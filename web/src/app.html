<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f8f3ec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Send photos and videos to the family's photo frames." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>kinframe</title>
		<script>
			// Right-to-left before the first paint (the app sets lang/dir properly once it starts).
			try {
				var l = localStorage.getItem('kinframe.locale') || navigator.language || '';
				if (/^(ar|he|iw)(-|$)/i.test(l)) document.documentElement.dir = 'rtl';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
