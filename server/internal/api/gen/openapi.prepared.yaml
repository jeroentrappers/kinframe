                            schema:
                                $ref: '#/components/schemas/TelegramLink'
                    description: Link
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - telegram
                - me
    /v1/me/telegram/link-code:
        post:
            description: |
                "Link my Telegram": a one-time code in `https://t.me/<bot>?start=<code>`. Opening it and tapping Start in the
                private chat with the bot links that Telegram account to the caller (docs/spec/telegram.md §5.1). Single use, 30
                minutes. `409 telegram_already_linked` when the caller has a link already (unlink first), `503
                feature_disabled`, `429 rate_limited`.
            operationId: createTelegramLinkCode
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TelegramCode'
                    description: Created
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - telegram
                - me
    /v1/me/weekly-summaries/{weekOf}:
        get:
            description: The caller's "seen and loved" summary of one week (Monday, in the caller's time zone), kept 12 weeks. `404 not_found` for weeks without one.
            operationId: getWeeklySummary
            parameters:
                - $ref: '#/components/parameters/WeekOf'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WeeklySummary'
                    description: Summary
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - engagement
    /v1/oauth/google/callback:
        get:
            description: |
                Google's OAuth redirect (registered by the operator as `<public URL>/v1/oauth/google/callback`). Opened by the
                browser, never called by clients. Checks `state` (single use, 15 minutes), exchanges `code` with the PKCE
                verifier, creates the picker session and answers `302` to the import's `return_uri` with
                `?import_id=<id>&status=<GoogleImportStatus>` (`picking`, or `failed` after a denied or failed consent).
                An unknown, expired or reused `state` gets a small HTML page instead of a redirect.
            operationId: googleOAuthCallback
            parameters:
                - in: query
                  name: state
                  required: true
                  schema:
                    maxLength: 200
                    type: string
                - in: query
                  name: code
                  schema:
                    maxLength: 2048
                    type: string
                - description: Set by Google when consent failed (e.g. `access_denied`).
                  in: query
                  name: error
                  schema:
                    maxLength: 200
                    type: string
                - in: query
                  name: scope
                  schema:
                    maxLength: 2048
                    type: string
            responses:
                "302":
                    description: Redirect to the import's `return_uri`
                "400":
                    content:
                        text/html:
                            schema:
                                type: string
                    description: Unknown, expired or reused state (HTML page)
            security: []
            tags:
                - photo-sources
    /v1/operator/blocked-servers:
        get:
            description: Servers blocked for the whole instance (README §5.22 "Trust").
            operationId: operatorListBlockedServers
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BlockedServer'
                                type: array
                    description: Blocked servers
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
        post:
            description: |
                Block a server instance-wide: every remote subscription with it ends on both sides (`server_blocked`), its
                federation requests answer `403 forbidden`, and this server stops calling it. Idempotent per host.
            operationId: operatorBlockServer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BlockedServerCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BlockedServer'
                    description: Blocked
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/blocked-servers/{blockedServerId}:
        delete:
            operationId: operatorUnblockServer
            parameters:
                - $ref: '#/components/parameters/BlockedServerId'
            responses:
                "204":
                    description: Unblocked
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/feeds/{feedId}/owner:
        post:
            description: The same for a family (feed). The new owner must be a member of the family.
            operationId: operatorTransferFeedOwner
            parameters:
                - $ref: '#/components/parameters/FeedId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OperatorOwnerTransfer'
                required: true
            responses:
                "204":
                    description: Transferred
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/frames/{frameId}/owner:
        post:
            description: |
                Move ownership of a frame to an existing member (`422 validation_failed` otherwise). The previous owner
                becomes admin, or is removed with `remove_previous: true`. Both get `ownership_changed`; the change is logged
                with the reason (`operatorListOwnershipLog`).
            operationId: operatorTransferFrameOwner
            parameters:
                - $ref: '#/components/parameters/FrameId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OperatorOwnerTransfer'
                required: true
            responses:
                "204":
                    description: Transferred
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/frames/{frameId}/remote-help:
        delete:
            description: 'Ends the frame''s active session (`ended_by: operator`). `404 not_found` when none is active.'
            operationId: operatorStopRemoteHelp
            parameters:
                - $ref: '#/components/parameters/FrameId'
            responses:
                "204":
                    description: Ended
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - remote-help
                - operator
        post:
            description: |
                Start remote help on a frame (README §5.23, docs/spec/remote-help.md §5.2): the server asks Headscale for a
                one-time, ephemeral pre-auth key that expires at the session's end, stores the session and puts a
                `remote_help` change on the frame's feed. The frame's members get `remote_help_started`.
                `409 remote_help_active` when the frame already has a session, `409 remote_help_unsupported` when the
                frame's latest heartbeat does not list the `remote_help` feature, `502 upstream_unavailable` when Headscale
                fails (no session is stored), `503 feature_disabled` without discovery `remote_help`.
            operationId: operatorStartRemoteHelp
            parameters:
                - $ref: '#/components/parameters/FrameId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RemoteHelpStart'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RemoteHelpSession'
                    description: Started
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - remote-help
                - operator
    /v1/operator/limits:
        get:
            operationId: operatorGetLimits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Limits'
                    description: Limits
            security:
