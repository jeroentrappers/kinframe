    /v1/frames/{frameId}/placements:
        get:
            description: Everything on the frame (needs see_library), or only the caller's own placements otherwise.
            operationId: listPlacements
            parameters:
                - $ref: '#/components/parameters/FrameId'
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - in: query
                  name: visibility
                  schema:
                    default: visible
                    enum:
                        - visible
                        - hidden
                        - trashed
                        - pending_moderation
                        - all
                    type: string
                - in: query
                  name: sender_id
                  schema:
                    $ref: '#/components/schemas/Id'
                - in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/MediaKind'
                - in: query
                  name: album_id
                  schema:
                    $ref: '#/components/schemas/Id'
                - description: |
                    "On this day" memories: only placements whose capture date (`item.captured_at`, else the client hint) falls
                    on this month and day (`MM-DD`, the client's local date) in an earlier year than the server's current year.
                  in: query
                  name: on_this_day
                  schema:
                    pattern: ^[0-9]{2}-[0-9]{2}$
                    type: string
                - in: query
                  name: sort
                  schema:
                    default: received_desc
                    enum:
                        - received_desc
                        - received_asc
                        - taken_desc
                        - taken_asc
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    counts:
                                        properties:
                                            hidden:
                                                type: integer
                                            photos:
                                                type: integer
                                            trashed:
                                                type: integer
                                            videos:
                                                type: integer
                                        type: object
                                    next_cursor:
                                        nullable: true
                                        type: string
                                    placements:
                                        items:
                                            $ref: '#/components/schemas/Placement'
                                        type: array
                                required:
                                    - placements
                                    - next_cursor
                                    - counts
                                type: object
                    description: Page
            tags:
                - library
