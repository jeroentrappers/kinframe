        get:
            operationId: getMe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Current user
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
        patch:
            operationId: updateMe
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                display_name:
                                    maxLength: 40
                                    minLength: 1
                                    type: string
                                locale:
                                    example: nl-BE
                                    type: string
                                share_location_names:
                                    type: boolean
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/avatar:
        delete:
            operationId: deleteAvatar
            responses:
                "204":
                    description: Removed
            tags:
                - me
        put:
            operationId: putAvatar
            requestBody:
                content:
                    image/jpeg:
                        schema:
                            format: binary
                            type: string
                    image/png:
                        schema:
                            format: binary
                            type: string
                    image/webp:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Stored (server crops to 256x256)
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/push-endpoints:
        get:
            operationId: listPushEndpoints
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PushEndpoint'
                                type: array
                    description: Registered endpoints
            tags:
                - me
        post:
            description: Idempotent on (kind, endpoint).
            operationId: registerPushEndpoint
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PushEndpointCreate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PushEndpoint'
                    description: Registered
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/push-endpoints/{endpointId}:
        delete:
            operationId: deletePushEndpoint
            parameters:
                - $ref: '#/components/parameters/EndpointId'
            responses:
                "204":
                    description: Removed
            tags:
                - me
    /v1/operator/limits:
        get:
            operationId: operatorGetLimits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Limits'
                    description: Limits
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
        put:
            operationId: operatorSetLimits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Limits'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Limits'
                    description: Updated
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/stats:
        get:
            operationId: operatorStats
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    frames:
                                        type: integer
                                    frames_online:
                                        type: integer
                                    items:
                                        type: integer
                                    processing_queue:
                                        type: integer
                                    storage_bytes:
                                        type: integer
                                    users:
                                        type: integer
                                type: object
                    description: Server statistics
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/sends:
        get:
            description: The caller's sent history across all devices, newest first.
            operationId: listMySends
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - in: query
                  name: state
                  schema:
                    default: all
                    enum:
                        - ongoing
                        - delivered
                        - all
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    next_cursor:
                                        nullable: true
                                        type: string
                                    sends:
                                        items:
                                            $ref: '#/components/schemas/Send'
                                        type: array
                                required:
                                    - sends
                                    - next_cursor
                                type: object
                    description: Page of sends
            tags:
                - sends
        post:
            operationId: createSend
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendCreate'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Accepted; processing
                "400":
                    $ref: '#/components/responses/Problem'
                "403":
                    $ref: '#/components/responses/Problem'
                "422":
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
    /v1/sends/{sendId}:
        delete:
            description: Removes all placements of this send from all frames (sender only). Never needs a frame to be online.
            operationId: unsend
            responses:
                "204":
                    description: Unsent
            tags:
                - sends
        get:
            operationId: getSend
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Send with per-frame placement status
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
        parameters:
            - in: path
              name: sendId
              required: true
              schema:
                $ref: '#/components/schemas/Id'
    /v1/sends/{sendId}/forward:
        post:
            description: Place the same items on additional frames.
            operationId: forwardSend
            parameters:
                - in: path
                  name: sendId
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                frame_ids:
                                    items:
                                        $ref: '#/components/schemas/Id'
                                    minItems: 1
                                    type: array
                            required:
                                - frame_ids
                            type: object
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Accepted
            tags:
                - sends
    /v1/uploads:
        post:
            description: |
                tus 1.0 creation endpoint (also HEAD/PATCH/DELETE on /v1/uploads/{uploadId}). See README §5.3.
                Upload-Metadata keys: filename, filetype, sha256 (optional).
            operationId: tusCreateUpload
            parameters:
                - in: header
                  name: Tus-Resumable
                  required: true
                  schema:
                    type: string
                - in: header
                  name: Upload-Length
                  required: true
                  schema:
                    type: integer
                - in: header
                  name: Upload-Metadata
                  required: true
                  schema:
                    type: string
            responses:
                "201":
                    description: Created; Location header holds the upload URL. If sha256 matches an existing item of the caller, `Kinframe-Existing-Item` header carries its id and the client may skip uploading.
                "413":
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
security:
    - userAuth: []
servers:
    - description: Default hosted server
      url: https://kinframe.appmire.be
    - description: Local development
      url: http://localhost:8110
tags:
    - name: discovery
    - name: me
    - name: frames
    - name: members
    - name: invites
    - name: sends
    - name: library
    - name: albums
    - name: settings
    - description: Place search and weather. Data by Open-Meteo.com (CC BY 4.0), fetched and cached by the server.
      name: weather
    - description: Frame enrollment and token exchange (unauthenticated or secret-based).
      name: devices
    - description: Endpoints called by the frame itself (device token).
      name: device
    - name: operator
    - description: Development-only helpers; absent in production.
      name: dev
