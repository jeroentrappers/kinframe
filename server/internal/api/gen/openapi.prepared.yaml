            type: object
        MuteFor:
            enum:
                - "off"
                - 1h
                - 8h
                - 1w
                - always
            type: string
        NowShowing:
            description: |
                Device websocket message `now_showing` (frame → server, README §6.1): what the frame's screen shows right
                now. Sent on every slide change (timer, swipe, `next`/`previous`/`show_placement`, the "N new" card), when a
                video starts, pauses or ends, every 15 s while a video plays, and when the screen sleeps or wakes. Times are
                the frame's clock; the server only uses differences between them.
            properties:
                direction:
                    description: '1: the slide came in as "next", -1: as "previous".'
                    enum:
                        - -1
                        - 1
                    type: integer
                hold_ms:
                    description: How long the slide is expected to stay.
                    type: integer
                ken_burns:
                    description: 'The slide moves (Ken Burns): deterministic per placement and focal point.'
                    type: boolean
                next_placement_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: What the frame expects to show next (for preloading).
                    nullable: true
                placement_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The slide on screen (the first tile of a collage or pair); null while nothing shows.
                    nullable: true
                placement_ids:
                    description: Every photo on screen (collage or pair), first = `placement_id`.
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 6
                    type: array
                screen:
                    enum:
                        - "on"
                        - "off"
                        - dimmed
                        - sleeping
                    type: string
                sent_at:
                    format: date-time
                    type: string
                started_at:
                    description: When the transition to this slide started.
                    format: date-time
                    type: string
                transition:
                    enum:
                        - crossfade
                        - slide
                        - cut
                    type: string
                transition_ms:
                    maximum: 5000
                    minimum: 0
                    type: integer
                type:
                    enum:
                        - now_showing
                    type: string
                video:
                    description: The playing video, or a live photo's clip, while it is on screen.
                    nullable: true
                    properties:
                        live:
                            description: The clip of a live photo (played over its still).
                            type: boolean
                        playing:
                            type: boolean
                        position_ms:
                            description: Playback position at `sent_at`.
                            minimum: 0
                            type: integer
                    required:
                        - position_ms
                        - playing
                    type: object
            required:
                - type
                - sent_at
                - screen
            type: object
        OnThisDay:
            properties:
                date:
                    format: date
                    type: string
                groups:
                    items:
                        properties:
                            feed_id:
                                $ref: '#/components/schemas/Id'
                            feed_name:
                                type: string
                            items:
                                items:
                                    $ref: '#/components/schemas/Item'
                                maxItems: 12
                                type: array
                            post_ids:
                                items:
                                    $ref: '#/components/schemas/Id'
                                type: array
                            years_ago:
                                minimum: 1
                                type: integer
                        required:
                            - feed_id
                            - feed_name
                            - years_ago
                            - items
                            - post_ids
                        type: object
                    maxItems: 3
                    type: array
            required:
                - date
                - groups
            type: object
        OperatorOwnerTransfer:
            properties:
                reason:
                    description: Kept in the ownership log; not shown to the people.
                    maxLength: 500
                    minLength: 1
                    type: string
                remove_previous:
                    default: false
                    description: Remove the previous owner instead of making them admin.
                    type: boolean
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - user_id
                - reason
            type: object
        OperatorOwnershipMatches:
            properties:
                feeds:
                    items:
                        $ref: '#/components/schemas/OperatorScope'
                    type: array
                frames:
                    items:
                        $ref: '#/components/schemas/OperatorScope'
                    type: array
            required:
                - frames
                - feeds
            type: object
        OperatorScope:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    enum:
                        - frame
                        - feed
                    type: string
                members:
                    items:
                        $ref: '#/components/schemas/OperatorScopeMember'
                    type: array
                name:
                    type: string
                remote_help_supported:
                    description: Frames only. The frame's latest heartbeat lists the `remote_help` feature (docs/spec/remote-help.md §4); otherwise the operator's page says "not available (Play build or no root)".
                    type: boolean
            required:
                - kind
                - id
                - name
                - members
            type: object
        OperatorScopeMember:
            properties:
                display_name:
                    type: string
                email:
                    nullable: true
                    type: string
                role:
                    description: Frame role (`Role`) or family role (`FeedRole`).
                    type: string
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - user_id
                - display_name
                - role
            type: object
        OwnershipLogEntry:
            properties:
                at:
                    format: date-time
                    type: string
                from_name:
                    description: Previous owner; for handovers the deleted account's name.
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                item_count:
                    description: Handovers only.
                    nullable: true
                    type: integer
                kind:
                    enum:
                        - operator_transfer
                        - account_handover
                    type: string
                operator_name:
                    nullable: true
                    type: string
                reason:
                    nullable: true
                    type: string
                removed_previous:
                    nullable: true
                    type: boolean
                scope_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                scope_kind:
                    allOf:
                        - enum:
                            - frame
                            - feed
                          type: string
                    nullable: true
                scope_name:
                    nullable: true
                    type: string
                to_name:
                    nullable: true
                    type: string
            required:
                - id
                - kind
                - at
            type: object
        OwnershipLogPage:
            properties:
                entries:
                    items:
                        $ref: '#/components/schemas/OwnershipLogEntry'
                    type: array
                next_cursor:
                    nullable: true
                    type: string
            required:
                - entries
                - next_cursor
            type: object
        Permissions:
            properties:
                change_settings:
                    type: boolean
                invite:
                    type: boolean
                manage_library:
                    type: boolean
                see_library:
                    type: boolean
                send:
                    type: boolean
            type: object
        Person:
            description: A contact (someone the caller shares a family or a frame with).
            properties:
                blocked:
                    description: The caller blocked this person.
                    type: boolean
                direct_conversation_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                feeds:
                    description: The families both are in.
                    items:
                        properties:
                            feed_id:
                                $ref: '#/components/schemas/Id'
                            feed_name:
                                type: string
                        required:
                            - feed_id
                            - feed_name
                        type: object
                    type: array
                frames:
                    description: The frames both are members of.
                    items:
                        properties:
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                        required:
                            - frame_id
                            - frame_name
                        type: object
                    type: array
                milestones:
                    description: The milestones this person chose to show (all of them for the caller's own profile).
                    items:
                        $ref: '#/components/schemas/MilestoneKey'
                    type: array
                person:
                    $ref: '#/components/schemas/PersonRef'
            required:
                - person
                - feeds
                - frames
                - blocked
            type: object
        PersonReaction:
            description: "A person's reaction. The first four are the frame's reactions (`Reaction`), so counts merge with frames':\n`love` ❤️, `laugh` \U0001F602, `wow` \U0001F62E, `sad` \U0001F622; people also have `thumbs_up` \U0001F44D and `pray` \U0001F64F.\n"
            enum:
                - love
                - laugh
                - wow
                - sad
                - thumbs_up
                - pray
            type: string
        PersonRef:
            description: |
                A person as shown next to a comment, message or reaction. `former_member: true` for deleted accounts: show
                the localized "Former member" instead of `display_name` (which is then empty) and no avatar.
            properties:
                avatar_url:
                    format: uri
                    nullable: true
                    type: string
                display_name:
                    type: string
                former_member:
                    default: false
                    type: boolean
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - user_id
                - display_name
            type: object
        PhotoRequest:
            description: A frame's "Ask for new photos".
            properties:
                answered_at:
                    format: date-time
                    nullable: true
                    type: string
                answered_by:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                expires_at:
                    format: date-time
                    type: string
                feed_ids:
                    description: |
                        The families with an active subscription to the frame. A family member who is not on the frame answers
                        the request by posting to one of these (the apps preselect it when sending).
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                frame_id:
                    $ref: '#/components/schemas/Id'
                frame_name:
                    type: string
                freshness:
                    $ref: '#/components/schemas/Freshness'
                id:
                    $ref: '#/components/schemas/Id'
                state:
                    $ref: '#/components/schemas/PhotoRequestState'
            required:
                - id
                - frame_id
                - frame_name
                - state
                - created_at
                - expires_at
            type: object
        PhotoRequestEvent:
            properties:
                request:
                    $ref: '#/components/schemas/PhotoRequest'
                type:
                    enum:
                        - photo_request.created
                        - photo_request.updated
                    type: string
            required:
                - type
                - request
            type: object
        PhotoRequestState:
            description: '`open`: waiting (7 days at most). `answered`: someone sent a photo that reached the frame. `expired`: nobody did within 7 days.'
            enum:
                - open
                - answered
                - expired
            type: string
        PhotoService:
            description: 'The outside service a photo came from. `email`: mailed to an inbox address (docs/spec/email-inbox.md). `telegram`: posted in a connected Telegram chat (docs/spec/telegram.md).'
            enum:
                - immich
                - icloud
                - google_photos
                - email
                - telegram
            type: string
        PhotoSource:
            properties:
                best_effort:
                    description: 'True for `icloud_link`: no official API; clients show the best-effort note.'
                    type: boolean
                can_manage:
                    description: The caller may pause, change and delete it.
                    type: boolean
                counts:
                    $ref: '#/components/schemas/PhotoSourceCounts'
                created_at:
                    format: date-time
                    type: string
                error_since:
                    description: First failure of the current streak.
                    format: date-time
                    nullable: true
                    type: string
                has_api_key:
                    type: boolean
                has_password:
                    type: boolean
                history:
                    $ref: '#/components/schemas/PhotoSourceHistory'
                history_count:
                    nullable: true
                    type: integer
                id:
                    $ref: '#/components/schemas/Id'
                immich_album_id:
                    description: '`immich_api` only.'
                    nullable: true
                    type: string
                include_videos:
                    type: boolean
                is_owner:
                    type: boolean
                last_attempt_at:
                    format: date-time
                    nullable: true
                    type: string
                last_error:
                    description: Short English detail for support; clients show their own text for `last_error_code`.
                    nullable: true
                    type: string
                last_error_code:
                    allOf:
                        - $ref: '#/components/schemas/PhotoSourceErrorCode'
                    nullable: true
                last_run:
                    allOf:
                        - $ref: '#/components/schemas/PhotoSourceRun'
                    nullable: true
                last_synced_at:
                    description: Last successful run.
                    format: date-time
                    nullable: true
                    type: string
                name:
                    description: The outside album's name (or the name given at creation).
                    type: string
                next_sync_at:
                    description: Null while paused or waiting for a person.
                    format: date-time
                    nullable: true
                    type: string
                notify_reactions:
                    type: boolean
                on_upstream_delete:
                    $ref: '#/components/schemas/PhotoSourceDeletePolicy'
                owner:
                    allOf:
                        - properties:
                            avatar_url:
                                format: uri
                                nullable: true
                                type: string
                            display_name:
                                type: string
                            user_id:
                                $ref: '#/components/schemas/Id'
                          required:
                            - user_id
                            - display_name
                          type: object
                    description: Who set it up; imported photos are sent by them. Null when that account is gone.
                    nullable: true
                pending_removals:
                    description: 'Removals held back by the mass-removal guard; confirm with `syncPhotoSource {confirm_removals: true}`.'
                    type: integer
                provider:
                    $ref: '#/components/schemas/PhotoSourceProvider'
                running:
                    description: A run is in progress.
                    type: boolean
                server_url:
                    description: '`immich_api` only.'
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/PhotoSourceStatus'
                target:
                    $ref: '#/components/schemas/PhotoSourceTarget'
                url_hint:
                    description: Redacted link for display (links only).
                    example: https://photos.example.org/share/…
                    nullable: true
                    type: string
                warnings:
                    items:
                        $ref: '#/components/schemas/PhotoSourceWarning'
                    type: array
            required:
                - id
                - provider
                - name
                - target
                - status
                - running
                - history
                - on_upstream_delete
                - include_videos
                - counts
                - created_at
            type: object
        PhotoSourceConnection:
            description: |
                How to reach the outside album. `immich_link` and `icloud_link` need `url` (and `password` for a protected
                Immich link); `immich_api` needs `server_url`, `api_key` and, to create, `immich_album_id`. Secrets are
                write-only: they are sealed at rest and never returned.
            properties:
                api_key:
                    description: '`immich_api` only. Needs album.read, asset.read, asset.view and asset.download.'
                    maxLength: 200
                    minLength: 8
                    type: string
                    writeOnly: true
                immich_album_id:
                    description: '`immich_api` only: the album, from `listImmichAlbums`.'
                    maxLength: 64
                    type: string
                password:
                    description: '`immich_link` only: the link password.'
                    maxLength: 200
                    type: string
                    writeOnly: true
                provider:
                    $ref: '#/components/schemas/PhotoSourceProvider'
                server_url:
                    description: '`immich_api` only: the Immich server, e.g. `https://photos.example.org` (an `/api` suffix is tolerated).'
                    maxLength: 2048
                    minLength: 8
                    type: string
                url:
                    description: The shared link (links only). It is the secret; responses carry `url_hint`.
                    example: https://photos.example.org/share/0d1e…
                    maxLength: 2048
                    minLength: 8
                    type: string
                    writeOnly: true
            required:
                - provider
            type: object
        PhotoSourceCounts:
            properties:
                duplicates:
                    description: Upstream photos the target already had.
                    type: integer
                failed:
                    type: integer
                gone_upstream:
                    description: No longer in the outside album (kept with `keep`).
                    type: integer
                imported:
                    description: Live items this source created.
                    type: integer
                pending:
                    description: Waiting to be downloaded (backlog).
                    type: integer
                removed_locally:
                    description: Removed on kinframe; never imported again.
                    type: integer
                skipped:
                    description: Not imported on purpose (videos off, too long, too large, unsupported, over the limit, before the first import's cut).
                    type: integer
                upstream:
                    description: Photos and videos in the outside album at the last listing.
                    type: integer
            required:
                - imported
                - pending
            type: object
        PhotoSourceCreate:
            allOf:
                - $ref: '#/components/schemas/PhotoSourceConnection'
                - description: Exactly one of `album_id` or `feed_id` (`422 validation_failed` otherwise).
                  properties:
                    album_id:
                        $ref: '#/components/schemas/Id'
                    feed_id:
                        $ref: '#/components/schemas/Id'
                    history:
                        $ref: '#/components/schemas/PhotoSourceHistory'
                    history_count:
                        description: 'Required with `history: last_n`.'
                        maximum: 10000
                        minimum: 1
                        type: integer
                    include_videos:
                        default: true
                        type: boolean
                    name:
                        description: Display name; defaults to the outside album's name.
                        maxLength: 60
                        type: string
                    notify_reactions:
                        default: true
                        description: The owner gets reaction and reply notifications for this source's photos.
                        type: boolean
                    on_upstream_delete:
                        $ref: '#/components/schemas/PhotoSourceDeletePolicy'
                  type: object
        PhotoSourceDeletePolicy:
            description: |
                What happens when a photo disappears from the outside album. `mirror`: remove it here too (default for albums).
                `keep`: keep it (default for feeds). Errors never remove anything; many removals at once wait for
                confirmation (`mass_removal`).
            enum:
                - mirror
                - keep
            type: string
        PhotoSourceErrorCode:
            description: Why the last run (or a test) failed; user-facing texts are in docs/spec/photo-sources.md §13.
            enum:
                - unreachable
                - tls_error
                - private_address_blocked
                - auth_failed
                - password_required
                - permission_missing
                - link_not_found
                - link_expired
                - album_not_found
                - unsupported_link
                - too_large
                - format_changed
                - rate_limited_upstream
                - upstream_error
                - owner_lost_access
                - credentials_unreadable
                - mass_removal
            type: string
        PhotoSourceHistory:
            description: |
                What the first run imports: `none` (only photos added from now on), `last_n` (the `history_count` newest by
                capture date) or `all` (up to `limits.max_photo_source_items`). Imported quietly (`Placement.backfill`).
                Defaults: `all` for albums, `last_n` with 20 for feeds.
            enum:
                - none
                - last_n
                - all
            type: string
        PhotoSourceProvider:
            description: |
                `immich_link`: an Immich shared link (`https://<immich>/share/<key>`, optional password); recommended.
                `immich_api`: an Immich server URL with an API key and a chosen album. `icloud_link`: an iCloud shared album's
                public website link (`https://www.icloud.com/sharedalbum/#<token>`), best effort.
            enum:
                - immich_link
                - immich_api
                - icloud_link
            type: string
        PhotoSourceRun:
            properties:
                added:
                    type: integer
                bytes:
                    type: integer
                error_code:
                    allOf:
                        - $ref: '#/components/schemas/PhotoSourceErrorCode'
                    nullable: true
                failed:
                    type: integer
                finished_at:
                    format: date-time
                    nullable: true
                    type: string
                removed:
                    type: integer
                skipped:
                    type: integer
                started_at:
                    format: date-time
                    type: string
                updated:
                    description: Captions, dates or files changed upstream.
                    type: integer
            required:
                - started_at
            type: object
        PhotoSourceStatus:
            description: |
                `active`: syncing on schedule (a single failed run being retried stays active, with `last_error_code`).
                `error`: failures expected to pass (unreachable, upstream errors) for 3 runs or 6 hours; retried with backoff.
                `needs_attention`: only a person can fix it (`last_error_code`); syncing stopped except a daily probe for some
                codes. `paused`: paused by a manager; imported photos keep showing.
            enum:
                - active
                - paused
                - error
                - needs_attention
            type: string
        PhotoSourceTarget:
            description: Where the photos go. Exactly one of `album_id` (with its frame) or `feed_id` is set.
            properties:
                album_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                album_name:
                    nullable: true
                    type: string
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                feed_name:
                    nullable: true
                    type: string
                frame_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The album's frame (albums belong to one frame).
                    nullable: true
                frame_name:
                    nullable: true
                    type: string
                kind:
                    enum:
                        - album
                        - feed
                    type: string
            required:
                - kind
            type: object
        PhotoSourceTestResult:
            properties:
                album_name:
                    nullable: true
                    type: string
                albums:
                    description: '`immich_api` without `immich_album_id`: the albums the key can read.'
                    items:
                        $ref: '#/components/schemas/ImmichAlbum'
                    type: array
                best_effort:
                    type: boolean
                error:
                    description: Short English detail.
                    nullable: true
                    type: string
                error_code:
                    allOf:
                        - $ref: '#/components/schemas/PhotoSourceErrorCode'
                    nullable: true
                estimate_bytes:
                    description: Size of everything in the album, when the provider tells.
                    nullable: true
                    type: integer
                ok:
                    type: boolean
                photos:
                    nullable: true
                    type: integer
                server_version:
                    description: Immich only, e.g. `v1.132.3`.
                    nullable: true
                    type: string
                videos:
                    nullable: true
                    type: integer
                warnings:
                    items:
                        $ref: '#/components/schemas/PhotoSourceWarning'
                    type: array
            required:
                - ok
            type: object
        PhotoSourceUpdate:
            description: At least one field. Connection changes are tested first and then synced at once.
            properties:
                api_key:
                    maxLength: 200
                    minLength: 8
                    type: string
                    writeOnly: true
                immich_album_id:
                    maxLength: 64
                    type: string
                include_videos:
                    description: Turning it on imports previously skipped videos in the next run.
                    type: boolean
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
                notify_reactions:
                    description: The owner's own switch; only the owner may change it.
                    type: boolean
                on_upstream_delete:
                    $ref: '#/components/schemas/PhotoSourceDeletePolicy'
                password:
                    description: null removes the link password.
                    maxLength: 200
                    nullable: true
                    type: string
                    writeOnly: true
                paused:
                    description: true pauses, false resumes.
                    type: boolean
                server_url:
                    maxLength: 2048
                    minLength: 8
                    type: string
                take_over:
                    description: The caller becomes the owner (credit for future photos). `immich_api` needs a new `api_key` with it.
                    type: boolean
                url:
                    description: A new link to the same (or another) outside album.
                    maxLength: 2048
                    minLength: 8
                    type: string
                    writeOnly: true
            type: object
        PhotoSourceWarning:
            description: |
                Conditions that don't stop syncing. `downloads_disabled`: the Immich link doesn't allow downloads, so photos
                come as previews. `metadata_hidden`: the link hides EXIF (no capture dates or descriptions).
                `item_limit_reached`: `limits.max_photo_source_items` is reached; newer upstream items are skipped.
            enum:
                - downloads_disabled
                - metadata_hidden
                - item_limit_reached
            type: string
        PhotosChoice:
            description: '`keep`: your photos stay with the family or frame, still credited to you (the default). `take`: they are taken away with the 30-day notice (README §5.21).'
            enum:
                - keep
                - take
            type: string
        PinHash:
            description: |
                PBKDF2-HMAC-SHA256 of the UTF-8 PIN digits (RFC 8018), 32-byte output. `salt` and `hash` are standard base64.
            properties:
                alg:
                    enum:
                        - pbkdf2-sha256
                    type: string
                hash:
                    description: base64 of 32 bytes
                    maxLength: 44
                    minLength: 44
                    type: string
                iterations:
                    example: 20000
                    maximum: 1000000
                    minimum: 1000
                    type: integer
                salt:
                    description: base64, at least 12 random bytes
                    maxLength: 64
                    minLength: 16
                    type: string
            required:
                - alg
                - iterations
                - salt
                - hash
            type: object
        Place:
            description: A geocoding result (Open-Meteo geocoding API).
            properties:
                admin1:
                    description: Region / state / province
                    example: Flanders
                    nullable: true
                    type: string
                country:
                    example: Belgium
                    nullable: true
                    type: string
                country_code:
                    description: ISO 3166-1 alpha-2
                    example: BE
                    nullable: true
                    type: string
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lon:
                    maximum: 180
                    minimum: -180
                    type: number
                name:
                    example: Gent
                    type: string
                timezone:
                    example: Europe/Brussels
                    nullable: true
                    type: string
            required:
                - name
                - lat
                - lon
            type: object
        Placement:
            properties:
                album_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                backfill:
                    default: false
                    description: |
                        Placed as history (a feed subscription's history, a history change, a resume, or a photo source's first
                        import). Frames don't treat it as new: no "N new" card, no screen wake. `received_at` is then the post time
                        (for a photo source's first import: when the photo was added upstream, else its capture time).
                    type: boolean
                delivered_at:
                    format: date-time
                    nullable: true
                    type: string
                feed_ids:
                    description: |
                        Feeds whose active subscriptions hold this placement on the frame (possibly also when `origin` is `send`).
                        Used for feed mode (`slideshow.feed_id`), like `album_ids` for album mode.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                fit_override:
                    allOf:
                        - $ref: '#/components/schemas/Fit'
                    nullable: true
                focal_override:
                    allOf:
                        - $ref: '#/components/schemas/FocalPoint'
                    nullable: true
                frame_id:
                    $ref: '#/components/schemas/Id'
                framing_override:
                    allOf:
                        - $ref: '#/components/schemas/Framing'
                    nullable: true
                hidden:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                item:
                    $ref: '#/components/schemas/Item'
                origin:
                    $ref: '#/components/schemas/PlacementOrigin'
                origin_feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: '`origin: feed`: the feed that placed it.'
                    nullable: true
                origin_feed_name:
                    description: Current name of `origin_feed_id`. Frames show "Sender · Feed name" (instead of "shared by").
                    nullable: true
                    type: string
                origin_remote:
                    allOf:
                        - $ref: '#/components/schemas/PlacementRemote'
                    description: |
                        Set on copies of posts of a family on another server (README §5.22). `origin` is then `feed`,
                        `origin_feed_id` null and `origin_feed_name` the remote family's name, so frames show "Lies · Janssens"
                        without knowing about servers.
                    nullable: true
                pending_moderation:
                    type: boolean
                prompt_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: 'Feed placements whose post answers a weekly prompt (`prompts` change): frames show the prompt''s title card before the first of them.'
                    nullable: true
                reaction:
                    allOf:
                        - $ref: '#/components/schemas/Reaction'
                    nullable: true
                received_at:
                    format: date-time
                    type: string
                replies:
                    items:
                        properties:
                            at:
                                format: date-time
                                type: string
                            preset:
                                $ref: '#/components/schemas/ReplyPreset'
                        type: object
                    type: array
                rotation:
                    enum:
                        - 0
                        - 90
                        - 180
                        - 270
                    type: integer
                seen_at:
                    format: date-time
                    nullable: true
                    type: string
                shared_by_name:
                    description: Display name of `shared_by_user_id`. Frames show "Sender · shared by Name".
                    nullable: true
                    type: string
                shared_by_user_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The member who shared this placement from another frame (`sharePlacements`); null for sends and forwards.
                    nullable: true
                status:
                    $ref: '#/components/schemas/PlacementStatus'
                taken_away:
                    allOf:
                        - $ref: '#/components/schemas/PlacementTakenAway'
                    description: 'Set while the sender took it away and it waits in the frame''s trash (`visibility: taken_away`, README §5.21). Never in the device change feed (the frame gets `placement.remove`).'
                    nullable: true
                trashed:
                    type: boolean
                trashed_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - frame_id
                - item
                - status
                - hidden
                - trashed
            type: object
        PlacementComments:
            description: |
                Payload of the `comments` change (entity: the placement): the three newest person comments of the placement's
                feed post, for frames with `settings.social.show_comments` on (README §5.20). Plain text, first names only.
            properties:
                comments:
                    description: Newest first.
                    items:
                        properties:
                            author_name:
                                example: Anna
                                type: string
                            body:
                                description: Cut at 280 characters with "…"; mentions as plain text.
                                maxLength: 280
                                type: string
                            created_at:
                                format: date-time
                                type: string
                            id:
                                $ref: '#/components/schemas/Id'
                        required:
                            - id
                            - author_name
                            - body
                            - created_at
                        type: object
                    maxItems: 3
                    type: array
                placement_id:
                    $ref: '#/components/schemas/Id'
            required:
                - placement_id
                - comments
            type: object
        PlacementOrigin:
            description: |
                How a placement got onto the frame. `send`: a send or forward to the frame. `share`: shared from another
                frame's library (`shared_by_*`). `feed`: a post in a feed the frame subscribes to (`origin_feed_*`).
                `import`: imported on the frame. When several paths lead to the same item, the first one is the origin.
            enum:
                - send
                - share
                - feed
                - import
            type: string
        PlacementRemote:
            description: '`Placement.origin_remote`: the placement is a copy of a post of a family on another server (B''s side).'
