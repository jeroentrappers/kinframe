components:
    parameters:
        AddressId:
            in: path
            name: addressId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        After:
            description: 'Chronological lists (comments, messages): return what comes after this id.'
            in: query
            name: after
            schema:
                $ref: '#/components/schemas/Id'
        Before:
            description: 'Chronological lists (timeline, messages): return what comes before this cursor (a `next_before` value, or a message id).'
            in: query
            name: before
            schema:
                maxLength: 200
                type: string
        BirthdayId:
            in: path
            name: birthdayId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        BlockedServerId:
            in: path
            name: blockedServerId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        CalendarId:
            in: path
            name: calendarId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        CircleId:
            in: path
            name: circleId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        CommentId:
            in: path
            name: commentId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        ConversationId:
            in: path
            name: conversationId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Cursor:
            in: query
            name: cursor
            schema:
                type: string
        EndpointId:
            in: path
            name: endpointId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        EventId:
            in: path
            name: eventId
            required: true
            schema:
                $ref: '#/components/schemas/CalendarEventId'
        FeedId:
            in: path
            name: feedId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        FrameId:
            in: path
            name: frameId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        HeldMessageId:
            in: path
            name: messageId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        IdempotencyKey:
            in: header
            name: Idempotency-Key
            schema:
                maxLength: 64
                type: string
        IfMatch:
            description: Quoted version, e.g. "7"
            in: header
            name: If-Match
            required: true
            schema:
                type: string
        ImportId:
            in: path
            name: importId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        InvitationId:
            in: path
            name: invitationId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        InviteToken:
            in: path
            name: token
            required: true
            schema:
                maxLength: 64
                minLength: 22
                type: string
        ItemId:
            in: path
            name: itemId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Limit:
            in: query
            name: limit
            schema:
                default: 50
                maximum: 200
                minimum: 1
                type: integer
        MessageId:
            in: path
            name: messageId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        PlacementId:
            in: path
            name: placementId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        PostId:
            in: path
            name: postId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        RemoteSubscriptionId:
            in: path
            name: remoteSubscriptionId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        ReportId:
            in: path
            name: reportId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        RequestId:
            in: path
            name: requestId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        SenderId:
            in: path
            name: senderId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        SourceId:
            in: path
            name: sourceId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        SubscriptionId:
            in: path
            name: subscriptionId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        TargetId:
            in: path
            name: targetId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        TargetKind:
            in: path
            name: targetKind
            required: true
            schema:
                $ref: '#/components/schemas/ReactionTargetKind'
        TelegramChatId:
            in: path
            name: chatId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        UserId:
            in: path
            name: userId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        WeekOf:
            description: A Monday (YYYY-MM-DD); other days answer `422 validation_failed`.
            in: path
            name: weekOf
            required: true
            schema:
                format: date
                type: string
    responses:
        Problem:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Error (RFC 9457)
    schemas:
        AccountDeletion:
            properties:
                photos:
                    default: take
                    description: |
                        `take` (default): every photo leaves every frame and family with the 30-day notice. `leave`: each photo
                        still in a family or on a frame is handed over to that family's or frame's owner and stays credited
                        "<name> (former member)" (README §5.21 "Account deletion").
                    enum:
                        - take
                        - leave
                    type: string
            type: object
        Album:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                only_in_album_mode:
                    default: false
                    description: Only play this album's photos when the frame plays this album (album mode or its schedule), not in the normal slideshow. A placement is left out of the normal slideshow when it is in at least one album with this flag and in no album without it. Frames that don't know the flag show everything as before.
                    type: boolean
                photo_source_count:
                    description: Photo sources syncing into this album (docs/spec/photo-sources.md); details for album managers in `listAlbumPhotoSources`.
                    type: integer
                placement_count:
                    type: integer
                placement_ids:
                    description: Ordered.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
                version:
                    type: integer
            required:
                - id
                - name
                - version
                - placement_count
            type: object
        AlbumWrite:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
                only_in_album_mode:
                    default: false
                    description: Only play this album's photos when the frame plays this album (album mode or its schedule), not in the normal slideshow. A placement is left out of the normal slideshow when it is in at least one album with this flag and in no album without it. Frames that don't know the flag show everything as before.
                    type: boolean
                placement_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
            type: object
        AppVersionPolicy:
            description: Version policy for one family app platform (README §5.15).
            properties:
                minimum_build:
                    description: 'Lowest build (Android versionCode, Apple CFBundleVersion) the server still serves; null: no minimum.'
                    nullable: true
                    type: integer
                recommended_build:
                    description: 'Apps below this build show an "update available" banner; null: none.'
                    nullable: true
                    type: integer
                store_url:
                    description: 'Where to update: the App Store, Mac App Store, Google Play, F-Droid or an APK page; null: the app''s own default.'
                    format: uri
                    nullable: true
                    type: string
            type: object
        Badge:
            description: 'The app badge: conversations with unread messages (not muted) plus threads with unread mentions of or replies to the caller (not muted).'
            properties:
                conversations:
                    type: integer
                threads:
                    type: integer
                total:
                    type: integer
            required:
                - total
                - conversations
                - threads
            type: object
        BadgeEvent:
            properties:
                badge:
                    $ref: '#/components/schemas/Badge'
                type:
                    enum:
                        - badge.updated
                    type: string
            required:
                - type
                - badge
            type: object
        BirthdayPerson:
            description: |
                A person with a birthday in a feed (docs/spec/birthdays.md). People, not accounts: `user_id` optionally links
                a feed member.
            properties:
                birth_year:
                    description: |
                        Null when unknown or when the caller may not see it: shown to owner/admins, whoever added the entry and
                        the linked member; to other members only with `show_age`.
                    example: 1946
                    nullable: true
                    type: integer
                can_decide:
                    description: The caller may approve or reject it (pending, owner/admin).
                    type: boolean
                can_edit:
                    description: The caller may change this entry (some fields only, for the linked member).
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                created_by_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Account id of whoever added or suggested it ("added by me"); null when that account is gone.
                    nullable: true
                created_by_name:
                    description: Null when that account is gone.
                    nullable: true
                    type: string
                day:
                    example: 12
                    maximum: 31
                    minimum: 1
                    type: integer
                decided_at:
                    format: date-time
                    nullable: true
                    type: string
                decided_by_name:
                    description: Suggestions only; owner/admins and the suggester.
                    nullable: true
                    type: string
                display_name:
                    example: Oma
                    type: string
                feed_id:
                    $ref: '#/components/schemas/Id'
                greetings_today:
                    description: Frames that sent a greeting for today's occurrence (0 on other days).
                    type: integer
                has_own_photo:
                    description: '`photo_url` is an uploaded photo, not the linked member''s avatar.'
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                linked_member_name:
                    nullable: true
                    type: string
                month:
                    example: 3
                    maximum: 12
                    minimum: 1
                    type: integer
                next_birthday:
                    description: The next occurrence on or after today in the caller's time zone (`User.timezone`); 29 February becomes 28 February in non-leap years.
                    format: date
                    type: string
                photo_url:
                    description: 256x256 WebP, public at an unguessable URL like avatars. The uploaded photo, else the linked member's avatar.
                    format: uri
                    nullable: true
                    type: string
                show_age:
                    description: Frames and notifications show the age (needs `birth_year`).
                    type: boolean
                status:
                    $ref: '#/components/schemas/BirthdayStatus'
                suggested:
                    description: Created as a poster's suggestion (also after approval).
                    type: boolean
                turns:
                    description: Age on `next_birthday`, when `birth_year` is visible to the caller.
                    nullable: true
                    type: integer
                updated_at:
                    format: date-time
                    type: string
                user_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The linked feed member; cleared when they leave the feed or delete their account.
                    nullable: true
            required:
                - id
                - feed_id
                - status
                - display_name
                - day
                - month
                - show_age
                - created_at
            type: object
        BirthdayPersonCreate:
            description: |
                `day`/`month` must form a real date (29 February is allowed, and with `birth_year` only in leap years).
                `birth_year` from 1900 to the current year.
            properties:
                birth_year:
                    minimum: 1900
                    nullable: true
                    type: integer
                day:
                    maximum: 31
                    minimum: 1
                    type: integer
                display_name:
                    maxLength: 40
                    minLength: 1
                    type: string
                month:
                    maximum: 12
                    minimum: 1
                    type: integer
                show_age:
                    default: false
                    type: boolean
                user_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Link to a member of this feed who has no entry yet ("Add my birthday" sends the caller's id).
                    nullable: true
            required:
                - display_name
                - day
                - month
            type: object
        BirthdayPersonUpdate:
            properties:
                birth_year:
                    description: null clears the year.
                    minimum: 1900
                    nullable: true
                    type: integer
                day:
                    maximum: 31
                    minimum: 1
                    type: integer
                display_name:
                    maxLength: 40
                    minLength: 1
                    type: string
                month:
                    maximum: 12
                    minimum: 1
                    type: integer
                show_age:
                    type: boolean
                user_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: null unlinks.
                    nullable: true
            type: object
        BirthdayStatus:
            description: |
                `pending`: a poster's suggestion waiting for the feed's owner or an admin. `approved`: on the list and on
                frames. `rejected`: declined; listed for the suggester and admins for 30 days.
            enum:
                - pending
                - approved
                - rejected
            type: string
        Block:
            properties:
                created_at:
                    format: date-time
                    type: string
                person:
                    $ref: '#/components/schemas/PersonRef'
            required:
                - person
                - created_at
            type: object
        BlockedServer:
            properties:
                created_at:
                    format: date-time
                    type: string
                created_by_name:
                    nullable: true
                    type: string
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Null for instance-wide blocks.
                    nullable: true
                host:
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                reason:
                    nullable: true
                    type: string
                server_name:
                    nullable: true
                    type: string
            required:
                - id
                - host
                - created_at
            type: object
        BlockedServerCreate:
            description: '`host` (e.g. `kinframe.example.org`) or a base URL in `server_url`.'
            properties:
                host:
                    maxLength: 253
                    type: string
                reason:
                    maxLength: 300
                    type: string
                server_url:
                    format: uri
                    maxLength: 2000
                    type: string
            type: object
        Calendar:
            description: |
                Payload of the `calendar` change (docs/api/README.md §5.8): every enabled source of the frame merged into one
                list, deduplicated across sources by UID and start, sorted by start.
            properties:
                countdowns:
                    description: Marked events that have not passed yet, nearest first.
                    items:
                        $ref: '#/components/schemas/Countdown'
                    type: array
                events:
                    items:
                        $ref: '#/components/schemas/CalendarEvent'
                    type: array
                generated_at:
                    format: date-time
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/CalendarSourceInfo'
                    type: array
                timezone:
                    description: The frame's time zone (`locale.timezone`), used for the window and all-day events.
                    example: Europe/Brussels
                    type: string
                window:
                    properties:
                        from:
                            format: date
                            type: string
                        to:
                            description: Inclusive.
                            format: date
                            type: string
                    required:
                        - from
                        - to
                    type: object
            required:
                - generated_at
                - timezone
                - window
                - sources
                - events
                - countdowns
            type: object
        CalendarColor:
            description: |
                Palette key. Clients map it to the light/dark colours listed in docs/api/README.md §5.8 (the same 12 colours
                everywhere).
            enum:
                - coral
                - tangerine
                - amber
                - olive
                - mint
                - sage
                - teal
                - sky
                - ocean
                - lavender
                - plum
                - rose
            type: string
        CalendarEvent:
            description: |
                One occurrence. Timed events have `start_at`/`end_at` (UTC; clients show them in the frame's time zone);
                all-day events have `start_date`/`end_date` (inclusive) and no times. Multi-day events span several days.
            properties:
                all_day:
                    type: boolean
                countdown:
                    type: boolean
                end_at:
                    format: date-time
                    nullable: true
                    type: string
                end_date:
                    format: date
                    nullable: true
                    type: string
                has_photo:
                    type: boolean
                id:
                    $ref: '#/components/schemas/CalendarEventId'
                invitation_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Received events only; the photo is at `/v1/device/invitations/{id}/photo`.
                    nullable: true
                location:
                    maxLength: 200
                    nullable: true
                    type: string
                notes:
                    maxLength: 500
                    nullable: true
                    type: string
                photo_placement:
                    allOf:
                        - $ref: '#/components/schemas/EventPhotoPlacement'
                    nullable: true
                recurring:
                    type: boolean
                sender_name:
                    description: Received events only.
                    nullable: true
                    type: string
                source_id:
                    $ref: '#/components/schemas/Id'
                start_at:
                    format: date-time
                    nullable: true
                    type: string
                start_date:
                    format: date
                    nullable: true
                    type: string
                title:
                    maxLength: 200
                    type: string
            required:
                - id
                - source_id
                - title
                - all_day
            type: object
        CalendarEventId:
            description: Stable id of one event occurrence (a hash of source, UID and occurrence start).
            pattern: ^[A-Za-z0-9_-]{8,64}$
            type: string
        CalendarSchedule:
            description: Same shape as `SleepSchedule`, with `from`/`to` instead of `sleep_at`/`wake_at`. `to` before `from` runs past midnight.
            properties:
                days:
                    items:
                        enum:
                            - mon
                            - tue
                            - wed
                            - thu
                            - fri
                            - sat
                            - sun
                        type: string
                    type: array
                enabled:
                    type: boolean
                from:
                    example: "07:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                to:
                    example: "09:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
            required:
                - id
                - from
                - to
                - days
                - enabled
            type: object
        CalendarSource:
            properties:
                color:
                    $ref: '#/components/schemas/CalendarColor'
                created_at:
                    format: date-time
                    type: string
                enabled:
                    type: boolean
                event_count:
                    description: Events of this source in the frame's window.
                    type: integer
                has_password:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/CalendarSourceKind'
                last_attempt_at:
                    format: date-time
                    nullable: true
                    type: string
                last_error:
                    description: Short reason of the last failed sync (English).
                    nullable: true
                    type: string
                last_synced_at:
                    description: Last successful sync.
                    format: date-time
                    nullable: true
                    type: string
                name:
                    description: 'Display name. Empty for the local calendar until renamed: clients show "Received events".'
                    type: string
                next_sync_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/CalendarSyncStatus'
                url_hint:
                    description: Redacted URL for display. Null for `local`.
                    example: https://calendar.google.com/…/basic.ics
                    nullable: true
                    type: string
                username:
                    description: CalDAV only.
                    nullable: true
                    type: string
            required:
                - id
                - kind
                - name
                - color
                - enabled
                - status
            type: object
        CalendarSourceCreate:
            properties:
                calendar_url:
                    description: 'CalDAV only: the calendar collection to use, from `CalendarTestResult.calendars`.'
                    maxLength: 2048
                    type: string
                color:
                    $ref: '#/components/schemas/CalendarColor'
                enabled:
                    default: true
                    type: boolean
                kind:
                    enum:
                        - ics
                        - caldav
                    type: string
                name:
                    description: Defaults to the calendar's own name, else the host.
                    maxLength: 60
                    type: string
                password:
                    description: CalDAV only; use an app-specific password.
                    maxLength: 500
                    type: string
                    writeOnly: true
                url:
                    description: '`https://`, `http://` or `webcal://` (treated as https). For CalDAV: the server, account or calendar URL.'
                    maxLength: 2048
                    minLength: 8
                    type: string
                username:
                    description: CalDAV only.
                    maxLength: 200
                    type: string
            required:
                - kind
                - url
            type: object
        CalendarSourceInfo:
            properties:
                color:
                    $ref: '#/components/schemas/CalendarColor'
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/CalendarSourceKind'
                last_synced_at:
                    format: date-time
                    nullable: true
                    type: string
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/CalendarSyncStatus'
            required:
                - id
                - kind
                - name
                - color
                - status
            type: object
        CalendarSourceKind:
            description: '`ics`: an ICS/iCal/webcal link. `caldav`: a CalDAV calendar. `local`: the frame''s received-events calendar.'
            enum:
                - ics
                - caldav
                - local
            type: string
        CalendarSourceUpdate:
            properties:
                calendar_url:
                    maxLength: 2048
                    type: string
                color:
                    $ref: '#/components/schemas/CalendarColor'
                enabled:
                    type: boolean
                name:
                    maxLength: 60
                    type: string
                password:
                    maxLength: 500
                    type: string
                    writeOnly: true
                url:
                    maxLength: 2048
                    minLength: 8
                    type: string
                username:
                    maxLength: 200
                    type: string
            type: object
        CalendarSyncStatus:
            description: '`syncing` before the first sync and while one runs; `disabled` when the source is turned off.'
            enum:
                - ok
                - syncing
                - failed
                - auth_failed
                - disabled
            type: string
        CalendarTestResult:
            properties:
                calendar_name:
                    description: The calendar's own name, if it has one.
                    nullable: true
                    type: string
                calendars:
                    description: CalDAV only. Calendars on the account that hold events.
                    items:
                        properties:
                            color:
                                description: The server's colour (hex), as a hint.
                                nullable: true
                                type: string
                            name:
                                type: string
                            url:
                                type: string
                        required:
                            - url
                            - name
                        type: object
                    type: array
                error:
                    nullable: true
                    type: string
                event_count:
                    description: Events in the next 30 days.
                    nullable: true
                    type: integer
                ok:
                    type: boolean
                status:
                    enum:
                        - ok
                        - failed
                        - auth_failed
                    type: string
            required:
                - ok
                - status
            type: object
        CalendarView:
            allOf:
                - $ref: '#/components/schemas/Calendar'
                - properties:
                    weather:
                        $ref: '#/components/schemas/Weather'
                  type: object
        CatalogPlugin:
            description: A plugin the frame can run, as the frame reports it (`PUT /device/plugins/catalog`).
            properties:
                builtin:
                    description: Part of the frame app; false for a plugin from the community registry (its newest version).
                    type: boolean
                locales:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description: |
                        Language tag → the manifest's translations (`@name`, `@description`, `@setting.<key>`,
                        `@setting.<key>.help`, `@setting.<key>.placeholder`, `@option.<key>.<value>`, `@preset.<id>`). English is
                        the manifest itself, with `en` for option labels.
                    type: object
                manifest:
                    additionalProperties: true
                    description: The plugin's `plugin.json` as-is (docs/plugins.md §3.1).
                    type: object
            required:
                - manifest
            type: object
        Change:
            discriminator:
                propertyName: type
            properties:
                album:
                    $ref: '#/components/schemas/Album'
                birthdays:
                    allOf:
                        - $ref: '#/components/schemas/FrameBirthdays'
                    description: The frame's birthday people (`birthdays` change), or null = drop them. Old frame apps ignore it.
                    nullable: true
                calendar:
                    allOf:
                        - $ref: '#/components/schemas/Calendar'
                    nullable: true
                comments:
                    allOf:
                        - $ref: '#/components/schemas/PlacementComments'
                    description: '`comments` change (entity `id` = the placement): its newest comments, or null = drop them (show comments turned off, comments removed). Only for frames with `settings.social.show_comments`. Old frame apps ignore it.'
                    nullable: true
                frame:
                    properties:
                        location:
                            nullable: true
                            type: string
                        name:
                            type: string
                        owner_name:
                            type: string
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                member:
                    properties:
                        avatar_url:
                            nullable: true
                            type: string
                        display_name:
                            type: string
                        role:
                            $ref: '#/components/schemas/Role'
                        user_id:
                            $ref: '#/components/schemas/Id'
                    type: object
                photo_request:
                    allOf:
                        - $ref: '#/components/schemas/FramePhotoRequest'
                    description: '`photo_request` change (entity `id` = the frame): the frame''s latest "Ask for new photos", or null when there is none in the last 7 days.'
                    nullable: true
                placement:
                    allOf:
                        - $ref: '#/components/schemas/Placement'
                        - properties:
                            media:
                                description: Frame rendition to download (present on placement.upsert when status is ready).
                                properties:
                                    bytes:
                                        type: integer
                                    height:
                                        type: integer
                                    mime:
                                        example: image/webp
                                        type: string
                                    poster_url:
                                        format: uri
                                        nullable: true
                                        type: string
                                    sha256:
                                        type: string
                                    url:
                                        format: uri
                                        type: string
                                    width:
                                        type: integer
                                type: object
                            motion:
                                description: |
                                    Live items only (`item.kind: live`), once the clip's frame rendition is ready: the short H.264
                                    clip to play over the still (`media`), which is also its poster. Frames that don't know `live`
                                    ignore it and show `media` as a photo.
                                properties:
                                    bytes:
                                        type: integer
                                    duration_ms:
                                        type: integer
                                    has_audio:
                                        type: boolean
                                    height:
                                        type: integer
                                    mime:
                                        example: video/mp4
                                        type: string
                                    sha256:
                                        type: string
                                    url:
                                        format: uri
                                        type: string
                                    width:
                                        type: integer
                                type: object
                          type: object
                prompts:
                    allOf:
                        - $ref: '#/components/schemas/FramePrompts'
                    description: '`prompts` change (entity `id` = the frame): the current weekly prompts of its families, or null = none.'
                    nullable: true
                remote_help:
                    allOf:
                        - $ref: '#/components/schemas/FrameRemoteHelp'
                    description: '`remote_help` change (entity `id` = the frame): the active remote help session, or null = no session (leave the tailnet and clean up). Old frame apps ignore it.'
                    nullable: true
                seq:
                    type: integer
                settings:
                    $ref: '#/components/schemas/FrameSettings'
                type:
                    enum:
                        - placement.upsert
                        - placement.remove
                        - settings
                        - album.upsert
                        - album.remove
                        - member.upsert
                        - member.remove
                        - frame
                        - weather
                        - calendar
                        - birthdays
                        - comments
                        - photo_request
                        - prompts
                        - remote_help
                        - reset
                    type: string
                weather:
                    $ref: '#/components/schemas/Weather'
            required:
                - seq
                - type
            type: object
        Circle:
            description: |
                A smaller group inside a family ("Anna's household", "The cousins"): its own chat (`conversation_id`) and an
                audience for posts. Circle posts reach the family's subscribed frames that have a manager (owner, admin or
                `change_settings`) in the circle, plus the frames in `frame_ids` (README §5.18).
            properties:
                conversation_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The circle's chat (members only).
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                feed_id:
                    $ref: '#/components/schemas/Id'
                frame_ids:
                    description: Extra frames (subscribed to the family) the circle's posts reach.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                frames_reached:
                    description: Every subscribed frame its posts reach now (managers in the circle, plus `frame_ids`).
                    items:
                        properties:
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                        required:
                            - frame_id
                            - frame_name
                        type: object
                    type: array
                id:
                    $ref: '#/components/schemas/Id'
                member_count:
                    type: integer
                members:
                    items:
                        $ref: '#/components/schemas/CircleMember'
                    type: array
                my_role:
                    allOf:
                        - $ref: '#/components/schemas/CircleRole'
                    description: Null when the caller is a feed owner/admin who is not in the circle.
                    nullable: true
                name:
                    type: string
            required:
                - id
                - feed_id
                - name
                - members
                - member_count
            type: object
        CircleCreate:
            properties:
                frame_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 50
                    type: array
                member_ids:
                    description: Feed members besides the caller.
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 200
                    type: array
                name:
                    maxLength: 40
                    minLength: 1
                    type: string
            required:
                - name
                - member_ids
            type: object
        CircleEvent:
            properties:
                circle:
                    $ref: '#/components/schemas/Circle'
                feed_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - circle.updated
                    type: string
            required:
                - type
                - feed_id
                - circle
            type: object
        CircleMember:
            properties:
                added_at:
                    format: date-time
                    type: string
                avatar_url:
                    format: uri
                    nullable: true
                    type: string
                display_name:
                    type: string
                role:
                    $ref: '#/components/schemas/CircleRole'
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - user_id
                - display_name
                - role
            type: object
        CircleRemovedEvent:
            properties:
                circle_id:
                    $ref: '#/components/schemas/Id'
                feed_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - circle.removed
                    type: string
            required:
                - type
                - feed_id
                - circle_id
            type: object
        CircleRole:
            enum:
                - admin
                - member
            type: string
        CircleUpdate:
            properties:
                frame_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 50
                    type: array
                name:
                    maxLength: 40
                    minLength: 1
                    type: string
            type: object
        CommandResult:
            properties:
                error_code:
                    nullable: true
                    type: string
                ok:
                    type: boolean
            required:
                - ok
            type: object
        Comment:
            properties:
                author:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    description: '`person` comments; null for frame entries.'
                    nullable: true
                body:
                    description: Null for frame entries and tombstones.
                    nullable: true
                    type: string
                can_delete:
                    type: boolean
                can_edit:
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                deleted:
                    default: false
                    description: Deleted by its author but kept as a tombstone because it has replies ("Comment deleted").
                    type: boolean
                edited_at:
                    format: date-time
                    nullable: true
                    type: string
                frame:
                    description: Frame entries only.
                    nullable: true
                    properties:
                        frame_id:
                            $ref: '#/components/schemas/Id'
                        frame_name:
                            type: string
                        item_id:
                            allOf:
                                - $ref: '#/components/schemas/Id'
                            nullable: true
                        reaction:
                            allOf:
                                - $ref: '#/components/schemas/Reaction'
                            nullable: true
                        reply:
                            allOf:
                                - $ref: '#/components/schemas/ReplyPreset'
                            nullable: true
                        server_name:
                            description: 'A frame on another server (README §5.22): show "Oma''s frame (kinframe.appmire.be)". `frame_id` is then the remote subscription''s id.'
                            nullable: true
                            type: string
                    required:
                        - frame_id
                        - frame_name
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/CommentKind'
                mentions:
                    items:
                        $ref: '#/components/schemas/Mention'
                    type: array
                parent_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: 'Replies only: the top-level comment (one level of replies).'
                    nullable: true
                post_id:
                    $ref: '#/components/schemas/Id'
                quoted:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    description: A reply to a reply quotes that person ("@Ben"), while hanging under the same top comment.
                    nullable: true
                reactions:
                    $ref: '#/components/schemas/ReactionSummary'
                removed_by_admin:
                    default: false
                    description: Only ever true for the author, who still sees it ("Removed by a family admin"); everyone else no longer gets it.
                    type: boolean
                reply_count:
                    description: Top-level comments only.
                    type: integer
            required:
                - id
                - post_id
                - kind
                - created_at
            type: object
        CommentCreate:
            properties:
                body:
                    description: Trimmed; at most `limits.max_comment_chars` characters (Unicode code points).
                    maxLength: 2000
                    minLength: 1
                    type: string
                mentions:
                    items:
                        $ref: '#/components/schemas/Mention'
                    maxItems: 20
                    type: array
                parent_id:
                    $ref: '#/components/schemas/Id'
                quoted_user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - body
            type: object
        CommentDeletedEvent:
            description: '`comment.deleted`: gone from the thread for the receiver.'
            properties:
                comment_id:
                    $ref: '#/components/schemas/Id'
                post_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - comment.deleted
                    type: string
            required:
                - type
                - post_id
                - comment_id
            type: object
        CommentEvent:
            description: '`comment.created` (new comment, reply or frame entry) and `comment.updated` (edited, or deleted into a tombstone).'
            properties:
                comment:
                    $ref: '#/components/schemas/Comment'
                post_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - comment.created
                        - comment.updated
                    type: string
            required:
                - type
                - post_id
                - comment
            type: object
        CommentKind:
            description: '`person`: a comment or reply. `frame`: a read-only frame entry ("Oma''s frame loved this", "Oma''s frame: Call me!").'
            enum:
                - person
                - frame
            type: string
        CommentPage:
            properties:
                comments:
                    items:
                        $ref: '#/components/schemas/Comment'
                    type: array
                has_more:
                    description: More comments after the last one; pass its id as `after`.
                    type: boolean
            required:
                - comments
                - has_more
            type: object
        CommentUpdate:
            properties:
                body:
                    maxLength: 2000
                    minLength: 1
                    type: string
                mentions:
                    items:
                        $ref: '#/components/schemas/Mention'
                    maxItems: 20
                    type: array
            required:
                - body
            type: object
        CommentsChoice:
            description: '`keep` (default) or `delete`: your comments in the family become tombstones ("Comment deleted").'
            enum:
                - keep
                - delete
            type: string
        Conversation:
            properties:
                archived:
                    description: The caller archived it (a new message un-archives it), or its family or circle was deleted (read-only).
                    type: boolean
                circle_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: '`family` and `circle`.'
                    nullable: true
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/ConversationKind'
                last_activity_at:
                    description: Last message
                    format: date-time
                    or creation. The list's sort key.: null
                    type: string
                last_message:
                    allOf:
                        - $ref: '#/components/schemas/Message'
                    nullable: true
                member_count:
                    type: integer
                members:
                    description: Every member (conversations are at most 100 people; family chats can be larger and list everyone).
                    items:
                        $ref: '#/components/schemas/ConversationMember'
                    type: array
                muted:
                    type: boolean
                muted_until:
                    description: 'Null with `muted: true` means always.'
                    format: date-time
                    nullable: true
                    type: string
                my_role:
                    $ref: '#/components/schemas/ConversationRole'
                name:
                    description: Group name; the family's or circle's name; for `direct`, the other person's display name.
                    type: string
                other:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    description: '`direct` only.'
                    nullable: true
                photo_url:
                    description: Group photo; the family's cover; for `direct`, the other person's avatar.
                    format: uri
                    nullable: true
                    type: string
                read_only:
                    description: 'No sending: the family or circle was deleted, or (direct) the other account is gone, blocked the caller, or the two no longer share a family or frame (README §5.21).'
                    type: boolean
                read_only_reason:
                    allOf:
                        - enum:
                            - archived
                            - account_gone
                            - blocked
                            - no_longer_contacts
                          type: string
                    description: 'Why `read_only`: `no_longer_contacts` shows "You can no longer message Lies".'
                    nullable: true
                read_receipts:
                    description: '"Seen" is shown here: direct chats and groups of up to 10 people, when the caller has `show_read_receipts` on.'
                    type: boolean
                read_up_to:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The caller's own read position.
                    nullable: true
                unread_count:
                    description: Messages after the caller's read position
                    not from people they blocked.: null
                    not their own: null
                    type: integer
                unread_mentions:
                    type: integer
            required:
                - id
                - kind
                - name
                - member_count
                - unread_count
                - last_activity_at
                - muted
                - archived
            type: object
        ConversationCreate:
            properties:
                kind:
                    enum:
                        - direct
                        - group
                    type: string
                member_ids:
                    description: Other people (not the caller).
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 99
                    minItems: 1
                    type: array
                name:
                    description: Required for groups.
                    maxLength: 60
                    minLength: 1
                    type: string
            required:
                - kind
                - member_ids
            type: object
        ConversationEvent:
            properties:
                conversation:
                    $ref: '#/components/schemas/Conversation'
                type:
                    enum:
                        - conversation.updated
                    type: string
            required:
                - type
                - conversation
            type: object
        ConversationKind:
            description: '`direct`: two people, one per pair. `group`: 3–100 people with a name. `family`: one per feed, its members always the feed''s members. `circle`: one per circle, its members the circle''s.'
            enum:
                - direct
                - group
                - family
                - circle
            type: string
        ConversationMember:
            properties:
                joined_at:
                    format: date-time
                    type: string
                last_read_message_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Only when read receipts are shown in this conversation (`Conversation.read_receipts`) and this member shows them too; null otherwise.
                    nullable: true
                person:
                    $ref: '#/components/schemas/PersonRef'
                role:
                    $ref: '#/components/schemas/ConversationRole'
            required:
                - person
                - role
            type: object
        ConversationPreferencesUpdate:
            properties:
                archived:
                    type: boolean
                mute:
                    $ref: '#/components/schemas/MuteFor'
            type: object
        ConversationRemovedEvent:
            properties:
                conversation_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - conversation.removed
                    type: string
            required:
                - type
                - conversation_id
            type: object
        ConversationRole:
            description: Groups only; family, circle and direct members are always `member` (family moderation follows feed roles).
            enum:
                - admin
                - member
            type: string
        ConversationUpdate:
            properties:
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
            type: object
        Countdown:
            description: A marked event, even when it lies outside the window.
            properties:
                all_day:
                    type: boolean
                color:
                    $ref: '#/components/schemas/CalendarColor'
                event_id:
                    $ref: '#/components/schemas/CalendarEventId'
                source_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                start_at:
                    format: date-time
                    nullable: true
                    type: string
                start_date:
                    format: date
                    nullable: true
                    type: string
                title:
                    type: string
            required:
                - event_id
                - title
                - all_day
                - color
            type: object
        DeviceEnroll:
            properties:
                app:
                    properties:
                        channel:
                            default: stable
                            enum:
                                - stable
                                - beta
                            type: string
                        version:
                            type: string
                        version_code:
                            type: integer
                    required:
                        - version
                        - version_code
                    type: object
                hardware:
                    properties:
                        abis:
                            items:
                                type: string
                            type: array
                        android_sdk:
                            example: 23
                            type: integer
                        board:
                            example: rk312x
                            type: string
                        brand:
                            example: denver
                            type: string
                        capabilities:
                            properties:
                                accelerometer:
                                    type: boolean
                                battery:
                                    type: boolean
                                light_sensor:
                                    type: boolean
                                motion_sensor:
                                    type: boolean
                                root:
                                    type: boolean
                                sd_card:
                                    type: boolean
                                speaker:
                                    type: boolean
                                usb_host:
                                    type: boolean
                            type: object
                        max_video_decode:
                            $ref: '#/components/schemas/Screen'
                        model:
                            example: PFF_1024
                            type: string
                        ram_mb:
                            type: integer
                        storage_total_bytes:
                            type: integer
                    required:
                        - model
                    type: object
                kind:
                    $ref: '#/components/schemas/DeviceKind'
                locale:
                    type: string
                screen:
                    $ref: '#/components/schemas/Screen'
                timezone:
                    type: string
            required:
                - hardware
                - screen
                - app
            type: object
        DeviceKind:
            default: android
            description: |
                What runs the frame. `android`: the frame app. `browser`: a web browser enrolled as a virtual frame from the TV
                page (`/tv/frame`). Browser frames speak the same device protocol; they never get app updates, are exempt from
                `426 app_update_required`, and send a smaller heartbeat (no Wi-Fi or storage fields).
            enum:
                - android
                - browser
            type: string
        DeviceState:
            properties:
                claimed:
                    type: boolean
                device_id:
                    $ref: '#/components/schemas/Id'
                frame_id:
                    nullable: true
                    type: string
                frame_name:
                    nullable: true
                    type: string
                latest_seq:
                    type: integer
                owner_name:
                    nullable: true
                    type: string
                server_time:
                    format: date-time
                    type: string
            required:
                - device_id
                - claimed
                - latest_seq
            type: object
        DiscoveredEntity:
            properties:
                device_class:
                    type: string
                entity_id:
                    type: string
                name:
                    type: string
                unit:
                    type: string
            required:
                - entity_id
            type: object
        DiscoveredService:
            properties:
                name:
                    maxLength: 100
                    type: string
                url:
                    example: http://192.168.1.20
                    maxLength: 200
                    type: string
            required:
                - name
                - url
            type: object
        Discovery:
            properties:
                api:
                    format: uri
                    type: string
                api_version:
                    description: API major version, `v1`.
                    example: v1
                    type: string
                app_versions:
                    description: |
                        Family app version policy per platform (README §5.15). A platform is left out when the operator set nothing
                        for it. Apps compare their own build number: below `minimum_build` they show a blocking "update" screen
                        (the server also answers `426 app_update_required` to their requests), below `recommended_build` a banner
                        that can be dismissed.
                    properties:
                        android:
                            $ref: '#/components/schemas/AppVersionPolicy'
                        ios:
                            $ref: '#/components/schemas/AppVersionPolicy'
                        macos:
                            $ref: '#/components/schemas/AppVersionPolicy'
                    type: object
                auth:
                    properties:
                        api_resource:
                            type: string
                        desktop_client_id:
                            description: |
                                Logto Native app of the Windows, macOS and Linux client. It signs in with a loopback redirect
                                (`http://127.0.0.1:<port>/callback`, RFC 8252). Absent on servers bootstrapped before it existed.
                            type: string
                        issuer:
                            format: uri
                            type: string
                        mobile_client_id:
                            type: string
                        web_client_id:
                            type: string
                    required:
                        - issuer
                        - mobile_client_id
                        - web_client_id
                        - api_resource
                    type: object
                base_url:
                    description: The server's public base URL (the `server` field of push payloads and the `kinframe-server` header of federation requests).
                    format: uri
                    type: string
                birthdays:
                    default: false
                    description: True when feeds have birthday lists (docs/spec/birthdays.md). Only true together with `feeds`.
                    type: boolean
                calendar:
                    default: false
                    description: True when the server syncs calendars for frames (ICS/webcal and CalDAV).
                    type: boolean
                chats:
                    default: false
                    description: True when the server has conversations (direct, group, family, circle), blocks and reports (README §5.19).
                    type: boolean
                dev_auth:
                    default: false
                    description: True only on development servers running dev auth mode (POST /dev/token). Never true in production.
                    type: boolean
                email_digest:
                    default: false
                    description: True when the server can send outgoing mail, so people can choose a daily or weekly email digest of comments and messages.
                    type: boolean
                email_inbox:
                    default: false
                    description: |
                        True when frames and feeds can have inbox addresses that turn mailed photos into sends and posts
                        (docs/spec/email-inbox.md). Clients hide "Email photos to this frame" otherwise.
                    type: boolean
                email_inbox_domain:
                    description: The mail domain of inbox addresses (`<slug>-<random>@<domain>`); null without `email_inbox`.
                    example: in.kinframe.appmire.be
                    nullable: true
                    type: string
                engagement:
                    default: false
                    description: True when the server has frame freshness, "Ask for new photos", reminders, streaks, prompts, On this day, summaries, recaps and milestones (README §5.20).
                    type: boolean
                federation:
                    $ref: '#/components/schemas/FederationInfo'
                feeds:
                    default: false
                    description: True when the server supports feeds and subscriptions (docs/spec/feeds.md).
                    type: boolean
                framing:
                    default: false
                    description: True when the server stores framing (zoom and position per orientation, docs/spec/framing.md).
                    type: boolean
                google_photos_import:
                    default: false
                    description: True when the operator configured a Google OAuth client, so clients offer "Add from Google Photos".
                    type: boolean
                leaving:
                    default: false
                    description: True when the server has the leaving choices, take-away, keep requests, the account deletion handover and the memories filter (README §5.21).
                    type: boolean
                limits:
                    $ref: '#/components/schemas/Limits'
                link_previews:
                    default: false
                    description: |
                        True when the operator turned on link previews (`KINFRAME_LINK_PREVIEWS=1`): the server fetches pages of
                        links in messages itself (public addresses only). Off by default; clients then show links without previews.
                    type: boolean
                name:
                    type: string
                photo_source_providers:
                    description: The providers this server allows (`icloud_link` can be turned off on its own). Empty without `photo_sources`.
                    items:
                        $ref: '#/components/schemas/PhotoSourceProvider'
                    type: array
                photo_sources:
                    default: false
                    description: True when albums and feeds can sync from Immich or iCloud (docs/spec/photo-sources.md).
                    type: boolean
                photo_sources_private_networks:
                    default: false
                    description: |
                        True when sources may reach private network addresses (a home-network Immich such as
                        `http://192.168.1.10:2283`). False: the connect sheet asks for a public address (docs/spec/photo-sources.md §12.3).
                    type: boolean
                remote_families:
                    default: false
                    description: True when frames here can follow families on other servers and families here can allow frames on other servers (README §5.22). False when federation is off.
                    type: boolean
                remote_help:
                    default: false
                    description: |
                        True when the operator configured remote help (Headscale, ADB key and the checked tailnet policy;
                        docs/spec/remote-help.md §5.1). Frame pages show an active session either way (`FrameSummary.remote_help`).
                    type: boolean
                sentry_dsn:
                    description: |
                        DSN of the Sentry-compatible server (GlitchTip) the web app sends its crash reports to
                        (docs/spec/crash-reporting.md): the operator's `KINFRAME_SENTRY_WEB_DSN`. Omitted when unset; the web app
                        then starts no crash reporting. Only the web app reads it; the native apps have their own DSN.
                    type: string
                server_id:
                    description: |
                        Stable random id of this server (generated at first start), so apps signed in to several servers can tell
                        them apart and deduplicate accounts (docs/spec/multi-server.md §2.3).
                    type: string
                server_name:
                    description: The operator-set label of this server (`KINFRAME_SERVER_LABEL`, default the public host name), shown as the server chip in apps with several accounts.
                    example: Janssens
                    type: string
                shop:
                    $ref: '#/components/schemas/Shop'
                social:
                    default: false
                    description: True when the server has the home timeline, comment threads, people's reactions, mentions, the `member` role and circles (docs/spec/family-social.md, README §5.18). Only with `feeds`.
                    type: boolean
                telegram:
                    default: false
                    description: |
                        True when the operator configured a Telegram bot, so frames and feeds can connect Telegram chats and
                        accounts can link Telegram (docs/spec/telegram.md). Clients hide every Telegram section otherwise.
                    type: boolean
                telegram_bot_username:
                    description: The bot's username without "@", for `https://t.me/<username>` links; null without `telegram`.
                    example: kinframe_bot
                    nullable: true
                    type: string
                telegram_max_file_bytes:
                    description: The largest file the bot can download (20 MB on Telegram's cloud Bot API, up to 2000 MB with a local Bot API server); null without `telegram`.
                    nullable: true
                    type: integer
                telegram_privacy_mode:
                    default: false
                    description: |
                        True when the bot runs in Telegram's privacy mode: a group must make the bot an admin before it sees photos,
                        so the connect sheet says so up front (docs/spec/telegram.md §6).
                    type: boolean
                version:
                    type: string
                voice_messages:
                    default: false
                    description: True when chats accept voice messages (needs ffmpeg on the server; README §5.19).
                    type: boolean
                weather:
                    default: false
                    description: True when the server fetches weather for frames and serves `/v1/geocode`.
                    type: boolean
                web:
                    format: uri
                    type: string
                webpush_public_key:
                    description: |
                        VAPID application server public key (uncompressed P-256 point, base64url) for browser push
                        subscriptions (`PushManager.subscribe({applicationServerKey})`). Null when the server has push disabled.
                    nullable: true
                    type: string
            required:
                - name
                - version
                - api
                - auth
                - limits
            type: object
        EmailAddress:
            properties:
                address:
                    description: 'The full address, `<slug>-<random>@<email_inbox_domain>`. A capability: shown to managers only.'
                    example: oma-k7q2m9@in.kinframe.appmire.be
                    format: email
                    type: string
                anyone_may_send:
                    description: Mail from anyone with the address is delivered without approval (default off).
                    type: boolean
                can_manage:
                    type: boolean
                counts:
                    properties:
                        allowed_senders:
                            type: integer
                        blocked_senders:
                            type: integer
                        delivered_30d:
                            description: Mails delivered in the last 30 days.
                            type: integer
                        held_messages:
                            type: integer
                        pending_senders:
                            type: integer
                    required:
                        - allowed_senders
                        - pending_senders
                        - held_messages
                    type: object
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_owner:
                    type: boolean
                last_received_at:
                    format: date-time
                    nullable: true
                    type: string
                name:
                    description: Label in the apps and in replies to senders ("Oma's frame").
                    type: string
                notify_reactions:
                    description: The owner gets reaction and reply notifications for photos they sent on behalf of non-account senders (the owner's own switch).
                    type: boolean
                offer_app_invite:
                    description: Replies to allowed, authenticated senders include a link to join the frame or feed in the app (an invite that always needs approval; default on).
                    type: boolean
                owner:
                    allOf:
                        - properties:
                            avatar_url:
                                format: uri
                                nullable: true
                                type: string
                            display_name:
                                type: string
                            user_id:
                                $ref: '#/components/schemas/Id'
                          required:
                            - user_id
                            - display_name
                          type: object
                    description: |
                        Who mail from senders without a matching account is sent by (the creator, or the frame's or feed's owner after
                        the creator lost their rights). Null only briefly while ownership passes on.
                    nullable: true
                regenerated_at:
                    format: date-time
                    nullable: true
                    type: string
                replies_available:
                    description: 'False when the server can''t send mail (no outgoing mail configured): senders get no replies at all.'
                    type: boolean
                send_confirmations:
                    description: Authenticated senders get a short "delivered" reply (default on).
                    type: boolean
                slug:
                    description: The friendly part.
                    example: oma
                    type: string
                status:
                    $ref: '#/components/schemas/EmailAddressStatus'
                target:
                    $ref: '#/components/schemas/EmailAddressTarget'
            required:
                - id
                - address
                - slug
                - name
                - target
                - status
                - anyone_may_send
                - send_confirmations
                - offer_app_invite
                - notify_reactions
                - counts
                - created_at
            type: object
        EmailAddressCreate:
            properties:
                anyone_may_send:
                    default: false
                    type: boolean
                name:
                    description: Label; defaults to the target's name.
                    maxLength: 60
                    minLength: 1
                    type: string
                notify_reactions:
                    default: true
                    type: boolean
                offer_app_invite:
                    default: true
                    type: boolean
                send_confirmations:
                    default: true
                    type: boolean
                slug:
                    description: The friendly part; defaults to one made from the target's name (lower case, accents removed, `oma`).
                    maxLength: 24
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
            type: object
        EmailAddressStatus:
            description: '`active`: mail is accepted. `paused`: mail to it is refused (`550 5.2.1 This address is paused`); resume to reopen.'
            enum:
                - active
                - paused
            type: string
        EmailAddressTarget:
            description: What the address fills. Exactly one of `frame_id` (a direct send) or `feed_id` (a post) is set.
            properties:
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                feed_name:
                    nullable: true
                    type: string
                frame_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                frame_name:
                    nullable: true
                    type: string
                kind:
                    enum:
                        - frame
                        - feed
                    type: string
            required:
                - kind
            type: object
        EmailAddressUpdate:
            description: At least one field.
            properties:
                anyone_may_send:
                    type: boolean
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
                notify_reactions:
                    description: The owner's own switch; only the owner may change it.
                    type: boolean
                offer_app_invite:
                    type: boolean
                paused:
                    description: true pauses, false resumes.
                    type: boolean
                send_confirmations:
                    type: boolean
                slug:
                    description: A new friendly part; the old address stops working at once.
                    maxLength: 24
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                take_over:
                    description: The caller becomes the owner.
                    type: boolean
            type: object
        EmailAuthResult:
            description: How the mail was checked (docs/spec/email-inbox.md §7). Only `authenticated` mail is matched, allowed or answered.
            properties:
                aligned:
                    description: 'Which check aligned: `spf` or `dkim`; null when neither.'
                    nullable: true
                    type: string
                authenticated:
                    description: DMARC-aligned SPF or DKIM passed for the From domain.
                    type: boolean
                dkim:
                    enum:
                        - pass
                        - fail
                        - none
                        - temperror
                        - permerror
                    type: string
                dkim_domain:
                    description: The `d=` of the passing signature.
                    nullable: true
                    type: string
                dmarc:
                    enum:
                        - pass
                        - fail
                        - none
                        - temperror
                    type: string
                dmarc_policy:
                    description: 'The From domain''s policy: `none`, `quarantine` or `reject`; null without a DMARC record.'
                    nullable: true
                    type: string
                from_domain:
                    nullable: true
                    type: string
                spf:
                    enum:
                        - pass
                        - fail
                        - softfail
                        - neutral
                        - none
                        - temperror
                        - permerror
                        - not_checked
                    type: string
            required:
