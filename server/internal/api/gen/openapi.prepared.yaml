components:
    parameters:
        CalendarId:
            in: path
            name: calendarId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Cursor:
            in: query
            name: cursor
            schema:
                type: string
        EndpointId:
            in: path
            name: endpointId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        EventId:
            in: path
            name: eventId
            required: true
            schema:
                $ref: '#/components/schemas/CalendarEventId'
        FrameId:
            in: path
            name: frameId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        IdempotencyKey:
            in: header
            name: Idempotency-Key
            schema:
                maxLength: 64
                type: string
        IfMatch:
            description: Quoted version, e.g. "7"
            in: header
            name: If-Match
            required: true
            schema:
                type: string
        InvitationId:
            in: path
            name: invitationId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        InviteToken:
            in: path
            name: token
            required: true
            schema:
                maxLength: 64
                minLength: 22
                type: string
        ItemId:
            in: path
            name: itemId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Limit:
            in: query
            name: limit
            schema:
                default: 50
                maximum: 200
                minimum: 1
                type: integer
        PlacementId:
            in: path
            name: placementId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        UserId:
            in: path
            name: userId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
    responses:
        Problem:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Error (RFC 9457)
    schemas:
        Album:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                placement_count:
                    type: integer
                placement_ids:
                    description: Ordered.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
                version:
                    type: integer
            required:
                - id
                - name
                - version
                - placement_count
            type: object
        AlbumWrite:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
                placement_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
            type: object
        Calendar:
            description: |
                Payload of the `calendar` change (docs/api/README.md §5.8): every enabled source of the frame merged into one
                list, deduplicated across sources by UID and start, sorted by start.
            properties:
                countdowns:
                    description: Marked events that have not passed yet, nearest first.
                    items:
                        $ref: '#/components/schemas/Countdown'
                    type: array
                events:
                    items:
                        $ref: '#/components/schemas/CalendarEvent'
                    type: array
                generated_at:
                    format: date-time
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/CalendarSourceInfo'
                    type: array
                timezone:
                    description: The frame's time zone (`locale.timezone`), used for the window and all-day events.
                    example: Europe/Brussels
                    type: string
                window:
                    properties:
                        from:
                            format: date
                            type: string
                        to:
                            description: Inclusive.
                            format: date
                            type: string
                    required:
                        - from
                        - to
                    type: object
            required:
                - generated_at
                - timezone
                - window
                - sources
                - events
                - countdowns
            type: object
        CalendarColor:
            description: |
                Palette key. Clients map it to the light/dark colours listed in docs/api/README.md §5.8 (the same 12 colours
                everywhere).
            enum:
                - coral
                - tangerine
                - amber
                - olive
                - mint
                - sage
                - teal
                - sky
                - ocean
                - lavender
                - plum
                - rose
            type: string
        CalendarEvent:
            description: |
                One occurrence. Timed events have `start_at`/`end_at` (UTC; clients show them in the frame's time zone);
                all-day events have `start_date`/`end_date` (inclusive) and no times. Multi-day events span several days.
            properties:
                all_day:
                    type: boolean
                countdown:
                    type: boolean
                end_at:
                    format: date-time
                    nullable: true
                    type: string
                end_date:
                    format: date
                    nullable: true
                    type: string
                has_photo:
                    type: boolean
                id:
                    $ref: '#/components/schemas/CalendarEventId'
                invitation_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Received events only; the photo is at `/v1/device/invitations/{id}/photo`.
                    nullable: true
                location:
                    maxLength: 200
                    nullable: true
                    type: string
                notes:
                    maxLength: 500
                    nullable: true
                    type: string
                photo_placement:
                    allOf:
                        - $ref: '#/components/schemas/EventPhotoPlacement'
                    nullable: true
                recurring:
                    type: boolean
                sender_name:
                    description: Received events only.
                    nullable: true
                    type: string
                source_id:
                    $ref: '#/components/schemas/Id'
                start_at:
                    format: date-time
                    nullable: true
                    type: string
                start_date:
                    format: date
                    nullable: true
                    type: string
                title:
                    maxLength: 200
                    type: string
            required:
                - id
                - source_id
                - title
                - all_day
            type: object
        CalendarEventId:
            description: Stable id of one event occurrence (a hash of source, UID and occurrence start).
            pattern: ^[A-Za-z0-9_-]{8,64}$
            type: string
        CalendarSchedule:
            description: Same shape as `SleepSchedule`, with `from`/`to` instead of `sleep_at`/`wake_at`. `to` before `from` runs past midnight.
            properties:
                days:
                    items:
                        enum:
                            - mon
                            - tue
                            - wed
                            - thu
                            - fri
                            - sat
                            - sun
                        type: string
                    type: array
                enabled:
                    type: boolean
                from:
                    example: "07:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                to:
                    example: "09:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
            required:
                - id
                - from
                - to
                - days
                - enabled
            type: object
        CalendarSource:
            properties:
                color:
                    $ref: '#/components/schemas/CalendarColor'
                created_at:
                    format: date-time
                    type: string
                enabled:
                    type: boolean
                event_count:
                    description: Events of this source in the frame's window.
                    type: integer
                has_password:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/CalendarSourceKind'
                last_attempt_at:
                    format: date-time
                    nullable: true
                    type: string
                last_error:
                    description: Short reason of the last failed sync (English).
                    nullable: true
                    type: string
                last_synced_at:
                    description: Last successful sync.
                    format: date-time
                    nullable: true
                    type: string
                name:
                    description: 'Display name. Empty for the local calendar until renamed: clients show "Received events".'
                    type: string
                next_sync_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/CalendarSyncStatus'
                url_hint:
                    description: Redacted URL for display. Null for `local`.
                    example: https://calendar.google.com/…/basic.ics
                    nullable: true
                    type: string
                username:
                    description: CalDAV only.
                    nullable: true
                    type: string
            required:
                - id
                - kind
                - name
                - color
                - enabled
                - status
            type: object
        CalendarSourceCreate:
            properties:
                calendar_url:
                    description: 'CalDAV only: the calendar collection to use, from `CalendarTestResult.calendars`.'
                    maxLength: 2048
                    type: string
                color:
                    $ref: '#/components/schemas/CalendarColor'
                enabled:
                    default: true
                    type: boolean
                kind:
                    enum:
                        - ics
                        - caldav
                    type: string
                name:
                    description: Defaults to the calendar's own name
                    else the host.: null
                    maxLength: 60
                    type: string
                password:
                    description: CalDAV only; use an app-specific password.
                    maxLength: 500
                    type: string
                    writeOnly: true
                url:
                    description: '`https://`, `http://` or `webcal://` (treated as https). For CalDAV: the server, account or calendar URL.'
                    maxLength: 2048
                    minLength: 8
                    type: string
                username:
                    description: CalDAV only.
                    maxLength: 200
                    type: string
            required:
                - kind
                - url
            type: object
        CalendarSourceInfo:
            properties:
                color:
                    $ref: '#/components/schemas/CalendarColor'
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/CalendarSourceKind'
                last_synced_at:
                    format: date-time
                    nullable: true
                    type: string
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/CalendarSyncStatus'
            required:
                - id
                - kind
                - name
                - color
                - status
            type: object
        CalendarSourceKind:
            description: '`ics`: an ICS/iCal/webcal link. `caldav`: a CalDAV calendar. `local`: the frame''s received-events calendar.'
            enum:
                - ics
                - caldav
                - local
            type: string
        CalendarSourceUpdate:
            properties:
                calendar_url:
                    maxLength: 2048
                    type: string
                color:
                    $ref: '#/components/schemas/CalendarColor'
                enabled:
                    type: boolean
                name:
                    maxLength: 60
                    type: string
                password:
                    maxLength: 500
                    type: string
                    writeOnly: true
                url:
                    maxLength: 2048
                    minLength: 8
                    type: string
                username:
                    maxLength: 200
                    type: string
            type: object
        CalendarSyncStatus:
            description: '`syncing` before the first sync and while one runs; `disabled` when the source is turned off.'
            enum:
                - ok
                - syncing
                - failed
                - auth_failed
                - disabled
            type: string
        CalendarTestResult:
            properties:
                calendar_name:
                    description: The calendar's own name
                    if it has one.: null
                    nullable: true
                    type: string
                calendars:
                    description: CalDAV only. Calendars on the account that hold events.
                    items:
                        properties:
                            color:
                                as a hint.: null
                                description: The server's colour (hex)
                                nullable: true
                                type: string
                            name:
                                type: string
                            url:
                                type: string
                        required:
                            - url
                            - name
                        type: object
                    type: array
                error:
                    nullable: true
                    type: string
                event_count:
                    description: Events in the next 30 days.
                    nullable: true
                    type: integer
                ok:
                    type: boolean
                status:
                    enum:
                        - ok
                        - failed
                        - auth_failed
                    type: string
            required:
                - ok
                - status
            type: object
        CalendarView:
            allOf:
                - $ref: '#/components/schemas/Calendar'
                - properties:
                    weather:
                        $ref: '#/components/schemas/Weather'
                  type: object
        Change:
            discriminator:
                propertyName: type
            properties:
                album:
                    $ref: '#/components/schemas/Album'
                calendar:
                    allOf:
                        - $ref: '#/components/schemas/Calendar'
                    nullable: true
                frame:
                    properties:
                        location:
                            nullable: true
                            type: string
                        name:
                            type: string
                        owner_name:
                            type: string
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                member:
                    properties:
                        avatar_url:
                            nullable: true
                            type: string
                        display_name:
                            type: string
                        role:
                            $ref: '#/components/schemas/Role'
                        user_id:
                            $ref: '#/components/schemas/Id'
                    type: object
                placement:
                    allOf:
                        - $ref: '#/components/schemas/Placement'
                        - properties:
                            media:
                                description: Frame rendition to download (present on placement.upsert when status is ready).
                                properties:
                                    bytes:
                                        type: integer
                                    height:
                                        type: integer
                                    mime:
                                        example: image/webp
                                        type: string
                                    poster_url:
                                        format: uri
                                        nullable: true
                                        type: string
                                    sha256:
                                        type: string
                                    url:
                                        format: uri
                                        type: string
                                    width:
                                        type: integer
                                type: object
                            motion:
                                description: |
                                    Live items only (`item.kind: live`), once the clip's frame rendition is ready: the short H.264
                                    clip to play over the still (`media`), which is also its poster. Frames that don't know `live`
                                    ignore it and show `media` as a photo.
                                properties:
                                    bytes:
                                        type: integer
                                    duration_ms:
                                        type: integer
                                    has_audio:
                                        type: boolean
                                    height:
                                        type: integer
                                    mime:
                                        example: video/mp4
                                        type: string
                                    sha256:
                                        type: string
                                    url:
                                        format: uri
                                        type: string
                                    width:
                                        type: integer
                                type: object
                          type: object
                seq:
                    type: integer
                settings:
                    $ref: '#/components/schemas/FrameSettings'
                type:
                    enum:
                        - placement.upsert
                        - placement.remove
                        - settings
                        - album.upsert
                        - album.remove
                        - member.upsert
                        - member.remove
                        - frame
                        - weather
                        - calendar
                        - reset
                    type: string
                weather:
                    $ref: '#/components/schemas/Weather'
            required:
                - seq
                - type
            type: object
        CommandResult:
            properties:
                error_code:
                    nullable: true
                    type: string
                ok:
                    type: boolean
            required:
                - ok
            type: object
        Countdown:
            description: A marked event, even when it lies outside the window.
            properties:
                all_day:
                    type: boolean
                color:
                    $ref: '#/components/schemas/CalendarColor'
                event_id:
                    $ref: '#/components/schemas/CalendarEventId'
                source_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                start_at:
                    format: date-time
                    nullable: true
                    type: string
                start_date:
                    format: date
                    nullable: true
                    type: string
                title:
                    type: string
            required:
                - event_id
                - title
                - all_day
                - color
            type: object
        DeviceEnroll:
            properties:
                app:
                    properties:
                        channel:
                            default: stable
                            enum:
                                - stable
                                - beta
                            type: string
                        version:
                            type: string
                        version_code:
                            type: integer
                    required:
                        - version
                        - version_code
                    type: object
                hardware:
                    properties:
                        abis:
                            items:
                                type: string
                            type: array
                        android_sdk:
                            example: 23
                            type: integer
                        board:
                            example: rk312x
                            type: string
                        brand:
                            example: denver
                            type: string
                        capabilities:
                            properties:
                                accelerometer:
                                    type: boolean
                                battery:
                                    type: boolean
                                light_sensor:
                                    type: boolean
                                motion_sensor:
                                    type: boolean
                                root:
                                    type: boolean
                                sd_card:
                                    type: boolean
                                speaker:
                                    type: boolean
                                usb_host:
                                    type: boolean
                            type: object
                        max_video_decode:
                            $ref: '#/components/schemas/Screen'
                        model:
                            example: PFF_1024
                            type: string
                        ram_mb:
                            type: integer
                        storage_total_bytes:
                            type: integer
                    required:
                        - model
                    type: object
                locale:
                    type: string
                screen:
                    $ref: '#/components/schemas/Screen'
                timezone:
                    type: string
            required:
                - hardware
                - screen
                - app
            type: object
        DeviceState:
            properties:
                claimed:
                    type: boolean
                device_id:
                    $ref: '#/components/schemas/Id'
                frame_id:
                    nullable: true
                    type: string
                frame_name:
                    nullable: true
                    type: string
                latest_seq:
                    type: integer
                owner_name:
                    nullable: true
                    type: string
                server_time:
                    format: date-time
                    type: string
            required:
                - device_id
                - claimed
                - latest_seq
            type: object
        Discovery:
            properties:
                api:
                    format: uri
                    type: string
                auth:
                    properties:
                        api_resource:
                            type: string
                        desktop_client_id:
                            description: |
                                Logto Native app of the Windows, macOS and Linux client. It signs in with a loopback redirect
                                (`http://127.0.0.1:<port>/callback`, RFC 8252). Absent on servers bootstrapped before it existed.
                            type: string
                        issuer:
                            format: uri
                            type: string
                        mobile_client_id:
                            type: string
                        web_client_id:
                            type: string
                    required:
                        - issuer
                        - mobile_client_id
                        - web_client_id
                        - api_resource
                    type: object
                calendar:
                    default: false
                    description: True when the server syncs calendars for frames (ICS/webcal and CalDAV).
                    type: boolean
                dev_auth:
                    default: false
                    description: True only on development servers running dev auth mode (POST /dev/token). Never true in production.
                    type: boolean
                limits:
                    $ref: '#/components/schemas/Limits'
                name:
                    type: string
                shop:
                    $ref: '#/components/schemas/Shop'
                version:
                    type: string
                weather:
                    default: false
                    description: True when the server fetches weather for frames and serves `/v1/geocode`.
                    type: boolean
                web:
                    format: uri
                    type: string
                webpush_public_key:
                    description: |
                        VAPID application server public key (uncompressed P-256 point, base64url) for browser push
                        subscriptions (`PushManager.subscribe({applicationServerKey})`). Null when the server has push disabled.
                    nullable: true
                    type: string
            required:
                - name
                - version
                - api
                - auth
                - limits
            type: object
        EventInvitation:
            properties:
                all_day:
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                decided_at:
                    format: date-time
                    nullable: true
                    type: string
                end_at:
                    format: date-time
                    nullable: true
                    type: string
                end_date:
                    format: date
                    nullable: true
                    type: string
                frame_id:
                    $ref: '#/components/schemas/Id'
                has_photo:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                location:
                    nullable: true
                    type: string
                notes:
                    nullable: true
                    type: string
                photo_placement:
                    $ref: '#/components/schemas/EventPhotoPlacement'
                sender_id:
                    $ref: '#/components/schemas/Id'
                sender_name:
                    type: string
                start_at:
                    format: date-time
                    nullable: true
                    type: string
                start_date:
                    format: date
                    nullable: true
                    type: string
                status:
                    enum:
                        - pending
                        - accepted
                        - declined
                        - withdrawn
                    type: string
                title:
                    type: string
            required:
                - id
                - frame_id
                - sender_id
                - sender_name
                - status
                - title
                - all_day
                - has_photo
                - created_at
            type: object
        EventInvitationCreate:
            description: Timed events need `start_at` and `end_at`; all-day events need `start_date` (`end_date` is inclusive and defaults to `start_date`).
            properties:
                all_day:
                    default: false
                    type: boolean
                end_at:
                    format: date-time
                    type: string
                end_date:
                    format: date
                    type: string
                location:
                    maxLength: 200
                    type: string
                notes:
                    maxLength: 2000
                    type: string
                photo_placement:
                    $ref: '#/components/schemas/EventPhotoPlacement'
                photo_upload_id:
                    description: A finished tus upload holding an image.
                    type: string
                start_at:
                    format: date-time
                    type: string
                start_date:
                    format: date
                    type: string
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - title
            type: object
        EventPhotoPlacement:
            description: '`top`: the photo above the event details. `background`: the photo fills the card behind them.'
            enum:
                - top
                - background
            type: string
        Fit:
            enum:
                - fill
                - fit
            type: string
        FocalPoint:
            description: Relative to the master rendition, 0..1 from top-left.
            properties:
                x:
                    maximum: 1
                    minimum: 0
                    type: number
                "y":
                    maximum: 1
                    minimum: 0
                    type: number
            required:
                - x
                - "y"
            type: object
        Frame:
            allOf:
                - $ref: '#/components/schemas/FrameSummary'
                - properties:
                    approve_joins_on_frame:
                        type: boolean
                    created_at:
                        format: date-time
                        type: string
                    default_permissions:
                        $ref: '#/components/schemas/Permissions'
                    invite_requires_approval:
                        type: boolean
                    member_count:
                        type: integer
                    moderation:
                        type: boolean
                    placement_count:
                        type: integer
                  type: object
        FrameCode:
            properties:
                claimed:
                    description: false while the frame has no owner
                    type: boolean
                code:
                    pattern: ^[0-9]{8}$
                    type: string
                expires_at:
                    format: date-time
                    type: string
                join_url:
                    format: uri
                    type: string
            required:
                - code
                - expires_at
                - join_url
            type: object
        FrameCommand:
            properties:
                placement_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - sleep
                        - wake
                        - restart
                        - next
                        - previous
                        - show_placement
                        - sync_now
                        - identify
                    type: string
            required:
                - type
            type: object
        FrameHealth:
            properties:
                last_heartbeat:
                    $ref: '#/components/schemas/Heartbeat'
                last_seen_at:
                    format: date-time
                    nullable: true
                    type: string
                last_unclean_shutdown_at:
                    format: date-time
                    nullable: true
                    type: string
                online:
                    type: boolean
            type: object
        FrameSettings:
            description: Defaults per docs/spec/product-spec.md §6. Unknown fields must be preserved by clients.
            properties:
                calendar:
                    description: Full-screen calendar options (product spec §4.9). The first day of the week is `locale.first_day_of_week`.
                    properties:
                        fade_past:
                            default: true
                            type: boolean
                        future_days:
                            default: 30
                            description: Sync window after today.
                            maximum: 365
                            minimum: 7
                            type: integer
                        past_days:
                            default: 30
                            description: Sync window before today.
                            maximum: 365
                            minimum: 1
                            type: integer
                        start_on_today:
                            default: true
                            description: Week and 4-day views start on today rather than the first day of the week.
                            type: boolean
                        timed_views:
                            description: 'Calendar timed view: while a schedule is active the frame shows the full-screen calendar instead of photos. New schedules default to 07:00–09:00 on every day.'
                            items:
                                $ref: '#/components/schemas/CalendarSchedule'
                            type: array
                        view:
                            default: week
                            enum:
                                - four_day
                                - week
                                - month
                            type: string
                        week_numbers:
                            default: false
                            type: boolean
                    type: object
                display:
                    properties:
                        brightness:
                            default: 204
                            maximum: 255
                            minimum: 15
                            type: integer
                        brightness_mode:
                            default: manual
                            enum:
                                - manual
                                - schedule
                                - sun
                                - sensor
                            type: string
                        brightness_schedule:
                            items:
                                properties:
                                    at:
                                        pattern: ^[0-2][0-9]:[0-5][0-9]$
                                        type: string
                                    brightness:
                                        maximum: 255
                                        minimum: 15
                                        type: integer
                                type: object
                            type: array
                        motion_timeout_min:
                            default: 30
                            nullable: true
                            type: integer
                        sleep_schedules:
                            items:
                                $ref: '#/components/schemas/SleepSchedule'
                            type: array
                        text_scale:
                            default: 1
                            enum:
                                - 1
                                - 1.15
                                - 1.3
                            type: number
                    type: object
                kiosk:
                    properties:
                        allow_remove_members_on_frame:
                            default: true
                            type: boolean
                        owner_pin:
                            description: |
                                Owner only (`403 forbidden` for anyone else). A 4–6 digit kiosk PIN for the frame, or null to remove it.
                                The server never stores or returns the PIN: it keeps only `owner_pin_hash`, which the frame verifies
                                locally (opening settings, leaving the kiosk, power off/restart, Wi-Fi changes).
                            nullable: true
                            pattern: ^[0-9]{4,6}$
                            type: string
                            writeOnly: true
                        owner_pin_hash:
                            allOf:
                                - $ref: '#/components/schemas/PinHash'
                            description: |
                                Salted hash of the owner PIN, null when no PIN is set. Only the frame sees it (in the change feed and
                                in `PATCH /device/settings` responses); user-facing settings omit it. The frame may set or clear it
                                with `PATCH /device/settings` when the PIN is changed at the frame; users set it via `owner_pin`.
                            nullable: true
                        owner_pin_set:
                            readOnly: true
                            type: boolean
                    type: object
                locale:
                    properties:
                        first_day_of_week:
                            default: mon
                            enum:
                                - mon
                                - sun
                                - sat
                            type: string
                        language:
                            default: en
                            type: string
                        temperature_unit:
                            default: c
                            enum:
                                - c
                                - f
                            type: string
                        timezone:
                            default: Europe/Brussels
                            type: string
                    type: object
                location:
                    description: |
                        Used for weather and sun-based brightness. Set by owner/admin, usually from a `/v1/geocode` result.
                        Changing it (or turning `widgets.weather` on) makes the server fetch weather right away.
                    nullable: true
                    properties:
                        lat:
                            maximum: 90
                            minimum: -90
                            type: number
                        lon:
                            maximum: 180
                            minimum: -180
                            type: number
                        name:
                            maxLength: 100
                            type: string
                    required:
                        - lat
                        - lon
                    type: object
                notifications:
                    properties:
                        sound:
                            default: true
                            type: boolean
                        volume:
                            default: 40
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                slideshow:
                    properties:
                        album_id:
                            description: null = all photos
                            nullable: true
                            type: string
                        background:
                            default: blur
                            enum:
                                - blur
                                - black
                                - palette
                            type: string
                        caption_date:
                            default: received
                            enum:
                                - taken
                                - received
                                - none
                            type: string
                        collage:
                            default: false
                            type: boolean
                        collage_max:
                            default: 3
                            maximum: 6
                            minimum: 2
                            type: integer
                        fill:
                            default: true
                            type: boolean
                        interval_s:
                            default: 30
                            maximum: 86400
                            minimum: 2
                            type: integer
                        live_photos:
                            default: "on"
                            description: |
                                Live/Motion Photos: `on` plays the motion once when the slide appears (and on tap), `tap` only on
                                tap, `off` shows the still only.
                            enum:
                                - "on"
                                - tap
                                - "off"
                            type: string
                        on_this_day:
                            default: false
                            type: boolean
                        order:
                            default: received
                            enum:
                                - received
                                - taken
                                - shuffle
                            type: string
                        pair_portraits:
                            default: true
                            type: boolean
                        reverse:
                            default: false
                            type: boolean
                        transition:
                            default: crossfade
                            enum:
                                - crossfade
                                - slide
                                - kenburns
                            type: string
                        transition_ms:
                            default: 800
                            maximum: 3000
                            minimum: 200
                            type: integer
                    type: object
                updates:
                    properties:
                        channel:
                            default: stable
                            description: Frame app release channel (beta program). Beta frames get the newest of beta and stable.
                            enum:
                                - stable
                                - beta
                            type: string
                    type: object
                version:
                    type: integer
                video:
                    properties:
                        auto_mute_min:
                            default: null
                            nullable: true
                            type: integer
                        autoplay:
                            default: true
                            type: boolean
                        playback:
                            default: once_hold
                            enum:
                                - loop
                                - once_hold
                                - once_advance
                            type: string
                        volume:
                            default: 60
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                widgets:
                    properties:
                        avatar:
                            default: true
                            type: boolean
                        calendar_sidebar:
                            default: false
                            description: 'Hybrid view: today and upcoming events beside the slideshow (side panel in landscape, bottom panel in portrait).'
                            type: boolean
                        caption:
                            default: true
                            type: boolean
                        clock:
                            default: true
                            type: boolean
                        clock_24h:
                            default: true
                            type: boolean
                        countdowns:
                            default: true
                            description: Countdown widgets on the slideshow (the nearest three).
                            type: boolean
                        date:
                            default: true
                            type: boolean
                        weather:
                            default: false
                            description: Current weather widget; needs `location`.
                            type: boolean
                    type: object
            required:
                - version
            type: object
        FrameSettingsPatch:
            description: RFC 7396 merge patch of FrameSettings (any subset; arrays are replaced whole).
            type: object
        FrameSummary:
            properties:
                app_version:
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                last_seen_at:
                    format: date-time
                    nullable: true
                    type: string
                location:
                    nullable: true
                    type: string
                name:
                    type: string
                needs_update:
                    type: boolean
                online:
                    type: boolean
                owner_name:
                    type: string
                permissions:
                    $ref: '#/components/schemas/Permissions'
                role:
                    $ref: '#/components/schemas/Role'
                screen:
                    $ref: '#/components/schemas/Screen'
            required:
                - id
                - name
                - role
                - permissions
                - online
            type: object
        FrameUpdate:
            description: A frame app release mirrored by the server.
            properties:
                min_sdk:
                    example: 23
                    type: integer
                prerelease:
                    description: True for beta releases.
                    type: boolean
                published_at:
                    format: date-time
                    type: string
                release_notes:
                    nullable: true
                    type: string
                sha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                size:
                    description: bytes
                    type: integer
                url:
                    description: 'Where to download the APK on this server: `/v1/device/update/apk/{version_code}` (frames) or `/v1/frame-app/apk/{version_code}` (public).'
                    format: uri
                    type: string
                version_code:
                    example: 20099
                    type: integer
                version_name:
                    example: 0.2.0
                    type: string
            required:
                - version_name
                - version_code
                - min_sdk
                - url
                - sha256
                - size
                - published_at
            type: object
        Heartbeat:
            properties:
                android_sdk:
                    type: integer
                app_version:
                    type: string
                app_version_code:
                    type: integer
                cache_bytes:
                    type: integer
                crash_count_24h:
                    type: integer
                last_shutdown_clean:
                    type: boolean
                last_update_error:
                    description: 'Short machine-readable reason, e.g. `sha256_mismatch`, `signature_mismatch`, `install_failed: ...`, `crash_loop 20199`'
                    nullable: true
                    type: string
                local_time:
                    format: date-time
                    type: string
                placements_cached:
                    type: integer
                placements_evicted:
                    description: Renditions the frame removed from its cache to free space (least recently shown first); it downloads them again before they show.
                    type: integer
                placements_missing:
                    type: integer
                screen_state:
                    enum:
                        - "on"
                        - "off"
                        - dimmed
                        - sleeping
                    type: string
                storage_free_bytes:
                    type: integer
                storage_state:
                    description: '`low`: below the frame''s low-water mark, evicting. `critical`: nearly full with nothing left to evict.'
                    enum:
                        - ok
                        - low
                        - critical
                    type: string
                storage_total_bytes:
                    type: integer
                timezone:
                    example: Europe/Brussels
                    type: string
                update_state:
                    description: |
                        Self-update state (README §5.7). `idle`: nothing pending. `downloading`, `installing`: in progress.
                        `waiting`: downloaded, waiting for the frame to be idle. `needs_user`: no root, the system installer is
                        showing. `updated`: the last update succeeded. `failed`: the last attempt failed (see
                        `last_update_error`). `rolled_back`: the new version crash-looped and the previous one was reinstalled.
                    enum:
                        - idle
                        - downloading
                        - waiting
                        - installing
                        - needs_user
                        - updated
                        - failed
                        - rolled_back
                    type: string
                uptime_s:
                    type: integer
                wifi_link_mbps:
                    nullable: true
                    type: integer
                wifi_rssi_dbm:
                    nullable: true
                    type: integer
                wifi_ssid:
                    nullable: true
                    type: string
            required:
                - app_version
                - uptime_s
            type: object
        Id:
            description: UUIDv7
            format: uuid
            type: string
        Invite:
