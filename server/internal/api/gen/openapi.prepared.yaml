            type: object
        PluginCatalog:
            properties:
                plugins:
                    items:
                        $ref: '#/components/schemas/CatalogPlugin'
                    maxItems: 100
                    type: array
            required:
                - plugins
            type: object
        PluginInstance:
            description: |
                One widget: a plugin with the owner's settings (docs/plugins.md §10). Settings follow the plugin's manifest;
                values of `secret` settings never go in `settings` but in `secrets`, which people can only write.
            properties:
                enabled:
                    default: true
                    description: An enabled instance needs every required setting and secret.
                    type: boolean
                instance_id:
                    pattern: ^[a-z0-9][a-z0-9-]{0,47}$
                    type: string
                order:
                    default: 0
                    maximum: 99
                    minimum: 0
                    type: integer
                plugin_id:
                    example: kinframe.ha-energy
                    maxLength: 64
                    type: string
                secrets:
                    additionalProperties:
                        maxLength: 2000
                        nullable: true
                        type: string
                    description: |
                        Write: key → new value, or null to remove it; keys left out keep their value. Stored encrypted. Only the
                        frame reads them back (in the change feed and `PATCH /device/settings` responses), in full.
                    maxProperties: 8
                    type: object
                secrets_set:
                    description: The secret settings that have a value.
                    items:
                        type: string
                    readOnly: true
                    type: array
                settings:
                    additionalProperties: true
                    description: The manifest's non-secret settings by key (strings, numbers, booleans, or a list of entity ids).
                    maxProperties: 40
                    type: object
                slot:
                    default: top-right
                    enum:
                        - top-left
                        - top-right
                    type: string
                version:
                    description: The plugin version the settings were made with (informational).
                    maxLength: 40
                    type: string
                visibility:
                    default: always
                    enum:
                        - always
                        - on_change
                        - on_tap
                    type: string
            required:
                - instance_id
                - plugin_id
            type: object
        PluginInstanceStatus:
            properties:
                entities:
                    description: |
                        Home Assistant entities the frame can see through this instance's `base_url` and `token` (for the entity
                        picker, docs/plugins.md §6.2). Absent when the plugin has no entity settings or the connection failed.
                    items:
                        $ref: '#/components/schemas/DiscoveredEntity'
                    maxItems: 3000
                    type: array
                error:
                    description: The last error, null when the last update and render worked.
                    maxLength: 300
                    nullable: true
                    type: string
                error_at:
                    format: date-time
                    nullable: true
                    type: string
                instance_id:
                    type: string
                running:
                    description: The instance started on the frame.
                    type: boolean
                update:
                    description: A newer registry version that asks for different permissions; it runs once the owner sets the instance's `version` to it.
                    nullable: true
                    properties:
                        permissions:
                            additionalProperties: true
                            description: The newer version's `permissions`.
                            type: object
                        version:
                            type: string
                    type: object
                updated_at:
                    description: When the last update succeeded.
                    format: date-time
                    nullable: true
                    type: string
                version:
                    description: 'The plugin version the frame runs (a registry plugin may run a newer one than the instance names: same permissions).'
                    nullable: true
                    type: string
            required:
                - instance_id
            type: object
        PluginRegistry:
            properties:
                index:
                    description: base64 of index.json, byte for byte as signed
                    type: string
                sequence:
                    type: integer
                signature:
                    description: base64 DER ECDSA P-256 SHA-256 signature over those bytes
                    type: string
            required:
                - index
                - signature
                - sequence
            type: object
        PluginStatusReport:
