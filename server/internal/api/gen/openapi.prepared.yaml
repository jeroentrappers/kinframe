                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/Item'
                    type: array
                summary:
                    properties:
                        delivered:
                            type: integer
                        failed:
                            type: integer
                        pending:
                            type: integer
                        processing:
                            type: integer
                        seen:
                            type: integer
                    type: object
            required:
                - id
                - created_at
                - items
                - frames
            type: object
        SendCreate:
            properties:
                frame_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    minItems: 1
                    type: array
                items:
                    items:
                        properties:
                            caption:
                                maxLength: 280
                                nullable: true
                                type: string
                            captured_at:
                                description: |
                                    Capture time. Prepared uploads carry no metadata, so clients read it from the original (EXIF,
                                    QuickTime) and send it here. Used when the stored file has no capture time.
                                format: date-time
                                nullable: true
                                type: string
                            duration_ms:
                                description: Prepared videos only. Duration the client produced (±500 ms).
                                minimum: 1
                                type: integer
                            fit:
                                $ref: '#/components/schemas/Fit'
                            focal_point:
                                $ref: '#/components/schemas/FocalPoint'
                            height:
                                description: Prepared uploads only. Pixel height the client produced.
                                minimum: 1
                                type: integer
                            include_audio:
                                default: true
                                description: For a live item it applies to the motion clip, which is muted unless this is `true` explicitly.
                                type: boolean
                            live:
                                default: true
                                description: |
                                    `false` sends a Motion Photo (a JPEG/HEIC with an embedded video, detected by the server) as a
                                    still only. Without `live_video_upload_id`, the server splits such files itself.
                                type: boolean
                            live_video_upload_id:
                                description: |
                                    Makes this a Live Photo: the tus upload of its motion clip (MOV/MP4, at most 10 s; longer clips
                                    are cut). `upload_id` must be a photo and `trim` is not allowed. The clip may be a prepared
                                    `video-master-v1`.
                                type: string
                            trim:
                                description: Videos only. The selected part must be at least 3 seconds long (unless the whole video is shorter).
                                properties:
                                    end_ms:
                                        minimum: 1
                                        type: integer
                                    start_ms:
                                        minimum: 0
                                        type: integer
                                type: object
                            upload_id:
                                description: tus upload id
                                or an existing item id when the server reported a duplicate. For a live item: null
                                the still.: null
                                type: string
                            width:
                                description: Prepared uploads only. Pixel width the client produced; a mismatch makes the server take the normal pipeline.
                                minimum: 1
                                type: integer
                        required:
                            - upload_id
                        type: object
                    minItems: 1
                    type: array
            required:
                - frame_ids
                - items
            type: object
        ShareResult:
            properties:
                placements:
                    description: The placements created on the target frames (empty for a dry run).
                    items:
                        $ref: '#/components/schemas/Placement'
                    type: array
                skipped:
                    description: Source placement × target frame pairs that were not shared.
                    items:
                        properties:
                            existing_placement_id:
                                $ref: '#/components/schemas/Id'
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            placement_id:
                                $ref: '#/components/schemas/Id'
                            reason:
                                enum:
                                    - already_on_frame
                                type: string
                        required:
                            - placement_id
                            - frame_id
                            - reason
                        type: object
                    type: array
            required:
                - placements
                - skipped
            type: object
        Shop:
            description: |
                Pre-order shop run by the server operator (README §5.11). Present only when the operator configured one
                (KINFRAME_SHOP_FILE). Prices include VAT. Localized texts are maps from a language code (see docs/i18n.md)
                to text; `en` is always present and is the fallback.
            properties:
                brand:
                    description: Consumer-facing brand name, e.g. in "Get a {brand}". Defaults to the server name.
                    example: kinframe
                    type: string
                currency:
                    description: ISO 4217
                    example: EUR
                    type: string
                default_locale:
                    description: |
                        Storefront language for visitors whose browser prefers none of `en`, `nl`, `fr`, `de` (the languages
                        the shop emails in). Defaults to `en`.
                    example: nl
                    type: string
                domains:
                    description: |
                        Storefront host names (no scheme or port). On these hosts the web app is the brand's shop: landing page,
                        `/shop` and `/shop/cancel`, calling the API on its own origin; every other path goes to `web`, where
                        sign-in and the family app live. Absent when the operator configured none.
                    example:
                        - shop.example.org
                    items:
                        type: string
                    type: array
                estimated_delivery:
                    $ref: '#/components/schemas/LocalizedText'
                products:
                    items:
                        $ref: '#/components/schemas/ShopProduct'
                    type: array
                seller:
                    properties:
                        email:
                            format: email
                            type: string
                        legal:
                            description: Legal line for the footer, e.g. company, address and VAT number.
                            type: string
                        name:
                            type: string
                        privacy_url:
                            format: uri
                            type: string
                    required:
                        - name
                        - email
                    type: object
                shipping:
                    $ref: '#/components/schemas/ShopShipping'
                vat_percent:
                    description: VAT included in all prices
                    example: 21
                    type: number
            required:
                - brand
                - currency
                - vat_percent
                - products
                - shipping
                - seller
            type: object
        ShopLine:
            properties:
                line_cents:
                    type: integer
                name:
                    type: string
                product_id:
                    type: string
                quantity:
                    type: integer
                unit_cents:
                    type: integer
            required:
                - product_id
                - name
                - quantity
                - unit_cents
                - line_cents
            type: object
        ShopProduct:
            properties:
                id:
                    example: frame-10
                    type: string
                image:
                    description: 'Illustration key: frame-10 or frame-15'
                    example: frame-10
                    type: string
                max_qty:
                    minimum: 1
                    type: integer
                name:
                    example: kinframe 10.1"
                    type: string
                price_cents:
                    description: Unit price incl. VAT
                    in cents: null
                    type: integer
                size:
                    description: Screen size label
                    example: 10.1"
                    type: string
                specs:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: Language code → short spec bullets; `en` is the fallback.
                    type: object
            required:
                - id
                - name
                - price_cents
                - max_qty
            type: object
        ShopReservation:
            properties:
                cancelled_at:
                    format: date-time
                    nullable: true
                    type: string
                country:
                    type: string
                created_at:
                    format: date-time
                    type: string
                currency:
                    type: string
                email:
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                internal_note:
                    nullable: true
                    type: string
                items:
                    items:
                        $ref: '#/components/schemas/ShopLine'
                    type: array
                locale:
                    type: string
                name:
                    type: string
                note:
                    nullable: true
                    type: string
                postal_code:
                    nullable: true
                    type: string
                reference:
                    type: string
                shipping_cents:
                    type: integer
                status:
                    $ref: '#/components/schemas/ShopReservationStatus'
                subtotal_cents:
                    type: integer
                total_cents:
                    type: integer
                updated_at:
                    format: date-time
                    type: string
            required:
                - id
                - reference
                - status
                - name
                - email
                - country
                - items
                - subtotal_cents
                - shipping_cents
                - total_cents
                - currency
                - locale
                - created_at
                - updated_at
            type: object
        ShopReservationCreate:
            properties:
                consent:
                    description: Must be true. The customer agrees to be contacted about this reservation.
                    type: boolean
                country:
                    example: BE
                    maxLength: 2
                    minLength: 2
                    type: string
                email:
                    maxLength: 254
                    type: string
                items:
                    items:
                        properties:
                            product_id:
                                maxLength: 64
                                type: string
                            quantity:
                                maximum: 99
                                minimum: 1
                                type: integer
                        required:
                            - product_id
                            - quantity
                        type: object
                    maxItems: 20
                    type: array
                locale:
                    description: Language for the emails (falls back to English)
                    example: nl
                    maxLength: 35
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                note:
                    maxLength: 1000
                    type: string
                postal_code:
                    maxLength: 12
                    type: string
                website:
                    description: Honeypot; leave empty.
                    maxLength: 200
                    type: string
            required:
                - name
                - email
                - country
                - items
                - consent
            type: object
        ShopReservationReceipt:
            properties:
                currency:
                    type: string
                email:
                    type: string
                items:
                    items:
                        $ref: '#/components/schemas/ShopLine'
                    type: array
                reference:
                    example: KF-7Q3M
                    type: string
                shipping_cents:
                    type: integer
                status:
                    $ref: '#/components/schemas/ShopReservationStatus'
                subtotal_cents:
                    type: integer
                total_cents:
                    type: integer
            required:
                - reference
                - status
                - email
                - items
                - subtotal_cents
                - shipping_cents
                - total_cents
                - currency
            type: object
        ShopReservationStatus:
            enum:
                - new
                - contacted
                - confirmed
                - cancelled
            type: string
        ShopShipping:
            properties:
                countries:
                    example:
                        - BE
                        - NL
                    items:
                        description: ISO 3166-1 alpha-2
                        type: string
                    type: array
                flat_cents:
                    description: Shipping cost per order incl. VAT
                    type: integer
                free_from_cents:
                    description: Item subtotal from which shipping is free; null = never
                    nullable: true
                    type: integer
            required:
                - countries
                - flat_cents
            type: object
        SleepSchedule:
            properties:
                days:
                    items:
                        enum:
                            - mon
                            - tue
                            - wed
                            - thu
                            - fri
                            - sat
                            - sun
                        type: string
                    type: array
                enabled:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                mode:
                    default: "off"
                    enum:
                        - "off"
                        - dim
                    type: string
                sleep_at:
                    example: "23:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
                wake_at:
                    example: "07:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
            required:
                - id
                - sleep_at
                - wake_at
                - days
                - enabled
            type: object
        TvLink:
            properties:
                album_id:
                    format: uuid
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                created_by_name:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                frame_id:
                    $ref: '#/components/schemas/Id'
                id:
                    $ref: '#/components/schemas/Id'
                interval_seconds:
                    type: integer
                kind:
                    allOf:
                        - $ref: '#/components/schemas/MediaKind'
                    nullable: true
                placement_count:
                    description: Size of a fixed selection; null for album/library links.
                    nullable: true
                    type: integer
                purpose:
                    enum:
                        - tv
                        - cast
                    type: string
                token:
                    type: string
                url:
                    description: 'The TV page: <public URL>/tv/<frameId>?t=<token>'
                    format: uri
                    type: string
            required:
                - id
                - frame_id
                - token
                - url
                - purpose
                - interval_seconds
                - expires_at
                - created_at
            type: object
        TvLinkCreate:
            properties:
                album_id:
                    description: Only this album.
                    format: uuid
                    nullable: true
                    type: string
                expires_in_hours:
                    default: 12
                    maximum: 168
                    minimum: 1
                    type: integer
                interval_seconds:
                    default: 10
                    maximum: 600
                    minimum: 3
                    type: integer
                kind:
                    $ref: '#/components/schemas/MediaKind'
                placement_ids:
                    description: Only these placements, in this order (a selection). Empty or absent = the whole visible library.
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 500
                    type: array
                purpose:
                    default: tv
                    description: Informational; cast links are short-lived.
                    enum:
                        - tv
                        - cast
                    type: string
            type: object
        TvSlide:
            properties:
                caption:
                    nullable: true
                    type: string
                captured_at:
                    format: date-time
                    nullable: true
                    type: string
                duration_ms:
                    nullable: true
                    type: integer
                height:
                    type: integer
                kind:
                    $ref: '#/components/schemas/MediaKind'
                mime:
                    description: e.g. image/webp or video/mp4
                    type: string
                placement_id:
                    $ref: '#/components/schemas/Id'
                poster_url:
                    format: uri
                    nullable: true
                    type: string
                received_at:
                    format: date-time
                    type: string
                sender_name:
                    type: string
                thumb_url:
                    format: uri
                    nullable: true
                    type: string
                url:
                    description: Absolute signed URL of the master rendition (Range supported).
                    format: uri
                    type: string
                width:
                    type: integer
            required:
                - placement_id
                - kind
                - url
                - mime
                - sender_name
                - received_at
                - width
                - height
            type: object
        TvSlideshow:
            properties:
                album_name:
                    nullable: true
                    type: string
                expires_at:
                    description: When the link itself stops working.
                    format: date-time
                    type: string
                frame_id:
                    $ref: '#/components/schemas/Id'
                frame_name:
                    type: string
                interval_seconds:
                    type: integer
                refresh_after:
                    description: Refetch before the media URLs expire.
                    format: date-time
                    type: string
                slides:
                    items:
                        $ref: '#/components/schemas/TvSlide'
                    maxItems: 500
                    type: array
            required:
                - frame_id
                - frame_name
                - interval_seconds
                - expires_at
                - refresh_after
                - slides
            type: object
        User:
            properties:
                avatar_url:
                    format: uri
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                display_name:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_operator:
                    type: boolean
                locale:
                    nullable: true
                    type: string
                share_location_names:
                    type: boolean
            required:
                - id
                - display_name
            type: object
        Weather:
            description: |
                Payload of the `weather` change (docs/api/README.md §5.4). `null` means "no weather": the location was
                removed, the weather widget was turned off, or the server has weather disabled; the frame drops what it has.
                Values are always metric (°C, km/h, mm); clients convert for `locale.temperature_unit`. Local times carry the
                location's UTC offset. Data by Open-Meteo.com (CC BY 4.0); clients showing it must credit "Weather data by
                Open-Meteo.com".
            nullable: true
            properties:
                current:
                    properties:
                        apparent_c:
                            description: Feels-like temperature
                            nullable: true
                            type: number
                        code:
                            description: WMO weather code (0–99)
                            type: integer
                        humidity_pct:
                            nullable: true
                            type: integer
                        is_day:
                            type: boolean
                        precip_mm:
                            nullable: true
                            type: number
                        temp_c:
                            type: number
                        time:
                            format: date-time
                            type: string
                        wind_dir_deg:
                            0 = north: null
                            description: Direction the wind comes from
                            nullable: true
                            type: integer
                        wind_kmh:
                            nullable: true
                            type: number
                    required:
                        - temp_c
                        - code
                        - is_day
                    type: object
                daily:
                    description: Up to 7 days, starting today (in the location's time zone).
                    items:
                        properties:
                            code:
                                type: integer
                            date:
                                format: date
                                type: string
                            max_c:
                                type: number
                            min_c:
                                type: number
                            precip_mm:
                                nullable: true
                                type: number
                            precip_prob:
                                description: Maximum hourly probability
                                nullable: true
                                percent: null
                                type: integer
                            sunrise:
                                format: date-time
                                nullable: true
                                type: string
                            sunset:
                                format: date-time
                                nullable: true
                                type: string
                        required:
                            - date
                            - min_c
                            - max_c
                            - code
                        type: object
                    type: array
                fetched_at:
                    description: When the server fetched this from Open-Meteo
                    format: date-time
                    type: string
                hourly:
                    description: The next 24 hours, starting with the current hour.
                    items:
                        properties:
                            code:
                                type: integer
                            is_day:
                                type: boolean
                            precip_prob:
                                description: Percent
                                nullable: true
                                type: integer
                            temp_c:
                                type: number
                            time:
                                format: date-time
                                type: string
                        required:
                            - time
                            - temp_c
                            - code
                        type: object
                    type: array
                location:
                    properties:
                        lat:
                            type: number
                        lon:
                            type: number
                        name:
                            nullable: true
                            type: string
                    type: object
                timezone:
                    example: Europe/Brussels
                    type: string
                units:
                    properties:
                        precipitation:
                            default: mm
                            enum:
                                - mm
                            type: string
                        temperature:
                            default: c
                            enum:
                                - c
                            type: string
                        wind_speed:
                            default: km/h
                            enum:
                                - km/h
                            type: string
                    type: object
                utc_offset_seconds:
                    type: integer
            required:
                - fetched_at
                - current
                - daily
            type: object
    securitySchemes:
        deviceAuth:
            bearerFormat: JWT
            description: Device access token from /v1/devices/token.
            scheme: bearer
            type: http
        userAuth:
            description: Logto access token for the API resource. The issuer comes from discovery.
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.kinframe.appmire.be/oidc/auth
                    scopes:
                        kinframe:operate: Operator access
                    tokenUrl: https://auth.kinframe.appmire.be/oidc/token
            type: oauth2
info:
    description: |
        Machine-readable contract for the kinframe server. Concepts, flows, websockets,
        tus uploads and the change feed are described in docs/api/README.md.
    license:
        identifier: AGPL-3.0-or-later
        name: AGPL-3.0-or-later
    summary: Family photo frames, self-hosted.
    title: kinframe API
    version: 1.0.0-draft
openapi: 3.0.3
paths:
    /.well-known/kinframe:
        get:
            operationId: getDiscovery
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Discovery'
                    description: Server discovery document
            security: []
            tags:
                - discovery
    /dev/token:
        post:
            description: |
                Development servers only (discovery `dev_auth: true`); 404 otherwise. Issues a user access token signed by the
                server itself so web and app development works without Logto. The server refuses to start with dev auth
                enabled when KINFRAME_ENV=production.
            operationId: devToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    format: email
                                    type: string
                                name:
                                    type: string
                            required:
                                - email
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    access_token:
                                        type: string
                                    expires_in:
                                        type: integer
                                required:
                                    - access_token
                                    - expires_in
                                type: object
                    description: Token
                "404":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - dev
    /v1/device/acks:
        post:
            operationId: deviceAck
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                delivered:
                                    items:
                                        $ref: '#/components/schemas/Id'
                                    maxItems: 500
                                    type: array
                                seen:
                                    items:
                                        properties:
                                            at:
                                                format: date-time
                                                type: string
                                            placement_id:
                                                $ref: '#/components/schemas/Id'
                                        required:
                                            - placement_id
                                            - at
                                        type: object
                                    maxItems: 500
                                    type: array
                            type: object
                required: true
            responses:
                "204":
                    description: Recorded
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/calendar/sync:
        post:
            description: '"Sync now" on the frame: the server re-syncs all of the frame''s calendar sources. A `calendar` change follows when something changed.'
            operationId: deviceSyncCalendars
            responses:
                "202":
                    description: Sync started
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/changes:
        get:
            operationId: deviceGetChanges
            parameters:
                - in: query
                  name: since
                  required: true
                  schema:
                    minimum: 0
                    type: integer
                - in: query
                  name: limit
                  schema:
                    default: 500
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    changes:
                                        items:
                                            $ref: '#/components/schemas/Change'
                                        type: array
                                    has_more:
                                        type: boolean
                                    next_seq:
                                        type: integer
                                required:
                                    - changes
                                    - next_seq
                                    - has_more
                                type: object
                    description: Ordered changes after `since`
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/code:
        post:
            description: Get (or re-get) the active frame code. Same code until it expires.
            operationId: deviceGetCode
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameCode'
                    description: Code
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/countdowns/{eventId}:
        delete:
            operationId: deviceClearCountdown
            responses:
                "204":
                    description: Unmarked
            security:
                - deviceAuth: []
            tags:
                - device
        parameters:
            - $ref: '#/components/parameters/EventId'
        put:
            description: The countdown toggle in the frame's event details. A `calendar` change follows.
            operationId: deviceSetCountdown
            responses:
                "204":
                    description: Marked
                "404":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/heartbeat:
        post:
            operationId: deviceHeartbeat
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Heartbeat'
                required: true
            responses:
                "204":
                    description: Recorded
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/imports:
        post:
            description: |
                Upload a photo/video imported from SD/USB on the frame so it joins the library (sender = the frame).
                Body is the file; tus is not required for imports (frames upload one file at a time, ≤ 512 MiB). The file
                takes the same processing as any upload (renditions, location metadata stripped).
                The server hashes the body: if this frame already has a live placement of the same file (source, master or
                rendition sha256), nothing is created and the existing placement is returned with `200`.

                **Imports from another app's leftover data** (`source`, docs/spec/frameo-import.md): `source_key` makes the
                import idempotent per frame. If this frame imported that key before, the placement of that item is returned
                with `200`, even when it was removed since (`status: removed`), so a re-run never brings back what the family
                deleted. The item keeps `sender_name`, `received_at`, fit, focal point and hidden state from the old app, and
                the frame's owner owns the media.
            operationId: deviceImport
            parameters:
                - in: header
                  name: X-Filename
                  required: true
                  schema:
                    type: string
                - in: header
                  name: X-Captured-At
                  schema:
                    format: date-time
                    type: string
                - description: Caption to restore (e.g. from a kinframe export manifest).
                  in: query
                  name: caption
                  schema:
                    maxLength: 280
                    type: string
                - description: The app the file comes from. `source_key`, `sender_name` and `received_at` are ignored without it.
                  in: query
                  name: source
                  schema:
                    $ref: '#/components/schemas/ItemOrigin'
                - description: Stable id of the file in that app (for Frameo, its file name). Unique per frame and source.
                  in: query
                  name: source_key
                  schema:
                    maxLength: 200
                    minLength: 1
                    type: string
                - description: The original sender's display name in that app.
                  in: query
                  name: sender_name
                  schema:
                    maxLength: 100
                    type: string
                - description: When the old app received the file; becomes the placement's `received_at` (not in the future).
                  in: query
                  name: received_at
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: fit
                  schema:
                    $ref: '#/components/schemas/Fit'
                - description: Focal point, as a fraction of the width (with `focal_y`).
                  in: query
                  name: focal_x
                  schema:
                    maximum: 1
                    minimum: 0
                    type: number
                - in: query
                  name: focal_y
                  schema:
                    maximum: 1
                    minimum: 0
                    type: number
                - description: Import the placement hidden (it was hidden from the slideshow in the old app).
                  in: query
                  name: hidden
                  schema:
                    default: false
                    type: boolean
                - description: Extra clockwise rotation chosen on the frame in the old app.
                  in: query
                  name: rotation
                  schema:
                    default: 0
                    enum:
                        - 0
                        - 90
                        - 180
                        - 270
                    type: integer
            requestBody:
                content:
                    application/octet-stream:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Duplicate; the frame already has this file
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Accepted; a placement.upsert change follows
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/imports/check:
        post:
            description: |
                Which of these file hashes this frame already has (a live placement whose source, master or frame
                rendition sha256 matches), so an import from SD/USB can skip duplicates before uploading. With `source` and
                `source_keys`, also which of those keys this frame has imported before (removed items included, see
                `deviceImport`), so a resumed import only uploads what is missing.
            operationId: deviceImportCheck
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                sha256:
                                    items:
                                        pattern: ^[0-9a-f]{64}$
                                        type: string
                                    maxItems: 500
                                    type: array
                                source:
                                    $ref: '#/components/schemas/ItemOrigin'
                                source_keys:
                                    items:
                                        maxLength: 200
                                        minLength: 1
                                        type: string
                                    maxItems: 500
                                    type: array
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    known:
                                        items:
                                            type: string
                                        type: array
                                    known_source_keys:
                                        items:
                                            type: string
                                        type: array
                                required:
                                    - known
                                type: object
                    description: The known subset
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/invitations:
        get:
            description: |
                Event invitations waiting for a decision on the frame, oldest first. The frame re-reads this list on connect,
                after syncing and after an `event_invitation` websocket message, like join requests.
            operationId: deviceListInvitations
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/EventInvitation'
                                type: array
                    description: Pending invitations
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/invitations/{invitationId}:
        post:
            description: Accept or decline. Final; `409 already_decided` when it was decided or withdrawn before.
            operationId: deviceDecideInvitation
            parameters:
                - $ref: '#/components/parameters/InvitationId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                decision:
                                    enum:
                                        - accept
                                        - decline
                                    type: string
                            required:
                                - decision
                            type: object
                required: true
            responses:
                "204":
                    description: Decided
                "409":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/invitations/{invitationId}/photo:
        get:
            description: The invitation's photo (WebP, long edge at most 1280 px). Supports ETag and If-None-Match.
            operationId: deviceGetInvitationPhoto
            parameters:
                - $ref: '#/components/parameters/InvitationId'
            responses:
                "200":
                    content:
                        image/webp:
                            schema:
                                format: binary
                                type: string
                    description: Photo
                "304":
                    description: Not modified
                "404":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/join-requests:
        get:
            description: |
                Pending join requests that wait for a decision on the frame ("ask on the frame before someone new joins").
                The frame shows them until they are decided here or by an owner/admin in the app; it re-reads this list on
                connect and after syncing, so requests announced while it was offline are not lost.
            operationId: deviceListJoinRequests
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/JoinRequest'
                                type: array
                    description: Oldest first
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/join-requests/{requestId}:
        post:
            operationId: deviceDecideJoin
            parameters:
                - in: path
                  name: requestId
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                decision:
                                    enum:
                                        - approve
                                        - deny
                                    type: string
                            required:
                                - decision
                            type: object
                required: true
            responses:
                "204":
                    description: Decided
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/media/{placementId}:
        get:
            description: |
                The frame-sized rendition (or poster with ?variant=poster). For a Live/Motion Photo (`item.kind: live`),
                `display` is the still and `?variant=motion` the short frame-sized clip. Supports Range, ETag, If-None-Match.
            operationId: deviceGetMedia
            parameters:
                - $ref: '#/components/parameters/PlacementId'
                - in: query
                  name: variant
                  schema:
                    default: display
                    enum:
                        - display
                        - poster
                        - avatar
                        - motion
                    type: string
            responses:
                "200":
                    description: Bytes
                "206":
                    description: Partial bytes
                "304":
                    description: Not modified
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/members/{userId}:
        delete:
            description: Remove a member from the frame itself (allowed unless the owner disabled it in settings). Cannot remove the owner.
            operationId: deviceRemoveMember
            parameters:
                - $ref: '#/components/parameters/UserId'
                - in: query
                  name: remove_items
                  schema:
                    default: false
                    type: boolean
            responses:
                "204":
                    description: Removed
                "403":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}:
        patch:
            description: Actions taken at the frame (hide/unhide, trash/restore, local fit/focal override).
            operationId: devicePatchPlacement
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fit:
                                    $ref: '#/components/schemas/Fit'
                                focal_point:
                                    $ref: '#/components/schemas/FocalPoint'
                                hidden:
                                    type: boolean
                                rotation:
                                    enum:
                                        - 0
                                        - 90
                                        - 180
                                        - 270
                                    type: integer
                                trashed:
                                    type: boolean
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Updated
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}/reaction:
        put:
            operationId: deviceSetReaction
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                reaction:
                                    allOf:
                                        - $ref: '#/components/schemas/Reaction'
                                    nullable: true
                            required:
                                - reaction
                            type: object
                required: true
            responses:
                "204":
                    description: Stored
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}/replies:
        post:
            operationId: deviceSendReply
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                preset:
                                    $ref: '#/components/schemas/ReplyPreset'
                            required:
                                - preset
                            type: object
                required: true
            responses:
                "204":
                    description: Sent
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/settings:
        patch:
            description: Settings changed locally on the frame. Same semantics as updateFrameSettings.
            operationId: devicePatchSettings
            parameters:
                - $ref: '#/components/parameters/IfMatch'
            requestBody:
                content:
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/FrameSettingsPatch'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameSettings'
                    description: Updated
                "412":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/state:
        get:
            description: Whether the frame is claimed, its identity and the latest change seq. Used after boot and on the setup screen.
            operationId: deviceGetState
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceState'
                    description: State
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/update:
        get:
            description: |
                Self-update check (README §5.7). Answers with the newest frame app release on the channel that is newer
                than the caller's version code (from `X-Kinframe-App`, else the code last reported by the device) and
                whose `min_sdk` the device meets; `204` when there is none. Allowed even when the app is below the
                server's minimum version (`426` is never returned here).
            operationId: deviceCheckUpdate
            parameters:
                - description: Defaults to the frame's `updates.channel` setting (unclaimed frames use the channel from enrollment).
                  in: query
                  name: channel
                  schema:
                    enum:
                        - stable
                        - beta
                    type: string
                - description: Version codes the frame refuses (rolled back earlier). The newest release not listed is returned.
                  explode: false
                  in: query
                  name: skip
                  schema:
                    items:
                        type: integer
                    maxItems: 50
                    type: array
                  style: form
                - description: '`kinframe-frame/<version name> (<version code>)`'
                  in: header
                  name: X-Kinframe-App
                  schema:
                    example: kinframe-frame/0.2.0 (20099)
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameUpdate'
                    description: An update is available
                "204":
                    description: Up to date (or no release suits this device)
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/update/apk/{versionCode}:
        get:
            description: The mirrored APK. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
            operationId: deviceGetUpdateApk
            parameters:
                - in: path
                  name: versionCode
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/vnd.android.package-archive:
                            schema:
                                format: binary
                                type: string
                    description: APK bytes
                "206":
                    description: Partial bytes
                "304":
                    description: Not modified
                "404":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/devices/enroll:
        post:
            description: Called once by a fresh frame. Rate-limited per IP.
            operationId: enrollDevice
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeviceEnroll'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    device_id:
                                        $ref: '#/components/schemas/Id'
                                    device_secret:
                                        base64url. Shown only once.: null
                                        description: 256-bit random
                                        type: string
                                required:
                                    - device_id
                                    - device_secret
                                type: object
                    description: Enrolled
                "429":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - devices
    /v1/devices/token:
        post:
            operationId: deviceToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                device_id:
                                    $ref: '#/components/schemas/Id'
                                device_secret:
                                    type: string
                            required:
                                - device_id
                                - device_secret
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    access_token:
                                        type: string
                                    expires_in:
                                        description: seconds
                                        type: integer
                                required:
                                    - access_token
                                    - expires_in
                                type: object
                    description: Short-lived device access token
                "401":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - devices
    /v1/frame-app/apk/{versionCode}:
        get:
            description: No sign-in. The mirrored APK, as `/v1/device/update/apk/{versionCode}`. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
            operationId: getFrameAppApk
            parameters:
                - in: path
                  name: versionCode
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/vnd.android.package-archive:
                            schema:
                                format: binary
                                type: string
                    description: APK bytes
                "206":
                    description: Partial bytes
                "304":
                    description: Not modified
                "404":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - frame-app
    /v1/frame-app/latest:
        get:
            description: |
                No sign-in. The newest stable frame app release this server mirrors (README §5.7), for the convert tool on
                the website (`/convert`), which installs kinframe on a frame over USB. `url` points at
                `/v1/frame-app/apk/{version_code}` on this server, so the browser needs no cross-origin download. `204` when
                the server mirrors no release (self-update disabled) or none suits `sdk`. Clients must still check the
                APK's signing certificate: this endpoint is a convenience, not a trust anchor.
            operationId: getFrameAppLatest
            parameters:
                - description: The frame's Android API level; releases whose `min_sdk` is higher are skipped.
                  in: query
                  name: sdk
                  schema:
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameUpdate'
                    description: The newest stable release
                "204":
                    description: No release available
            security: []
            tags:
                - frame-app
    /v1/frames:
        get:
            description: Frames the caller is a member of (any role).
            operationId: listMyFrames
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/FrameSummary'
                                type: array
                    description: Frames
            tags:
                - frames
    /v1/frames/{frameId}:
        delete:
            description: Owner only. Revokes the device credential and deletes all placements on this frame.
            operationId: removeFrame
            responses:
                "204":
                    description: Removed
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - frames
        get:
            operationId: getFrame
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Frame'
                    description: Frame
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - frames
        parameters:
            - $ref: '#/components/parameters/FrameId'
        patch:
            description: Owner or admin.
            operationId: updateFrame
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                approve_joins_on_frame:
                                    type: boolean
                                default_permissions:
                                    $ref: '#/components/schemas/Permissions'
                                invite_requires_approval:
                                    type: boolean
                                location:
                                    maxLength: 40
                                    type: string
                                moderation:
                                    description: New placements need approval by owner/admin before showing.
                                    type: boolean
                                name:
                                    maxLength: 40
                                    minLength: 1
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Frame'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - frames
    /v1/frames/{frameId}/albums:
        get:
            operationId: listAlbums
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Album'
                                type: array
                    description: Albums
            tags:
                - albums
        parameters:
            - $ref: '#/components/parameters/FrameId'
        post:
            operationId: createAlbum
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlbumWrite'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Album'
                    description: Created
            tags:
                - albums
    /v1/frames/{frameId}/albums/{albumId}:
        delete:
            description: Placements stay on the frame.
            operationId: deleteAlbum
            responses:
                "204":
                    description: Deleted
            tags:
                - albums
        parameters:
            - $ref: '#/components/parameters/FrameId'
            - in: path
              name: albumId
              required: true
              schema:
                $ref: '#/components/schemas/Id'
        patch:
            operationId: updateAlbum
            parameters:
                - $ref: '#/components/parameters/IfMatch'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AlbumWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Album'
                    description: Updated
                "412":
                    $ref: '#/components/responses/Problem'
            tags:
                - albums
    /v1/frames/{frameId}/calendar:
        get:
            description: |
                Read-only merged view of what the frame shows (needs change_settings): the payload of the frame's
                `calendar` change, plus the frame's weather (`null` when it has none) so clients can show the forecast per
                day.
            operationId: getFrameCalendar
            parameters:
                - $ref: '#/components/parameters/FrameId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarView'
                    description: Merged calendar
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
    /v1/frames/{frameId}/calendars:
        get:
            description: The frame's calendar sources with their sync status (needs change_settings). There is no limit on the number.
            operationId: listCalendars
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CalendarSource'
                                type: array
                    description: Sources in display order; the local received-events calendar (if any) comes first.
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
        parameters:
            - $ref: '#/components/parameters/FrameId'
        post:
            description: |
                Add an ICS/webcal link or a CalDAV calendar (needs change_settings). The server syncs it right away; the
                result has `status: syncing`. The URL and credentials are encrypted at rest and never returned (only
                `url_hint`). `503 feature_disabled` when the server has calendars turned off. For a CalDAV account with
                several calendars, `calendar_url` picks one (from `testCalendar`); create one source per calendar.
            operationId: createCalendar
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalendarSourceCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSource'
                    description: Created
                "422":
                    $ref: '#/components/responses/Problem'
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
    /v1/frames/{frameId}/calendars/{calendarId}:
        delete:
            description: |
                Remove a source and its events from the frame (needs change_settings). Removing the local received-events
                calendar deletes every accepted event; the calendar comes back with the next accepted invitation.
            operationId: deleteCalendar
            responses:
                "204":
                    description: Removed
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
        parameters:
            - $ref: '#/components/parameters/FrameId'
            - $ref: '#/components/parameters/CalendarId'
        patch:
            description: |
                Rename, recolour, enable/disable, or change the link or credentials (needs change_settings). Omitted fields
                are kept. Changing the URL or credentials syncs right away.
            operationId: updateCalendar
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalendarSourceUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSource'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
    /v1/frames/{frameId}/calendars/{calendarId}/sync:
        post:
            description: 'Sync now (needs change_settings). Returns at once with `status: syncing`.'
            operationId: syncCalendar
            parameters:
                - $ref: '#/components/parameters/FrameId'
                - $ref: '#/components/parameters/CalendarId'
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSource'
                    description: Sync started
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - calendar
    /v1/frames/{frameId}/calendars:test:
        post:
            description: |
                Try a link or CalDAV account without saving it (needs change_settings; rate-limited). For CalDAV,
                `calendars` lists the calendars found on the account so the client can let the user pick one or more.
                `ok: false` with `status` and `error` when the calendar cannot be read.
            operationId: testCalendar
            parameters:
