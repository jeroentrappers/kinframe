                                type: boolean
                            direct_photos:
                                description: The caller's own direct placements on that frame.
                                type: integer
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                            role:
                                $ref: '#/components/schemas/Role'
