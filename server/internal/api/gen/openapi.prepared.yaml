components:
    parameters:
        Cursor:
            in: query
            name: cursor
            schema:
                type: string
        EndpointId:
            in: path
            name: endpointId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        FrameId:
            in: path
            name: frameId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        IdempotencyKey:
            in: header
            name: Idempotency-Key
            schema:
                maxLength: 64
                type: string
        IfMatch:
            description: Quoted version, e.g. "7"
            in: header
            name: If-Match
            required: true
            schema:
                type: string
        InviteToken:
            in: path
            name: token
            required: true
            schema:
                maxLength: 64
                minLength: 22
                type: string
        ItemId:
            in: path
            name: itemId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Limit:
            in: query
            name: limit
            schema:
                default: 50
                maximum: 200
                minimum: 1
                type: integer
        PlacementId:
            in: path
            name: placementId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        UserId:
            in: path
            name: userId
            required: true
            schema:
                $ref: '#/components/schemas/Id'
    responses:
        Problem:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Error (RFC 9457)
    schemas:
        Album:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                placement_count:
                    type: integer
                placement_ids:
                    description: Ordered.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
                version:
                    type: integer
            required:
                - id
                - name
                - version
                - placement_count
            type: object
        AlbumWrite:
            properties:
                cover_placement_id:
                    $ref: '#/components/schemas/Id'
                name:
                    maxLength: 60
                    minLength: 1
                    type: string
                placement_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                schedule:
                    description: Play this album automatically between dates each year (e.g. December).
                    nullable: true
                    properties:
                        from_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                        to_month_day:
                            pattern: ^[0-9]{2}-[0-9]{2}$
                            type: string
                    type: object
            type: object
        Change:
            discriminator:
                propertyName: type
            properties:
                album:
                    $ref: '#/components/schemas/Album'
                frame:
                    properties:
                        location:
                            nullable: true
                            type: string
                        name:
                            type: string
                        owner_name:
                            type: string
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                member:
                    properties:
                        avatar_url:
                            nullable: true
                            type: string
                        display_name:
                            type: string
                        role:
                            $ref: '#/components/schemas/Role'
                        user_id:
                            $ref: '#/components/schemas/Id'
                    type: object
                placement:
                    allOf:
                        - $ref: '#/components/schemas/Placement'
                        - properties:
                            media:
                                description: Frame rendition to download (present on placement.upsert when status is ready).
                                properties:
                                    bytes:
                                        type: integer
                                    height:
                                        type: integer
                                    mime:
                                        example: image/webp
                                        type: string
                                    poster_url:
                                        format: uri
                                        nullable: true
                                        type: string
                                    sha256:
                                        type: string
                                    url:
                                        format: uri
                                        type: string
                                    width:
                                        type: integer
                                type: object
                          type: object
                seq:
                    type: integer
                settings:
                    $ref: '#/components/schemas/FrameSettings'
                type:
                    enum:
                        - placement.upsert
                        - placement.remove
                        - settings
                        - album.upsert
                        - album.remove
                        - member.upsert
                        - member.remove
                        - frame
                        - weather
                        - reset
                    type: string
                weather:
                    $ref: '#/components/schemas/Weather'
            required:
                - seq
                - type
            type: object
        CommandResult:
            properties:
                error_code:
                    nullable: true
                    type: string
                ok:
                    type: boolean
            required:
                - ok
            type: object
        DeviceEnroll:
            properties:
                app:
                    properties:
                        channel:
                            default: stable
                            enum:
                                - stable
                                - beta
                            type: string
                        version:
                            type: string
                        version_code:
                            type: integer
                    required:
                        - version
                        - version_code
                    type: object
                hardware:
                    properties:
                        abis:
                            items:
                                type: string
                            type: array
                        android_sdk:
                            example: 23
                            type: integer
                        board:
                            example: rk312x
                            type: string
                        brand:
                            example: denver
                            type: string
                        capabilities:
                            properties:
                                accelerometer:
                                    type: boolean
                                battery:
                                    type: boolean
                                light_sensor:
                                    type: boolean
                                motion_sensor:
                                    type: boolean
                                root:
                                    type: boolean
                                sd_card:
                                    type: boolean
                                speaker:
                                    type: boolean
                                usb_host:
                                    type: boolean
                            type: object
                        max_video_decode:
                            $ref: '#/components/schemas/Screen'
                        model:
                            example: PFF_1024
                            type: string
                        ram_mb:
                            type: integer
                        storage_total_bytes:
                            type: integer
                    required:
                        - model
                    type: object
                locale:
                    type: string
                screen:
                    $ref: '#/components/schemas/Screen'
                timezone:
                    type: string
            required:
                - hardware
                - screen
                - app
            type: object
        DeviceState:
            properties:
                claimed:
                    type: boolean
                device_id:
                    $ref: '#/components/schemas/Id'
                frame_id:
                    nullable: true
                    type: string
                frame_name:
                    nullable: true
                    type: string
                latest_seq:
                    type: integer
                owner_name:
                    nullable: true
                    type: string
                server_time:
                    format: date-time
                    type: string
            required:
                - device_id
                - claimed
                - latest_seq
            type: object
        Discovery:
            properties:
                api:
                    format: uri
                    type: string
                auth:
                    properties:
                        api_resource:
                            type: string
                        desktop_client_id:
                            description: |
                                Logto Native app of the Windows, macOS and Linux client. It signs in with a loopback redirect
                                (`http://127.0.0.1:<port>/callback`, RFC 8252). Absent on servers bootstrapped before it existed.
                            type: string
                        issuer:
                            format: uri
                            type: string
                        mobile_client_id:
                            type: string
                        web_client_id:
                            type: string
                    required:
                        - issuer
                        - mobile_client_id
                        - web_client_id
                        - api_resource
                    type: object
                dev_auth:
                    default: false
                    description: True only on development servers running dev auth mode (POST /dev/token). Never true in production.
                    type: boolean
                limits:
                    $ref: '#/components/schemas/Limits'
                name:
                    type: string
                version:
                    type: string
                weather:
                    default: false
                    description: True when the server fetches weather for frames and serves `/v1/geocode`.
                    type: boolean
                web:
                    format: uri
                    type: string
                webpush_public_key:
                    description: |
                        VAPID application server public key (uncompressed P-256 point, base64url) for browser push
                        subscriptions (`PushManager.subscribe({applicationServerKey})`). Null when the server has push disabled.
                    nullable: true
                    type: string
            required:
                - name
                - version
                - api
                - auth
                - limits
            type: object
        Fit:
            enum:
                - fill
                - fit
            type: string
        FocalPoint:
            description: Relative to the master rendition, 0..1 from top-left.
            properties:
                x:
                    maximum: 1
                    minimum: 0
                    type: number
                "y":
                    maximum: 1
                    minimum: 0
                    type: number
            required:
                - x
                - "y"
            type: object
        Frame:
            allOf:
                - $ref: '#/components/schemas/FrameSummary'
                - properties:
                    approve_joins_on_frame:
                        type: boolean
                    created_at:
                        format: date-time
                        type: string
                    default_permissions:
                        $ref: '#/components/schemas/Permissions'
                    invite_requires_approval:
                        type: boolean
                    member_count:
                        type: integer
                    moderation:
                        type: boolean
                    placement_count:
                        type: integer
                  type: object
        FrameCode:
            properties:
                claimed:
                    description: false while the frame has no owner
                    type: boolean
                code:
                    pattern: ^[0-9]{8}$
                    type: string
                expires_at:
                    format: date-time
                    type: string
                join_url:
                    format: uri
                    type: string
            required:
                - code
                - expires_at
                - join_url
            type: object
        FrameCommand:
            properties:
                placement_id:
                    $ref: '#/components/schemas/Id'
                type:
                    enum:
                        - sleep
                        - wake
                        - restart
                        - next
                        - previous
                        - show_placement
                        - sync_now
                        - identify
                    type: string
            required:
                - type
            type: object
        FrameHealth:
            properties:
                last_heartbeat:
                    $ref: '#/components/schemas/Heartbeat'
                last_seen_at:
                    format: date-time
                    nullable: true
                    type: string
                last_unclean_shutdown_at:
                    format: date-time
                    nullable: true
                    type: string
                online:
                    type: boolean
            type: object
        FrameSettings:
            description: Defaults per docs/spec/product-spec.md §6. Unknown fields must be preserved by clients.
            properties:
                display:
                    properties:
                        brightness:
                            default: 204
                            maximum: 255
                            minimum: 15
                            type: integer
                        brightness_mode:
                            default: manual
                            enum:
                                - manual
                                - schedule
                                - sun
                                - sensor
                            type: string
                        brightness_schedule:
                            items:
                                properties:
                                    at:
                                        pattern: ^[0-2][0-9]:[0-5][0-9]$
                                        type: string
                                    brightness:
                                        maximum: 255
                                        minimum: 15
                                        type: integer
                                type: object
                            type: array
                        motion_timeout_min:
                            default: 30
                            nullable: true
                            type: integer
                        sleep_schedules:
                            items:
                                $ref: '#/components/schemas/SleepSchedule'
                            type: array
                        text_scale:
                            default: 1
                            enum:
                                - 1
                                - 1.15
                                - 1.3
                            type: number
                    type: object
                kiosk:
                    properties:
                        allow_remove_members_on_frame:
                            default: true
                            type: boolean
                        owner_pin:
                            description: |
                                Owner only (`403 forbidden` for anyone else). A 4–6 digit kiosk PIN for the frame, or null to remove it.
                                The server never stores or returns the PIN: it keeps only `owner_pin_hash`, which the frame verifies
                                locally (opening settings, leaving the kiosk, power off/restart, Wi-Fi changes).
                            nullable: true
                            pattern: ^[0-9]{4,6}$
                            type: string
                            writeOnly: true
                        owner_pin_hash:
                            allOf:
                                - $ref: '#/components/schemas/PinHash'
                            description: |
                                Salted hash of the owner PIN, null when no PIN is set. Only the frame sees it (in the change feed and
                                in `PATCH /device/settings` responses); user-facing settings omit it. The frame may set or clear it
                                with `PATCH /device/settings` when the PIN is changed at the frame; users set it via `owner_pin`.
                            nullable: true
                        owner_pin_set:
                            readOnly: true
                            type: boolean
                    type: object
                locale:
                    properties:
                        first_day_of_week:
                            default: mon
                            enum:
                                - mon
                                - sun
                                - sat
                            type: string
                        language:
                            default: en
                            type: string
                        temperature_unit:
                            default: c
                            enum:
                                - c
                                - f
                            type: string
                        timezone:
                            default: Europe/Brussels
                            type: string
                    type: object
                location:
                    description: |
                        Used for weather and sun-based brightness. Set by owner/admin, usually from a `/v1/geocode` result.
                        Changing it (or turning `widgets.weather` on) makes the server fetch weather right away.
                    nullable: true
                    properties:
                        lat:
                            maximum: 90
                            minimum: -90
                            type: number
                        lon:
                            maximum: 180
                            minimum: -180
                            type: number
                        name:
                            maxLength: 100
                            type: string
                    required:
                        - lat
                        - lon
                    type: object
                notifications:
                    properties:
                        sound:
                            default: true
                            type: boolean
                        volume:
                            default: 40
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                slideshow:
                    properties:
                        album_id:
                            description: null = all photos
                            nullable: true
                            type: string
                        background:
                            default: blur
                            enum:
                                - blur
                                - black
                                - palette
                            type: string
                        caption_date:
                            default: received
                            enum:
                                - taken
                                - received
                                - none
                            type: string
                        collage:
                            default: false
                            type: boolean
                        collage_max:
                            default: 3
                            maximum: 6
                            minimum: 2
                            type: integer
                        fill:
                            default: true
                            type: boolean
                        interval_s:
                            default: 30
                            maximum: 86400
                            minimum: 2
                            type: integer
                        on_this_day:
                            default: false
                            type: boolean
                        order:
                            default: received
                            enum:
                                - received
                                - taken
                                - shuffle
                            type: string
                        pair_portraits:
                            default: true
                            type: boolean
                        reverse:
                            default: false
                            type: boolean
                        transition:
                            default: crossfade
                            enum:
                                - crossfade
                                - slide
                                - kenburns
                            type: string
                        transition_ms:
                            default: 800
                            maximum: 3000
                            minimum: 200
                            type: integer
                    type: object
                updates:
                    properties:
                        channel:
                            default: stable
                            description: Frame app release channel (beta program). Beta frames get the newest of beta and stable.
                            enum:
                                - stable
                                - beta
                            type: string
                    type: object
                version:
                    type: integer
                video:
                    properties:
                        auto_mute_min:
                            default: null
                            nullable: true
                            type: integer
                        autoplay:
                            default: true
                            type: boolean
                        playback:
                            default: once_hold
                            enum:
                                - loop
                                - once_hold
                                - once_advance
                            type: string
                        volume:
                            default: 60
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                widgets:
                    properties:
                        avatar:
                            default: true
                            type: boolean
                        caption:
                            default: true
                            type: boolean
                        clock:
                            default: true
                            type: boolean
                        clock_24h:
                            default: true
                            type: boolean
                        date:
                            default: true
                            type: boolean
                        weather:
                            default: false
                            description: Current weather widget; needs `location`.
                            type: boolean
                    type: object
            required:
                - version
            type: object
        FrameSettingsPatch:
            description: RFC 7396 merge patch of FrameSettings (any subset; arrays are replaced whole).
            type: object
        FrameSummary:
            properties:
                app_version:
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                last_seen_at:
                    format: date-time
                    nullable: true
                    type: string
                location:
                    nullable: true
                    type: string
                name:
                    type: string
                needs_update:
                    type: boolean
                online:
                    type: boolean
                owner_name:
                    type: string
                permissions:
                    $ref: '#/components/schemas/Permissions'
                role:
                    $ref: '#/components/schemas/Role'
                screen:
                    $ref: '#/components/schemas/Screen'
            required:
                - id
                - name
                - role
                - permissions
                - online
            type: object
        FrameUpdate:
            description: A frame app release mirrored by the server.
            properties:
                min_sdk:
                    example: 23
                    type: integer
                prerelease:
                    description: True for beta releases.
                    type: boolean
                published_at:
                    format: date-time
                    type: string
                release_notes:
                    nullable: true
                    type: string
                sha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                size:
                    description: bytes
                    type: integer
                url:
                    description: 'Where to download the APK: `/v1/device/update/apk/{version_code}` on this server.'
                    format: uri
                    type: string
                version_code:
                    example: 20099
                    type: integer
                version_name:
                    example: 0.2.0
                    type: string
            required:
                - version_name
                - version_code
                - min_sdk
                - url
                - sha256
                - size
                - published_at
            type: object
        Heartbeat:
            properties:
                android_sdk:
                    type: integer
                app_version:
                    type: string
                app_version_code:
                    type: integer
                cache_bytes:
                    type: integer
                crash_count_24h:
                    type: integer
                last_shutdown_clean:
                    type: boolean
                last_update_error:
                    description: 'Short machine-readable reason, e.g. `sha256_mismatch`, `signature_mismatch`, `install_failed: ...`, `crash_loop 20199`'
                    nullable: true
                    type: string
                local_time:
                    format: date-time
                    type: string
                placements_cached:
                    type: integer
                placements_evicted:
                    description: Renditions the frame removed from its cache to free space (least recently shown first); it downloads them again before they show.
                    type: integer
                placements_missing:
                    type: integer
                screen_state:
                    enum:
                        - "on"
                        - "off"
                        - dimmed
                        - sleeping
                    type: string
                storage_free_bytes:
                    type: integer
                storage_state:
                    description: '`low`: below the frame''s low-water mark, evicting. `critical`: nearly full with nothing left to evict.'
                    enum:
                        - ok
                        - low
                        - critical
                    type: string
                storage_total_bytes:
                    type: integer
                timezone:
                    example: Europe/Brussels
                    type: string
                update_state:
                    description: |
                        Self-update state (README §5.7). `idle`: nothing pending. `downloading`, `installing`: in progress.
                        `waiting`: downloaded, waiting for the frame to be idle. `needs_user`: no root, the system installer is
                        showing. `updated`: the last update succeeded. `failed`: the last attempt failed (see
                        `last_update_error`). `rolled_back`: the new version crash-looped and the previous one was reinstalled.
                    enum:
                        - idle
                        - downloading
                        - waiting
                        - installing
                        - needs_user
                        - updated
                        - failed
                        - rolled_back
                    type: string
                uptime_s:
                    type: integer
                wifi_link_mbps:
                    nullable: true
                    type: integer
                wifi_rssi_dbm:
                    nullable: true
                    type: integer
                wifi_ssid:
                    nullable: true
                    type: string
            required:
                - app_version
                - uptime_s
            type: object
        Id:
            description: UUIDv7
            format: uuid
            type: string
        Invite:
            properties:
                created_by_name:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                max_uses:
                    nullable: true
                    type: integer
                note:
                    nullable: true
                    type: string
                token:
                    type: string
                url:
                    format: uri
                    type: string
                uses:
                    type: integer
            required:
                - id
                - token
                - url
                - expires_at
            type: object
        InvitePreview:
            properties:
                already_member:
                    type: boolean
                frame_location:
                    nullable: true
                    type: string
                frame_name:
                    type: string
                invited_by_name:
                    type: string
                owner_name:
                    type: string
                requires_approval:
                    type: boolean
            required:
                - frame_name
                - invited_by_name
                - requires_approval
            type: object
        Item:
            properties:
                caption:
                    nullable: true
                    type: string
                caption_edited:
                    type: boolean
                captured_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                duration_ms:
                    nullable: true
                    type: integer
                failure_code:
                    nullable: true
                    type: string
                fit:
                    $ref: '#/components/schemas/Fit'
                focal_point:
                    $ref: '#/components/schemas/FocalPoint'
                has_audio:
                    nullable: true
                    type: boolean
                height:
                    type: integer
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    $ref: '#/components/schemas/MediaKind'
                place_name:
                    nullable: true
                    type: string
                sender_id:
                    $ref: '#/components/schemas/Id'
                sender_name:
                    type: string
                status:
                    enum:
                        - processing
                        - ready
                        - failed
                    type: string
                thumb_url:
                    description: Short-lived signed URL (about 1 h) usable directly in <img src> without an Authorization header.
                    format: uri
                    nullable: true
                    type: string
                width:
                    type: integer
            required:
                - id
                - kind
                - status
                - sender_id
                - created_at
            type: object
        JoinRequest:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                invited_by_name:
                    nullable: true
                    type: string
                note:
                    nullable: true
                    type: string
                user:
                    properties:
                        avatar_url:
                            nullable: true
                            type: string
                        display_name:
                            type: string
                        id:
                            $ref: '#/components/schemas/Id'
                    type: object
                via:
                    enum:
                        - frame_code
                        - invite
                    type: string
            required:
                - id
                - user
                - via
                - created_at
            type: object
        Limits:
            properties:
                max_items_per_send:
                    default: 200
                    type: integer
                max_upload_bytes:
                    default: 2147483648
                    type: integer
                max_video_seconds:
                    default: 300
                    type: integer
                trash_retention_days:
                    default: 30
                    type: integer
            required:
                - max_items_per_send
                - max_video_seconds
                - max_upload_bytes
            type: object
        MediaKind:
            enum:
                - photo
                - video
            type: string
        Member:
            properties:
                avatar_url:
                    format: uri
                    nullable: true
                    type: string
                display_name:
                    type: string
                joined_at:
                    format: date-time
                    type: string
                last_sent_at:
                    format: date-time
                    nullable: true
                    type: string
                permissions:
                    $ref: '#/components/schemas/Permissions'
                role:
                    $ref: '#/components/schemas/Role'
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - user_id
                - display_name
                - role
                - permissions
            type: object
        Permissions:
            properties:
                change_settings:
                    type: boolean
                invite:
                    type: boolean
                manage_library:
                    type: boolean
                see_library:
                    type: boolean
                send:
                    type: boolean
            type: object
        PinHash:
            description: |
                PBKDF2-HMAC-SHA256 of the UTF-8 PIN digits (RFC 8018), 32-byte output. `salt` and `hash` are standard base64.
            properties:
                alg:
                    enum:
                        - pbkdf2-sha256
                    type: string
                hash:
                    description: base64 of 32 bytes
                    maxLength: 44
                    minLength: 44
                    type: string
                iterations:
                    example: 20000
                    maximum: 1000000
                    minimum: 1000
                    type: integer
                salt:
                    at least 12 random bytes: null
                    description: base64
                    maxLength: 64
                    minLength: 16
                    type: string
            required:
                - alg
                - iterations
                - salt
                - hash
            type: object
        Place:
            description: A geocoding result (Open-Meteo geocoding API).
            properties:
                admin1:
                    description: Region / state / province
                    example: Flanders
                    nullable: true
                    type: string
                country:
                    example: Belgium
                    nullable: true
                    type: string
                country_code:
                    description: ISO 3166-1 alpha-2
                    example: BE
                    nullable: true
                    type: string
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lon:
                    maximum: 180
                    minimum: -180
                    type: number
                name:
                    example: Gent
                    type: string
                timezone:
                    example: Europe/Brussels
                    nullable: true
                    type: string
            required:
                - name
                - lat
                - lon
            type: object
        Placement:
            properties:
                album_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                delivered_at:
                    format: date-time
                    nullable: true
                    type: string
                fit_override:
                    allOf:
                        - $ref: '#/components/schemas/Fit'
                    nullable: true
                focal_override:
                    allOf:
                        - $ref: '#/components/schemas/FocalPoint'
                    nullable: true
                frame_id:
                    $ref: '#/components/schemas/Id'
                hidden:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                item:
                    $ref: '#/components/schemas/Item'
                pending_moderation:
                    type: boolean
                reaction:
                    allOf:
                        - $ref: '#/components/schemas/Reaction'
                    nullable: true
                received_at:
                    format: date-time
                    type: string
                replies:
                    items:
                        properties:
                            at:
                                format: date-time
                                type: string
                            preset:
                                $ref: '#/components/schemas/ReplyPreset'
                        type: object
                    type: array
                rotation:
                    enum:
                        - 0
                        - 90
                        - 180
                        - 270
                    type: integer
                seen_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/PlacementStatus'
                trashed:
                    type: boolean
                trashed_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - frame_id
                - item
                - status
                - hidden
                - trashed
            type: object
        PlacementStatus:
            enum:
                - pending
                - ready
                - delivered
                - seen
                - failed
                - removed
            type: string
        Problem:
            properties:
                code:
                    $ref: '#/components/schemas/ProblemCode'
                detail:
                    type: string
                errors:
                    description: Field-level validation errors (422)
                    items:
                        properties:
                            code:
                                type: string
                            field:
                                type: string
                        type: object
                    type: array
                status:
                    type: integer
                title:
                    type: string
                type:
                    format: uri
                    type: string
            required:
                - type
                - title
                - status
                - code
            type: object
        ProblemCode:
            enum:
                - unauthorized
                - token_expired
                - device_revoked
                - forbidden
                - missing_permission
                - not_found
                - code_invalid
                - code_expired
                - invite_invalid
                - invite_expired
                - already_member
                - validation_failed
                - too_many_items
                - video_too_long
                - upload_too_large
                - upload_not_found
                - unsupported_media
                - corrupt_media
                - version_conflict
                - frame_offline
                - command_timeout
                - owner_cannot_leave
                - rate_limited
                - app_update_required
                - upstream_unavailable
                - feature_disabled
                - server_error
            type: string
        PushEndpoint:
            allOf:
                - $ref: '#/components/schemas/PushEndpointCreate'
                - properties:
                    created_at:
                        format: date-time
                        type: string
                    id:
                        $ref: '#/components/schemas/Id'
                  required:
                    - id
                    - created_at
                  type: object
        PushEndpointCreate:
            properties:
                device_name:
                    maxLength: 60
                    type: string
                endpoint:
                    description: UnifiedPush/WebPush URL
                    or FCM/APNs token: null
                    type: string
                kind:
                    enum:
                        - unifiedpush
                        - fcm
                        - apns
                        - webpush
                    type: string
                locale:
                    type: string
                webpush_keys:
                    properties:
                        auth:
                            type: string
                        p256dh:
                            type: string
                    type: object
            required:
                - kind
                - endpoint
            type: object
        Reaction:
            enum:
                - love
                - laugh
                - wow
                - sad
            type: string
        RedeemResult:
            properties:
                frame:
                    $ref: '#/components/schemas/FrameSummary'
                join_request_id:
                    $ref: '#/components/schemas/Id'
                status:
                    enum:
                        - claimed
                        - joined
                        - pending
                        - already_member
                    type: string
            required:
                - status
                - frame
            type: object
        ReplyPreset:
            enum:
                - beautiful
                - call_me
                - miss_you
                - thanks
            type: string
        Role:
            enum:
                - owner
                - admin
                - member
            type: string
        Screen:
            properties:
                density_dpi:
                    type: integer
                height:
                    example: 800
                    type: integer
                orientation:
                    enum:
                        - landscape
                        - portrait
                    type: string
                width:
                    example: 1280
                    type: integer
            required:
                - width
                - height
            type: object
        Send:
            properties:
                created_at:
                    format: date-time
                    type: string
                frames:
                    description: Per-frame delivery for this send.
                    items:
                        properties:
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                            online:
                                type: boolean
                            placements:
                                items:
                                    properties:
                                        item_id:
                                            $ref: '#/components/schemas/Id'
                                        placement_id:
                                            $ref: '#/components/schemas/Id'
                                        reaction:
                                            allOf:
                                                - $ref: '#/components/schemas/Reaction'
                                            nullable: true
                                        replies:
                                            items:
                                                $ref: '#/components/schemas/ReplyPreset'
                                            type: array
                                        status:
                                            $ref: '#/components/schemas/PlacementStatus'
                                    required:
                                        - placement_id
                                        - item_id
                                        - status
                                    type: object
                                type: array
                        required:
                            - frame_id
                            - frame_name
                            - placements
                        type: object
                    type: array
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/Item'
                    type: array
                summary:
                    properties:
                        delivered:
                            type: integer
                        failed:
                            type: integer
                        pending:
                            type: integer
                        processing:
                            type: integer
                        seen:
                            type: integer
                    type: object
            required:
                - id
                - created_at
                - items
                - frames
            type: object
        SendCreate:
            properties:
                frame_ids:
                    items:
                        $ref: '#/components/schemas/Id'
                    minItems: 1
                    type: array
                items:
                    items:
                        properties:
                            caption:
                                maxLength: 280
                                nullable: true
                                type: string
                            captured_at:
                                description: Client hint used when the file has no metadata.
                                format: date-time
                                nullable: true
                                type: string
                            fit:
                                $ref: '#/components/schemas/Fit'
                            focal_point:
                                $ref: '#/components/schemas/FocalPoint'
                            include_audio:
                                default: true
                                type: boolean
                            trim:
                                description: Videos only. The selected part must be at least 3 seconds long (unless the whole video is shorter).
                                properties:
                                    end_ms:
                                        minimum: 1
                                        type: integer
                                    start_ms:
                                        minimum: 0
                                        type: integer
                                type: object
                            upload_id:
                                description: tus upload id
                                or an existing item id when the server reported a duplicate: null
                                type: string
                        required:
                            - upload_id
                        type: object
                    minItems: 1
                    type: array
            required:
                - frame_ids
                - items
            type: object
        SleepSchedule:
            properties:
                days:
                    items:
                        enum:
                            - mon
                            - tue
                            - wed
                            - thu
                            - fri
                            - sat
                            - sun
                        type: string
                    type: array
                enabled:
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                mode:
                    default: "off"
                    enum:
                        - "off"
                        - dim
                    type: string
                sleep_at:
                    example: "23:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
                wake_at:
                    example: "07:00"
                    pattern: ^[0-2][0-9]:[0-5][0-9]$
                    type: string
            required:
                - id
                - sleep_at
                - wake_at
                - days
                - enabled
            type: object
        User:
            properties:
                avatar_url:
                    format: uri
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                display_name:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_operator:
                    type: boolean
                locale:
                    nullable: true
                    type: string
                share_location_names:
                    type: boolean
            required:
                - id
                - display_name
            type: object
        Weather:
            description: |
                Payload of the `weather` change (docs/api/README.md §5.4). `null` means "no weather": the location was
                removed, the weather widget was turned off, or the server has weather disabled; the frame drops what it has.
                Values are always metric (°C, km/h, mm); clients convert for `locale.temperature_unit`. Local times carry the
                location's UTC offset. Data by Open-Meteo.com (CC BY 4.0); clients showing it must credit "Weather data by
                Open-Meteo.com".
            nullable: true
            properties:
                current:
                    properties:
                        apparent_c:
                            description: Feels-like temperature
                            nullable: true
                            type: number
                        code:
                            description: WMO weather code (0–99)
                            type: integer
                        humidity_pct:
                            nullable: true
                            type: integer
                        is_day:
                            type: boolean
                        precip_mm:
                            nullable: true
                            type: number
                        temp_c:
                            type: number
                        time:
                            format: date-time
                            type: string
                        wind_dir_deg:
                            0 = north: null
                            description: Direction the wind comes from
                            nullable: true
                            type: integer
                        wind_kmh:
                            nullable: true
                            type: number
                    required:
                        - temp_c
                        - code
                        - is_day
                    type: object
                daily:
                    description: Up to 7 days, starting today (in the location's time zone).
                    items:
                        properties:
                            code:
                                type: integer
                            date:
                                format: date
                                type: string
                            max_c:
                                type: number
                            min_c:
                                type: number
                            precip_mm:
                                nullable: true
                                type: number
                            precip_prob:
                                description: Maximum hourly probability
                                nullable: true
                                percent: null
                                type: integer
                            sunrise:
                                format: date-time
                                nullable: true
                                type: string
                            sunset:
                                format: date-time
                                nullable: true
                                type: string
                        required:
                            - date
                            - min_c
                            - max_c
                            - code
                        type: object
                    type: array
                fetched_at:
                    description: When the server fetched this from Open-Meteo
                    format: date-time
                    type: string
                hourly:
                    description: The next 24 hours, starting with the current hour.
                    items:
                        properties:
                            code:
                                type: integer
                            is_day:
                                type: boolean
                            precip_prob:
                                description: Percent
                                nullable: true
                                type: integer
                            temp_c:
                                type: number
                            time:
                                format: date-time
                                type: string
                        required:
                            - time
                            - temp_c
                            - code
                        type: object
                    type: array
                location:
                    properties:
                        lat:
                            type: number
                        lon:
                            type: number
                        name:
                            nullable: true
                            type: string
                    type: object
                timezone:
                    example: Europe/Brussels
                    type: string
                units:
                    properties:
                        precipitation:
                            default: mm
                            enum:
                                - mm
                            type: string
                        temperature:
                            default: c
                            enum:
                                - c
                            type: string
                        wind_speed:
                            default: km/h
                            enum:
                                - km/h
                            type: string
                    type: object
                utc_offset_seconds:
                    type: integer
            required:
                - fetched_at
                - current
                - daily
            type: object
    securitySchemes:
        deviceAuth:
            bearerFormat: JWT
            description: Device access token from /v1/devices/token.
            scheme: bearer
            type: http
        userAuth:
            description: Logto access token for the API resource. The issuer comes from discovery.
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.kinframe.appmire.be/oidc/auth
                    scopes:
                        kinframe:operate: Operator access
                    tokenUrl: https://auth.kinframe.appmire.be/oidc/token
            type: oauth2
info:
    description: |
        Machine-readable contract for the kinframe server. Concepts, flows, websockets,
        tus uploads and the change feed are described in docs/api/README.md.
    license:
        identifier: AGPL-3.0-or-later
        name: AGPL-3.0-or-later
    summary: Family photo frames, self-hosted.
    title: kinframe API
    version: 1.0.0-draft
openapi: 3.0.3
paths:
    /.well-known/kinframe:
        get:
            operationId: getDiscovery
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Discovery'
                    description: Server discovery document
            security: []
            tags:
                - discovery
    /dev/token:
        post:
            description: |
                Development servers only (discovery `dev_auth: true`); 404 otherwise. Issues a user access token signed by the
                server itself so web and app development works without Logto. The server refuses to start with dev auth
                enabled when KINFRAME_ENV=production.
            operationId: devToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    format: email
                                    type: string
                                name:
                                    type: string
                            required:
                                - email
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    access_token:
                                        type: string
                                    expires_in:
                                        type: integer
                                required:
                                    - access_token
                                    - expires_in
                                type: object
                    description: Token
                "404":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - dev
    /v1/device/acks:
        post:
            operationId: deviceAck
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                delivered:
                                    items:
                                        $ref: '#/components/schemas/Id'
                                    maxItems: 500
                                    type: array
                                seen:
                                    items:
                                        properties:
                                            at:
                                                format: date-time
                                                type: string
                                            placement_id:
                                                $ref: '#/components/schemas/Id'
                                        required:
                                            - placement_id
                                            - at
                                        type: object
                                    maxItems: 500
                                    type: array
                            type: object
                required: true
            responses:
                "204":
                    description: Recorded
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/changes:
        get:
            operationId: deviceGetChanges
            parameters:
                - in: query
                  name: since
                  required: true
                  schema:
                    minimum: 0
                    type: integer
                - in: query
                  name: limit
                  schema:
                    default: 500
                    maximum: 1000
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    changes:
                                        items:
                                            $ref: '#/components/schemas/Change'
                                        type: array
                                    has_more:
                                        type: boolean
                                    next_seq:
                                        type: integer
                                required:
                                    - changes
                                    - next_seq
                                    - has_more
                                type: object
                    description: Ordered changes after `since`
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/code:
        post:
            description: Get (or re-get) the active frame code. Same code until it expires.
            operationId: deviceGetCode
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameCode'
                    description: Code
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/heartbeat:
        post:
            operationId: deviceHeartbeat
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Heartbeat'
                required: true
            responses:
                "204":
                    description: Recorded
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/imports:
        post:
            description: |
                Upload a photo/video imported from SD/USB on the frame so it joins the library (sender = the frame).
                Body is the file; tus is not required for imports (frames upload one file at a time, ≤ 512 MiB).
            operationId: deviceImport
            parameters:
                - in: header
                  name: X-Filename
                  required: true
                  schema:
                    type: string
                - in: header
                  name: X-Captured-At
                  schema:
                    format: date-time
                    type: string
            requestBody:
                content:
                    application/octet-stream:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Accepted; a placement.upsert change follows
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/join-requests:
        get:
            description: |
                Pending join requests that wait for a decision on the frame ("ask on the frame before someone new joins").
                The frame shows them until they are decided here or by an owner/admin in the app; it re-reads this list on
                connect and after syncing, so requests announced while it was offline are not lost.
            operationId: deviceListJoinRequests
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/JoinRequest'
                                type: array
                    description: Oldest first
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/join-requests/{requestId}:
        post:
            operationId: deviceDecideJoin
            parameters:
                - in: path
                  name: requestId
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                decision:
                                    enum:
                                        - approve
                                        - deny
                                    type: string
                            required:
                                - decision
                            type: object
                required: true
            responses:
                "204":
                    description: Decided
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/media/{placementId}:
        get:
            description: The frame-sized rendition (or poster with ?variant=poster). Supports Range, ETag, If-None-Match.
            operationId: deviceGetMedia
            parameters:
                - $ref: '#/components/parameters/PlacementId'
                - in: query
                  name: variant
                  schema:
                    default: display
                    enum:
                        - display
                        - poster
                        - avatar
                    type: string
            responses:
                "200":
                    description: Bytes
                "206":
                    description: Partial bytes
                "304":
                    description: Not modified
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/members/{userId}:
        delete:
            description: Remove a member from the frame itself (allowed unless the owner disabled it in settings). Cannot remove the owner.
            operationId: deviceRemoveMember
            parameters:
                - $ref: '#/components/parameters/UserId'
                - in: query
                  name: remove_items
                  schema:
                    default: false
                    type: boolean
            responses:
                "204":
                    description: Removed
                "403":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}:
        patch:
            description: Actions taken at the frame (hide/unhide, trash/restore, local fit/focal override).
            operationId: devicePatchPlacement
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fit:
                                    $ref: '#/components/schemas/Fit'
                                focal_point:
                                    $ref: '#/components/schemas/FocalPoint'
                                hidden:
                                    type: boolean
                                rotation:
                                    enum:
                                        - 0
                                        - 90
                                        - 180
                                        - 270
                                    type: integer
                                trashed:
                                    type: boolean
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Updated
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}/reaction:
        put:
            operationId: deviceSetReaction
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                reaction:
                                    allOf:
                                        - $ref: '#/components/schemas/Reaction'
                                    nullable: true
                            required:
                                - reaction
                            type: object
                required: true
            responses:
                "204":
                    description: Stored
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/placements/{placementId}/replies:
        post:
            operationId: deviceSendReply
            parameters:
                - $ref: '#/components/parameters/PlacementId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                preset:
                                    $ref: '#/components/schemas/ReplyPreset'
                            required:
                                - preset
                            type: object
                required: true
            responses:
                "204":
                    description: Sent
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/settings:
        patch:
            description: Settings changed locally on the frame. Same semantics as updateFrameSettings.
            operationId: devicePatchSettings
            parameters:
                - $ref: '#/components/parameters/IfMatch'
            requestBody:
                content:
                    application/merge-patch+json:
                        schema:
                            $ref: '#/components/schemas/FrameSettingsPatch'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameSettings'
                    description: Updated
                "412":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/state:
        get:
            description: Whether the frame is claimed, its identity and the latest change seq. Used after boot and on the setup screen.
            operationId: deviceGetState
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeviceState'
                    description: State
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/update:
        get:
            description: |
                Self-update check (README §5.7). Answers with the newest frame app release on the channel that is newer
                than the caller's version code (from `X-Kinframe-App`, else the code last reported by the device) and
                whose `min_sdk` the device meets; `204` when there is none. Allowed even when the app is below the
                server's minimum version (`426` is never returned here).
            operationId: deviceCheckUpdate
            parameters:
                - description: Defaults to the frame's `updates.channel` setting (unclaimed frames use the channel from enrollment).
                  in: query
                  name: channel
                  schema:
                    enum:
                        - stable
                        - beta
                    type: string
                - description: Version codes the frame refuses (rolled back earlier). The newest release not listed is returned.
                  explode: false
                  in: query
                  name: skip
                  schema:
                    items:
                        type: integer
                    maxItems: 50
                    type: array
                  style: form
                - description: '`kinframe-frame/<version name> (<version code>)`'
                  in: header
                  name: X-Kinframe-App
                  schema:
                    example: kinframe-frame/0.2.0 (20099)
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FrameUpdate'
                    description: An update is available
                "204":
                    description: Up to date (or no release suits this device)
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/device/update/apk/{versionCode}:
        get:
            description: The mirrored APK. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
            operationId: deviceGetUpdateApk
            parameters:
                - in: path
                  name: versionCode
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/vnd.android.package-archive:
                            schema:
                                format: binary
                                type: string
                    description: APK bytes
                "206":
                    description: Partial bytes
                "304":
                    description: Not modified
                "404":
                    $ref: '#/components/responses/Problem'
            security:
                - deviceAuth: []
            tags:
                - device
    /v1/devices/enroll:
        post:
            description: Called once by a fresh frame. Rate-limited per IP.
            operationId: enrollDevice
