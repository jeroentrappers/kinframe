                                        base64url. Shown only once.: null
                                        description: 256-bit random
                                        type: string
                                required:
                                    - device_id
                                    - device_secret
                                type: object
                    description: Enrolled
                "429":
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - devices
