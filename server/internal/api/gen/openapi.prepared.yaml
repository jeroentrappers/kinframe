                    $ref: '#/components/schemas/Id'
                freshest_frames:
                    items:
                        properties:
                            days_with_new_photos:
                                type: integer
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                        required:
