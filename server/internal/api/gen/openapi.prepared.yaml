                    $ref: '#/components/schemas/RemoteHelpSession'
                type:
                    enum:
                        - remote_help.updated
                    type: string
            required:
                - type
                - frame_id
                - session
            type: object
        RemoteHelpPage:
            properties:
                next_cursor:
                    nullable: true
                    type: string
                sessions:
                    items:
                        $ref: '#/components/schemas/RemoteHelpSession'
                    type: array
            required:
                - sessions
                - next_cursor
            type: object
        RemoteHelpPushKey:
            description: |
                Push `key`s of remote help (README §5.23). `remote_help_started`: the frame's members, at start.
                `remote_help_on`: the operator who started it, when the frame joined. `remote_help_ended`: members and the
                operator, not whoever ended it. `ids`: `frame_id`, `session_id`; `tag`: `remote_help:<frame_id>`.
            enum:
                - remote_help_started
                - remote_help_on
                - remote_help_ended
            type: string
        RemoteHelpSession:
            description: |
                A remote help session. Members (`getFrameRemoteHelp`, `remote_help.updated` to members) get it without
                `tailnet_ip` and `error`.
            properties:
                adb_command:
                    example: adb connect kinframe-36339301:5555
                    type: string
                ended_at:
                    format: date-time
                    nullable: true
                    type: string
                ended_by:
                    allOf:
                        - $ref: '#/components/schemas/RemoteHelpEndedBy'
                    nullable: true
                ended_by_name:
                    description: The person who ended it (operator or owner/admin).
                    nullable: true
                    type: string
                ends_at:
                    format: date-time
                    type: string
                error:
                    description: Operator only. Why the frame or Headscale failed.
                    nullable: true
                    type: string
                frame_id:
                    $ref: '#/components/schemas/Id'
                frame_name:
                    type: string
                hostname:
                    example: kinframe-36339301
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                reason:
                    type: string
                started_at:
                    format: date-time
                    type: string
                started_by_name:
                    description: The operator who started it.
                    type: string
                state:
                    description: '`pending`: waiting for the frame to join the tailnet (ends as `failed` after 30 minutes). `on`: the frame reported it joined.'
                    enum:
                        - pending
                        - "on"
                        - ended
                    type: string
                tailnet_ip:
                    description: Operator only. Reported by the frame.
                    example: 100.64.0.9
                    nullable: true
                    type: string
            required:
                - id
                - frame_id
                - frame_name
                - state
                - reason
                - started_by_name
                - started_at
                - ends_at
                - ended_at
                - ended_by
                - ended_by_name
                - hostname
                - adb_command
            type: object
        RemoteHelpStart:
            properties:
                hours:
                    description: How long the session lasts.
                    enum:
                        - 1
                        - 8
                        - 24
                    type: integer
                reason:
                    description: Shown to the frame's members and kept in the log.
                    maxLength: 500
                    minLength: 1
                    type: string
            required:
                - hours
                - reason
            type: object
        RemoteInvitePreview:
            properties:
                cover_url:
                    description: A signed thumbnail on A, valid for an hour.
                    format: uri
                    nullable: true
                    type: string
                feed_name:
                    type: string
                frame_count:
                    description: Frames that follow the family (local and remote).
                    type: integer
                requires_approval:
                    description: The family's admins must approve first.
                    type: boolean
                server:
                    $ref: '#/components/schemas/RemoteServer'
                this_server_host:
                    type: string
                this_server_name:
                    description: This server's name
                    for "Photos from this family will be copied to this server (…)".: null
                    type: string
            required:
                - server
                - feed_name
                - this_server_name
            type: object
        RemoteInviteRef:
            properties:
                invite_url:
                    example: https://kinframe.janssens.be/fi/9cQ2xV0kFq7Lm3Zt8bW1rA
                    format: uri
                    maxLength: 2000
                    type: string
            required:
                - invite_url
            type: object
        RemoteOnEnd:
            default: remove
            description: 'When the subscription ends: `remove` the copied photos from the frame (default) or `keep` the ones already there.'
            enum:
                - remove
                - keep
            type: string
        RemoteServer:
            description: Another kinframe server as this one knows it.
            properties:
                blocked:
                    type: boolean
                follows:
                    description: 'Operator listing: frames here following families there.'
                    type: integer
                host:
                    example: kinframe.janssens.be
                    type: string
                last_contact_at:
                    format: date-time
                    nullable: true
                    type: string
                last_error:
                    nullable: true
                    type: string
                server_id:
                    description: Its stable `server_id` (from its well-known document).
                    nullable: true
                    type: string
                server_name:
                    example: Janssens
                    type: string
                server_url:
                    description: Its base URL.
                    format: uri
                    type: string
                subscribers:
                    description: 'Operator listing: frames there following families here.'
                    type: integer
            required:
                - server_url
                - server_name
            type: object
        RemoteSubscription:
            description: A frame on this server following a family on another server (B's side).
            properties:
                activated_at:
                    format: date-time
                    nullable: true
                    type: string
                backfill:
                    properties:
                        placed:
                            type: integer
                        state:
                            enum:
                                - idle
                                - running
                            type: string
                        total:
                            type: integer
                    type: object
                birthdays:
                    type: boolean
                cover_url:
                    format: uri
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                ended_at:
                    format: date-time
                    nullable: true
                    type: string
                feed_name:
                    type: string
                frame_id:
                    $ref: '#/components/schemas/Id'
                history:
                    $ref: '#/components/schemas/SubscriptionHistory'
                history_count:
                    nullable: true
                    type: integer
                id:
                    $ref: '#/components/schemas/Id'
                item_count:
                    description: Photos copied to this server and on the frame.
                    type: integer
                last_error:
                    nullable: true
                    type: string
                last_sync_at:
                    format: date-time
                    nullable: true
                    type: string
                on_end:
                    $ref: '#/components/schemas/RemoteOnEnd'
                removed_reason:
                    allOf:
                        - $ref: '#/components/schemas/RemoteEndReason'
                    nullable: true
                requested_by_name:
                    nullable: true
                    type: string
                server:
                    $ref: '#/components/schemas/RemoteServer'
                status:
                    description: '`pending` (A''s admins decide), `active`, `rejected`, `removed` (see `removed_reason`), or `error` (A unreachable or refusing for 3 days; retried).'
                    enum:
                        - pending
                        - active
                        - rejected
                        - removed
                        - error
                    type: string
            required:
                - id
                - frame_id
                - status
                - feed_name
                - server
                - history
                - on_end
                - created_at
            type: object
        RemoteSubscriptionCreate:
            properties:
                birthdays:
                    default: true
                    type: boolean
                history:
                    $ref: '#/components/schemas/SubscriptionHistory'
                history_count:
                    description: 'Required with `history: last_n`.'
                    maximum: 1000
                    minimum: 1
                    type: integer
                invite_url:
                    format: uri
                    maxLength: 2000
                    type: string
                on_end:
                    $ref: '#/components/schemas/RemoteOnEnd'
            required:
                - invite_url
            type: object
        RemoteSubscriptionEvent:
            description: '`remote_subscription.updated`: a frame''s follow of a family on another server changed status, synced or failed (the frame''s managers; README §5.22).'
            properties:
                frame_id:
                    $ref: '#/components/schemas/Id'
                remote_subscription:
                    $ref: '#/components/schemas/RemoteSubscription'
                type:
                    enum:
                        - remote_subscription.updated
                    type: string
            required:
                - type
                - frame_id
                - remote_subscription
            type: object
        RemoteSubscriptionUpdate:
            properties:
                birthdays:
                    type: boolean
                on_end:
                    $ref: '#/components/schemas/RemoteOnEnd'
            type: object
        ReplyPreset:
            enum:
                - beautiful
                - call_me
                - miss_you
                - thanks
            type: string
        Report:
            description: The reporter sees their own report (`mine`) without `excerpt`, `author` or `note` of others; handlers see everything except who reported.
            properties:
                author:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    description: Who wrote the reported content (handlers).
                    nullable: true
                conversation_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                created_at:
                    format: date-time
                    type: string
                excerpt:
                    description: The reported text as it was when reported (kept even if it was edited or deleted since), or a description of the media; handlers only.
                    nullable: true
                    type: string
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: Null when the operator handles it.
                    nullable: true
                id:
                    $ref: '#/components/schemas/Id'
                mine:
                    type: boolean
                note:
                    nullable: true
                    type: string
                post_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                reason:
                    $ref: '#/components/schemas/ReportReason'
                resolved_at:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    enum:
                        - open
                        - removed
                        - dismissed
                    type: string
                target_id:
                    $ref: '#/components/schemas/Id'
                target_kind:
                    $ref: '#/components/schemas/ReportTargetKind'
            required:
                - id
                - target_kind
                - target_id
                - reason
                - status
                - created_at
            type: object
        ReportCreate:
            properties:
                note:
                    maxLength: 500
                    type: string
                reason:
                    $ref: '#/components/schemas/ReportReason'
                target_id:
                    $ref: '#/components/schemas/Id'
                target_kind:
                    $ref: '#/components/schemas/ReportTargetKind'
            required:
                - target_kind
                - target_id
                - reason
            type: object
        ReportEvent:
            properties:
                report:
                    $ref: '#/components/schemas/Report'
                type:
                    enum:
                        - report.created
                    type: string
            required:
                - type
                - report
            type: object
        ReportReason:
            enum:
                - unkind
                - spam
                - inappropriate
                - other
            type: string
        ReportTargetKind:
            enum:
                - comment
                - message
                - post
            type: string
        Role:
            enum:
                - owner
                - admin
                - member
            type: string
        Screen:
            properties:
                density_dpi:
                    type: integer
                height:
                    example: 800
                    type: integer
                orientation:
                    enum:
                        - landscape
                        - portrait
                    type: string
                width:
                    example: 1280
                    type: integer
            required:
                - width
                - height
            type: object
        Send:
            properties:
                created_at:
                    format: date-time
                    type: string
                feeds:
                    description: The feeds this send was posted to, with receipts (docs/spec/feeds.md §7).
                    items:
                        $ref: '#/components/schemas/SendFeed'
                    type: array
                frames:
                    description: Per-frame delivery for this send (direct recipients and shares; feed placements are in `feeds`).
                    items:
                        properties:
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            frame_name:
                                type: string
                            online:
                                type: boolean
                            placements:
                                items:
                                    properties:
                                        item_id:
                                            $ref: '#/components/schemas/Id'
                                        placement_id:
                                            $ref: '#/components/schemas/Id'
                                        reaction:
                                            allOf:
                                                - $ref: '#/components/schemas/Reaction'
                                            nullable: true
                                        replies:
                                            items:
                                                $ref: '#/components/schemas/ReplyPreset'
                                            type: array
                                        shared_by_name:
                                            description: Set when another member shared this item to the frame.
                                            nullable: true
                                            type: string
                                        status:
                                            $ref: '#/components/schemas/PlacementStatus'
                                    required:
                                        - placement_id
                                        - item_id
                                        - status
                                    type: object
                                type: array
                        required:
                            - frame_id
                            - frame_name
                            - placements
                        type: object
                    type: array
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/Item'
                    type: array
                summary:
                    properties:
                        delivered:
                            type: integer
                        failed:
                            type: integer
                        pending:
                            type: integer
                        processing:
                            type: integer
                        seen:
                            type: integer
                    type: object
                via:
                    allOf:
                        - $ref: '#/components/schemas/ItemVia'
                    description: |
                        Set when a photo source or a Google Photos import made this send on the sender's behalf (one send per sync
                        run or import), when it came by mail (`service: email`, one send per mail), or from a connected Telegram
                        chat (`service: telegram`, one send per batch). Such sends get no `delivered` push, except Telegram sends by
                        a linked account (they are that person's own sends).
                    nullable: true
            required:
                - id
                - created_at
                - items
                - frames
            type: object
        SendCreate:
            description: |
                Recipients are `frame_ids` plus `feed_ids`; together they must not be empty (`422 validation_failed` on
                `frame_ids`). Feeds need membership (any role), frames need `send`. A frame that is a direct recipient and
                also subscribes to a feed in `feed_ids` gets the item once (docs/spec/feeds.md §6.2).
            properties:
                circle_ids:
                    description: |
                        The audience inside a feed: at most one circle per feed, its feed must be in `feed_ids`, and the caller must
                        be in the circle (`422 validation_failed`, field `circle_ids`). That feed's post is shared with the circle
                        only (README §5.18); other feeds get a whole-family post.
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 20
                    type: array
                feed_ids:
                    description: 'Feeds to post to. Each becomes one post; every active subscribed frame gets a placement (`origin: feed`). Needs role `poster` or above (`403 missing_permission` for `member`).'
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 20
                    type: array
                frame_ids:
                    description: Frames to send to directly. May be empty when `feed_ids` is not.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                items:
                    items:
                        properties:
                            caption:
                                maxLength: 280
                                nullable: true
                                type: string
                            captured_at:
                                description: |
                                    Capture time. Prepared uploads carry no metadata, so clients read it from the original (EXIF,
                                    QuickTime) and send it here. Used when the stored file has no capture time.
                                format: date-time
                                nullable: true
                                type: string
                            duration_ms:
                                description: Prepared videos only. Duration the client produced (±500 ms).
                                minimum: 1
                                type: integer
                            fit:
                                $ref: '#/components/schemas/Fit'
                            focal_point:
                                $ref: '#/components/schemas/FocalPoint'
                            framing:
                                $ref: '#/components/schemas/Framing'
                            height:
                                description: Prepared uploads only. Pixel height the client produced.
                                minimum: 1
                                type: integer
                            include_audio:
                                default: true
                                description: For a live item it applies to the motion clip, which is muted unless this is `true` explicitly.
                                type: boolean
                            live:
                                default: true
                                description: |
                                    `false` sends a Motion Photo (a JPEG/HEIC with an embedded video, detected by the server) as a
                                    still only. Without `live_video_upload_id`, the server splits such files itself.
                                type: boolean
                            live_video_upload_id:
                                description: |
                                    Makes this a Live Photo: the tus upload of its motion clip (MOV/MP4, at most 10 s; longer clips
                                    are cut). `upload_id` must be a photo and `trim` is not allowed. The clip may be a prepared
                                    `video-master-v1`.
                                type: string
                            trim:
                                description: Videos only. The selected part must be at least 3 seconds long (unless the whole video is shorter).
                                properties:
                                    end_ms:
                                        minimum: 1
                                        type: integer
                                    start_ms:
                                        minimum: 0
                                        type: integer
                                type: object
                            upload_id:
                                description: tus upload id, or an existing item id when the server reported a duplicate. For a live item, the still.
                                type: string
                            width:
                                description: Prepared uploads only. Pixel width the client produced; a mismatch makes the server take the normal pipeline.
                                minimum: 1
                                type: integer
                        required:
                            - upload_id
                        type: object
                    minItems: 1
                    type: array
                prompt_id:
                    description: Tag the feed posts as answers to this weekly prompt (`FeedPrompt.id`, current or previous week); only the post in that prompt's feed is tagged.
                    format: uuid
                    type: string
            required:
                - frame_ids
                - items
            type: object
        SendFeed:
            description: One feed a send was posted to.
            properties:
                feed_id:
                    $ref: '#/components/schemas/Id'
                feed_name:
                    type: string
                post_id:
                    $ref: '#/components/schemas/Id'
                removed:
                    description: The post was removed from the feed (unsend or admin).
                    type: boolean
                summary:
                    $ref: '#/components/schemas/FeedReceiptSummary'
            required:
                - feed_id
                - feed_name
                - post_id
            type: object
        ShareResult:
            properties:
                placements:
                    description: The placements created on the target frames (empty for a dry run).
                    items:
                        $ref: '#/components/schemas/Placement'
                    type: array
                skipped:
                    description: Source placement × target frame pairs that were not shared.
                    items:
                        properties:
                            existing_placement_id:
                                $ref: '#/components/schemas/Id'
                            frame_id:
                                $ref: '#/components/schemas/Id'
                            placement_id:
                                $ref: '#/components/schemas/Id'
                            reason:
                                enum:
                                    - already_on_frame
                                type: string
                        required:
                            - placement_id
                            - frame_id
                            - reason
                        type: object
                    type: array
            required:
                - placements
                - skipped
            type: object
        Shop:
            description: |
                Pre-order shop run by the server operator (README §5.11). Present only when the operator configured one
                (KINFRAME_SHOP_FILE). Prices include VAT. Localized texts are maps from a language code (see docs/i18n.md)
                to text; `en` is always present and is the fallback.
            properties:
                brand:
                    description: Consumer-facing brand name, e.g. in "Get a {brand}". Defaults to the server name.
                    example: kinframe
                    type: string
                checkout:
                    default: false
                    description: |
                        True when orders are paid online: `createShopReservation` then needs the delivery address and answers
                        with a `checkout_url` to send the customer to. False: reservations without payment.
                    type: boolean
                currency:
                    description: ISO 4217
                    example: EUR
                    type: string
                default_locale:
                    description: |
                        Storefront language for visitors whose browser prefers none of `en`, `nl`, `fr`, `de` (the languages
                        the shop emails in). Defaults to `en`.
                    example: nl
                    type: string
                diy:
                    $ref: '#/components/schemas/ShopDiy'
                domains:
                    description: |
                        Storefront host names (no scheme or port). On these hosts the web app is the brand's shop: landing page,
                        `/shop`, `/shop/cancel`, `/shop/order` and `/shop/terms`, calling the API on its own origin; every other path goes to `web`, where
                        sign-in and the family app live. Absent when the operator configured none.
                    example:
                        - shop.example.org
                    items:
                        type: string
                    type: array
                elsewhere:
                    description: |
                        Retailers selling a frame the convert tool supports. Links for countries outside `shipping.countries`
                        are shown to visitors elsewhere ("Outside Belgium?"); links that list a shipping country are shown to
                        visitors from that country in the "buy it yourself and convert it" section. The links may be affiliate
                        links (shown with a disclosure). Absent when the operator configured none.
                    items:
                        $ref: '#/components/schemas/ShopElsewhereLink'
                    type: array
                estimated_delivery:
                    $ref: '#/components/schemas/LocalizedText'
                notice:
                    allOf:
                        - $ref: '#/components/schemas/LocalizedText'
                    description: |
                        A notice shown prominently at the top of the storefront and the shop page, above the products (e.g.
                        "we resell converted frames"). Plain text, no HTML; a blank line starts a new paragraph. Absent when
                        the operator configured none.
                products:
                    items:
                        $ref: '#/components/schemas/ShopProduct'
                    type: array
                seller:
                    properties:
                        address:
                            description: Seller's address (terms of sale).
                            type: string
                        email:
                            format: email
                            type: string
                        legal:
                            description: Legal line for the footer, e.g. company, address and VAT number.
                            type: string
                        name:
                            type: string
                        phone:
                            type: string
                        privacy_url:
                            format: uri
                            type: string
                        terms_url:
                            description: Terms of sale; absent = the web app's own page `/shop/terms`.
                            format: uri
                            type: string
                        vat_number:
                            type: string
                    required:
                        - name
                        - email
                    type: object
                shipping:
                    $ref: '#/components/schemas/ShopShipping'
                stock:
                    description: |
                        Shops with stock management: the dispatch day of an order placed now, when every item is in stock
                        (the next business day) and when one is not. Business days are Belgian working days.
                    properties:
                        ships_in_stock:
                            format: date
                            type: string
                        ships_out_of_stock:
                            format: date
                            type: string
                    required:
                        - ships_in_stock
                        - ships_out_of_stock
                    type: object
                vat_percent:
                    description: VAT included in all prices
                    example: 21
                    type: number
            required:
                - brand
                - currency
                - vat_percent
                - products
                - shipping
                - seller
            type: object
        ShopDiy:
            description: |
                Title and text of the "buy it yourself and convert it" section, shown to visitors in a shipping country when
                `elsewhere` has links for that country. Plain text; a blank line in `body` starts a new paragraph. Either may
                be absent; the web app then uses its own texts.
            properties:
                body:
                    $ref: '#/components/schemas/LocalizedText'
                title:
                    $ref: '#/components/schemas/LocalizedText'
            type: object
        ShopElsewhereLink:
            description: A retailer selling a frame the convert tool supports, for visitors from some countries.
            properties:
                affiliate:
                    default: false
                    description: True for an affiliate link; the web app then shows a disclosure.
                    type: boolean
                countries:
                    description: ISO 3166-1 alpha-2 codes; `*` means every other country.
                    example:
                        - NL
                    items:
                        type: string
                    type: array
                product:
                    description: The frame model.
                    example: Denver PFF-1024
                    type: string
                retailer:
                    example: bol.com
                    type: string
                secondary:
                    default: false
                    description: True for an alternative shown as a small text link ("Also at bol.com") below the main links.
                    type: boolean
                url:
                    format: uri
                    type: string
            required:
                - countries
                - retailer
                - product
                - url
            type: object
        ShopLine:
            properties:
                line_cents:
                    type: integer
                name:
                    type: string
                product_id:
                    type: string
                quantity:
                    type: integer
                unit_cents:
                    type: integer
            required:
                - product_id
                - name
                - quantity
                - unit_cents
                - line_cents
            type: object
        ShopPaymentStatus:
            description: The payment at the provider (shops with `checkout`); `paid` confirms the order.
            enum:
                - open
                - pending
                - authorized
                - paid
                - failed
                - canceled
                - expired
            type: string
        ShopProduct:
            properties:
                id:
                    example: frame-10
                    type: string
                image:
                    description: 'Illustration key: frame-10 or frame-15'
                    example: frame-10
                    type: string
                in_stock:
                    description: 'Shops with `stock`: frames ready to ship, at most `max_qty` (the real count is not shown).'
                    minimum: 0
                    type: integer
                max_qty:
                    minimum: 1
                    type: integer
                name:
                    example: kinframe 10.1"
                    type: string
                photos:
                    description: |
                        Product photos, the first one leading: paths on the API origin (`/v1/shop/media/{name}`, public, cached
                        for a day). Absent = show the `image` illustration.
                    items:
                        type: string
                    type: array
                price_cents:
                    description: Unit price incl. VAT, in cents
                    type: integer
                size:
                    description: Screen size label
                    example: 10.1"
                    type: string
