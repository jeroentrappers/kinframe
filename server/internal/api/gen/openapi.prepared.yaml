            operationId: getItemMedia
            parameters:
                - $ref: '#/components/parameters/ItemId'
                - description: '`motion` is the master of a Live/Motion Photo clip (`item.kind: live`).'
                  in: path
                  name: variant
                  required: true
                  schema:
                    enum:
                        - thumb_256
                        - thumb_512
                        - master
                        - poster
                        - motion
                    type: string
            responses:
                "302":
                    description: Redirect to signed media URL
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
    /v1/me:
        delete:
            description: Deletes the kinframe user. The Logto account is deleted separately via Logto's account API.
            operationId: deleteMe
            parameters:
                - description: Also remove everything this user sent from all frames.
                  in: query
                  name: remove_items
                  required: true
                  schema:
                    type: boolean
            responses:
                "204":
                    description: Deleted
                "409":
                    $ref: '#/components/responses/Problem'
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
        get:
            operationId: getMe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Current user
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
        patch:
            operationId: updateMe
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                display_name:
                                    maxLength: 40
                                    minLength: 1
                                    type: string
                                locale:
                                    example: nl-BE
                                    type: string
                                share_location_names:
                                    type: boolean
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/avatar:
        delete:
            operationId: deleteAvatar
            responses:
                "204":
                    description: Removed
            tags:
                - me
        put:
            operationId: putAvatar
            requestBody:
                content:
                    image/jpeg:
                        schema:
                            format: binary
                            type: string
                    image/png:
                        schema:
                            format: binary
                            type: string
                    image/webp:
                        schema:
                            format: binary
                            type: string
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Stored (server crops to 256x256)
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/push-endpoints:
        get:
            operationId: listPushEndpoints
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PushEndpoint'
                                type: array
                    description: Registered endpoints
            tags:
                - me
        post:
            description: Idempotent on (kind, endpoint).
            operationId: registerPushEndpoint
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PushEndpointCreate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PushEndpoint'
                    description: Registered
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - me
    /v1/me/push-endpoints/{endpointId}:
        delete:
            operationId: deletePushEndpoint
            parameters:
                - $ref: '#/components/parameters/EndpointId'
            responses:
                "204":
                    description: Removed
            tags:
                - me
    /v1/operator/limits:
        get:
            operationId: operatorGetLimits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Limits'
                    description: Limits
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
        put:
            operationId: operatorSetLimits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Limits'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Limits'
                    description: Updated
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/reservations:
        get:
            description: Shop reservations, newest first. `404 not_found` when the server has no shop.
            operationId: operatorListReservations
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ShopReservationStatus'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    reservations:
                                        items:
                                            $ref: '#/components/schemas/ShopReservation'
                                        type: array
                                required:
                                    - reservations
                                type: object
                    description: Reservations
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/reservations.csv:
        get:
            description: All reservations as CSV (UTF-8 with BOM, comma-separated), newest first; `status` filters.
            operationId: operatorExportReservations
            parameters:
                - in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/ShopReservationStatus'
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                type: string
                    description: CSV export
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/reservations/{reservationId}:
        patch:
            operationId: operatorUpdateReservation
            parameters:
                - in: path
                  name: reservationId
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                internal_note:
                                    description: Only for the operator; never emailed.
                                    maxLength: 2000
                                    nullable: true
                                    type: string
                                status:
                                    $ref: '#/components/schemas/ShopReservationStatus'
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShopReservation'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/operator/stats:
        get:
            operationId: operatorStats
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    frames:
                                        type: integer
                                    frames_online:
                                        type: integer
                                    items:
                                        type: integer
                                    media_pipeline:
                                        description: |
                                            How masters were made (README §5.3 "Prepared uploads"): `transcoded` by the full pipeline,
                                            `prepared` (a client master verified and kept without re-encoding), `fallback` (a prepared
                                            upload that did not conform and was transcoded). `reused_renditions` counts frame video
                                            renditions served from the master's bytes instead of a transcode.
                                        properties:
                                            fallback:
                                                type: integer
                                            prepared:
                                                type: integer
                                            reused_renditions:
                                                type: integer
                                            transcoded:
                                                type: integer
                                        type: object
                                    processing_queue:
                                        type: integer
                                    storage_bytes:
                                        type: integer
                                    users:
                                        type: integer
                                type: object
                    description: Server statistics
            security:
                - userAuth:
                    - kinframe:operate
            tags:
                - operator
    /v1/sends:
        get:
            description: The caller's sent history across all devices, newest first.
            operationId: listMySends
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - in: query
                  name: state
                  schema:
                    default: all
                    enum:
                        - ongoing
                        - delivered
                        - all
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    next_cursor:
                                        nullable: true
                                        type: string
                                    sends:
                                        items:
                                            $ref: '#/components/schemas/Send'
                                        type: array
                                required:
                                    - sends
                                    - next_cursor
                                type: object
                    description: Page of sends
            tags:
                - sends
        post:
            operationId: createSend
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendCreate'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Accepted; processing
                "400":
                    $ref: '#/components/responses/Problem'
                "403":
                    $ref: '#/components/responses/Problem'
                "422":
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
    /v1/sends/{sendId}:
        delete:
            description: Removes all placements of this send from all frames (sender only). Never needs a frame to be online.
            operationId: unsend
            responses:
                "204":
                    description: Unsent
            tags:
                - sends
        get:
            operationId: getSend
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Send with per-frame placement status
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
        parameters:
            - in: path
              name: sendId
              required: true
              schema:
                $ref: '#/components/schemas/Id'
    /v1/sends/{sendId}/forward:
        post:
            description: |
                Place the same items on additional frames. Uses the same path as `sharePlacements`: no new upload or master,
                renditions only for screen sizes that have none yet, and frames that already hold an item are skipped.
            operationId: forwardSend
            parameters:
                - in: path
                  name: sendId
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                frame_ids:
                                    items:
                                        $ref: '#/components/schemas/Id'
                                    minItems: 1
                                    type: array
                            required:
                                - frame_ids
                            type: object
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Send'
                    description: Accepted
            tags:
                - sends
    /v1/shop/reservations:
        post:
            description: |
                Pre-order reservation for a frame sold by the server operator. No sign-in and no payment: the customer is
                emailed when stock is in. Only on servers with a shop (discovery `shop`); `404 not_found` otherwise.
                Prices and totals are recomputed by the server from its own configuration; the client never sends prices.
                Rate limited per IP (`429 rate_limited`). `website` is a honeypot that people never fill in: when it is
                not empty the server answers as usual but stores and sends nothing. Field errors (`422`) use these fields
                and codes: `email`/`format`, `country`/`enum`, `items`/`minItems`, `items.<i>.product_id`/`enum`,
                `items.<i>.quantity`/`maximum`, `consent`/`required`.
            operationId: createShopReservation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ShopReservationCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShopReservationReceipt'
                    description: Reserved
                default:
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - shop
    /v1/shop/reservations/cancel:
        post:
            description: |
                Cancels a reservation with the signed token from the link in the confirmation email (the web page
                `/shop/cancel?token=…` asks for a confirmation and then calls this). Idempotent. `404 not_found` for an
                invalid token or a deleted reservation.
            operationId: cancelShopReservation
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                token:
                                    maxLength: 200
                                    minLength: 10
                                    type: string
                            required:
                                - token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    reference:
                                        example: KF-7Q3M
                                        type: string
                                    status:
                                        $ref: '#/components/schemas/ShopReservationStatus'
                                required:
                                    - reference
                                    - status
                                type: object
                    description: Cancelled
                default:
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - shop
    /v1/tv/{token}:
        get:
            description: |
                No sign-in: the token is the credential. Returns the slides with absolute, signed media URLs (master
                rendition: WebP photos, H.264/AAC MP4 videos) that a TV or Chromecast can fetch without headers. The URLs
                expire after 1-2 h; refetch after `refresh_after`. `404 not_found` for unknown or revoked tokens,
                `410 link_expired` once the link has expired.
            operationId: getTvSlideshow
            parameters:
                - in: path
                  name: token
                  required: true
                  schema:
                    maxLength: 64
                    minLength: 22
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TvSlideshow'
                    description: Slideshow
                default:
                    $ref: '#/components/responses/Problem'
            security: []
            tags:
                - tv
    /v1/uploads:
        post:
            description: |
                tus 1.0 creation endpoint (also HEAD/PATCH/DELETE on /v1/uploads/{uploadId}). See README §5.3.
                Upload-Metadata keys: filename, filetype, sha256 (optional), prepared (optional: `photo-master-v1` or
                `video-master-v1` when the client already produced a master; the server verifies it, see README §5.3
                "Prepared uploads").
            operationId: tusCreateUpload
            parameters:
                - in: header
                  name: Tus-Resumable
                  required: true
                  schema:
                    type: string
                - in: header
                  name: Upload-Length
                  required: true
                  schema:
                    type: integer
                - in: header
                  name: Upload-Metadata
                  required: true
                  schema:
                    type: string
            responses:
                "201":
                    description: Created; Location header holds the upload URL. If sha256 matches an existing item of the caller, `Kinframe-Existing-Item` header carries its id and the client may skip uploading.
                "413":
                    $ref: '#/components/responses/Problem'
            tags:
                - sends
security:
    - userAuth: []
servers:
    - description: Default hosted server
      url: https://kinframe.appmire.be
    - description: Local development
      url: http://localhost:8110
tags:
    - name: discovery
    - name: me
    - name: frames
    - name: members
    - name: invites
    - name: sends
    - name: library
    - name: albums
    - name: settings
    - description: Show a frame's library on a TV (Google Cast, Presentation API or a full-screen TV page).
      name: tv
    - description: Place search and weather. Data by Open-Meteo.com (CC BY 4.0), fetched and cached by the server.
      name: weather
    - description: Calendars synced by the server (ICS/webcal, CalDAV), events sent to frames, and countdowns.
      name: calendar
    - description: Frame enrollment and token exchange (unauthenticated or secret-based).
      name: devices
    - description: Endpoints called by the frame itself (device token).
      name: device
    - description: Public frame app releases, for installing kinframe on a frame (the website's convert tool).
      name: frame-app
    - description: Pre-order reservations for frames sold by the server operator (only when configured).
      name: shop
    - name: operator
    - description: Development-only helpers; absent in production.
      name: dev
