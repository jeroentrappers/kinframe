                    enum:
                        - keep_request.updated
                    type: string
            required:
                - type
                - request
            type: object
        KeepRequestList:
            properties:
                requests:
                    items:
                        $ref: '#/components/schemas/KeepRequest'
                    type: array
            required:
                - requests
            type: object
        KeepRequestStatus:
