                    pattern: ^[0-9]{2}-[0-9]{2}$
                    type: string
                - in: query
                  name: sort
                  schema:
                    default: received_desc
                    enum:
                        - received_desc
                        - received_asc
                        - taken_desc
                        - taken_asc
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    counts:
                                        properties:
                                            hidden:
                                                type: integer
                                            photos:
                                                type: integer
                                            trashed:
                                                type: integer
                                            videos:
                                                type: integer
                                        type: object
                                    next_cursor:
