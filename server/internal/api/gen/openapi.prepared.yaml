                    nullable: true
                    type: string
                name:
                    type: string
                needs_update:
                    type: boolean
                now_showing:
                    allOf:
                        - $ref: '#/components/schemas/FrameNowShowing'
                    description: |
                        The photo for the frame card (README §5.5, "Frame cards"): while the frame is connected, the slide its
                        screen reports (`source: screen`, the device websocket's `now_showing`); otherwise its most recently placed
                        visible item (`source: last_placed`). Absent (null) when there is neither, and when the caller can't see
                        the library (`see_library`).
                    nullable: true
                online:
                    type: boolean
                owner_name:
                    type: string
                permissions:
                    $ref: '#/components/schemas/Permissions'
                photo_request:
                    allOf:
                        - $ref: '#/components/schemas/PhotoRequest'
                    description: 'The frame''s "Ask for new photos": the open one, or one answered in the last 24 hours; null otherwise.'
                    nullable: true
                reactions_today:
                    $ref: '#/components/schemas/FrameReactionsToday'
                    description: Reactions and quick replies sent from the frame today (README §5.5, "Frame cards"); absent when the caller can't see the library (`see_library`).
                remote_help:
                    allOf:
                        - $ref: '#/components/schemas/FrameRemoteHelpSummary'
                    description: The frame's active remote help session (README §5.23), or null. Frame lists show a badge, the frame page a banner.
                    nullable: true
                role:
                    $ref: '#/components/schemas/Role'
                screen:
                    $ref: '#/components/schemas/Screen'
            required:
                - id
                - name
                - role
                - permissions
                - online
            type: object
        FrameUpdate:
            description: A frame app release mirrored by the server.
            properties:
                min_sdk:
                    example: 23
                    type: integer
                prerelease:
                    description: True for beta releases.
                    type: boolean
                published_at:
                    format: date-time
                    type: string
                release_notes:
                    nullable: true
                    type: string
                sha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                size:
                    description: bytes
                    type: integer
                url:
                    description: 'Where to download the APK on this server: `/v1/device/update/apk/{version_code}` (frames) or `/v1/frame-app/apk/{version_code}` (public).'
                    format: uri
                    type: string
                version_code:
                    example: 20099
                    type: integer
                version_name:
                    example: 0.2.0
                    type: string
            required:
                - version_name
                - version_code
                - min_sdk
                - url
                - sha256
                - size
                - published_at
            type: object
        Framing:
            description: |
                Zoom and position per screen orientation, for photos shown in fill mode (docs/spec/framing.md). A screen uses
                `landscape` when its width is at least its height, else `portrait`; a missing view means the focal point at 1×.
            properties:
                landscape:
                    $ref: '#/components/schemas/FramingView'
                portrait:
                    $ref: '#/components/schemas/FramingView'
            type: object
        FramingView:
            description: The centre of the visible part (0..1 of the master, from top-left) and the zoom over the cover crop.
            properties:
                x:
                    maximum: 1
                    minimum: 0
                    type: number
                "y":
                    maximum: 1
                    minimum: 0
                    type: number
                zoom:
                    maximum: 4
                    minimum: 1
                    type: number
            required:
                - x
                - "y"
                - zoom
            type: object
        Freshness:
            description: |
                How recently a frame (or family) got new photos from people (README §5.20). The ring: `level` from 1 (shared
                today) down to 0 (14 days or more). Words, not numbers: `fresh` "Fresh", `recent` "4 days", `quiet`
                "2 weeks quiet", `never` "No photos yet".
            properties:
                days_quiet:
                    description: Whole days since the last personal photo (null = never).
                    nullable: true
                    type: integer
                last_shared_at:
                    format: date-time
                    nullable: true
                    type: string
                last_shared_by:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    nullable: true
                level:
                    maximum: 1
                    minimum: 0
                    type: number
                state:
                    enum:
                        - fresh
                        - recent
                        - quiet
                        - never
                    type: string
            required:
                - state
                - level
            type: object
        GoogleImport:
            properties:
                auth_url:
                    description: '`needs_auth` only: Google''s consent page, to open in a browser session (never an embedded web view).'
                    format: uri
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_code:
                    allOf:
                        - $ref: '#/components/schemas/GoogleImportErrorCode'
                    nullable: true
                finished_at:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                picker_expires_at:
                    format: date-time
                    nullable: true
                    type: string
                picker_uri:
                    description: '`picking` only: Google''s picker. Web clients append `/autoclose`; on Android the Google Photos app can handle it.'
                    format: uri
                    nullable: true
                    type: string
                progress:
                    properties:
                        bytes:
                            type: integer
                        duplicates:
                            description: Already in the album or feed.
                            type: integer
                        failed:
                            type: integer
                        imported:
                            type: integer
                        picked:
                            type: integer
                        skipped:
                            description: Too long, too large or unsupported.
                            type: integer
                    required:
                        - picked
                        - imported
                    type: object
                send_ids:
                    description: The sends (and thus posts) the import made; unsend them to undo.
                    items:
                        $ref: '#/components/schemas/Id'
                    type: array
                status:
                    $ref: '#/components/schemas/GoogleImportStatus'
                target:
                    $ref: '#/components/schemas/PhotoSourceTarget'
                updated_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - status
                - target
                - progress
                - created_at
            type: object
        GoogleImportCreate:
            description: Exactly one of `album_id` or `feed_id`.
            properties:
                album_id:
                    $ref: '#/components/schemas/Id'
                feed_id:
                    $ref: '#/components/schemas/Id'
                return_uri:
                    description: Where the browser goes after consent, with `?import_id=…&status=…` added.
                    example: app.kinframe:/google-import
                    maxLength: 512
                    type: string
            required:
                - return_uri
            type: object
        GoogleImportErrorCode:
            enum:
                - consent_denied
                - auth_failed
                - picker_expired
                - google_unavailable
                - target_gone
                - download_failed
                - server_error
            type: string
        GoogleImportStatus:
            description: |
                `needs_auth`: open `auth_url`. `picking`: open `picker_uri`; the server waits for Google. `importing`: copying
                (`progress`). `done` (possibly with `progress.failed` > 0), `failed` (`error_code`), `expired` (nothing picked
                before Google's session ended) and `cancelled` are final.
            enum:
                - needs_auth
                - picking
                - importing
                - done
                - failed
                - cancelled
                - expired
            type: string
        Heartbeat:
            properties:
                android_sdk:
                    type: integer
                app_version:
                    type: string
                app_version_code:
                    type: integer
                cache_bytes:
                    type: integer
                crash_count_24h:
                    type: integer
                features:
                    description: |
                        Optional capabilities of the frame app. `feed_backfill`: the frame shows `Placement.backfill` placements
                        quietly (no "N new" card, no wake). Until a frame's latest heartbeat lists it, the server withholds
                        backfilled feed placements from its change feed and emits them once it does. `birthdays`: the frame shows
                        the `birthdays` change (informational only: nothing is withheld; apps use it for
                        `Subscription.frame.birthdays_supported`). `play`: informational, the frame app is the Google Play build
                        (docs/play-frame.md): it updates through Google Play rather than from `GET /device/update`, and has no root.
                        `comments`, `photo_requests`, `prompts`: informational (README §5.20); the frame shows the `comments` change,
                        has the "Ask for new photos" button, and shows prompt title cards. Apps use them to say "update the frame
                        app"; nothing is withheld.
                        `remote_help`: the frame can join the operator's tailnet for remote help (the GitHub build on a rooted
                        frame, docs/spec/remote-help.md §5.4); only such frames can get a session.
                    items:
                        type: string
                    type: array
                last_shutdown_clean:
                    type: boolean
                last_update_error:
                    description: 'Short machine-readable reason, e.g. `sha256_mismatch`, `signature_mismatch`, `install_failed: ...`, `crash_loop 20199`'
                    nullable: true
                    type: string
                local_time:
                    format: date-time
                    type: string
                placements_cached:
                    type: integer
                placements_evicted:
                    description: Renditions the frame removed from its cache to free space (least recently shown first); it downloads them again before they show.
                    type: integer
                placements_missing:
                    type: integer
                remote_help:
                    $ref: '#/components/schemas/HeartbeatRemoteHelp'
                screen_state:
                    enum:
                        - "on"
                        - "off"
                        - dimmed
                        - sleeping
                    type: string
                serial:
                    description: 'The device serial (as `adb devices` shows it), sent only by frames that list `remote_help`: the server names the tailnet host `kinframe-<serial>` after it (docs/spec/remote-help.md §5.2).'
                    example: "36339301"
                    maxLength: 64
                    nullable: true
                    type: string
                storage_free_bytes:
                    type: integer
                storage_state:
                    description: '`low`: below the frame''s low-water mark, evicting. `critical`: nearly full with nothing left to evict.'
                    enum:
                        - ok
                        - low
                        - critical
                    type: string
                storage_total_bytes:
                    type: integer
                timezone:
                    example: Europe/Brussels
                    type: string
                update_state:
                    description: |
                        Self-update state (README §5.7). `idle`: nothing pending. `downloading`, `installing`: in progress.
                        `waiting`: downloaded, waiting for the frame to be idle. `needs_user`: no root, the system installer is
                        showing. `updated`: the last update succeeded. `failed`: the last attempt failed (see
                        `last_update_error`). `rolled_back`: the new version crash-looped and the previous one was reinstalled.
                    enum:
                        - idle
                        - downloading
                        - waiting
                        - installing
                        - needs_user
                        - updated
                        - failed
                        - rolled_back
                    type: string
                uptime_s:
                    type: integer
                wifi_link_mbps:
                    nullable: true
                    type: integer
                wifi_rssi_dbm:
                    nullable: true
                    type: integer
                wifi_ssid:
                    nullable: true
                    type: string
            required:
                - app_version
                - uptime_s
            type: object
        HeartbeatRemoteHelp:
            description: |
                The frame's remote help state (docs/spec/remote-help.md §5.4). The first heartbeat with `on` or `failed` for
                the active session clears the stored pre-auth key; `on` stores `ip` for the operator, `failed` ends the
                session (`ended_by: failed`, with `error` in the log), `off` for a session the server still has active ends
                it like `deviceStopRemoteHelp` (`ended_by: frame`). Heartbeats for another session id are ignored.
            properties:
                error:
                    maxLength: 500
                    nullable: true
                    type: string
                ip:
                    example: 100.64.0.9
                    nullable: true
                    type: string
                session_id:
                    $ref: '#/components/schemas/Id'
                state:
                    enum:
                        - starting
                        - "on"
                        - failed
                        - "off"
                    type: string
            required:
                - session_id
                - state
            type: object
        Id:
            description: UUIDv7
            format: uuid
            type: string
        ImmichAlbum:
            properties:
                asset_count:
                    type: integer
                id:
                    type: string
                name:
                    type: string
                owner_name:
                    nullable: true
                    type: string
                shared:
                    description: Shared with the key's account by someone else.
                    type: boolean
                thumbnail_url:
                    description: A short-lived kinframe URL of the album thumbnail (proxied; the key never reaches the client).
                    format: uri
                    nullable: true
                    type: string
                updated_at:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - name
                - asset_count
            type: object
        ImmichAlbumList:
            properties:
                albums:
                    description: Own albums first, then shared ones, by name.
                    items:
                        $ref: '#/components/schemas/ImmichAlbum'
                    type: array
                error:
                    nullable: true
                    type: string
                error_code:
                    allOf:
                        - $ref: '#/components/schemas/PhotoSourceErrorCode'
                    nullable: true
                ok:
                    type: boolean
                server_version:
                    nullable: true
                    type: string
            required:
                - ok
                - albums
            type: object
        ImmichConnection:
            properties:
                api_key:
                    maxLength: 200
                    minLength: 8
                    type: string
                    writeOnly: true
                server_url:
                    maxLength: 2048
                    minLength: 8
                    type: string
            required:
                - server_url
                - api_key
            type: object
        Invite:
            properties:
                created_by_name:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                max_uses:
                    nullable: true
                    type: integer
                note:
                    nullable: true
                    type: string
                token:
                    type: string
                url:
                    format: uri
                    type: string
                uses:
                    type: integer
            required:
                - id
                - token
                - url
                - expires_at
            type: object
        InvitePreview:
            properties:
                already_member:
                    type: boolean
                frame_location:
                    nullable: true
                    type: string
                frame_name:
                    type: string
                invited_by_name:
                    type: string
                owner_name:
                    type: string
                requires_approval:
                    type: boolean
            required:
                - frame_name
                - invited_by_name
                - requires_approval
            type: object
        Item:
            properties:
                caption:
                    nullable: true
                    type: string
                caption_edited:
                    type: boolean
                captured_at:
                    format: date-time
                    nullable: true
                    type: string
                created_at:
                    format: date-time
                    type: string
                display_url:
                    description: |
                        The display rendition (README §5.3): the uncropped photo (for videos: the poster frame) as WebP, long edge
                        ≤1600 px, never upscaled. For large images such as feed post photos; clients crop or fit it to their
                        layout. Short-lived signed URL (about 1 h, like `thumb_url`). Absent until the server made it (older items
                        until the display backfill reached them); fall back to `thumb_url` then.
                    format: uri
                    type: string
                duration_ms:
                    nullable: true
                    type: integer
                failure_code:
                    nullable: true
                    type: string
                fit:
                    $ref: '#/components/schemas/Fit'
                focal_point:
                    $ref: '#/components/schemas/FocalPoint'
                former_sender_name:
                    description: |
                        Handed over when its sender deleted their account with "Leave my photos to the families" (README §5.21):
                        `sender_id` is now the new owner; show "<former_sender_name> (former member)" as the credit.
                    nullable: true
                    type: string
                framing:
                    allOf:
                        - $ref: '#/components/schemas/Framing'
                    nullable: true
                has_audio:
                    nullable: true
                    type: boolean
                height:
                    type: integer
                id:
                    $ref: '#/components/schemas/Id'
                imported_from:
                    allOf:
                        - $ref: '#/components/schemas/ItemOrigin'
                    description: |
                        Set on items a frame imported from another app's leftover data (docs/spec/frameo-import.md). The sender is
                        then the frame; clients show `imported_sender_name` instead, e.g. "Anna · via Frameo".
                    nullable: true
                imported_sender_name:
                    description: The original sender's display name in that app, when known.
                    nullable: true
                    type: string
                kind:
                    $ref: '#/components/schemas/MediaKind'
                motion:
                    allOf:
                        - $ref: '#/components/schemas/ItemMotion'
                    description: |
                        Live items only: the motion clip. `GET /v1/items/{id}/media/motion` streams its master once `status` is
                        `ready`. If the clip fails, the item stays a plain photo (`kind: photo`, no `motion`).
                    nullable: true
                place_name:
                    nullable: true
                    type: string
                remote_sender:
                    allOf:
                        - $ref: '#/components/schemas/ItemRemoteSender'
                    description: Copied from a family on another server (README §5.22); show `remote_sender.name` instead of a local person.
                    nullable: true
                sender_id:
                    $ref: '#/components/schemas/Id'
                sender_name:
                    type: string
                status:
                    enum:
                        - processing
                        - ready
                        - failed
                    type: string
                thumb_url:
                    description: |
                        The 256 px square (centre-cropped) thumbnail, for small tiles and lists. Short-lived signed URL (about 1 h)
                        usable directly in <img src> without an Authorization header.
                    format: uri
                    nullable: true
                    type: string
                via:
                    allOf:
                        - $ref: '#/components/schemas/ItemVia'
                    description: |
                        Set on items a photo source synced or a Google Photos import copied (docs/spec/photo-sources.md §9.5), or
                        that were mailed to an inbox address (`service: email`, docs/spec/email-inbox.md §9) or posted in a
                        connected Telegram chat (`service: telegram`, docs/spec/telegram.md §8). The sender is the account that set
                        it up (for mail and Telegram: the matched or linked account, or the address's or chat's owner); clients and
                        frames show "Anna via Immich" ("Anna · Feed via Immich" for feed placements), or "Jan via email" / "Jan via
                        Telegram". Optional: clients that don't know it show the sender only.
                    nullable: true
                width:
                    type: integer
            required:
                - id
                - kind
                - status
                - sender_id
                - created_at
            type: object
        ItemMotion:
            properties:
                duration_ms:
                    nullable: true
                    type: integer
                has_audio:
                    nullable: true
                    type: boolean
                height:
                    nullable: true
                    type: integer
                status:
                    enum:
                        - processing
                        - ready
                    type: string
                width:
                    nullable: true
                    type: integer
            required:
                - status
            type: object
        ItemOrigin:
            description: An app a frame can import leftover photos from.
            enum:
                - frameo
            type: string
        ItemRemoteSender:
            description: '`Item.remote_sender`: copied from another server; `sender_id` is then the remote sender record''s id.'
            properties:
                name:
                    type: string
                server_name:
                    type: string
                server_url:
                    format: uri
                    type: string
            required:
                - name
                - server_name
                - server_url
            type: object
        ItemVia:
            properties:
                address_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: '`email`: the inbox address it was mailed to, while it exists.'
                    nullable: true
                label:
                    description: |
                        Photo services: the service name to show, not translated ("Immich", "iCloud", "Google Photos"); frames show
                        "<sender> via <label>". `email`, `telegram`: the name of the person who mailed or posted it ("Jan"; for
                        Telegram the linked account's display name, else the Telegram display name); frames show "<label> via
                        email" / "<label> via Telegram" (localized) **instead of** the sender's name, since the sender may be the
                        address's or chat's owner sending on Jan's behalf.
                    example: Immich
                    type: string
                service:
                    $ref: '#/components/schemas/PhotoService'
                source_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: The photo source that synced it, while it exists (null for Google imports and deleted sources).
                    nullable: true
                telegram_chat_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    description: '`telegram`: the Telegram chat it was posted in (`TelegramChat`), while it exists.'
                    nullable: true
            required:
                - service
                - label
            type: object
        JoinRequest:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                invited_by_name:
                    nullable: true
                    type: string
                note:
                    nullable: true
                    type: string
                user:
                    properties:
                        avatar_url:
                            nullable: true
                            type: string
                        display_name:
                            type: string
                        id:
                            $ref: '#/components/schemas/Id'
                    type: object
                via:
                    description: |
                        How the request came. `frame_code`, `invite`: as before. Outside channels (one enum value each, later channels
                        add only a value): `email`, from the join link in a reply to someone who mailed photos
                        (docs/spec/email-inbox.md §10.4); `telegram`, from the join link the bot gave a Telegram group member in a
                        private chat (docs/spec/telegram.md §10.3). Channel requests always need approval.
                    enum:
                        - frame_code
                        - invite
                        - email
                        - telegram
                    type: string
                via_matches:
                    description: |
                        Channel requests only: whether the requester's verified identity matches the one the link was sent to (for
                        `email`: the account's verified email is that address); null when the channel can't tell (always for
                        `telegram`).
                    nullable: true
                    type: boolean
                via_name:
                    description: |
                        Channel requests only: who the channel invited, as managers should see it (for `email`: the sender's name and
                        address, "Jan · jan.peeters@telenet.be"; for `telegram`: the Telegram name and the chat, "Ben · Telegram,
                        Peeters family").
                    nullable: true
                    type: string
            required:
                - id
                - user
                - via
                - created_at
            type: object
        KeepRequest:
            properties:
                allowed_count:
                    type: integer
                answered_at:
                    format: date-time
                    nullable: true
                    type: string
                asked_at:
                    format: date-time
                    type: string
                asked_by:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    nullable: true
                asked_by_name:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                feed_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                feed_name:
                    nullable: true
                    type: string
                frame_id:
                    allOf:
                        - $ref: '#/components/schemas/Id'
                    nullable: true
                frame_name:
                    nullable: true
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                item_count:
                    description: Items asked for.
                    type: integer
                items:
                    description: '`getKeepRequest` only: the items asked for, with `allowed` once answered.'
                    items:
                        properties:
                            allowed:
                                nullable: true
                                type: boolean
                            item:
                                $ref: '#/components/schemas/Item'
                        required:
                            - item
                        type: object
                    type: array
                note:
                    nullable: true
                    type: string
                person:
                    allOf:
                        - $ref: '#/components/schemas/PersonRef'
                    description: The person asked (who took the photos away).
                    nullable: true
                scope:
                    enum:
                        - frame
                        - feed
                    type: string
                status:
                    $ref: '#/components/schemas/KeepRequestStatus'
                taking_id:
                    $ref: '#/components/schemas/Id'
            required:
                - id
                - status
                - scope
                - taking_id
                - asked_by_name
                - asked_at
                - expires_at
                - item_count
            type: object
        KeepRequestAnswer:
            properties:
                allow:
                    enum:
                        - all
                        - some
                        - none
                    type: string
                item_ids:
                    description: '`some` only: the allowed items (a subset of the request''s).'
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 2000
                    minItems: 1
                    type: array
            required:
                - allow
            type: object
        KeepRequestCreate:
            properties:
                feed_id:
                    $ref: '#/components/schemas/Id'
                frame_id:
                    $ref: '#/components/schemas/Id'
                item_ids:
                    description: The photos to ask for; absent means every item of the taking in this scope.
                    items:
                        $ref: '#/components/schemas/Id'
                    maxItems: 2000
                    minItems: 1
                    type: array
                note:
                    description: Optional words for the person ("The ones with the children
                    for Oma").: null
                    maxLength: 300
                    type: string
                taking_id:
                    $ref: '#/components/schemas/Id'
            required:
                - taking_id
            type: object
        KeepRequestEvent:
            description: '`keep_request.updated`: a keep request was made, answered or expired (the person asked and the scope''s managers).'
            properties:
                request:
                    $ref: '#/components/schemas/KeepRequest'
