            operationId: purgePlacement
            responses:
                "204":
                    description: Purged
            tags:
                - library
        parameters:
            - $ref: '#/components/parameters/FrameId'
            - $ref: '#/components/parameters/PlacementId'
        patch:
            description: Sender of the item, or manage_library.
            operationId: updatePlacement
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                approved:
                                    description: Moderation decision (owner/admin).
                                    type: boolean
                                hidden:
                                    type: boolean
                                trashed:
                                    description: true moves to trash (30 days)
                                    false restores.: null
                                    type: boolean
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Placement'
                    description: Updated
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - library
