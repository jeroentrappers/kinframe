                            default: true
                            description: Week and 4-day views start on today rather than the first day of the week.
                            type: boolean
                        timed_views:
                            description: 'Calendar timed view: while a schedule is active the frame shows the full-screen calendar instead of photos. New schedules default to 07:00–09:00 on every day.'
                            items:
                                $ref: '#/components/schemas/CalendarSchedule'
                            type: array
                        view:
                            default: week
                            enum:
                                - four_day
                                - week
                                - month
                            type: string
                        week_numbers:
                            default: false
                            type: boolean
                    type: object
                display:
                    properties:
                        brightness:
                            default: 204
                            maximum: 255
                            minimum: 15
                            type: integer
                        brightness_mode:
                            default: manual
                            enum:
                                - manual
                                - schedule
                                - sun
                                - sensor
                            type: string
                        brightness_schedule:
                            items:
                                properties:
                                    at:
                                        pattern: ^[0-2][0-9]:[0-5][0-9]$
                                        type: string
                                    brightness:
                                        maximum: 255
                                        minimum: 15
                                        type: integer
                                type: object
                            type: array
                        motion_timeout_min:
                            default: 30
                            nullable: true
                            type: integer
                        sleep_schedules:
                            items:
                                $ref: '#/components/schemas/SleepSchedule'
                            type: array
                        text_scale:
                            default: 1
                            enum:
                                - 1
                                - 1.15
                                - 1.3
                            type: number
                    type: object
                kiosk:
                    properties:
                        allow_remove_members_on_frame:
                            default: true
                            type: boolean
                        owner_pin:
                            description: |
                                Owner only (`403 forbidden` for anyone else). A 4–6 digit kiosk PIN for the frame, or null to remove it.
                                The server never stores or returns the PIN: it keeps only `owner_pin_hash`, which the frame verifies
                                locally (opening settings, leaving the kiosk, power off/restart, Wi-Fi changes).
                            nullable: true
                            pattern: ^[0-9]{4,6}$
                            type: string
                            writeOnly: true
                        owner_pin_hash:
                            allOf:
                                - $ref: '#/components/schemas/PinHash'
                            description: |
                                Salted hash of the owner PIN, null when no PIN is set. Only the frame sees it (in the change feed and
                                in `PATCH /device/settings` responses); user-facing settings omit it. The frame may set or clear it
                                with `PATCH /device/settings` when the PIN is changed at the frame; users set it via `owner_pin`.
                            nullable: true
                        owner_pin_set:
                            readOnly: true
                            type: boolean
                    type: object
                locale:
                    properties:
                        first_day_of_week:
                            default: mon
                            enum:
                                - mon
                                - sun
                                - sat
                            type: string
                        language:
                            default: en
                            type: string
                        temperature_unit:
                            default: c
                            enum:
                                - c
                                - f
                            type: string
                        timezone:
                            default: Europe/Brussels
                            type: string
                    type: object
                location:
                    description: |
                        Used for weather and sun-based brightness. Set by owner/admin, usually from a `/v1/geocode` result.
                        Changing it (or turning `widgets.weather` on) makes the server fetch weather right away.
                    nullable: true
                    properties:
                        lat:
                            maximum: 90
                            minimum: -90
                            type: number
                        lon:
                            maximum: 180
                            minimum: -180
                            type: number
                        name:
                            maxLength: 100
                            type: string
                    required:
                        - lat
                        - lon
                    type: object
                notifications:
                    properties:
                        sound:
                            default: true
                            type: boolean
                        volume:
                            default: 40
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                plugins:
                    description: |
                        Widgets from plugins (docs/plugins.md): the layout and the plugin instances. What a frame can run is in
                        its catalog (`GET /frames/{frameId}/plugins`); instances are checked against it.
                    properties:
                        instances:
                            description: |
                                Replaced whole by a patch (it is an array). Secrets are matched by `instance_id`: an instance sent
                                without `secrets` keeps the ones it has.
                            items:
                                $ref: '#/components/schemas/PluginInstance'
                            maxItems: 8
                            type: array
                        layout:
                            properties:
                                background:
                                    default: paper
                                    enum:
                                        - paper
                                        - photo
                                    type: string
                                mode:
                                    default: "off"
                                    description: 'Off, the photo''s top corners, a band beside or above a 3:2 photo, or split: a photo on half the screen and the other half shared by a dashboard (widgets, clock, the next 48 hours) and a second photo.'
                                    enum:
                                        - "off"
                                        - overlay
                                        - band
                                        - split
                                    type: string
                                side:
                                    default: right
                                    description: Where the band goes in landscape; for split, the side of the dashboard's half (landscape) or of the dashboard itself (portrait).
                                    enum:
                                        - left
                                        - right
                                    type: string
                            type: object
                    type: object
                slideshow:
                    properties:
                        album_id:
                            description: null = all photos. Setting it clears `feed_id`.
                            nullable: true
                            type: string
                        background:
                            default: blur
                            enum:
                                - blur
                                - black
                                - palette
                            type: string
                        caption_date:
                            default: received
                            enum:
                                - taken
                                - received
                                - none
                            type: string
                        collage:
                            default: false
                            type: boolean
                        collage_max:
                            default: 3
                            maximum: 6
                            minimum: 2
                            type: integer
                        feed_id:
                            description: |
