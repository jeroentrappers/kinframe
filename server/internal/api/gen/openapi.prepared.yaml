    /v1/geocode:
        get:
            description: |
                Place search for a frame's `settings.location`, proxied to the Open-Meteo geocoding API and cached by the
                server (clients never call third parties). Rate-limited per user (`429 rate_limited`). An empty list means
                no match. `502 upstream_unavailable` when the geocoding service cannot be reached, `503` when the server
                has weather disabled.
            operationId: geocode
            parameters:
                - in: query
                  name: q
                  required: true
                  schema:
                    maxLength: 100
                    minLength: 2
                    type: string
                - description: Language of place names (ISO 639-1), e.g. `nl`
                  in: query
                  name: lang
                  schema:
                    default: en
                    pattern: ^[a-zA-Z]{2}$
                    type: string
                - in: query
                  name: count
                  schema:
                    default: 8
                    maximum: 20
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Place'
                                type: array
                    description: Matching places, best first
                "429":
                    $ref: '#/components/responses/Problem'
                default:
                    $ref: '#/components/responses/Problem'
            tags:
                - weather
