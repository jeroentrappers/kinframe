        post:
            operationId: bulkUpdatePlacements
            parameters:
                - $ref: '#/components/parameters/FrameId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                action:
                                    enum:
                                        - hide
                                        - unhide
                                        - trash
                                        - restore
                                        - purge
                                        - add_to_album
                                        - remove_from_album
                                    type: string
                                album_id:
                                    $ref: '#/components/schemas/Id'
                                placement_ids:
                                    items:
                                        $ref: '#/components/schemas/Id'
                                    maxItems: 1000
                                    minItems: 1
                                    type: array
                            required:
                                - placement_ids
                                - action
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    failed:
                                        items:
                                            properties:
                                                code:
                                                    $ref: '#/components/schemas/ProblemCode'
                                                id:
                                                    $ref: '#/components/schemas/Id'
                                            type: object
                                        type: array
                                    ok:
                                        items:
                                            $ref: '#/components/schemas/Id'
                                        type: array
                                type: object
                    description: Per-id outcome
            tags:
                - library
    /v1/frames/{frameId}/replace-device:
