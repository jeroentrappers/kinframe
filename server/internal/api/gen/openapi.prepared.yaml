                                Setting it clears `album_id`. Reset to null when the subscription ends. An empty or unknown feed plays
                                everything.
                            nullable: true
                            type: string
                        fill:
                            default: true
                            type: boolean
                        interval_s:
                            default: 30
                            maximum: 86400
                            minimum: 2
                            type: integer
                        live_photos:
                            default: "on"
                            description: |
                                Live/Motion Photos: `on` plays the motion once when the slide appears (and on tap), `tap` only on
                                tap, `off` shows the still only.
                            enum:
                                - "on"
                                - tap
                                - "off"
                            type: string
                        on_this_day:
                            default: false
                            type: boolean
                        order:
                            default: received
                            enum:
                                - received
                                - taken
                                - shuffle
                            type: string
                        pair_portraits:
                            default: true
                            type: boolean
                        reverse:
                            default: false
                            type: boolean
                        transition:
                            default: crossfade
                            enum:
                                - crossfade
                                - slide
                                - kenburns
                            type: string
                        transition_ms:
                            default: 800
                            maximum: 3000
                            minimum: 200
                            type: integer
                    type: object
                social:
                    description: Family social on the frame (docs/spec/family-social.md §8, README §5.20). Owner, admins and `change_settings` members.
                    properties:
                        ask_for_photos:
                            default: true
                            description: Show "Ask for new photos" in the frame's quick menu.
                            type: boolean
                        new_photos_from:
                            default: true
                            description: Show "New photos from Ben" on the next wake after new photos arrived (computed by the frame from the new placements' senders).
                            type: boolean
                        prompt_cards:
                            default: true
                            description: Show a weekly prompt's title card before its answers.
                            type: boolean
                        show_comments:
                            default: false
                            description: When a photo with comments appears, a card with the newest comment fades in for 8 s (once per photo per day). The server sends the `comments` change only while this is on.
                            type: boolean
                    type: object
                updates:
                    properties:
                        channel:
                            default: stable
                            description: Frame app release channel (beta program). Beta frames get the newest of beta and stable.
                            enum:
                                - stable
                                - beta
                            type: string
                    type: object
                version:
                    type: integer
                video:
                    properties:
                        auto_mute_min:
                            default: null
                            nullable: true
                            type: integer
                        autoplay:
                            default: true
                            type: boolean
                        playback:
                            default: once_hold
                            enum:
                                - loop
                                - once_hold
                                - once_advance
                            type: string
                        volume:
                            default: 60
                            maximum: 100
                            minimum: 0
                            type: integer
                    type: object
                widgets:
                    properties:
                        avatar:
                            default: true
                            type: boolean
                        calendar_sidebar:
                            default: false
                            description: 'Hybrid view: today and upcoming events beside the slideshow (side panel in landscape, bottom panel in portrait).'
                            type: boolean
                        caption:
                            default: true
                            type: boolean
                        clock:
                            default: true
                            type: boolean
                        clock_24h:
                            default: true
                            type: boolean
                        countdowns:
                            default: true
                            description: 'Countdown widgets on the slideshow (the nearest three): marked events and, from 7 days before, feed birthdays (docs/spec/birthdays.md §6.6). The birthday card on the day itself does not depend on it.'
                            type: boolean
                        date:
                            default: true
                            type: boolean
                        weather:
                            default: false
                            description: Current weather widget; needs `location`.
                            type: boolean
                    type: object
            required:
                - version
            type: object
