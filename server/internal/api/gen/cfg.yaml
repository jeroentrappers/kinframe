# oapi-codegen configuration. Input is docs/api/openapi.yaml after tools/specprep.
package: gen
output: internal/api/gen/api.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  skip-prune: true
  # Hand-written in internal/api: tus (tusd library), binary media, multi-type avatar upload.
  exclude-operation-ids:
    - tusCreateUpload
    - putAvatar
    - deviceGetMedia
    - getItemMedia
    # Hand-written: 200-or-204 with header parsing, and binary APK downloads with Range.
    - deviceCheckUpdate
    - deviceGetUpdateApk
    # Hand-written: the public release check and APK download for the convert tool (same shapes as above).
    - getFrameAppLatest
    - getFrameAppApk
    # Hand-written: event invitation photos (binary, ETag).
    - deviceGetInvitationPhoto
    - getEventInvitationPhoto
    # Only mounted in dev auth mode.
    - devToken
    # Hand-written: plugin bundles (binary, ETag).
    - deviceGetPluginBundle
    # Hand-written: CSV download.
    - operatorExportReservations
    # Hand-written: the TV mirror websocket.
    - tvMirror
