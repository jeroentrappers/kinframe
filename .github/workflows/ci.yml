name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Server (tests in the runtime toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The test stage runs the full suite with KINFRAME_REQUIRE_MEDIA_TOOLS=1,
      # so media tests can't silently skip.
      - name: Test stage
        uses: docker/build-push-action@v6
        with:
          context: server
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: server
          tags: kinframe-server:ci
          cache-from: type=gha

  android:
    name: Android (frame + family)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:testDebugUnitTest :frame:testDebugUnitTest :frame:lintDebug :frame:assembleRelease :family:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: frame-release-apk
          path: android/frame/build/outputs/apk/release/*.apk
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=phone
