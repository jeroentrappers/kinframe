name: Desktop app

# Windows, macOS and Linux client (desktop/, Rust + egui). Checks on every change; installers as build artifacts.
#
#   Linux:   .AppImage and .deb (x86_64)
#   Windows: NSIS installer (.exe) and MSI (WiX), x86_64
#   macOS:   .app in a .dmg, separately for Apple silicon (aarch64) and Intel (x86_64)
#
# Builds are unsigned for now. Code signing is a follow-up (desktop/README.md, "Signing"): Windows Authenticode
# and macOS Developer ID + notarization with the Appmire Apple team, both from repository secrets.

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  package:
    name: Package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        env:
          # linuxdeploy runs as an AppImage itself; CI runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: kinframe-desktop-${{ matrix.name }}
          path: |
            desktop/target/packages/*.AppImage
            desktop/target/packages/*.deb
            desktop/target/packages/*.exe
            desktop/target/packages/*.msi
            desktop/target/packages/*.dmg
          if-no-files-found: error
