# kinframe stack role: Postgres + Logto + kinframe server in one compose project, all bound to loopback.
# A reverse proxy (nginx, Caddy, …) in front terminates TLS; that part is host-specific and not in this role.
#
# Every host-specific value and every secret is a variable. Secrets have no defaults on purpose:
# the play fails fast when one is missing.
---
kinframe_dir: /opt/kinframe

# Images
kinframe_image: ghcr.io/jeroentrappers/kinframe-server
kinframe_version: main            # image tag: main, sha-xxxxxxx or a release like 0.1.0
logto_version: "1.43.0"
postgres_version: "17-alpine"

# Public names (TLS is terminated in front of these ports)
kinframe_domain: ""                # e.g. kinframe.example.org
logto_domain: ""                   # e.g. auth.kinframe.example.org
logto_admin_domain: ""             # e.g. admin.auth.kinframe.example.org

# Loopback ports
kinframe_port: 8110
logto_core_port: 8111
logto_admin_port: 8112

kinframe_server_name: kinframe     # shown in the apps before sign-in

# Logto console admin, created by bootstrap-logto on the first run (password from the vault).
logto_admin_username: kinframe_admin   # Logto usernames: letters, digits, underscore; no hyphens
# Accounts that get the kinframe-operator role (they must have signed up first; re-run the play after).
kinframe_operator_emails: []
kinframe_log_level: info

# Secrets (no defaults; supply them from a vault)
# kinframe_postgres_superuser_password:
# kinframe_db_password:
# logto_db_password:
# logto_admin_password:          # ≥ 8 chars; the Logto console login
# kinframe_signing_key:          # ≥ 32 random bytes, hex or base64; signs device tokens and media URLs
# kinframe_smtp_host / _port / _user / _password / _from
# kinframe_s3_access_key:        # backend s3 or kinframe_minio: kinframe's own key (not the root account)
# kinframe_s3_secret_key:        # ≥ 8 chars (MinIO's minimum)
# kinframe_minio_root_user:      # kinframe_minio only: object store admin, used by the bootstrap job
# kinframe_minio_root_password:  # ≥ 8 chars

# Media storage (processed media only: masters, renditions, posters, thumbnails, avatars).
#   fs: the `media` volume (default; nothing changes for existing deployments)
#   s3: an S3-compatible bucket, either the bundled object store below or a managed one
kinframe_blob_backend: fs

# Bundled S3 server: Silo (pgsty/silo), the community-maintained MinIO fork. MinIO Inc. stopped publishing
# community images (minio/minio is gone from Docker Hub); Silo keeps the MinIO S3 API, MINIO_* settings and
# on-disk format, ships security fixes and includes `mc`. Can be enabled while the backend is still `fs`, so the
# media can be copied over with `migrate-blobs` before switching.
kinframe_minio: false
kinframe_minio_image: pgsty/silo
kinframe_minio_version: RELEASE.2026-10-18T00-00-00Z
kinframe_minio_console_port: 0     # >0 publishes the web console on 127.0.0.1:<port> (ssh -L to use it)

# S3 settings. With kinframe_minio the endpoint is the bundled server (http://minio:9000, path-style) and the
# bootstrap job creates the bucket and a kinframe user limited to it. For managed storage set the endpoint,
# region, TLS and addressing to what the provider documents and create the bucket and key there.
kinframe_s3_endpoint: ""           # e.g. https://fsn1.your-objectstorage.com (ignored with kinframe_minio)
kinframe_s3_public_endpoint: ""    # only for kinframe_media_redirect=presigned: the bucket as clients reach it
kinframe_s3_region: us-east-1
kinframe_s3_bucket: kinframe
kinframe_s3_prefix: ""             # optional key prefix inside the bucket
kinframe_s3_use_ssl: true          # managed storage; the bundled server is plain HTTP on the compose network
kinframe_s3_path_style: false      # MinIO/Silo need path-style; forced on with kinframe_minio
# off: the server streams media (default, keeps the bucket private and internal).
# presigned: signed media URLs and avatars redirect to 15-minute presigned bucket URLs (bucket must be public).
kinframe_media_redirect: "off"

# Social sign-in on Logto's sign-in page (bootstrap-logto creates the connectors). Every provider is off
# while its client ID is empty; IDs and secrets come from the vault. Registration steps and the exact
# callback URLs (https://<logto_domain>/callback/<apple|google|microsoft|facebook|github>) are in
# docs/deploy.md ("Social sign-in").
kinframe_social_apple_client_id: ""        # the Services ID, e.g. app.kinframe.signin (no secret needed)
kinframe_social_google_client_id: ""
kinframe_social_google_client_secret: ""
kinframe_social_microsoft_client_id: ""    # Entra app (client) ID
kinframe_social_microsoft_client_secret: ""
kinframe_social_microsoft_tenant: common   # common = personal Microsoft accounts + work/school accounts
kinframe_social_facebook_client_id: ""     # Meta app ID (Facebook Login; Instagram has no consumer login)
kinframe_social_facebook_client_secret: ""
kinframe_social_github_client_id: ""
kinframe_social_github_client_secret: ""
# Removing a provider's ID leaves its Logto connector (and button) in place unless this is true.
kinframe_social_remove_unconfigured: false
# Link a first social sign-in to the existing account with the same verified email.
kinframe_social_link_by_email: true
# Logto sign-in page: kinframe look (logo, colours, CSS) and optional legal links (empty = no link).
kinframe_logto_branding: true
kinframe_terms_url: ""
kinframe_privacy_url: ""

# Optional pre-order shop (docs/deploy.md "Pre-order shop"). Empty = no shop (the default). A dict with the
# server's shop file fields (brand, seller, products, shipping, estimated_delivery, notify_email, domains,
# default_locale, …); the role
# writes it to <kinframe_dir>/shop.json and sets KINFRAME_SHOP_FILE. Mails go out over kinframe_smtp_*.
kinframe_shop: {}

# Extra environment for the server container (e.g. bootstrap credentials).
kinframe_extra_env: {}
