# kinframe stack: Postgres + Logto + kinframe server via docker compose, all on loopback.
---
- name: Required variables are set
  ansible.builtin.assert:
    that:
      - kinframe_domain | length > 0
      - logto_domain | length > 0
      - logto_admin_domain | length > 0
      - kinframe_postgres_superuser_password is defined
      - kinframe_db_password is defined
      - logto_db_password is defined
      - kinframe_signing_key is defined and kinframe_signing_key | length >= 43
      - kinframe_smtp_host is defined and kinframe_smtp_password is defined
      - logto_admin_password is defined and logto_admin_password | length >= 8
      - logto_admin_username is match('^[A-Za-z_][A-Za-z0-9_]*$')   # Logto's username rule
    fail_msg: Set the domains and the secrets (see defaults/main.yml).
    quiet: true

- name: Media storage settings are complete
  ansible.builtin.assert:
    that:
      - kinframe_blob_backend in ['fs', 's3']
      - kinframe_media_redirect in ['off', 'presigned']
      - kinframe_media_redirect == 'off' or kinframe_blob_backend == 's3'
      - kinframe_s3_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - kinframe_s3_access_key is defined and kinframe_s3_access_key | length >= 3
      - kinframe_s3_secret_key is defined and kinframe_s3_secret_key | length >= 8
      - kinframe_minio or kinframe_s3_endpoint | length > 0
      - not kinframe_minio or (kinframe_minio_root_user is defined and kinframe_minio_root_user | length >= 3)
      - not kinframe_minio or (kinframe_minio_root_password is defined and kinframe_minio_root_password | length >= 8)
      - not kinframe_minio or kinframe_minio_root_user != kinframe_s3_access_key
    fail_msg: >-
      S3 media storage needs kinframe_s3_access_key/_secret_key (≥ 8 chars) from the vault, plus either
      kinframe_minio (with kinframe_minio_root_user/_password) or kinframe_s3_endpoint (see defaults/main.yml).
    quiet: true
  when: kinframe_blob_backend == 's3' or kinframe_minio

- name: Loopback ports are free or already ours
  ansible.builtin.shell: |
    set -o pipefail
    ss -Hltnp "( sport = :{{ item }} )" | grep -v -e docker-proxy -e '^$' || true
  args: { executable: /bin/bash }
  register: port_check
  changed_when: false
  failed_when: port_check.stdout | length > 0
  loop: "{{ [kinframe_port, logto_core_port, logto_admin_port]
            + ([kinframe_minio_console_port] if kinframe_minio and (kinframe_minio_console_port | int) > 0 else []) }}"

- name: Project directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kinframe_dir }}", mode: "0750" }
    # Postgres lists this as uid 70; the SQL inside stays 0400 and owned by uid 70.
    - { path: "{{ kinframe_dir }}/initdb", mode: "0755" }
    - { path: "{{ kinframe_dir }}/secrets", mode: "0700" }

- name: Postgres superuser password
  ansible.builtin.copy:
    content: "{{ kinframe_postgres_superuser_password }}"
    dest: "{{ kinframe_dir }}/secrets/postgres-password"
    owner: "70"   # postgres uid in the alpine image
    group: root
    mode: "0400"
  no_log: true

- name: Render compose, env files and the first-start SQL
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ kinframe_dir }}/{{ item.dest }}"
    owner: "{{ item.owner | default('root') }}"
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml, mode: "0640" }
    - { src: kinframe.env.j2, dest: kinframe.env, mode: "0600" }
    - { src: logto.env.j2, dest: logto.env, mode: "0600" }
    - { src: bootstrap.env.j2, dest: bootstrap.env, mode: "0600" }
    - { src: initdb.sql.j2, dest: initdb/10-kinframe.sql, mode: "0400", owner: "70" }
    - { src: minio.env.j2, dest: minio.env, mode: "0600", when: "{{ kinframe_minio }}" }
  loop_control: { label: "{{ item.dest }}" }
  when: item.when | default(true) | bool
  no_log: true
  register: rendered

- name: Object store bootstrap script
  ansible.builtin.copy:
    src: minio-bootstrap.sh
    dest: "{{ kinframe_dir }}/minio-bootstrap.sh"
    owner: root
    group: root
    mode: "0644"
  when: kinframe_minio

- name: Pull images
  ansible.builtin.command:
    cmd: docker compose pull --quiet
    chdir: "{{ kinframe_dir }}"
  register: pulled
  changed_when: "'Pulled' in pulled.stderr or 'Downloaded' in pulled.stderr"

- name: Start or update Postgres and Logto
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans postgres logto
    chdir: "{{ kinframe_dir }}"
  register: stack_up
  changed_when: "'Started' in stack_up.stderr or 'Created' in stack_up.stderr or 'Recreate' in stack_up.stderr"

- name: Wait for Logto
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ logto_core_port }}/oidc/.well-known/openid-configuration"
    headers: { Host: "{{ logto_domain }}", X-Forwarded-Proto: https }
  register: logto_up
  retries: 40
  delay: 5
  until: logto_up is succeeded
  changed_when: false

# Idempotent: creates the console admin on the first run, then only reconciles. no_log because the
# first run prints the one-time Management API credentials (not needed: later runs sign in as admin).
- name: Configure Logto (bootstrap-logto)
  ansible.builtin.command:
    cmd: docker compose run --rm logto-bootstrap
    chdir: "{{ kinframe_dir }}"
  register: bootstrap
  changed_when: "'nothing changed' not in (bootstrap.stdout + bootstrap.stderr)"
  failed_when: false   # judged below, so the error is visible despite no_log
  no_log: true

- name: Bootstrap output (credentials filtered out)
  ansible.builtin.debug:
    msg: >-
      {{ (bootstrap.stdout_lines + bootstrap.stderr_lines)
         | reject('search', 'M2M_SECRET|M2M_ID|PASSWORD')
         | reject('search', '^ Container ')
         | list }}

- name: Bootstrap succeeded
  ansible.builtin.assert:
    that: bootstrap.rc == 0
    fail_msg: bootstrap-logto failed (exit {{ bootstrap.rc }}); see the output above.
    quiet: true

- name: Start or update the object store
  ansible.builtin.command:
    cmd: docker compose up -d --wait minio
    chdir: "{{ kinframe_dir }}"
  register: minio_up
  changed_when: "'Started' in minio_up.stderr or 'Created' in minio_up.stderr or 'Recreate' in minio_up.stderr"
  when: kinframe_minio

# Idempotent: bucket, least-privilege policy and kinframe's user (the server never gets root credentials).
- name: Configure the object store (minio-bootstrap)
  ansible.builtin.command:
    cmd: docker compose run --rm minio-bootstrap
    chdir: "{{ kinframe_dir }}"
  register: minio_bootstrap
  changed_when: "'nothing changed' not in minio_bootstrap.stdout"
  when: kinframe_minio

- name: Start or update the kinframe server
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans server
    chdir: "{{ kinframe_dir }}"
  register: server_up
  changed_when: "'Started' in server_up.stderr or 'Created' in server_up.stderr or 'Recreate' in server_up.stderr"

# The server reads the Logto client IDs (/data/logto.json) at start.
- name: Restart the server after a Logto change
  ansible.builtin.command:
    cmd: docker compose restart server
    chdir: "{{ kinframe_dir }}"
  when: bootstrap is changed and server_up is not changed
  changed_when: true

- name: Wait for the kinframe server
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ kinframe_port }}/.well-known/kinframe"
    return_content: true
  register: kinframe_up
  retries: 30
  delay: 3
  until: kinframe_up is succeeded
  changed_when: false

- name: Discovery is production-ready
  ansible.builtin.assert:
    that:
      - not (kinframe_up.json.dev_auth | default(false))
      - kinframe_up.json.auth.issuer == 'https://' ~ logto_domain ~ '/oidc'
      - kinframe_up.json.auth.web_client_id | length > 0
      - kinframe_up.json.auth.mobile_client_id | length > 0
    fail_msg: "Discovery is not production-ready: {{ kinframe_up.json.auth | default({}) }} dev_auth={{ kinframe_up.json.dev_auth | default(false) }}"
    quiet: true
