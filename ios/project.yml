# XcodeGen spec for Kinframe.xcodeproj. After editing: `cd ios && xcodegen` (the generated project is checked in,
# so building needs only Xcode).
name: Kinframe
options:
  bundleIdPrefix: app.kinframe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # Feature flag: APNs registration (the server sends through APNs when KINFRAME_APNS_KEY_FILE is set).
    KINFRAME_APNS_ENABLED: YES
    # Shared between the app, the share extension and the keychain.
    KINFRAME_APP_GROUP: group.app.kinframe.family
  configs:
    # aps-environment in Kinframe.entitlements: debug builds get sandbox device tokens, store builds production ones.
    Debug:
      KINFRAME_APS_ENVIRONMENT: development
    Release:
      KINFRAME_APS_ENVIRONMENT: production

packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.1.0
  LogtoSDK:
    url: https://github.com/logto-io/swift
    from: 2.0.0

targets:
  KinframeKit:
    type: framework
    platform: iOS
    sources:
      - path: KinframeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.kit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: LogtoSDK
        product: LogtoClient

  Kinframe:
    type: application
    platform: iOS
    sources:
      - path: Kinframe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family
        PRODUCT_NAME: Kinframe
        INFOPLIST_FILE: Kinframe/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kinframe/Kinframe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # Mac Catalyst (Mac App Store, same record as the iPhone app): sandboxed, same bundle identifier.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Kinframe/Kinframe-Mac.entitlements
      configs:
        Debug:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match Development app.kinframe.family
        Release:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore app.kinframe.family
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": match AppStore app.kinframe.family catalyst
    dependencies:
      - target: KinframeKit
      - target: KinframeShare
    scheme:
      testTargets:
        - KinframeTests
      gatherCoverageData: false

  KinframeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: KinframeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.share
        PRODUCT_NAME: KinframeShare
        INFOPLIST_FILE: KinframeShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: KinframeShare/KinframeShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # Mac Catalyst (Mac App Store, same record as the iPhone app): sandboxed, same bundle identifier.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": KinframeShare/KinframeShare-Mac.entitlements
      configs:
        Debug:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match Development app.kinframe.family.share
        Release:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore app.kinframe.family.share
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": match AppStore app.kinframe.family.share catalyst
    dependencies:
      - target: KinframeKit
        embed: false

  KinframeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KinframeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.tests
    dependencies:
      - target: Kinframe
      - target: KinframeKit

  KinframeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KinframeUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.uitests
        TEST_TARGET_NAME: Kinframe
    dependencies:
      - target: Kinframe

schemes:
  KinframeUITests:
    build:
      targets:
        Kinframe: all
        KinframeUITests: [test]
    test:
      targets:
        - KinframeUITests
