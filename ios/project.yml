# XcodeGen spec for Kinframe.xcodeproj. After editing: `cd ios && xcodegen` (the generated project is checked in,
# so building needs only Xcode).
name: Kinframe
options:
  bundleIdPrefix: app.kinframe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TEAMID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # Feature flag: APNs registration. Off until the server can send APNs pushes (see ios/README.md).
    KINFRAME_APNS_ENABLED: NO
    # Shared between the app, the share extension and the keychain.
    KINFRAME_APP_GROUP: group.app.kinframe.family

packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.1.0
  LogtoSDK:
    url: https://github.com/logto-io/swift
    from: 2.0.0

targets:
  KinframeKit:
    type: framework
    platform: iOS
    sources:
      - path: KinframeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.kit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
    dependencies:
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: LogtoSDK
        product: LogtoClient

  Kinframe:
    type: application
    platform: iOS
    sources:
      - path: Kinframe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family
        PRODUCT_NAME: Kinframe
        INFOPLIST_FILE: Kinframe/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kinframe/Kinframe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: KinframeKit
      - target: KinframeShare
    scheme:
      testTargets:
        - KinframeTests
      gatherCoverageData: false

  KinframeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: KinframeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.share
        PRODUCT_NAME: KinframeShare
        INFOPLIST_FILE: KinframeShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: KinframeShare/KinframeShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: KinframeKit
        embed: false

  KinframeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KinframeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kinframe.family.tests
    dependencies:
      - target: Kinframe
      - target: KinframeKit
