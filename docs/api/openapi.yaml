openapi: 3.1.0
info:
  title: kinframe API
  version: 1.0.0-draft
  summary: Family photo frames, self-hosted.
  description: |
    Machine-readable contract for the kinframe server. Concepts, flows, websockets,
    tus uploads and the change feed are described in docs/api/README.md.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://kinframe.appmire.be
    description: Default hosted server
  - url: http://localhost:8110
    description: Local development

security:
  - userAuth: []

tags:
  - name: discovery
  - name: me
  - name: frames
  - name: members
  - name: invites
  - name: sends
  - name: library
  - name: albums
  - name: feeds
    description: Private family channels that frames subscribe to (docs/spec/feeds.md). Members, invites, posts, receipts and birthdays (docs/spec/birthdays.md).
  - name: subscriptions
    description: A frame subscribing to a feed, managed from both sides.
  - name: photo-sources
    description: Immich and iCloud albums synced into an album or a feed, and one-time imports from Google Photos (docs/spec/photo-sources.md).
  - name: email-inbox
    description: Inbox addresses that turn mailed photos into sends to a frame or posts to a feed, their senders and held mail, and the operator's inbound webhook (docs/spec/email-inbox.md).
  - name: telegram
    description: Telegram groups and private chats connected to a frame or a feed through the server's bot, linked Telegram accounts, and Telegram's webhook (docs/spec/telegram.md).
  - name: social
    description: The home timeline, comment threads with replies and mentions, and people's reactions on posts, post items, comments and messages (docs/spec/family-social.md).
  - name: circles
    description: Smaller groups inside a family (feed), with their own chat and as an audience for posts (docs/spec/family-social.md §3).
  - name: chats
    description: Direct, group, family and circle conversations, messages with photos, videos and voice, read receipts, typing, contacts and link previews (docs/spec/family-social.md §4, §7).
  - name: safety
    description: Blocking people and reporting comments, messages and posts.
  - name: engagement
    description: Gentle encouragement to share - frame freshness, "Ask for new photos", reminders and their budget, family streaks, weekly prompts, On this day, summaries, recaps and milestones (docs/spec/family-social.md §9).
  - name: leaving
    description: Leaving a family or frame with your photos (they stay, or are taken away with 30 days' notice), asking to keep, account deletion handover, the memories filter and operator ownership transfers (docs/spec/leaving.md).
  - name: remote
    description: Frames following a family on another kinframe server, as frame managers and family admins see it (docs/spec/multi-server.md §3).
  - name: federation
    description: Server-to-server calls between kinframe servers, signed with HTTP Message Signatures (RFC 9421, Ed25519). Not for apps (README §5.22).
  - name: settings
  - name: tv
    description: Show a frame's library on a TV (Google Cast, Presentation API or a full-screen TV page).
  - name: weather
    description: Place search and weather. Data by Open-Meteo.com (CC BY 4.0), fetched and cached by the server.
  - name: calendar
    description: Calendars synced by the server (ICS/webcal, CalDAV), events sent to frames, and countdowns.
  - name: devices
    description: Frame enrollment and token exchange (unauthenticated or secret-based).
  - name: device
    description: Endpoints called by the frame itself (device token).
  - name: frame-app
    description: Public frame app releases, for installing kinframe on a frame (the website's convert tool).
  - name: shop
    description: Pre-order reservations for frames sold by the server operator (only when configured).
  - name: operator
  - name: dev
    description: Development-only helpers; absent in production.

paths:
  /.well-known/kinframe:
    get:
      tags: [discovery]
      operationId: getDiscovery
      security: []
      responses:
        '200':
          description: Server discovery document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }

  /dev/token:
    post:
      tags: [dev]
      operationId: devToken
      security: []
      description: |
        Development servers only (discovery `dev_auth: true`); 404 otherwise. Issues a user access token signed by the
        server itself so web and app development works without Logto. The server refuses to start with dev auth
        enabled when KINFRAME_ENV=production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- me
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 40 }
                share_location_names: { type: boolean }
                locale: { type: string, examples: [nl-BE] }
                timezone:
                  type: string
                  description: IANA time zone of the user's device, set automatically by the apps (birthday morning notifications at 08:00 local).
                  examples: [Europe/Brussels]
                show_read_receipts: { type: boolean, description: 'Read receipts in chats (README §5.19).' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [me]
      operationId: deleteMe
      description: |
        Deletes the kinframe user. When the server has Logto management credentials, it deletes the Logto account too.
        The body's `photos` (README §5.21 "Account deletion") says what happens to the photos: `take` (default) or
        `leave` (handed over to the families' and frames' owners). Older clients send only `remove_items`: `true`
        means `take`, `false` means `leave`. `photos` wins when both are sent.
      parameters:
        - name: remove_items
          in: query
          required: false
          deprecated: true
          description: "Older clients: `true` means `photos: take`, `false` means `photos: leave`."
          schema: { type: boolean }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountDeletion' } } }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/avatar:
    put:
      tags: [me]
      operationId: putAvatar
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
          image/png: { schema: { type: string, contentMediaType: image/png } }
          image/webp: { schema: { type: string, contentMediaType: image/webp } }
      responses:
        '200': { description: Stored (server crops to 256x256), content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [me]
      operationId: deleteAvatar
      responses:
        '204': { description: Removed }

  /v1/me/push-endpoints:
    get:
      tags: [me]
      operationId: listPushEndpoints
      responses:
        '200':
          description: Registered endpoints
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PushEndpoint' } }
    post:
      tags: [me]
      operationId: registerPushEndpoint
      description: Idempotent on (kind, endpoint).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PushEndpointCreate' } } }
      responses:
        '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/PushEndpoint' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/push-endpoints/{endpointId}:
    delete:
      tags: [me]
      operationId: deletePushEndpoint
      parameters: [ { $ref: '#/components/parameters/EndpointId' } ]
      responses:
        '204': { description: Removed }

  # ---------------------------------------------------------------- frames
  /v1/frames:
    get:
      tags: [frames]
      operationId: listMyFrames
      description: Frames the caller is a member of (any role).
      responses:
        '200':
          description: Frames
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FrameSummary' } }

  /v1/frames/redeem:
    post:
      tags: [frames]
      operationId: redeemFrameCode
      description: Claim an unowned frame or join an owned one with the code shown on the frame. See README §5.1.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200':
          description: Result
          content: { application/json: { schema: { $ref: '#/components/schemas/RedeemResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [frames]
      operationId: getFrame
      responses:
        '200': { description: Frame, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [frames]
      operationId: updateFrame
      description: Owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                location: { type: string, maxLength: 40 }
                default_permissions: { $ref: '#/components/schemas/Permissions' }
                approve_joins_on_frame: { type: boolean }
                invite_requires_approval: { type: boolean }
                moderation: { type: boolean, description: New placements need approval by owner/admin before showing. }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [frames]
      operationId: removeFrame
      description: Owner only. Revokes the device credential and deletes all placements on this frame.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/leave:
    post:
      tags: [frames]
      operationId: leaveFrame
      description: |
        Remove your own membership. The owner must transfer ownership first. `photos` (README §5.21): `keep` (default)
        leaves your direct placements on the frame; `take` takes them away with the 30-day notice. Requests with
        `photos` get `200` with the result; requests without it (older clients) get `204`.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveFrameRequest' }
      responses:
        '200': { description: Left, content: { application/json: { schema: { $ref: '#/components/schemas/TakeAwayResult' } } } }
        '204': { description: Left }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/transfer:
    post:
      tags: [frames]
      operationId: transferOwnership
      description: Owner only. The previous owner becomes admin.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Transferred }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/replace-device:
    post:
      tags: [frames]
      operationId: replaceDevice
      description: |
        Owner only. "Move to new frame": attach a freshly enrolled, unclaimed device (identified by the code it shows)
        to this frame. The old device credential is revoked; the new device syncs everything.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200': { description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/health:
    get:
      tags: [frames]
      operationId: getFrameHealth
      description: Owner, admin, or members with change_settings.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Latest heartbeat and connectivity, content: { application/json: { schema: { $ref: '#/components/schemas/FrameHealth' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/commands:
    post:
      tags: [frames]
      operationId: sendFrameCommand
      description: Delivered over the device websocket only; never queued.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FrameCommand' } } }
      responses:
        '200': { description: Executed by the frame, content: { application/json: { schema: { $ref: '#/components/schemas/CommandResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- members
  /v1/frames/{frameId}/members:
    get:
      tags: [members]
      operationId: listMembers
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200':
          description: Members
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } }

  /v1/frames/{frameId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [members]
      operationId: updateMember
      description: Owner or admin. Admins cannot change the owner or other admins' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, member] }
                permissions: { $ref: '#/components/schemas/Permissions' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [members]
      operationId: removeMember
      parameters:
        - name: remove_items
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/join-requests:
    get:
      tags: [members]
      operationId: listJoinRequests
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200':
          description: Pending requests
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } }

  /v1/frames/{frameId}/join-requests/{requestId}/{decision}:
    post:
      tags: [members]
      operationId: decideJoinRequest
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, deny] } }
      responses:
        '204': { description: Decided }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- invites
  /v1/frames/{frameId}/invites:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [invites]
      operationId: listInvites
      responses:
        '200':
          description: Active invites created by the caller (owner/admin see all)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
    post:
      tags: [invites]
      operationId: createInvite
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses: { type: [integer, 'null'], minimum: 1, description: null = unlimited }
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                note: { type: string, maxLength: 80, description: Shown to the owner when approving. }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/invites/{inviteId}:
    delete:
      tags: [invites]
      operationId: revokeInvite
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: inviteId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Revoked }

  /v1/invites/{token}:
    get:
      tags: [invites]
      operationId: previewInvite
      description: Requires sign-in so invite tokens can't be enumerated anonymously.
      parameters: [ { $ref: '#/components/parameters/InviteToken' } ]
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/InvitePreview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /v1/invites/{token}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      parameters: [ { $ref: '#/components/parameters/InviteToken' } ]
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/RedeemResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- sends
  /v1/uploads:
    post:
      tags: [sends]
      operationId: tusCreateUpload
      description: |
        tus 1.0 creation endpoint (also HEAD/PATCH/DELETE on /v1/uploads/{uploadId}). See README §5.3.
        Upload-Metadata keys: filename, filetype, sha256 (optional), prepared (optional: `photo-master-v1` or
        `video-master-v1` when the client already produced a master; the server verifies it, see README §5.3
        "Prepared uploads").
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, const: 1.0.0 } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer } }
        - { name: Upload-Metadata, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created; Location header holds the upload URL. If sha256 matches an existing item of the caller, `Kinframe-Existing-Item` header carries its id and the client may skip uploading.
        '413': { $ref: '#/components/responses/Problem' }

  /v1/sends:
    get:
      tags: [sends]
      operationId: listMySends
      description: The caller's sent history across all devices, newest first.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: state
          in: query
          schema: { type: string, enum: [ongoing, delivered, all], default: all }
      responses:
        '200':
          description: Page of sends
          content:
            application/json:
              schema:
                type: object
                required: [sends, next_cursor]
                properties:
                  sends: { type: array, items: { $ref: '#/components/schemas/Send' } }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [sends]
      operationId: createSend
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendCreate' } } }
      responses:
        '202': { description: Accepted; processing, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/sends/{sendId}:
    parameters: [ { name: sendId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [sends]
      operationId: getSend
      responses:
        '200': { description: Send with per-frame placement status, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sends]
      operationId: unsend
      description: Removes all placements of this send from all frames (sender only). Never needs a frame to be online.
      responses:
        '204': { description: Unsent }

  /v1/sends/{sendId}/forward:
    post:
      tags: [sends]
      operationId: forwardSend
      description: |
        Place the same items on additional frames, or post them to feeds. Uses the same path as `sharePlacements`:
        no new upload or master, renditions only for screen sizes that have none yet, and frames that already hold an
        item are skipped (a placement that was only there through a feed becomes held directly, so unsubscribing no
        longer removes it).
      parameters: [ { name: sendId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_ids]
              description: '`frame_ids` and `feed_ids` together must not be empty.'
              properties:
                frame_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
                feed_ids:
                  type: array
                  maxItems: 20
                  description: Post the send's items to these feeds (caller must be a poster or above). A feed that already has a live post of this send is skipped.
                  items: { $ref: '#/components/schemas/Id' }
                circle_ids:
                  type: array
                  maxItems: 20
                  description: As in `SendCreate.circle_ids`.
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }

  /v1/items/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    patch:
      tags: [sends]
      operationId: updateItem
      description: Sender, or a manager of every frame the item is on. Changes propagate to all placements and show "edited".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: [string, 'null'], maxLength: 280 }
                focal_point: { $ref: '#/components/schemas/FocalPoint' }
                fit: { $ref: '#/components/schemas/Fit' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/items/{itemId}/media/{variant}:
    get:
      tags: [sends]
      operationId: getItemMedia
      description: Thumbnails and the master rendition for app/web, for everyone who may see the item (its sender, frames' library viewers, feed and circle members, and members of conversations it was sent in). Responds 302 to a short-lived signed URL (`/v1/media/signed/{token}`, HMAC + expiry, ~1 h) that needs no Authorization header and supports Range and ETag, so it works in <img>/<video> tags.
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - name: variant
          in: path
          required: true
          description: '`motion` is the master of a Live/Motion Photo clip (`item.kind: live`). For a voice message (`VoiceClip.item_id`) `master` is the AAC recording (`audio/mp4`) and there are no thumbnails.'
          schema: { type: string, enum: [thumb_256, thumb_512, master, poster, motion] }
      responses:
        '302': { description: Redirect to signed media URL }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- library
  /v1/frames/{frameId}/placements:
    get:
      tags: [library]
      operationId: listPlacements
      description: Everything on the frame (needs see_library), or only the caller's own placements otherwise.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: visibility
          in: query
          description: '`taken_away` (managers only): placements their senders took away, still in the 30-day trash (README §5.21); never part of `all`.'
          schema: { type: string, enum: [visible, hidden, trashed, pending_moderation, all, taken_away], default: visible }
        - { name: taking_id, in: query, description: 'With `visibility: taken_away`: only this taking.', schema: { $ref: '#/components/schemas/Id' } }
        - { name: sender_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - { name: album_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: feed_id, in: query, description: Only placements held by this feed (`feed_ids`)., schema: { $ref: '#/components/schemas/Id' } }
        - name: on_this_day
          in: query
          description: |
            "On this day" memories: only placements whose capture date (`item.captured_at`, else the client hint) falls
            on this month and day (`MM-DD`, the client's local date) in an earlier year than the server's current year.
          schema: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }
        - { name: sort, in: query, schema: { type: string, enum: [received_desc, received_asc, taken_desc, taken_asc], default: received_desc } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [placements, next_cursor, counts]
                properties:
                  placements: { type: array, items: { $ref: '#/components/schemas/Placement' } }
                  next_cursor: { type: [string, 'null'] }
                  counts:
                    type: object
                    properties:
                      photos: { type: integer }
                      videos: { type: integer }
                      hidden: { type: integer }
                      trashed: { type: integer }
                      taken_away: { type: integer, description: 'Managers only: placements taken away by their senders (README §5.21).' }

  /v1/frames/{frameId}/placements/{placementId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/PlacementId' }
    patch:
      tags: [library]
      operationId: updatePlacement
      description: Sender of the item, or manage_library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                trashed: { type: boolean, description: 'true moves to trash (30 days), false restores.' }
                approved: { type: boolean, description: Moderation decision (owner/admin). }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [library]
      operationId: purgePlacement
      description: Permanent removal (skips trash).
      responses:
        '204': { description: Purged }

  /v1/frames/{frameId}/placements:bulk:
    post:
      tags: [library]
      operationId: bulkUpdatePlacements
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement_ids, action]
              properties:
                placement_ids: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Id' } }
                action: { type: string, enum: [hide, unhide, trash, restore, purge, add_to_album, remove_from_album] }
                album_id: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Per-id outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: array, items: { $ref: '#/components/schemas/Id' } }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        code: { $ref: '#/components/schemas/ProblemCode' }

  /v1/frames/{frameId}/placements:share:
    post:
      tags: [library]
      operationId: sharePlacements
      description: |
        Share photos and videos from this frame's library to other frames without uploading them again (README §5.3,
        "Sharing between frames"). Each new placement references the **same item**: no new upload, master or blob copy;
        a frame rendition is only made when the target's screen size has none yet.

        - Source: every placement must be live on `{frameId}` (not trashed or awaiting moderation), and the caller needs
          `see_library` there or be the item's sender (or the member who shared it there).
        - Targets: the caller needs `send` on every frame in `frame_ids`. The target's moderation applies
          (`pending_moderation` unless the caller manages that frame), and at most `limits.max_items_per_send`
          placements may be shared per request.
        - A target that already holds the item is skipped and reported in `skipped`.
        - New placements keep the item's original sender (who hears about reactions, and sees them in their history)
          and record `shared_by_user_id` / `shared_by_name` (the sharer, who gets the "delivered" push).
        - The original sender's unsend removes shared placements too. Owners and admins of a target manage them like any
          other placement; the sharer may hide, trash or purge the placements they created (that is how clients undo).
        - `dry_run: true` validates and reports `skipped` without creating anything, so pickers can show which frames
          already have the selection.
        - All-or-nothing validation; repeat-safe with `Idempotency-Key`.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement_ids, frame_ids]
              properties:
                placement_ids: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Id' } }
                frame_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Created placements and skipped targets, content: { application/json: { schema: { $ref: '#/components/schemas/ShareResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- albums
  /v1/frames/{frameId}/albums:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [albums]
      operationId: listAlbums
      responses:
        '200':
          description: Albums
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Album' } } } }
    post:
      tags: [albums]
      operationId: createAlbum
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlbumWrite' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Album' } } } }

  /v1/frames/{frameId}/albums/{albumId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { name: albumId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [albums]
      operationId: updateAlbum
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlbumWrite' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Album' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [albums]
      operationId: deleteAlbum
      description: |
        Placements stay on the frame, unless `remove_source_items` is true: then the photos the album's photo sources
        imported are removed too (docs/spec/photo-sources.md §9.1). The album's photo sources are deleted either way.
      parameters:
        - name: remove_source_items
          in: query
          description: Also remove the photos this album's photo sources imported (clients ask when `photo_source_count` > 0).
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Deleted }

  /v1/frames/{frameId}/albums/{albumId}/photo-sources:
    get:
      tags: [photo-sources]
      operationId: listAlbumPhotoSources
      description: The album's photo sources with their status (album managers, i.e. owner, admin or manage_library; `403 missing_permission` otherwise).
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: albumId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: Sources, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhotoSource' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- feeds
  /v1/feeds:
    get:
      tags: [feeds]
      operationId: listMyFeeds
      description: Feeds the caller is a member of (any role). See docs/spec/feeds.md.
      responses:
        '200':
          description: Feeds
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FeedSummary' } }
    post:
      tags: [feeds]
      operationId: createFeed
      description: The caller becomes the feed's owner. At most `limits.max_feeds_per_user` owned feeds (`409 limit_reached`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Feed' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [feeds]
      operationId: getFeed
      description: Feed members only; everyone else gets `404 not_found` (feeds are never discoverable).
      responses:
        '200': { description: Feed, content: { application/json: { schema: { $ref: '#/components/schemas/Feed' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [feeds]
      operationId: updateFeed
      description: |
        Owner or admin. Renaming re-emits the feed's placements on every subscribed frame so their credit follows.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Feed' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [feeds]
      operationId: deleteFeed
      description: |
        Owner only. Removes every post from every subscribed frame (placements that also reached a frame directly
        stay), ends all subscriptions (`removed`, reason `feed_deleted`) and notifies the frames' owners and admins.
        Items stay in the posters' sent history. Runs in the background; the feed is gone for clients at once.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/leave:
    post:
      tags: [feeds]
      operationId: leaveFeed
      description: |
        Remove your own feed membership. The owner must transfer ownership first (`409 owner_cannot_leave`).
        README §5.21: `photos` `keep` (default) or `take`, `comments` `keep` (default) or `delete`, and
        `leave_frame_ids` to leave frames in the same request. Requests with `photos` get `200` with the result;
        requests without it (older clients) get `204`.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveFeedRequest' }
      responses:
        '200': { description: Left, content: { application/json: { schema: { $ref: '#/components/schemas/TakeAwayResult' } } } }
        '204': { description: Left }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/transfer:
    post:
      tags: [feeds]
      operationId: transferFeedOwnership
      description: Owner only. The new owner must be a member; the previous owner becomes admin.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Transferred }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/members:
    get:
      tags: [feeds]
      operationId: listFeedMembers
      description: Any feed member.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200':
          description: Members
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeedMember' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [feeds]
      operationId: updateFeedMember
      description: Owner or admin. Admins cannot change the owner or other admins, and only change posters and members. Ownership moves with `transferFeedOwnership`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, poster, member] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FeedMember' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [feeds]
      operationId: removeFeedMember
      description: Owner or admin (admins cannot remove the owner or other admins).
      parameters:
        - name: remove_posts
          in: query
          description: Also remove the member's posts from the feed and every subscribed frame.
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/join-requests:
    get:
      tags: [feeds]
      operationId: listFeedJoinRequests
      description: Owner or admin. Pending requests from join invites (`via` is `invite`, `email` for join links mailed to senders, or `telegram` for join links the Telegram bot gave).
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200':
          description: Pending requests
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/join-requests/{requestId}/{decision}:
    post:
      tags: [feeds]
      operationId: decideFeedJoinRequest
      description: Owner or admin. Approved requesters become posters, or members when the feed has `new_members_can_post` off.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, deny] } }
      responses:
        '204': { description: Decided }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/invites:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [feeds]
      operationId: listFeedInvites
      description: |
        Owner or admin: all active (not expired, revoked or used up) invites. Posters, when the feed has
        `posters_can_invite`: their own active invites.
      responses:
        '200':
          description: Active invites
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeedInvite' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [feeds]
      operationId: createFeedInvite
      description: |
        Owner or admin, or any member when the feed has `posters_can_invite` (default off) for `join` invites;
        `subscribe` invites are pre-approved and stay owner/admin only (`403 forbidden`). Returns a link (`https://<web>/fi/<token>`, also shown as QR) and a short code for the
        app's "Enter a code" field. `join` invites make the redeemer a poster (after approval unless the feed's
        `invite_requires_approval` is off); `subscribe` invites let the redeemer subscribe frames they manage,
        pre-approved, without joining.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedInviteCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FeedInvite' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/invites/{inviteId}:
    delete:
      tags: [feeds]
      operationId: revokeFeedInvite
      description: Owner or admin, or the poster who created it.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { name: inviteId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feed-invites:lookup:
    post:
      tags: [feeds]
      operationId: lookupFeedInvite
      description: |
        Resolve a short feed invite code (typed into "Enter a code"; codes contain letters, frame codes are 8 digits)
        to its preview, including the token for `acceptFeedInvite`. Rate-limited like code redemption; unknown codes
        answer `404 invite_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}-?[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{4}$', description: '8 Crockford base32 characters, hyphen optional, case-insensitive.' }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/FeedInvitePreview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/feed-invites/{token}:
    get:
      tags: [feeds]
      operationId: previewFeedInvite
      description: Requires sign-in so tokens can't be enumerated anonymously.
      parameters: [ { $ref: '#/components/parameters/InviteToken' } ]
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/FeedInvitePreview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /v1/feed-invites/{token}/accept:
    post:
      tags: [feeds]
      operationId: acceptFeedInvite
      description: |
        `join` invites: no body needed; the caller joins as poster or a join request is created. `subscribe` invites:
        `frame_ids` (frames the caller manages: owner, admin or `change_settings`) are subscribed and active at once;
        frames that already have a live subscription to the feed are reported with their existing one.
      parameters:
        - { $ref: '#/components/parameters/InviteToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedInviteAccept' } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/FeedInviteResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- feed posts
  /v1/feeds/{feedId}/posts:
    get:
      tags: [feeds]
      operationId: listFeedPosts
      description: |
        Any feed member, newest first. `receipts` are present on the caller's own posts, on every post for owner and
        admins, and on every post for everyone when the feed has `members_see_receipts`; `reactions` (frames'
        reactions and replies) likewise with `members_see_reactions`; otherwise they are null. Circle posts only for
        circle members. Post as a feed is done with `createSend` (`feed_ids`).
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: poster_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: Page of posts
          content:
            application/json:
              schema:
                type: object
                required: [posts, next_cursor]
                properties:
                  posts: { type: array, items: { $ref: '#/components/schemas/FeedPost' } }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/posts/{postId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/PostId' }
    get:
      tags: [feeds]
      operationId: getFeedPost
      responses:
        '200': { description: Post, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPost' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [feeds]
      operationId: removeFeedPost
      description: |
        The poster (unsend) or an owner/admin of the feed. Removes the post from the feed and its placements from every
        subscribed frame, except placements that also reached a frame directly or through another feed. The send and its
        direct placements are untouched. Never needs a frame to be online.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/posts/{postId}/items/{itemId}:
    delete:
      tags: [feeds]
      operationId: removeFeedPostItem
      description: Like `removeFeedPost` for one item. Removing the last item removes the post.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/PostId' }
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/posts/{postId}/receipts:
    get:
      tags: [feeds]
      operationId: getFeedPostReceipts
      description: |
        Per-frame delivery, seen state, reactions and replies of one post. Same visibility as `FeedPost.receipts`
        (`members_see_receipts`; `403 missing_permission` otherwise). Hidden and trashed placements are reported as delivered or seen, like
        for direct sends; who moderated is never revealed.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/PostId' }
      responses:
        '200': { description: Receipts, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPostReceipts' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- feed birthdays
  /v1/feeds/{feedId}/birthdays:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [feeds]
      operationId: listFeedBirthdays
      description: |
        The feed's birthday people (docs/spec/birthdays.md), sorted by the next birthday in the caller's time zone.
        Any feed member sees `approved` ones; owner and admins also see `pending` and `rejected` ones (rejected for 30
        days), posters their own suggestions. `birth_year` is null unless the caller may see it (owner/admin, whoever
        added the entry, the linked member, or `show_age` on).
      parameters:
        - name: status
          in: query
          description: Only this status (default all the caller may see).
          schema: { $ref: '#/components/schemas/BirthdayStatus' }
      responses:
        '200':
          description: Birthday people
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [feeds]
      operationId: createFeedBirthday
      description: |
        Add a birthday person. Owner, admins and (with the feed's `posters_can_add_birthdays`) posters add it as
        `approved`: it reaches every frame with a birthday subscription. Other posters create a `pending` suggestion
        and the feed's owner and admins are notified (`birthday.suggested`, push `birthday_suggestion`).
        `409 duplicate_birthday` (existing entry's id in `detail`) when a pending or approved entry of this feed has
        the same normalized name, day and month; `409 limit_reached` beyond `limits.max_birthdays_per_feed`
        (pending and approved count); `422 validation_failed` for an impossible date (`day`) or year (`birth_year`).
        `user_id` must be a member of this feed without another entry. The photo is uploaded afterwards with
        `putFeedBirthdayPhoto`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPersonCreate' } } }
      responses:
        '201': { description: Created (approved or pending), content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/birthdays/{birthdayId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/BirthdayId' }
    get:
      tags: [feeds]
      operationId: getFeedBirthday
      description: Same visibility and field rules as `listFeedBirthdays`.
      responses:
        '200': { description: Birthday person, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [feeds]
      operationId: updateFeedBirthday
      description: |
        Owner and admins: any field of any entry (also of a pending suggestion before approving it). The suggester:
        their pending suggestion. Posters with `posters_can_add_birthdays`: entries they added. The linked member:
        `birth_year`, `show_age` and unlinking (`user_id: null`) of their own entry. Other fields answer
        `403 forbidden`. Omitted fields are kept; `birth_year: null` clears the year. Changes to approved entries
        reach the frames with a `birthdays` change. Same `409`/`422` rules as `createFeedBirthday`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPersonUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [feeds]
      operationId: removeFeedBirthday
      description: |
        Owner and admins (any entry), the suggester (withdraw a pending suggestion), posters with
        `posters_can_add_birthdays` (entries they added) and the linked member (their own entry). Deletes the entry,
        its photo and its greetings; frames drop the person with the next `birthdays` change. Not reversible on the
        server: clients offer Undo by creating it again.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/birthdays/{birthdayId}/approve:
    post:
      tags: [feeds]
      operationId: approveFeedBirthday
      description: |
        Owner or admin; `pending` → `approved`. Notifies the suggester (`birthday.decided`, push `birthday_decided`)
        and puts the person on the frames. Repeating it on an approved entry returns it unchanged;
        `409 already_decided` on a rejected one; `409 duplicate_birthday` when an approved entry with the same name
        and date appeared meanwhile.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/BirthdayId' }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/birthdays/{birthdayId}/reject:
    post:
      tags: [feeds]
      operationId: rejectFeedBirthday
      description: |
        Owner or admin; `pending` → `rejected`. Notifies the suggester. The entry stays visible to the suggester and
        admins for 30 days, then it is deleted; a new suggestion for the same person is allowed at once. Repeating it
        returns the entry unchanged; `409 already_decided` on an approved one (remove it instead).
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/BirthdayId' }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/birthdays/{birthdayId}/photo:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/BirthdayId' }
    put:
      tags: [feeds]
      operationId: putFeedBirthdayPhoto
      description: |
        Set the person's photo, like `putAvatar`: the server crops to a centred square, stores 256x256 WebP at a new
        unguessable URL and deletes the previous file. Whoever may edit the entry's photo (see `updateFeedBirthday`;
        the linked member too).
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
          image/png: { schema: { type: string, contentMediaType: image/png } }
          image/webp: { schema: { type: string, contentMediaType: image/webp } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [feeds]
      operationId: deleteFeedBirthdayPhoto
      description: Remove the uploaded photo; the linked member's avatar (if any) is used instead.
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/BirthdayPerson' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/birthday-greetings:
    get:
      tags: [feeds]
      operationId: listFeedBirthdayGreetings
      description: |
        Greetings frames sent for this feed's birthday people ("Opa's frame says happy birthday to Oma"), newest
        first, kept 13 months. Any feed member.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: birthday_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: date, in: query, description: Only greetings for this occurrence date., schema: { type: string, format: date } }
      responses:
        '200':
          description: Page of greetings
          content:
            application/json:
              schema:
                type: object
                required: [greetings, next_cursor]
                properties:
                  greetings: { type: array, items: { $ref: '#/components/schemas/FeedBirthdayGreeting' } }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/preferences:
    patch:
      tags: [feeds]
      operationId: updateFeedPreferences
      description: |
        The caller's own preferences in this feed (any member). `birthday_notifications` (default true): the morning
        notification on a birthday day and greeting notifications for this feed's people.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedPreferencesUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Feed' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- subscriptions
  /v1/feeds/{feedId}/subscriptions:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [subscriptions]
      operationId: listFeedSubscriptions
      description: |
        Owner and admins see every status, including who requested. Other members see `active` and `paused`
        subscriptions only, without `requested_by_name`. Rejected and removed ones are listed for 30 days.
      parameters:
        - name: status
          in: query
          description: Only this status (default all the caller may see).
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
      responses:
        '200':
          description: Subscriptions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [subscriptions]
      operationId: requestSubscription
      description: |
        Subscribe a frame to this feed. The caller must be a feed member and a manager of the frame (owner, admin or
        `change_settings`). The subscription is `active` at once when the caller is owner/admin of the feed or the feed
        has `auto_approve_subscriptions`; otherwise it is `pending` and the feed's owner and admins are notified.
        `409 already_subscribed` (with the existing subscription in `detail`) when the frame has a live subscription to
        this feed; `409 limit_reached` beyond `limits.max_subscriptions_per_feed`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionRequest' } } }
      responses:
        '201': { description: Created (pending or active), content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/subscriptions:
    get:
      tags: [subscriptions]
      operationId: listFrameSubscriptions
      description: |
        The feeds a frame subscribes to. Frame managers (owner, admin, `change_settings`) see every status; other
        members see `active` and `paused` ones.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - name: status
          in: query
          description: Only this status (default all the caller may see).
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
      responses:
        '200':
          description: Subscriptions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/subscriptions/{subscriptionId}:
    parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
    get:
      tags: [subscriptions]
      operationId: getSubscription
      description: Visible to the frame's members and the feed's members, with the same field rules as the lists.
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [subscriptions]
      operationId: updateSubscription
      description: |
        Frame managers only. Changing the history option backfills (quietly) or trims feed-only placements of
        history items; posts made after `activated_at` are never trimmed. Allowed in `pending`, `active` and
        `paused`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [subscriptions]
      operationId: removeSubscription
      description: |
        Ends a subscription (`removed`): frame managers unsubscribe (or withdraw a pending request), the requester may
        withdraw their pending request, and feed owners/admins remove any subscription. Feed-only placements leave the
        frame; `slideshow.feed_id` resets to null if it pointed at this feed. The other side is notified.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/subscriptions/{subscriptionId}/approve:
    post:
      tags: [subscriptions]
      operationId: approveSubscription
      description: Feed owner or admin; `pending` → `active`. Starts the history backfill and notifies the requester.
      parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/subscriptions/{subscriptionId}/reject:
    post:
      tags: [subscriptions]
      operationId: rejectSubscription
      description: Feed owner or admin; `pending` → `rejected`. Notifies the requester.
      parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/subscriptions/{subscriptionId}/pause:
    post:
      tags: [subscriptions]
      operationId: pauseSubscription
      description: |
        Frame managers; `active` → `paused`. The feed's placements leave the frame (kept on the server, restored on
        resume) unless they also reached it directly or through another active feed. No new posts are placed.
      parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
      responses:
        '200': { description: Paused, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/subscriptions/{subscriptionId}/resume:
    post:
      tags: [subscriptions]
      operationId: resumeSubscription
      description: |
        Frame managers; `paused` → `active`. Restores the feed's placements and quietly places the posts made while
        paused.
      parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
      responses:
        '200': { description: Resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- photo sources (docs/spec/photo-sources.md)
  /v1/feeds/{feedId}/photo-sources:
    get:
      tags: [photo-sources]
      operationId: listFeedPhotoSources
      description: The feed's photo sources with their status (feed owner and admins; posters get `403 missing_permission`).
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200':
          description: Sources, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhotoSource' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-sources:
    get:
      tags: [photo-sources]
      operationId: listMyPhotoSources
      description: Sources the caller owns (set up), across all albums and feeds, for Settings → Photo sources.
      responses:
        '200':
          description: Sources, newest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhotoSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [photo-sources]
      operationId: createPhotoSource
      description: |
        Connect an outside album to a kinframe album (`album_id`: album managers of its frame) or a feed (`feed_id`:
        feed owner/admins). The caller becomes the source's owner: imported photos are sent by them. The server tests
        the connection first (`422 source_test_failed` with the `PhotoSourceErrorCode` in `detail`; a blocked private
        address is `422 validation_failed` on `url`/`server_url`), then starts the first run (`running: true`).
        Secrets (`url`, `api_key`, `password`) are sealed at rest and never returned. `409 duplicate_source` when the
        same outside album already feeds this target (`detail`: its id), `409 limit_reached` beyond
        `limits.max_photo_sources_per_target` or `max_photo_sources_per_user`, `503 feature_disabled` when the server
        has photo sources (or this provider) turned off. Rate-limited (30/h per user).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSourceCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSource' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-sources:test:
    post:
      tags: [photo-sources]
      operationId: testPhotoSource
      description: |
        Try a connection without saving it: reads the outside album's name and size, and the warnings the source would
        have (`downloads_disabled`, `metadata_hidden`). `ok: false` with `error_code` when it cannot be read. For
        `immich_api` without `immich_album_id`, `albums` lists the account's albums (like `listImmichAlbums`).
        Rate-limited together with `listImmichAlbums` (30/h per user).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSourceConnection' } } }
      responses:
        '200': { description: Outcome, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSourceTestResult' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-sources:immich-albums:
    post:
      tags: [photo-sources]
      operationId: listImmichAlbums
      description: |
        The albums an Immich API key can read (own and shared with that account), before creating an `immich_api`
        source, so the client can let the person pick one. Nothing is saved. Failures answer `200` with `ok: false`
        and `error_code`, like `testPhotoSource`. Rate-limited together with `testPhotoSource`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImmichConnection' } } }
      responses:
        '200': { description: Albums, content: { application/json: { schema: { $ref: '#/components/schemas/ImmichAlbumList' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-sources/{sourceId}:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    get:
      tags: [photo-sources]
      operationId: getPhotoSource
      description: Managers of the target (album managers, feed owner/admins) and the owner. Others get `404 not_found`.
      responses:
        '200': { description: Source, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [photo-sources]
      operationId: updatePhotoSource
      description: |
        Managers of the target. Omitted fields are kept. `paused: true|false` pauses or resumes (repeating is a no-op).
        Changing the link, server URL, key, password or album tests it first (`422 source_test_failed`) and then
        syncs at once; success returns an `error`/`needs_attention` source to `active`. `take_over: true` makes the
        caller the owner (needed after `owner_lost_access`; for `immich_api` together with a new `api_key`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSourceUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSource' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [photo-sources]
      operationId: deletePhotoSource
      description: |
        Stop syncing (managers of the target). With `remove_items` the photos this source imported are removed from
        the frame (album) or from the feed's posts, like an unsend, in the background; without it they stay as the
        owner's ordinary photos (still credited "via …"). Clients ask which, showing `counts.imported`.
      parameters:
        - name: remove_items
          in: query
          required: true
          description: Also remove the photos this source imported.
          schema: { type: boolean }
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-sources/{sourceId}/sync:
    post:
      tags: [photo-sources]
      operationId: syncPhotoSource
      description: |
        Sync now (managers of the target). Returns at once with `running: true`. At most once per 2 minutes per source
        and 30 per hour per user (`429` with `Retry-After`). A paused source answers `409 invalid_transition`.
        `confirm_removals: true` applies removals held back by the mass-removal guard (`pending_removals`,
        `last_error_code: mass_removal`).
      parameters: [ { $ref: '#/components/parameters/SourceId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_removals: { type: boolean, default: false, description: Remove the photos that disappeared upstream although there were many. }
      responses:
        '202': { description: Sync started, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSource' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Google Photos import
  /v1/google-imports:
    get:
      tags: [photo-sources]
      operationId: listMyGoogleImports
      description: The caller's imports of the last 7 days, newest first (so an app that was closed while the picker was open can resume).
      responses:
        '200':
          description: Imports
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GoogleImport' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [photo-sources]
      operationId: startGoogleImport
      description: |
        "Add from Google Photos" into an album (album managers) or a feed (any feed member). Answers `needs_auth` with
        `auth_url` (open it in a browser session; Google redirects to `googleOAuthCallback`, which redirects to
        `return_uri`), or directly `picking` with `picker_uri` when the caller's previous import left a token with more
        than 10 minutes to live. `503 feature_disabled` when the server has no Google OAuth client (discovery
        `google_photos_import: false`). `return_uri` must be `app.kinframe:/google-import`,
        `<public URL>/google-import/return` or `<web>/google-import/return` (`422 validation_failed`). Rate-limited
        (20/h per user).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoogleImportCreate' } } }
      responses:
        '201': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleImport' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/google-imports/{importId}:
    get:
      tags: [photo-sources]
      operationId: getGoogleImport
      description: The importer only. Poll while `picking` or `importing` (every 2–5 s, or follow `google_import.updated`).
      parameters: [ { $ref: '#/components/parameters/ImportId' } ]
      responses:
        '200': { description: Import, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleImport' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/google-imports/{importId}/cancel:
    post:
      tags: [photo-sources]
      operationId: cancelGoogleImport
      description: |
        Cancel (the importer). From `needs_auth` or `picking` the picker session is deleted; from `importing` the server
        stops after the current file and keeps what was added (undo is `unsend` of `send_ids`). A finished import
        answers `409 invalid_transition`; cancelling a cancelled one returns it unchanged.
      parameters: [ { $ref: '#/components/parameters/ImportId' } ]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleImport' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/oauth/google/callback:
    get:
      tags: [photo-sources]
      operationId: googleOAuthCallback
      security: []
      description: |
        Google's OAuth redirect (registered by the operator as `<public URL>/v1/oauth/google/callback`). Opened by the
        browser, never called by clients. Checks `state` (single use, 15 minutes), exchanges `code` with the PKCE
        verifier, creates the picker session and answers `302` to the import's `return_uri` with
        `?import_id=<id>&status=<GoogleImportStatus>` (`picking`, or `failed` after a denied or failed consent).
        An unknown, expired or reused `state` gets a small HTML page instead of a redirect.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: code, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: error, in: query, description: Set by Google when consent failed (e.g. `access_denied`)., schema: { type: string, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        '302': { description: Redirect to the import's `return_uri` }
        '400': { description: 'Unknown, expired or reused state (HTML page)', content: { text/html: { schema: { type: string } } } }

  # ---------------------------------------------------------------- email inbox (docs/spec/email-inbox.md)
  /v1/frames/{frameId}/email-addresses:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [email-inbox]
      operationId: listFrameEmailAddresses
      description: 'The frame''s inbox addresses (frame managers: owner, admin, `change_settings`; others `403 missing_permission`).'
      responses:
        '200':
          description: Addresses, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmailAddress' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [email-inbox]
      operationId: createFrameEmailAddress
      description: |
        A new address that fills this frame (frame managers). The caller becomes its `owner`: mail from senders without
        a matching account is sent by them. `409 limit_reached` beyond `limits.max_email_addresses_per_target`,
        `503 feature_disabled` without discovery `email_inbox`. Rate-limited (30/h per user).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddressCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddress' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/email-addresses:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [email-inbox]
      operationId: listFeedEmailAddresses
      description: The feed's inbox addresses (feed owner and admins; posters get `403 missing_permission`).
      responses:
        '200':
          description: Addresses, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmailAddress' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [email-inbox]
      operationId: createFeedEmailAddress
      description: A new address that posts to this feed (feed owner and admins). Otherwise as `createFrameEmailAddress`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddressCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddress' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}:
    parameters: [ { $ref: '#/components/parameters/AddressId' } ]
    get:
      tags: [email-inbox]
      operationId: getEmailAddress
      description: Managers of the target (frame managers, feed owner/admins). Others get `404 not_found`.
      responses:
        '200': { description: Address, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddress' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [email-inbox]
      operationId: updateEmailAddress
      description: |
        Managers of the target. Omitted fields are kept. `paused: true|false` pauses or resumes (repeating is a no-op;
        mail to a paused address is refused with `550 5.2.1`). A new `slug` changes the address (the random part
        stays) and retires the old one at once. `take_over: true` makes the caller the owner.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddressUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddress' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [email-inbox]
      operationId: deleteEmailAddress
      description: |
        Managers of the target. The address stops working at once and is never issued again; its senders, held mail
        and email join links go with it. Photos already delivered stay.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/regenerate:
    post:
      tags: [email-inbox]
      operationId: regenerateEmailAddress
      description: |
        A new random part (managers of the target): the old address stops working at once and is never issued again.
        Senders, settings and held mail stay. Rate-limited (10/h per address).
      parameters: [ { $ref: '#/components/parameters/AddressId' } ]
      responses:
        '200': { description: Regenerated, content: { application/json: { schema: { $ref: '#/components/schemas/EmailAddress' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/senders:
    parameters: [ { $ref: '#/components/parameters/AddressId' } ]
    get:
      tags: [email-inbox]
      operationId: listEmailSenders
      description: |
        The allowed and blocked senders (managers of the target), by email. Members of the target are allowed
        automatically by their verified account email and are not listed. Pending senders are in
        `listEmailPendingSenders`.
      responses:
        '200':
          description: Senders
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmailSender' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [email-inbox]
      operationId: addEmailSender
      description: |
        Allow (or with `blocked: true` block) an address (managers of the target). A pending sender with that address
        is approved (and their held mail delivered) or rejected and blocked. `409 duplicate_sender` when it is already
        allowed or blocked (`detail`: its id), `409 limit_reached` beyond `limits.max_email_senders_per_address`.
        Rate-limited (120/h per user).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSenderCreate' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/EmailSender' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/senders/{senderId}:
    parameters:
      - { $ref: '#/components/parameters/AddressId' }
      - { $ref: '#/components/parameters/SenderId' }
    patch:
      tags: [email-inbox]
      operationId: updateEmailSender
      description: 'Rename, block (`blocked: true`) or unblock (`blocked: false`) an allowed or blocked sender (managers of the target).'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSenderUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/EmailSender' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [email-inbox]
      operationId: removeEmailSender
      description: |
        Remove an allowed or blocked sender (managers of the target): their next mail is held as from an unknown
        sender again. Their unused email join link is revoked.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/pending-senders:
    get:
      tags: [email-inbox]
      operationId: listEmailPendingSenders
      description: Senders waiting for approval, with their held mail (managers of the target), newest first.
      parameters: [ { $ref: '#/components/parameters/AddressId' } ]
      responses:
        '200':
          description: Pending senders
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmailPendingSender' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/pending-senders/{senderId}/approve:
    post:
      tags: [email-inbox]
      operationId: approveEmailSender
      description: |
        Allow a pending sender (managers of the target). With `deliver` (default) their authenticated held mail is
        delivered now (unverified held mail stays held; deliver it one by one with `deliverEmailHeldMessage`). The
        sender gets a `delivered` reply when the address sends confirmations. `409 already_decided` when someone else
        decided first.
      parameters:
        - { $ref: '#/components/parameters/AddressId' }
        - { $ref: '#/components/parameters/SenderId' }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSenderApprove' } } }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/EmailSender' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/pending-senders/{senderId}/reject:
    post:
      tags: [email-inbox]
      operationId: rejectEmailSender
      description: |
        Reject a pending sender (managers of the target): their held mail is deleted, nobody tells them. With `block`
        their later mail is dropped silently (`204` either way). `409 already_decided` when someone else decided first.
      parameters:
        - { $ref: '#/components/parameters/AddressId' }
        - { $ref: '#/components/parameters/SenderId' }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSenderReject' } } }
      responses:
        '204': { description: Rejected }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/held-messages/{messageId}:
    parameters:
      - { $ref: '#/components/parameters/AddressId' }
      - { $ref: '#/components/parameters/HeldMessageId' }
    get:
      tags: [email-inbox]
      operationId: getEmailHeldMessage
      description: One held mail with its photos and videos as short-lived thumbnail URLs (managers of the target).
      responses:
        '200': { description: Held mail, content: { application/json: { schema: { $ref: '#/components/schemas/EmailHeldMessage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [email-inbox]
      operationId: deleteEmailHeldMessage
      description: Delete one held mail without deciding about its sender (managers of the target).
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/held-messages/{messageId}/deliver:
    post:
      tags: [email-inbox]
      operationId: deliverEmailHeldMessage
      description: |
        Deliver this one held mail (managers of the target), also an unverified one (`reason: unverified_sender`):
        sent by the address owner, credited to the claimed name, never answered. The sender is not allowed by it.
      parameters:
        - { $ref: '#/components/parameters/AddressId' }
        - { $ref: '#/components/parameters/HeldMessageId' }
      responses:
        '200': { description: Delivered, content: { application/json: { schema: { $ref: '#/components/schemas/EmailMessage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/email-addresses/{addressId}/messages:
    get:
      tags: [email-inbox]
      operationId: listEmailMessages
      description: Recent mail (last 30 days) to the address and what became of it (managers of the target), newest first.
      parameters:
        - { $ref: '#/components/parameters/AddressId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Recent mail, content: { application/json: { schema: { $ref: '#/components/schemas/EmailMessagePage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/inbound/email:
    post:
      tags: [email-inbox]
      operationId: receiveInboundEmail
      security: [ { inboundWebhook: [] } ]
      description: |
        **Operator integration, not for clients.** A mail provider or forwarding service posts one received message
        (raw MIME, exactly as received) for kinframe to process (docs/spec/email-inbox.md §6.3). Only when the
        operator set `KINFRAME_EMAIL_WEBHOOK_SECRET` (`404 not_found` otherwise; `503 feature_disabled` while the
        inbox is off). Signed with HMAC-SHA256 (`inboundWebhook`); a bad or replayed signature or a timestamp more than
        5 minutes off is `401 unauthorized`. `413 upload_too_large` above `limits.max_email_message_bytes`. The
        message is queued and processed asynchronously; the answer reports each envelope recipient. Do not retry a
        `2xx` or `4xx`; retry `429` and `5xx` (a retried message is recognised and not delivered twice). Rate-limited
        (600/min).
      parameters:
        - { name: X-Kinframe-Timestamp, in: header, required: true, description: Unix seconds when the request was signed., schema: { type: string, pattern: '^[0-9]{1,12}$' } }
        - { name: X-Kinframe-Envelope-To, in: header, required: true, description: 'The envelope recipient(s) (SMTP RCPT TO), comma-separated. BCC recipients exist only here.', schema: { type: string, maxLength: 4096 } }
        - { name: X-Kinframe-Envelope-From, in: header, description: The envelope sender (SMTP MAIL FROM); empty for the null sender., schema: { type: string, maxLength: 512 } }
        - { name: X-Kinframe-Client-Ip, in: header, description: The IP address of the server that delivered the mail to the provider. Without it SPF is not checked (DKIM only)., schema: { type: string, maxLength: 64 } }
        - { name: X-Kinframe-Helo, in: header, description: That server's HELO/EHLO name., schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          message/rfc822:
            schema: { type: string, format: binary }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/EmailInboundResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/inbound/email:check:
    post:
      tags: [email-inbox]
      operationId: checkInboundEmailRecipients
      security: [ { inboundWebhook: [] } ]
      description: |
        **Operator integration, not for clients.** Which recipients exist and are active, so a provider can refuse
        unknown ones during its own SMTP dialogue. Signed like `receiveInboundEmail`, with the JSON body as the body and
        empty envelope fields.
      parameters:
        - { name: X-Kinframe-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailRecipientCheck' } } }
      responses:
        '200': { description: Recipients, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRecipientCheckResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- telegram (docs/spec/telegram.md)
  /v1/frames/{frameId}/telegram-chats:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [telegram]
      operationId: listFrameTelegramChats
      description: |
        Frame managers (owner, admin, `change_settings`). The Telegram chats connected to this frame: live ones first,
        then those disconnected in the last 30 days. `503 feature_disabled` without discovery `telegram`.
      responses:
        '200': { description: Chats, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TelegramChat' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/telegram-codes:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    post:
      tags: [telegram]
      operationId: createFrameTelegramCode
      description: |
        Frame managers. A one-time connect code in a Telegram deep link (docs/spec/telegram.md §5.1): `chat_kind:
        group` gives `https://t.me/<bot>?startgroup=<code>` (pick a group; the bot joins and binds it), `private`
        gives `https://t.me/<bot>?start=<code>` (a private chat with the bot). The caller becomes the chat's owner. The
        code is single use and expires after 30 minutes; a new code for the same frame and kind revokes the caller's
        previous open one. `409 limit_reached` at `limits.max_telegram_chats_per_target` or
        `max_telegram_chats_per_user`, `409 telegram_already_linked` for `link_account` when the caller is linked
        already, `503 feature_disabled` without a bot, `429 rate_limited` (30/h per user).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TelegramConnectCodeCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCode' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/telegram-chats:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [telegram]
      operationId: listFeedTelegramChats
      description: Feed owner and admins. As `listFrameTelegramChats`.
      responses:
        '200': { description: Chats, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TelegramChat' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/telegram-codes:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    post:
      tags: [telegram]
      operationId: createFeedTelegramCode
      description: Feed owner and admins. As `createFrameTelegramCode`; each batch from the chat becomes a post.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TelegramConnectCodeCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCode' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telegram-codes/{codeId}:
    parameters: [ { name: codeId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [telegram]
      operationId: getTelegramCode
      description: The caller's own code, to follow it until it is used (or listen to `telegram_code.updated`).
      responses:
        '200': { description: Code, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCode' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [telegram]
      operationId: revokeTelegramCode
      description: Revokes an open code of the caller (repeating it is a no-op).
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telegram-chats/{chatId}:
    parameters: [ { $ref: '#/components/parameters/TelegramChatId' } ]
    get:
      tags: [telegram]
      operationId: getTelegramChat
      description: Managers of the chat's target. Unknown chats and chats the caller may not manage are `404 not_found`.
      responses:
        '200': { description: Chat, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramChat' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [telegram]
      operationId: updateTelegramChat
      description: |
        Managers of the target. `paused` pauses (media is ignored, the bot stays silent) or resumes; `take_over: true`
        makes the caller the owner (the sender of outside contributions from now on; an owner who loses their rights is
        replaced by the frame's or feed's owner automatically). `notify_reactions` is the owner's own switch
        (`403 forbidden` for others). `topic_id` must be one of `topics` or null. `409 invalid_transition` on a
        disconnected chat.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TelegramChatUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramChat' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [telegram]
      operationId: disconnectTelegramChat
      description: |
        Managers of the target. The bot says goodbye and leaves the group (`ended_reason: disconnected`). Photos already
        sent stay (unsend them from history). The chat's join invites are revoked.
      responses:
        '204': { description: Disconnected }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telegram-chats/{chatId}/contributors:
    parameters: [ { $ref: '#/components/parameters/TelegramChatId' } ]
    get:
      tags: [telegram]
      operationId: listTelegramContributors
      description: Managers of the target. The people whose media the bot saw in this chat, most recent first.
      responses:
        '200': { description: Contributors, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TelegramContributor' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telegram-chats/{chatId}/contributors/{contributorId}:
    parameters:
      - { $ref: '#/components/parameters/TelegramChatId' }
      - { name: contributorId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [telegram]
      operationId: updateTelegramContributor
      description: Managers of the target. A blocked contributor's media is ignored silently in this chat, and their join invite is revoked.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TelegramContributorUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramContributor' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/telegram:
    get:
      tags: [telegram, me]
      operationId: getTelegramLink
      description: The Telegram account linked to the caller. `404 not_found` when none is linked.
      responses:
        '200': { description: Link, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramLink' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [telegram, me]
      operationId: unlinkTelegram
      description: Unlinks the caller's Telegram account. Later media from it counts as an outside contributor's.
      responses:
        '204': { description: Unlinked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/telegram/link-code:
    post:
      tags: [telegram, me]
      operationId: createTelegramLinkCode
      description: |
        "Link my Telegram": a one-time code in `https://t.me/<bot>?start=<code>`. Opening it and tapping Start in the
        private chat with the bot links that Telegram account to the caller (docs/spec/telegram.md §5.1). Single use, 30
        minutes. `409 telegram_already_linked` when the caller has a link already (unlink first), `503
        feature_disabled`, `429 rate_limited`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramCode' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/telegram/webhook:
    post:
      tags: [telegram]
      operationId: telegramWebhook
      security: [ { telegramWebhook: [] } ]
      description: |
        **Called by Telegram only, not for clients** (docs/spec/telegram.md §7). Registered by the server with
        `setWebhook` when it runs in webhook mode. A wrong or missing `X-Telegram-Bot-Api-Secret-Token` is `401`;
        `404 not_found` when no bot is configured or the server long-polls. The update is filtered, stored and
        acknowledged with an empty `200` at once; processing is asynchronous. Body at most 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: 'A Telegram Bot API `Update` object.' }
      responses:
        '200': { description: Accepted (also for updates the server ignores) }
        '401': { description: Wrong or missing secret token }
        '404': { description: 'No bot configured, or the server polls' }
        '413': { description: Body too large }

  # ---------------------------------------------------------------- family social: timeline and threads (docs/spec/family-social.md, README §5.18)
  /v1/timeline:
    get:
      tags: [social]
      operationId: getTimeline
      description: |
        Home: posts from every family (feed) the caller is a member of, with `member` and every other role, plus
        frame posts (direct sends to frames) the caller may see (README §5.18), newest first. Circle posts only for
        circle members. Chronological, never ranked. Removed posts are left out.
      parameters:
        - $ref: '#/components/parameters/Before'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: feed_id, in: query, description: Only this family's posts (the family screen)., schema: { $ref: '#/components/schemas/Id' } }
        - { name: circle_id, in: query, description: Only posts with this circle as audience., schema: { $ref: '#/components/schemas/Id' } }
        - { name: prompt_id, in: query, description: Only posts tagged with this weekly prompt (the answers)., schema: { $ref: '#/components/schemas/Id' } }
        - { name: frame_id, in: query, description: Only frame posts to this frame., schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Page of posts, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}:
    get:
      tags: [social]
      operationId: getPost
      description: |
        One feed post or frame post as on the timeline (push deep links, shared post cards). `404 not_found` when the
        caller may not see it or it was removed.
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      responses:
        '200': { description: Post, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePost' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/comments:
    parameters: [ { $ref: '#/components/parameters/PostId' } ]
    get:
      tags: [social]
      operationId: listComments
      description: |
        The thread, oldest first, flat: replies carry `parent_id` (always a top-level comment) and come after their
        parent; clients nest them. Frame entries (`kind: frame`) are in the same list. Comments by people the caller
        blocked are left out; comments removed by an admin are left out for everyone except their author.
      parameters:
        - $ref: '#/components/parameters/After'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Page of comments, content: { application/json: { schema: { $ref: '#/components/schemas/CommentPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [social]
      operationId: createComment
      description: |
        Anyone who may see the post (README §5.18). `409 comments_closed` when the thread is closed. Replies:
        `parent_id` is a top-level comment of this thread; a reply to a reply is sent with the top comment as
        `parent_id` and the person replied to as `quoted_user_id`. Mentions must point at people who may see the post
        (`422 validation_failed`, field `mentions`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommentCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/comments/{commentId}:
    parameters:
      - { $ref: '#/components/parameters/PostId' }
      - { $ref: '#/components/parameters/CommentId' }
    patch:
      tags: [social]
      operationId: updateComment
      description: The author only, any time (shows "edited"). Frame entries can't be edited (`403 forbidden`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommentUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [social]
      operationId: deleteComment
      description: |
        The author (a top comment with replies stays as a `deleted` tombstone, otherwise it disappears), or a
        moderator (feed owner/admin; for frame posts the frame's owner/admin): removed without a tombstone, with its
        replies; its author still sees it with `removed_by_admin`.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/thread:
    put:
      tags: [social]
      operationId: setThreadState
      description: The poster, or a moderator (feed owner/admin; frame owner/admin for frame posts). Closing keeps existing comments and reactions; new comments get `409 comments_closed`.
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/ThreadState' }
      responses:
        '200': { description: Thread, content: { application/json: { schema: { $ref: '#/components/schemas/ThreadSummary' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/read:
    put:
      tags: [social]
      operationId: markThreadRead
      description: Marks the thread read up to `up_to` (a comment id of this thread). Never moves backwards. Sends `thread.read` to the caller's other connections.
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [up_to]
              properties:
                up_to: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Marked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/mute:
    put:
      tags: [social]
      operationId: setThreadMute
      description: Mute or unmute pushes for this thread (comments, replies and mentions in it) for the caller.
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Problem' }

  /v1/posts/{postId}/prompt:
    put:
      tags: [engagement]
      operationId: tagPostPrompt
      description: |
        The poster: tag a feed post as an answer to one of its family's weekly prompts (the current week's or the
        previous week's), or untag it with null. Frame posts can't be tagged (`422 validation_failed`).
      parameters: [ { $ref: '#/components/parameters/PostId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt_id]
              properties:
                prompt_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
      responses:
        '200': { description: Post, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePost' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/reactions/{targetKind}/{targetId}:
    parameters:
      - { $ref: '#/components/parameters/TargetKind' }
      - { $ref: '#/components/parameters/TargetId' }
      - name: post_id
        in: query
        description: Required for `post_item` (the item's post; one item can be in several posts). Ignored otherwise.
        schema: { $ref: '#/components/schemas/Id' }
    get:
      tags: [social]
      operationId: listReactions
      description: Who reacted (people and, for posts and post items, frames), newest first. Same visibility as the target.
      responses:
        '200': { description: Reactions, content: { application/json: { schema: { $ref: '#/components/schemas/ReactionList' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [social]
      operationId: setReaction
      description: |
        The caller's reaction on a post, one item of a post, a comment or a chat message: one per person and target,
        the latest wins, null removes it. Allowed on closed threads. Not on frame entries or system messages
        (`422 validation_failed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { oneOf: [ { $ref: '#/components/schemas/PersonReaction' }, { type: 'null' } ] }
      responses:
        '200': { description: The target's new summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReactionSummary' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- circles (families' smaller groups)
  /v1/feeds/{feedId}/circles:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [circles]
      operationId: listCircles
      description: The circles of this family the caller is in; the feed's owner and admins see every circle (names and members, not their posts).
      responses:
        '200': { description: Circles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Circle' } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [circles]
      operationId: createCircle
      description: |
        Feed owner/admin, or any member when the feed has `members_can_create_circles` (default on). The creator is a
        circle admin; `member_ids` must be feed members. At most `limits.max_circles_per_feed` (`409 limit_reached`).
        Names are unique per family, case-insensitive (`422 validation_failed`, field `name`, code `duplicate`). The
        circle's chat (kind `circle`) is created with it.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CircleCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Circle' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/circles/{circleId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [circles]
      operationId: getCircle
      responses:
        '200': { description: Circle, content: { application/json: { schema: { $ref: '#/components/schemas/Circle' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [circles]
      operationId: updateCircle
      description: Circle admins and the feed's owner/admins. `frame_ids` replaces the extra frames the circle's posts reach.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CircleUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Circle' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [circles]
      operationId: deleteCircle
      description: |
        Circle admins and the feed's owner/admins. Removes the circle's posts everywhere (like `removeFeedPost`:
        frames, timeline, threads) and archives its chat. Clients warn first.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/circles/{circleId}/members:
    post:
      tags: [circles]
      operationId: addCircleMembers
      description: Circle admins and the feed's owner/admins add feed members (already present ones are ignored). They join the circle's chat.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/CircleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Circle, content: { application/json: { schema: { $ref: '#/components/schemas/Circle' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/circles/{circleId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/CircleId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [circles]
      operationId: updateCircleMember
      description: Circle admins and the feed's owner/admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/CircleRole' }
      responses:
        '200': { description: Circle, content: { application/json: { schema: { $ref: '#/components/schemas/Circle' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [circles]
      operationId: removeCircleMember
      description: Circle admins and the feed's owner/admins remove anyone; any member removes themself (leave). Their posts to the circle stay. Leaving the family leaves its circles.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- chats (README §5.19)
  /v1/conversations:
    get:
      tags: [chats]
      operationId: listConversations
      description: |
        Every conversation the caller is in (family and circle chats included), most recent activity first, with
        unread counts and the last message. Family-sized, so not paged. Archived conversations (the caller's own
        `archived`, or a deleted family or circle) only with `archived=true`.
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Conversations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [chats]
      operationId: createConversation
      description: |
        Start a `direct` or `group` chat (family and circle chats exist with their family or circle). Everyone in
        `member_ids` must share a family or a frame with the caller and must not have blocked them
        (`403 cannot_message`, `detail` names nobody). `direct`: exactly one other person; idempotent per pair: the
        existing conversation is returned with `200`. `group`: 2–99 others (3–100 people with the caller) and a
        `name`; the caller is its admin.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationCreate' } } }
      responses:
        '200': { description: The existing direct conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}:
    parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
    get:
      tags: [chats]
      operationId: getConversation
      description: Members only; everyone else gets `404 not_found`.
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [chats]
      operationId: updateConversation
      description: Groups only (`409 invalid_transition` otherwise; family and circle chats take their name from the family or circle). Group admins.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/photo:
    parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
    put:
      tags: [chats]
      operationId: putConversationPhoto
      description: 'Group admins. Like `putAvatar`: the server crops to a 256x256 WebP at a public, unguessable URL. Groups only.'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
          image/png: { schema: { type: string, contentMediaType: image/png } }
          image/webp: { schema: { type: string, contentMediaType: image/webp } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [chats]
      operationId: deleteConversationPhoto
      description: Group admins.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/members:
    post:
      tags: [chats]
      operationId: addConversationMembers
      description: |
        Groups only. Any member may add people who share a family or a frame with them and have not blocked them
        (`403 cannot_message`), up to 100 people. New members see messages from the moment they were added.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, minItems: 1, maxItems: 99, items: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [chats]
      operationId: updateConversationMember
      description: Groups only, group admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ConversationRole' }
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [chats]
      operationId: removeConversationMember
      description: |
        Groups only. Admins remove anyone; anyone removes themself (leave). When the last admin leaves, the
        longest-standing member becomes admin. Direct, family and circle chats can't be left (`409 invalid_transition`):
        archive or mute them, or leave the family or circle.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/preferences:
    patch:
      tags: [chats]
      operationId: updateConversationPreferences
      description: The caller's own mute and archive state for this conversation. A new message un-archives it.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationPreferencesUpdate' } } }
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/messages:
    parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
    get:
      tags: [chats]
      operationId: listMessages
      description: |
        A page of messages, always oldest first within the page. Neither cursor: the newest `limit` messages.
        `before`: the `limit` messages just before that message (scrolling up). `after`: the `limit` messages just
        after it (catching up after a reconnect). Both: `422 validation_failed`. Messages before the caller joined a
        group are not returned; messages from people the caller blocked are left out.
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Page of messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessagePage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [chats]
      operationId: sendMessage
      description: |
        At least one of `body`, `items`, `voice` and `shared_post_id`. Photos and videos use the normal uploads (tus, prepared
        uploads) and become ordinary items (`status: processing` until ready; `message.updated` follows). A voice
        message has `voice` and no `items` (README §5.19). Idempotent on `client_id` per author
        and conversation as well as on `Idempotency-Key`. Direct chats with someone who blocked the caller, or whose
        account is gone, answer `403 cannot_message`. Archived conversations are read-only (`409 invalid_transition`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MessageCreate' } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { $ref: '#/components/parameters/MessageId' }
    get:
      tags: [chats]
      operationId: getMessage
      responses:
        '200': { description: Message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [chats]
      operationId: updateMessage
      description: The author, within `limits.message_edit_hours` (24) of sending (`409 invalid_transition` after). Text only; items can't change.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MessageUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [chats]
      operationId: deleteMessage
      description: |
        The author, any time: the message stays as a tombstone ("This message was deleted"): `deleted: true`, no body,
        items or preview. Moderators (group admins; the feed's owner/admins in family and circle chats) may remove
        anyone's message: a tombstone with `removed_by_admin: true`. Items already put on a frame stay there.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/messages/{messageId}/send:
    post:
      tags: [chats]
      operationId: putMessageOnFrame
      description: |
        "Put on a frame": a normal send of the message's photos and videos (no new upload), to frames the caller may
        send to and families they may post to, with the usual limits, moderation and receipts. `item_ids` picks some
        (default: every photo and video; a voice recording is never sent). Items of other people's
        messages go to frames like `sharePlacements` (credit "Ben · shared by Anna", README §5.3) and can't be posted
        to families (`403 forbidden` when `feed_ids` is not empty). The conversation gets a `put_on_frame` system
        message, and frame reactions and quick replies on these placements show under the original message.
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/MessageId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutOnFrameRequest' } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/read:
    put:
      tags: [chats]
      operationId: markConversationRead
      description: |
        The caller read up to `message_id`. Never moves backwards. Other members get `read.updated` only when
        read receipts are shown in this conversation (README §5.19); the caller's other connections always do.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Marked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/conversations/{conversationId}/typing:
    post:
      tags: [chats]
      operationId: sendTyping
      description: |
        The caller is typing (or recording a voice message). Not stored: the other members who are connected get a
        `typing` event that expires after 6 s. Clients send it at most every 3 s while typing; more are ignored.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                activity: { type: string, enum: [typing, recording], default: typing }
      responses:
        '204': { description: Relayed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/contacts:
    get:
      tags: [chats]
      operationId: listContacts
      description: |
        People the caller shares at least one family or frame with: the only people they can start a chat with or add
        to a group. There is no search beyond this list. Sorted by display name.
      responses:
        '200': { description: Contacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Person' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/people/{userId}:
    get:
      tags: [chats]
      operationId: getPerson
      description: A contact's profile (`404 not_found` for anyone who isn't a contact). The caller's own id returns their own profile with every milestone.
      parameters: [ { $ref: '#/components/parameters/UserId' } ]
      responses:
        '200': { description: Person, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/badge:
    get:
      tags: [chats]
      operationId: getBadge
      description: The app badge (README §5.19), also sent as `badge.updated` whenever it changes.
      responses:
        '200': { description: Badge, content: { application/json: { schema: { $ref: '#/components/schemas/Badge' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/link-previews:
    post:
      tags: [chats]
      operationId: createLinkPreview
      description: |
        Only when discovery has `link_previews: true` (the operator's opt-in; `503 feature_disabled` otherwise). The
        server fetches the page itself (README §5.19: public addresses only, size and time limits) and returns the
        cached preview. The composer uses it to show the preview before sending; `sendMessage` attaches the preview
        of the body's first link by itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
      responses:
        '200': { description: 'Preview (possibly `status: failed`)', content: { application/json: { schema: { $ref: '#/components/schemas/LinkPreview' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- blocks and reports
  /v1/blocks:
    get:
      tags: [safety]
      operationId: listBlocks
      responses:
        '200': { description: People the caller blocked, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Block' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/blocks/{userId}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    put:
      tags: [safety]
      operationId: blockUser
      description: |
        Idempotent. Hides the person's comments, messages and reactions from the caller, stops their direct messages
        (they get `403 cannot_message`, without being told why) and stops them adding the caller to groups. Shared
        families, circles and groups stay (removing people is the admins' call). The blocked person is not notified.
      responses:
        '204': { description: Blocked }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [safety]
      operationId: unblockUser
      responses:
        '204': { description: Unblocked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/reports:
    post:
      tags: [safety]
      operationId: createReport
      description: |
        Report a comment, a message or a post the caller can see. In a family (a feed post, its comments, a family or
        circle chat) the feed's owner and admins get it; anything else (direct and group chats, frame posts) goes to
        the server operator. The reporter stays anonymous to the reported person. One open report per reporter and
        target (repeating returns the existing one).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportCreate' } } }
      responses:
        '201': { description: Reported, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/reports:
    get:
      tags: [safety]
      operationId: listFeedReports
      description: The feed's owner and admins. Open reports first, then the last 30 days of resolved ones.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200': { description: Reports, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Report' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/reports:
    get:
      tags: [operator]
      operationId: listOperatorReports
      description: Operator only (`kinframe:operate`). Reports that don't belong to a family.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
      responses:
        '200': { description: Reports, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Report' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/reports/{reportId}/resolve:
    post:
      tags: [safety]
      operationId: resolveReport
      description: |
        Whoever handles the report (feed owner/admin, or the operator). `remove` removes the content like a moderator
        delete (`deleteComment`, `deleteMessage`, `removeFeedPost`); `dismiss` keeps it. `409 already_decided` when
        someone else resolved it first.
      parameters: [ { $ref: '#/components/parameters/ReportId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [remove, dismiss] }
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- encouragement to share (README §5.20)
  /v1/feeds/{feedId}/engagement:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [engagement]
      operationId: getFeedEngagement
      description: Any member. The family's streak, prompt, reminder and recap settings.
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/FeedEngagement' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [engagement]
      operationId: updateFeedEngagement
      description: Owner or admin.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedEngagementUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FeedEngagement' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/streak:
    get:
      tags: [engagement]
      operationId: getFeedStreak
      description: 'Any member. `404 not_found` is never used for a disabled streak; it reports `enabled: false`.'
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200': { description: Streak, content: { application/json: { schema: { $ref: '#/components/schemas/FeedStreak' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/prompts:
    get:
      tags: [engagement]
      operationId: listFeedPrompts
      description: |
        Any member. The current week's prompt, the next 4 weeks (as planned: the server's choice unless an admin set
        one) and the past 12 weeks, newest first. Empty while `prompts_enabled` is off. Titles are in the caller's
        language for server prompts.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200': { description: Prompts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeedPrompt' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/prompts/{weekOf}:
    parameters:
      - { $ref: '#/components/parameters/FeedId' }
      - { $ref: '#/components/parameters/WeekOf' }
    put:
      tags: [engagement]
      operationId: setFeedPrompt
      description: |
        Owner or admin: choose the prompt of the current or a future week: one from the server's list (`library_key`),
        an own `title`, or `skip: true` (no prompt that week). Exactly one of the three (`422 validation_failed`).
        Past weeks can't change (`409 invalid_transition`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedPromptSet' } } }
      responses:
        '200': { description: Prompt, content: { application/json: { schema: { $ref: '#/components/schemas/FeedPrompt' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [engagement]
      operationId: resetFeedPrompt
      description: Owner or admin. Back to the server's choice for that week (current or future).
      responses:
        '204': { description: Reset }
        default: { $ref: '#/components/responses/Problem' }

  /v1/prompts:
    get:
      tags: [engagement]
      operationId: listPromptLibrary
      description: The server's prompt list in the caller's language (`Accept-Language`), for the admin's picker.
      responses:
        '200': { description: Prompts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PromptLibraryEntry' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/on-this-day:
    get:
      tags: [engagement]
      operationId: getOnThisDay
      description: |
        "On this day" for Home: posts from today's date in earlier years (in the caller's `timezone`) in the caller's
        families, newest year first, at most 3 groups of 12 items. Empty when there is nothing (Home then hides the
        card). Same visibility as the timeline.
      responses:
        '200': { description: On this day, content: { application/json: { schema: { $ref: '#/components/schemas/OnThisDay' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/weekly-summaries/{weekOf}:
    get:
      tags: [engagement]
      operationId: getWeeklySummary
      description: The caller's "seen and loved" summary of one week (Monday, in the caller's time zone), kept 12 weeks. `404 not_found` for weeks without one.
      parameters: [ { $ref: '#/components/parameters/WeekOf' } ]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklySummary' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/recaps/{month}:
    get:
      tags: [engagement]
      operationId: getFeedRecap
      description: Any member. The monthly family recap (also posted as a `monthly_recap` system message in the family chat). `404 not_found` before it was made.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, description: 'YYYY-MM' }
      responses:
        '200': { description: Recap, content: { application/json: { schema: { $ref: '#/components/schemas/MonthlyRecap' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/milestones:
    get:
      tags: [engagement]
      operationId: listMyMilestones
      description: The caller's personal milestones (private unless `shown`). Only achieved ones are listed.
      responses:
        '200': { description: Milestones, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Milestone' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/milestones/{milestoneKey}:
    patch:
      tags: [engagement]
      operationId: updateMyMilestone
      description: Show a milestone on the caller's profile (`getPerson`, to their contacts) or hide it again; `seen` dismisses its card.
      parameters:
        - { name: milestoneKey, in: path, required: true, schema: { $ref: '#/components/schemas/MilestoneKey' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shown: { type: boolean }
                seen: { type: boolean, enum: [true] }
      responses:
        '200': { description: Milestone, content: { application/json: { schema: { $ref: '#/components/schemas/Milestone' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/reminders:
    get:
      tags: [engagement]
      operationId: getReminderPreferences
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/ReminderPreferences' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [engagement]
      operationId: updateReminderPreferences
      description: |
        Also what the push actions call: **Snooze 1 month** sends `{snooze_days: 30}`, **Fewer reminders**
        `{level: fewer}`. `snooze_days: 0` ends a snooze.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReminderPreferencesUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ReminderPreferences' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/photo-requests/{requestId}:
    get:
      tags: [engagement]
      operationId: getPhotoRequest
      description: A frame's "Ask for new photos" (push deep link). Members of the frame and of families whose posts reach it.
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      responses:
        '200': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/photo-requests:
    get:
      tags: [engagement]
      operationId: listFramePhotoRequests
      description: Frame members. The frame's requests of the last 30 days, newest first.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Requests, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhotoRequest' } } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- leaving (docs/spec/leaving.md, README §5.21)
  /v1/me/leave-preview:
    get:
      tags: [leaving]
      operationId: getLeavePreview
      description: |
        What the leave sheet shows: counts of the caller's own photos and comments in the family (`feed_id`) or of the
        caller's own photos on the frame (`frame_id`), and for a family the frames the caller is a member of that
        subscribe to it. Exactly one of `feed_id` and `frame_id` (`422 validation_failed` otherwise). Works for
        current members and for people who already left or were removed and still have photos there (the take-away
        sheet); `404 not_found` for scopes the caller has nothing in.
      parameters:
        - { name: feed_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: frame_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/LeavePreview' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/former-places:
    get:
      tags: [leaving]
      operationId: listFormerPlaces
      description: |
        Families and frames the caller no longer belongs to (left or removed) where photos they sent are still live,
        for "Take my photos away from Janssens" in the sent history (README §5.21).
      responses:
        '200': { description: Places, content: { application/json: { schema: { $ref: '#/components/schemas/FormerPlaces' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/take-away:
    post:
      tags: [leaving]
      operationId: takeAwayFromFeed
      description: |
        Take the caller's own photos away from this family (README §5.21 "Taking away"): their live posts leave the
        family, and the posts' placements on every subscribed frame (local and on other servers) are taken away with
        the 30-day notice. Works for current members, people who left and people who were removed. Idempotent: a
        second call takes away only what came back or was posted since. `404 not_found` when the caller has nothing
        live in the family.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/TakeAwayRequest' } } }
      responses:
        '200': { description: Taken away, content: { application/json: { schema: { $ref: '#/components/schemas/TakeAwayResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/take-away:
    post:
      tags: [leaving]
      operationId: takeAwayFromFrame
      description: |
        Take the caller's own direct placements (sends, forwards, shares) away from this frame with the 30-day notice.
        Placements that reached the frame through a family are not touched (take them away from the family). Works
        for current members, people who left and people who were removed. `404 not_found` when the caller has nothing
        live on the frame.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Taken away, content: { application/json: { schema: { $ref: '#/components/schemas/TakeAwayResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/taken-away:
    get:
      tags: [leaving]
      operationId: listFrameTakenAway
      description: |
        Frame owner, admins and `manage_library` members. The frame's "Taken away" groups (one per taking: person,
        date, count, until), newest first, while their 30 days run; the placements themselves are listed with
        `listPlacements?visibility=taken_away&taking_id=`.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Groups, content: { application/json: { schema: { $ref: '#/components/schemas/TakenAwayGroupList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/taken-away:
    get:
      tags: [leaving]
      operationId: listFeedTakenAway
      description: |
        Family owner and admins. Posts taken away from the family, grouped per taking, while their 30 days run (for
        "Ask to keep" on the family side).
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200': { description: Groups, content: { application/json: { schema: { $ref: '#/components/schemas/TakenAwayGroupList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/keep-requests:
    post:
      tags: [leaving]
      operationId: createKeepRequest
      description: |
        Ask the person who took photos away to let them stay (README §5.21 "Ask to keep"). Exactly one of `frame_id`
        (frame owner, admins, `manage_library`) and `feed_id` (family owner and admins). One request per scope and
        taking: a second answers `409 limit_reached`. `403 forbidden` when the person blocked the caller (the group's
        `can_ask` is then false with `cannot_ask_reason: blocked`), `409 invalid_transition` when the 30 days are over.
        `item_ids` picks photos (items of the taking in that scope); absent means all of them.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequestCreate' } } }
      responses:
        '201': { description: Asked, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/keep-requests:
    get:
      tags: [leaving]
      operationId: listMyKeepRequests
      description: Requests sent to the caller (the person who took photos away), newest first. Default `open` only.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
      responses:
        '200': { description: Requests, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequestList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/keep-requests:
    get:
      tags: [leaving]
      operationId: listFrameKeepRequests
      description: Frame owner, admins and `manage_library` members. Requests made for this frame, newest first (all states, 60 days).
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Requests, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequestList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/keep-requests:
    get:
      tags: [leaving]
      operationId: listFeedKeepRequests
      description: Family owner and admins. Requests made for this family, newest first (all states, 60 days).
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      responses:
        '200': { description: Requests, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequestList' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/keep-requests/{requestId}:
    get:
      tags: [leaving]
      operationId: getKeepRequest
      description: |
        The person asked and the askers (the scope's managers). Includes the photos asked for (`items`, with thumbnails)
        so the person can pick which to allow.
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      responses:
        '200': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/keep-requests/{requestId}/answer:
    post:
      tags: [leaving]
      operationId: answerKeepRequest
      description: |
        The person asked only. `all` and `none` need no `item_ids`; `some` needs at least one of the requested items.
        Allowed photos come back (placement and post as before, credited as before); the rest are deleted when the 30
        days end. The answer is final: `409 already_decided` for a second answer, `409 invalid_transition` after expiry.
      parameters: [ { $ref: '#/components/parameters/RequestId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequestAnswer' } } }
      responses:
        '200': { description: Answered, content: { application/json: { schema: { $ref: '#/components/schemas/KeepRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/memories:
    get:
      tags: [leaving]
      operationId: getMemoryPreferences
      description: The caller's private memories filter (README §5.21 "Memories"). Nobody else ever sees it.
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPreferences' } } } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [leaving]
      operationId: updateMemoryPreferences
      description: |
        Replaces the lists that are present (an absent field is left unchanged). People must be people the caller
        shares or shared a family, frame or chat with; unknown ids are dropped. Hiding someone does not block them.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPreferencesUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryPreferences' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- remote families (docs/spec/multi-server.md, README §5.22)
  /v1/remote-invites:preview:
    post:
      tags: [remote]
      operationId: previewRemoteInvite
      description: |
        Frame managers on this server (B), before following a family on another server (A). The server fetches A's
        `/.well-known/kinframe`, checks the invite with A (`federationSubscribe` with `preview: true`, signed) and
        returns what the confirmation shows. `422 validation_failed` for a URL that isn't a kinframe subscribe invite,
        `404 invite_invalid` / `410 invite_expired` as A answers, `403 forbidden` when A or this server refuses
        (federation off, not on the allow list, blocked, or the family doesn't allow frames on other servers),
        `502 upstream_unavailable` when A can't be reached. `503 feature_disabled` when federation is off here.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RemoteInviteRef' } } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteInvitePreview' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/remote-subscriptions:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [remote]
      operationId: listRemoteSubscriptions
      description: |
        Families on other servers this frame follows. Frame managers (owner, admin, `change_settings`) see every
        status; other members see `active` ones. Ended ones are listed for 30 days.
      responses:
        '200':
          description: Remote subscriptions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RemoteSubscription' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [remote]
      operationId: createRemoteSubscription
      description: |
        Frame managers. Follow a family on another server with its subscribe invite URL (the family must allow frames
        on other servers and the invite must have `allow_remote`). The server asks A (`federationSubscribe`, signed);
        the result is `active` for pre-approved invites, else `pending` until A's admins decide. Errors as for
        `previewRemoteInvite`; `409 already_subscribed` when the frame already follows that family.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSubscriptionCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSubscription' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/remote-subscriptions/{remoteSubscriptionId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/RemoteSubscriptionId' }
    patch:
      tags: [remote]
      operationId: updateRemoteSubscription
      description: Frame managers. What happens to the copied photos when the subscription ends (`on_end`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSubscriptionUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSubscription' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [remote]
      operationId: deleteRemoteSubscription
      description: |
        Frame managers. Unsubscribe (or withdraw a pending request): tells A (`federationUnsubscribe`, signed, retried
        in the background when A is down) and keeps or removes the copied photos (`placements`, default the
        subscription's `on_end`).
      parameters:
        - { name: placements, in: query, schema: { $ref: '#/components/schemas/RemoteOnEnd' } }
      responses:
        '204': { description: Unsubscribed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/blocked-servers:
    parameters: [ { $ref: '#/components/parameters/FeedId' } ]
    get:
      tags: [remote]
      operationId: listFeedBlockedServers
      description: Family owner and admins. Servers whose frames may not follow this family.
      responses:
        '200':
          description: Blocked servers
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockedServer' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [remote]
      operationId: blockFeedServer
      description: |
        Family owner and admins. Blocks a server for this family: its remote subscriptions to the family end
        (`removed_reason: server_blocked`) and new requests from it are refused. Idempotent per host.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BlockedServerCreate' } } }
      responses:
        '201': { description: Blocked, content: { application/json: { schema: { $ref: '#/components/schemas/BlockedServer' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/feeds/{feedId}/blocked-servers/{blockedServerId}:
    delete:
      tags: [remote]
      operationId: unblockFeedServer
      description: Family owner and admins. Ended subscriptions stay ended.
      parameters:
        - { $ref: '#/components/parameters/FeedId' }
        - { $ref: '#/components/parameters/BlockedServerId' }
      responses:
        '204': { description: Unblocked }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- settings
  # ---------------------------------------------------------------- tv
  /v1/frames/{frameId}/tv-links:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [tv]
      operationId: listTvLinks
      description: Active (unexpired, unrevoked) TV links. Owner/admin see all; others see the links they created.
      responses:
        '200':
          description: Active TV links
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TvLink' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tv]
      operationId: createTvLink
      description: |
        Creates a short-lived, revocable share token for a slideshow of this frame's library, used by the TV page
        (`/tv/{frameId}?t=<token>`) and by Cast senders. Needs `see_library`, unless every `placement_ids` entry is
        one of the caller's own placements (e.g. "Show on TV" from History).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TvLinkCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TvLink' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/tv-links/{linkId}:
    delete:
      tags: [tv]
      operationId: revokeTvLink
      description: Revoke a TV link (its creator, or owner/admin). TV pages using it stop at their next refresh.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: linkId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/tv/{token}:
    get:
      tags: [tv]
      operationId: getTvSlideshow
      security: []
      description: |
        No sign-in: the token is the credential. Returns the slides with absolute, signed media URLs (master
        rendition: WebP photos, H.264/AAC MP4 videos) that a TV or Chromecast can fetch without headers. The URLs
        expire after 1-2 h; refetch after `refresh_after`. `404 not_found` for unknown or revoked tokens,
        `410 link_expired` once the link has expired.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
      responses:
        '200': { description: Slideshow, content: { application/json: { schema: { $ref: '#/components/schemas/TvSlideshow' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/tv/{token}/mirror:
    get:
      tags: [tv]
      operationId: tvMirror
      security: []
      description: |
        WebSocket (README §6.4) for a `mirror` TV link: the TV follows the physical frame live. The server sends a
        `MirrorState` right away and on every change, and `{type: "ended", reason}` before closing when the link is
        revoked, expires or its creator loses `see_library`. At most 8 viewers per frame (`429 rate_limited`).
        `404 not_found` for unknown, revoked or non-mirror tokens, `410 link_expired` for expired ones.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
      responses:
        '101': { description: Switching to the websocket protocol }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/settings:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [settings]
      operationId: getFrameSettings
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
    patch:
      tags: [settings]
      operationId: updateFrameSettings
      description: JSON merge patch (RFC 7396) of FrameSettings. Requires If-Match.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/FrameSettingsPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/stations/latest:
    get:
      tags: [settings]
      operationId: getStationLatest
      security: []
      description: |
        The latest reading of a personal weather station that uploads to kinframe (docs/plugins.md §9.4), for the
        frame's weather-station widget and the Home Assistant integration. The station is named by its upload ID and
        key, the same pair it uploads with, in headers so they stay out of logs. `404` when no frame registered that
        pair or nothing arrived in the last 48 hours. Rate-limited per address.
      parameters:
        - { name: X-Station-Id, in: header, required: true, schema: { type: string, maxLength: 64 } }
        - { name: X-Station-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Latest reading, content: { application/json: { schema: { $ref: '#/components/schemas/StationLatest' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/stations/public:
    get:
      tags: [settings]
      operationId: listPublicStations
      security: []
      description: |
        The weather stations with a public page (docs/plugins.md §9.4), for the overview at /stations: each one's
        latest reading and its temperature per hour over the last 24 hours. Only stations whose owner turned the page
        on and that sent a reading in the last 48 hours; sorted by title. Rate-limited per address; cacheable for 60
        seconds.
      responses:
        '200': { description: The public stations, content: { application/json: { schema: { $ref: '#/components/schemas/PublicStationList' } } } }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/stations/{stationId}/public:
    get:
      tags: [settings]
      operationId: getStationPublic
      security: []
      description: |
        A personal weather station's public page (docs/plugins.md §9.4): its latest reading, today's extremes and the
        last 48 hours in 5-minute steps, for anyone with the link. Only for stations whose owner turned the page on in
        the frame's weather-station plugin (`public_page`), under the title they chose; nothing about the frame or its
        place. `404` for every other station ID, so it doesn't tell which stations exist. Rate-limited per address;
        cacheable for 30 seconds.
      parameters:
        - { name: stationId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200': { description: The station's page, content: { application/json: { schema: { $ref: '#/components/schemas/StationPublic' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/plugins:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [settings]
      operationId: getFramePlugins
      description: |
        The plugins the frame can run and how its instances are doing (needs change_settings): the form for each
        plugin comes from its manifest, the entity picker and "find on network" from what the frame discovered.
        The instances themselves are in the settings (`plugins.instances`).
      responses:
        '200': { description: Catalog and status, content: { application/json: { schema: { $ref: '#/components/schemas/FramePlugins' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- weather
  /v1/geocode:
    get:
      tags: [weather]
      operationId: geocode
      description: |
        Place search for a frame's `settings.location`, proxied to the Open-Meteo geocoding API and cached by the
        server (clients never call third parties). Rate-limited per user (`429 rate_limited`). An empty list means
        no match. `502 upstream_unavailable` when the geocoding service cannot be reached, `503` when the server
        has weather disabled.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: lang, in: query, description: 'Language of place names (ISO 639-1), e.g. `nl`', schema: { type: string, pattern: '^[a-zA-Z]{2}$', default: en } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200':
          description: Matching places, best first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Place' } }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- calendar
  /v1/frames/{frameId}/calendars:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [calendar]
      operationId: listCalendars
      description: The frame's calendar sources with their sync status (needs change_settings). There is no limit on the number.
      responses:
        '200':
          description: Sources in display order; the local received-events calendar (if any) comes first.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [calendar]
      operationId: createCalendar
      description: |
        Add an ICS/webcal link or a CalDAV calendar (needs change_settings). The server syncs it right away; the
        result has `status: syncing`. The URL and credentials are encrypted at rest and never returned (only
        `url_hint`). `503 feature_disabled` when the server has calendars turned off. For a CalDAV account with
        several calendars, `calendar_url` picks one (from `testCalendar`); create one source per calendar.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars:test:
    post:
      tags: [calendar]
      operationId: testCalendar
      description: |
        Try a link or CalDAV account without saving it (needs change_settings; rate-limited). For CalDAV,
        `calendars` lists the calendars found on the account so the client can let the user pick one or more.
        `ok: false` with `status` and `error` when the calendar cannot be read.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceCreate' } } }
      responses:
        '200': { description: Outcome, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarTestResult' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars/{calendarId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/CalendarId' }
    patch:
      tags: [calendar]
      operationId: updateCalendar
      description: |
        Rename, recolour, enable/disable, or change the link or credentials (needs change_settings). Omitted fields
        are kept. Changing the URL or credentials syncs right away.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [calendar]
      operationId: deleteCalendar
      description: |
        Remove a source and its events from the frame (needs change_settings). Removing the local received-events
        calendar deletes every accepted event; the calendar comes back with the next accepted invitation.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars/{calendarId}/sync:
    post:
      tags: [calendar]
      operationId: syncCalendar
      description: 'Sync now (needs change_settings). Returns at once with `status: syncing`.'
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/CalendarId' }
      responses:
        '202': { description: Sync started, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendar:
    get:
      tags: [calendar]
      operationId: getFrameCalendar
      description: |
        Read-only merged view of what the frame shows (needs change_settings): the payload of the frame's
        `calendar` change, plus the frame's weather (`null` when it has none) so clients can show the forecast per
        day.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Merged calendar, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarView' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/countdowns/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/EventId' }
    put:
      tags: [calendar]
      operationId: setCountdown
      description: |
        Show a countdown to this event (an `id` from the merged calendar) on the frame (needs change_settings).
        Idempotent. Any number can be marked; the frame shows the nearest three. `404` when the event is not in the
        frame's calendar.
      responses:
        '204': { description: Marked }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [calendar]
      operationId: clearCountdown
      responses:
        '204': { description: Unmarked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [calendar]
      operationId: listEventInvitations
      description: Events sent to this frame, newest first. Senders see their own; owner and admin see all.
      responses:
        '200':
          description: Invitations
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventInvitation' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [calendar]
      operationId: sendEventToFrame
      description: |
        Send an event to the frame (needs `send`). It arrives as an invitation that the frame accepts or declines;
        accepted events go to the frame's local received-events calendar. The sender gets an
        `event_invitation.decided` websocket event (or a push). Accepted events cannot be changed remotely: send a
        new one instead. The optional photo is a finished tus upload (`photo_upload_id`, JPEG/PNG/WebP/HEIC).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInvitationCreate' } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/EventInvitation' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events/{invitationId}:
    delete:
      tags: [calendar]
      operationId: withdrawEventInvitation
      description: The sender (or owner/admin) withdraws an invitation that is still pending; `409 already_decided` otherwise.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/InvitationId' }
      responses:
        '204': { description: Withdrawn }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events/{invitationId}/photo:
    get:
      tags: [calendar]
      operationId: getEventInvitationPhoto
      description: The invitation's photo (WebP), for its sender and owner/admin. `404` when it has none.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/InvitationId' }
      responses:
        '200': { description: Photo, content: { image/webp: { schema: { type: string, contentMediaType: image/webp } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- devices (enrollment)
  /v1/devices/enroll:
    post:
      tags: [devices]
      operationId: enrollDevice
      security: []
      description: Called once by a fresh frame. Rate-limited per IP.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceEnroll' } } }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_secret]
                properties:
                  device_id: { $ref: '#/components/schemas/Id' }
                  device_secret: { type: string, description: '256-bit random, base64url. Shown only once.' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/devices/token:
    post:
      tags: [devices]
      operationId: deviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, device_secret]
              properties:
                device_id: { $ref: '#/components/schemas/Id' }
                device_secret: { type: string }
      responses:
        '200':
          description: Short-lived device access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, description: seconds }
        '401': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- device (frame-side)
  /v1/device/state:
    get:
      tags: [device]
      operationId: deviceGetState
      security: [ { deviceAuth: [] } ]
      description: Whether the frame is claimed, its identity and the latest change seq. Used after boot and on the setup screen.
      responses:
        '200': { description: State, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceState' } } } }

  /v1/device/code:
    post:
      tags: [device]
      operationId: deviceGetCode
      security: [ { deviceAuth: [] } ]
      description: Get (or re-get) the active frame code. Same code until it expires.
      responses:
        '200': { description: Code, content: { application/json: { schema: { $ref: '#/components/schemas/FrameCode' } } } }

  /v1/device/changes:
    get:
      tags: [device]
      operationId: deviceGetChanges
      security: [ { deviceAuth: [] } ]
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Ordered changes after `since`
          content:
            application/json:
              schema:
                type: object
                required: [changes, next_seq, has_more]
                properties:
                  changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
                  next_seq: { type: integer }
                  has_more: { type: boolean }

  /v1/device/media/{placementId}:
    get:
      tags: [device]
      operationId: deviceGetMedia
      security: [ { deviceAuth: [] } ]
      description: |
        The frame-sized rendition (or poster with ?variant=poster). For a Live/Motion Photo (`item.kind: live`),
        `display` is the still and `?variant=motion` the short frame-sized clip. Supports Range, ETag, If-None-Match.
      parameters:
        - { $ref: '#/components/parameters/PlacementId' }
        - { name: variant, in: query, schema: { type: string, enum: [display, poster, avatar, motion], default: display } }
      responses:
        '200': { description: Bytes }
        '206': { description: Partial bytes }
        '304': { description: Not modified }

  /v1/device/acks:
    post:
      tags: [device]
      operationId: deviceAck
      security: [ { deviceAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivered: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Id' } }
                seen:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [placement_id, at]
                    properties:
                      placement_id: { $ref: '#/components/schemas/Id' }
                      at: { type: string, format: date-time }
      responses:
        '204': { description: Recorded }

  /v1/device/heartbeat:
    post:
      tags: [device]
      operationId: deviceHeartbeat
      security: [ { deviceAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } }
      responses:
        '204': { description: Recorded }

  /v1/device/settings:
    patch:
      tags: [device]
      operationId: devicePatchSettings
      security: [ { deviceAuth: [] } ]
      description: Settings changed locally on the frame. Same semantics as updateFrameSettings.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/FrameSettingsPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
        '412': { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/catalog:
    put:
      tags: [device]
      operationId: devicePutPluginCatalog
      security: [ { deviceAuth: [] } ]
      description: The plugins this frame can run, sent when the app starts and its catalog changed. Replaces the previous one.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginCatalog' } } }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/registry:
    get:
      tags: [device]
      operationId: deviceGetPluginRegistry
      security: [ { deviceAuth: [] } ]
      description: |
        The community plugin registry's index exactly as signed, with its signature (docs/plugins.md §7.1); the frame
        verifies it with the key built into the app. `204` while the server has none (registry off or not fetched yet).
      responses:
        '200': { description: Signed index, content: { application/json: { schema: { $ref: '#/components/schemas/PluginRegistry' } } } }
        '204': { description: No registry }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/bundles/{file}:
    get:
      tags: [device]
      operationId: deviceGetPluginBundle
      security: [ { deviceAuth: [] } ]
      description: A plugin bundle the current index lists and doesn't revoke (`<id>-<version>.zip`). ETag `"<sha256>"`.
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{0,80}-\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\.zip$' } }
      responses:
        '200': { description: Bundle, content: { application/zip: { schema: { type: string, contentMediaType: application/zip } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/status:
    put:
      tags: [device]
      operationId: devicePutPluginStatus
      security: [ { deviceAuth: [] } ]
      description: Errors, discovered entities and services (at most every 10 s). Replaces the previous report.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginStatusReport' } } }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/placements/{placementId}:
    patch:
      tags: [device]
      operationId: devicePatchPlacement
      security: [ { deviceAuth: [] } ]
      description: Actions taken at the frame (hide/unhide, trash/restore, local fit/focal override).
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                trashed: { type: boolean }
                fit: { $ref: '#/components/schemas/Fit' }
                focal_point: { $ref: '#/components/schemas/FocalPoint' }
                rotation: { type: integer, enum: [0, 90, 180, 270] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }

  /v1/device/placements/{placementId}/reaction:
    put:
      tags: [device]
      operationId: deviceSetReaction
      security: [ { deviceAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
      responses:
        '204': { description: Stored }

  /v1/device/placements/{placementId}/replies:
    post:
      tags: [device]
      operationId: deviceSendReply
      security: [ { deviceAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { $ref: '#/components/schemas/ReplyPreset' }
      responses:
        '204': { description: Sent }

  /v1/device/join-requests:
    get:
      tags: [device]
      operationId: deviceListJoinRequests
      security: [ { deviceAuth: [] } ]
      description: |
        Pending join requests that wait for a decision on the frame ("ask on the frame before someone new joins").
        The frame shows them until they are decided here or by an owner/admin in the app; it re-reads this list on
        connect and after syncing, so requests announced while it was offline are not lost.
      responses:
        '200':
          description: Oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } }

  /v1/device/join-requests/{requestId}:
    post:
      tags: [device]
      operationId: deviceDecideJoin
      security: [ { deviceAuth: [] } ]
      parameters: [ { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
      responses:
        '204': { description: Decided }

  /v1/device/members/{userId}:
    delete:
      tags: [device]
      operationId: deviceRemoveMember
      security: [ { deviceAuth: [] } ]
      description: Remove a member from the frame itself (allowed unless the owner disabled it in settings). Cannot remove the owner.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: remove_items, in: query, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/device/imports:
    post:
      tags: [device]
      operationId: deviceImport
      security: [ { deviceAuth: [] } ]
      description: |
        Upload a photo/video imported from SD/USB on the frame so it joins the library (sender = the frame).
        Body is the file; tus is not required for imports (frames upload one file at a time, ≤ 512 MiB). The file
        takes the same processing as any upload (renditions, location metadata stripped).
        The server hashes the body: if this frame already has a live placement of the same file (source, master or
        rendition sha256), nothing is created and the existing placement is returned with `200`.

        **Imports from another app's leftover data** (`source`, docs/spec/frameo-import.md): `source_key` makes the
        import idempotent per frame. If this frame imported that key before, the placement of that item is returned
        with `200`, even when it was removed since (`status: removed`), so a re-run never brings back what the family
        deleted. The item keeps `sender_name`, `received_at`, fit, focal point and hidden state from the old app, and
        the frame's owner owns the media.
      parameters:
        - { name: X-Filename, in: header, required: true, schema: { type: string } }
        - { name: X-Captured-At, in: header, schema: { type: string, format: date-time } }
        - name: caption
          in: query
          description: Caption to restore (e.g. from a kinframe export manifest).
          schema: { type: string, maxLength: 280 }
        - name: source
          in: query
          description: The app the file comes from. `source_key`, `sender_name` and `received_at` are ignored without it.
          schema: { $ref: '#/components/schemas/ItemOrigin' }
        - name: source_key
          in: query
          description: Stable id of the file in that app (for Frameo, its file name). Unique per frame and source.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sender_name
          in: query
          description: The original sender's display name in that app.
          schema: { type: string, maxLength: 100 }
        - name: received_at
          in: query
          description: When the old app received the file; becomes the placement's `received_at` (not in the future).
          schema: { type: string, format: date-time }
        - name: fit
          in: query
          schema: { $ref: '#/components/schemas/Fit' }
        - name: focal_x
          in: query
          description: Focal point, as a fraction of the width (with `focal_y`).
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: focal_y
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: hidden
          in: query
          description: Import the placement hidden (it was hidden from the slideshow in the old app).
          schema: { type: boolean, default: false }
        - name: rotation
          in: query
          description: Extra clockwise rotation chosen on the frame in the old app.
          schema: { type: integer, enum: [0, 90, 180, 270], default: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, contentMediaType: application/octet-stream } }
      responses:
        '200': { description: Duplicate; the frame already has this file, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        '202': { description: Accepted; a placement.upsert change follows, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/imports/check:
    post:
      tags: [device]
      operationId: deviceImportCheck
      security: [ { deviceAuth: [] } ]
      description: |
        Which of these file hashes this frame already has (a live placement whose source, master or frame
        rendition sha256 matches), so an import from SD/USB can skip duplicates before uploading. With `source` and
        `source_keys`, also which of those keys this frame has imported before (removed items included, see
        `deviceImport`), so a resumed import only uploads what is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  type: array
                  maxItems: 500
                  items: { type: string, pattern: '^[0-9a-f]{64}$' }
                source: { $ref: '#/components/schemas/ItemOrigin' }
                source_keys:
                  type: array
                  maxItems: 500
                  items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The known subset
          content:
            application/json:
              schema:
                type: object
                required: [known]
                properties:
                  known: { type: array, items: { type: string } }
                  known_source_keys: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/calendar/sync:
    post:
      tags: [device]
      operationId: deviceSyncCalendars
      security: [ { deviceAuth: [] } ]
      description: '"Sync now" on the frame: the server re-syncs all of the frame''s calendar sources. A `calendar` change follows when something changed.'
      responses:
        '202': { description: Sync started }

  /v1/device/countdowns/{eventId}:
    parameters: [ { $ref: '#/components/parameters/EventId' } ]
    put:
      tags: [device]
      operationId: deviceSetCountdown
      security: [ { deviceAuth: [] } ]
      description: The countdown toggle in the frame's event details. A `calendar` change follows.
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [device]
      operationId: deviceClearCountdown
      security: [ { deviceAuth: [] } ]
      responses:
        '204': { description: Unmarked }

  /v1/device/invitations:
    get:
      tags: [device]
      operationId: deviceListInvitations
      security: [ { deviceAuth: [] } ]
      description: |
        Event invitations waiting for a decision on the frame, oldest first. The frame re-reads this list on connect,
        after syncing and after an `event_invitation` websocket message, like join requests.
      responses:
        '200':
          description: Pending invitations
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventInvitation' } } } }

  /v1/device/invitations/{invitationId}:
    post:
      tags: [device]
      operationId: deviceDecideInvitation
      security: [ { deviceAuth: [] } ]
      description: Accept or decline. Final; `409 already_decided` when it was decided or withdrawn before.
      parameters: [ { $ref: '#/components/parameters/InvitationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        '204': { description: Decided }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/device/invitations/{invitationId}/photo:
    get:
      tags: [device]
      operationId: deviceGetInvitationPhoto
      security: [ { deviceAuth: [] } ]
      description: The invitation's photo (WebP, long edge at most 1280 px). Supports ETag and If-None-Match.
      parameters: [ { $ref: '#/components/parameters/InvitationId' } ]
      responses:
        '200': { description: Photo, content: { image/webp: { schema: { type: string, contentMediaType: image/webp } } } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/device/birthdays/{birthdayId}/greetings/{date}:
    put:
      tags: [device]
      operationId: deviceGreetBirthday
      security: [ { deviceAuth: [] } ]
      description: |
        "Say happy birthday" on the frame's birthday card (docs/spec/birthdays.md §7). `birthdayId` is a
        `FrameBirthday.id` (or any of its `birthday_ids`), `date` the frame's local date. Idempotent: one greeting per
        person, frame and date, recorded once in every feed that lists the person; `204` also when it existed.
        Feed members get `birthday.greeting` (push `birthday_greeting` with `birthday_notifications`).
        `404 not_found` when the person is not on this frame (removed, subscription paused or birthdays off);
        `422 validation_failed` (field `date`) when `date` is not the person's birthday (29 February counts on
        28 February in non-leap years) or lies outside the server's UTC date −2 … +1 days. At most 50 a day per frame
        (`429 rate_limited`).
      parameters:
        - { $ref: '#/components/parameters/BirthdayId' }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/device/photo-requests:
    post:
      tags: [device]
      operationId: deviceRequestPhotos
      security: [ { deviceAuth: [] } ]
      description: |
        "Ask for new photos" from the frame's quick menu (README §5.20). Creates a request and notifies the family,
        at most one per frame per 24 hours: within that time the open (or last) request is returned with `200`
        and nobody is notified again. `403 forbidden` when the owner turned the button off
        (`settings.social.ask_for_photos`). The frame shows `photo_request` from the change feed afterwards.
      responses:
        '200': { description: Already asked within 24 hours, content: { application/json: { schema: { $ref: '#/components/schemas/FramePhotoRequest' } } } }
        '201': { description: Asked, content: { application/json: { schema: { $ref: '#/components/schemas/FramePhotoRequest' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/update:
    get:
      tags: [device]
      operationId: deviceCheckUpdate
      security: [ { deviceAuth: [] } ]
      description: |
        Self-update check (README §5.7). Answers with the newest frame app release on the channel that is newer
        than the caller's version code (from `X-Kinframe-App`, else the code last reported by the device) and
        whose `min_sdk` the device meets; `204` when there is none. Allowed even when the app is below the
        server's minimum version (`426` is never returned here).
      parameters:
        - name: channel
          in: query
          description: Defaults to the frame's `updates.channel` setting (unclaimed frames use the channel from enrollment).
          schema: { type: string, enum: [stable, beta] }
        - name: skip
          in: query
          description: Version codes the frame refuses (rolled back earlier). The newest release not listed is returned.
          style: form
          explode: false
          schema: { type: array, maxItems: 50, items: { type: integer } }
        - name: X-Kinframe-App
          in: header
          description: '`kinframe-frame/<version name> (<version code>)`'
          schema: { type: string, examples: ['kinframe-frame/0.2.0 (20099)'] }
      responses:
        '200': { description: An update is available, content: { application/json: { schema: { $ref: '#/components/schemas/FrameUpdate' } } } }
        '204': { description: Up to date (or no release suits this device) }

  /v1/device/update/apk/{versionCode}:
    get:
      tags: [device]
      operationId: deviceGetUpdateApk
      security: [ { deviceAuth: [] } ]
      description: The mirrored APK. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
      parameters:
        - { name: versionCode, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: APK bytes, content: { application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } } } }
        '206': { description: Partial bytes }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/frame-app/latest:
    get:
      tags: [frame-app]
      operationId: getFrameAppLatest
      security: []
      description: |
        No sign-in. The newest stable frame app release this server mirrors (README §5.7), for the convert tool on
        the website (`/convert`), which installs kinframe on a frame over USB. `url` points at
        `/v1/frame-app/apk/{version_code}` on this server, so the browser needs no cross-origin download. `204` when
        the server mirrors no release (self-update disabled) or none suits `sdk`. Clients must still check the
        APK's signing certificate: this endpoint is a convenience, not a trust anchor.
      parameters:
        - name: sdk
          in: query
          description: The frame's Android API level; releases whose `min_sdk` is higher are skipped.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: The newest stable release, content: { application/json: { schema: { $ref: '#/components/schemas/FrameUpdate' } } } }
        '204': { description: No release available }

  /v1/frame-app/apk/{versionCode}:
    get:
      tags: [frame-app]
      operationId: getFrameAppApk
      security: []
      description: No sign-in. The mirrored APK, as `/v1/device/update/apk/{versionCode}`. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
      parameters:
        - { name: versionCode, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: APK bytes, content: { application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } } } }
        '206': { description: Partial bytes }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- shop (README §5.11)
  /v1/shop/reservations:
    post:
      tags: [shop]
      operationId: createShopReservation
      security: []
      description: |
        Order or reservation for a frame sold by the server operator, without sign-in. Shops with `checkout`: an
        order the customer pays online; the answer has `checkout_url` (the provider's payment page, which returns to
        `/shop/order?token=…`) and the emails go out once the provider reports the payment as paid. Otherwise a
        reservation without payment; the customer is emailed right away. Only on servers with a shop (discovery
        `shop`); `404 not_found` otherwise. With `checkout` also `street`/`minLength`, `city`/`minLength`,
        `postal_code`/`minLength`; `502 server_error` when the payment provider fails.
        Prices and totals are recomputed by the server from its own configuration; the client never sends prices.
        Rate limited per IP (`429 rate_limited`). `website` is a honeypot that people never fill in: when it is
        not empty the server answers as usual but stores and sends nothing. Field errors (`422`) use these fields
        and codes: `email`/`format`, `country`/`enum`, `items`/`minItems`, `items.<i>.product_id`/`enum`,
        `items.<i>.quantity`/`maximum`, `consent`/`required`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservationCreate' } } }
      responses:
        '201': { description: Reserved, content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservationReceipt' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/shop/orders/status:
    post:
      tags: [shop]
      operationId: getShopOrderStatus
      security: []
      description: |
        The order and its payment, for the page the payment provider returns to (`/shop/order?token=…`, with the
        signed token from that link). Asks the provider for the latest status while the payment is still open, so it
        also works where the provider can't reach the webhook. `404 not_found` for an invalid token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200': { description: The order, content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservationReceipt' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/shop/reservations/cancel:
    post:
      tags: [shop]
      operationId: cancelShopReservation
      security: []
      description: |
        Cancels a reservation with the signed token from the link in the confirmation email (the web page
        `/shop/cancel?token=…` asks for a confirmation and then calls this). Idempotent. `404 not_found` for an
        invalid token or a deleted reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string, examples: [KF-7Q3M] }
                  status: { $ref: '#/components/schemas/ShopReservationStatus' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- operator
  /v1/operator/stats:
    get:
      tags: [operator]
      operationId: operatorStats
      security: [ { userAuth: ['kinframe:operate'] } ]
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  frames: { type: integer }
                  frames_online: { type: integer }
                  items: { type: integer }
                  storage_bytes: { type: integer }
                  processing_queue: { type: integer }
                  media_pipeline:
                    type: object
                    description: |
                      How masters were made (README §5.3 "Prepared uploads"): `transcoded` by the full pipeline,
                      `prepared` (a client master verified and kept without re-encoding), `fallback` (a prepared
                      upload that did not conform and was transcoded). `reused_renditions` counts frame video
                      renditions served from the master's bytes instead of a transcode.
                    properties:
                      transcoded: { type: integer }
                      prepared: { type: integer }
                      fallback: { type: integer }
                      reused_renditions: { type: integer }

  /v1/operator/limits:
    get:
      tags: [operator]
      operationId: operatorGetLimits
      security: [ { userAuth: ['kinframe:operate'] } ]
      responses:
        '200': { description: Limits, content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } } }
    put:
      tags: [operator]
      operationId: operatorSetLimits
      security: [ { userAuth: ['kinframe:operate'] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } } }

  /v1/operator/reservations:
    get:
      tags: [operator]
      operationId: operatorListReservations
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Shop reservations, newest first. `404 not_found` when the server has no shop.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShopReservationStatus' } }
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations: { type: array, items: { $ref: '#/components/schemas/ShopReservation' } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/shop/stock:
    get:
      tags: [operator]
      operationId: operatorListShopStock
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: |
        Frames ready to ship per product (shops with `stock`), in the order of the shop's products; products never
        counted have 0. `404 not_found` when the server has no shop or no stock management.
      responses:
        '200':
          description: Stock
          content:
            application/json:
              schema:
                type: object
                required: [stock]
                properties:
                  stock: { type: array, items: { $ref: '#/components/schemas/ShopStockItem' } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/shop/stock/{productId}:
    put:
      tags: [operator]
      operationId: operatorSetShopStock
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Sets a product's stock count. Paid orders lower it; cancelled orders don't raise it again.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShopStockItem' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/reservations.csv:
    get:
      tags: [operator]
      operationId: operatorExportReservations
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: All reservations as CSV (UTF-8 with BOM, comma-separated), newest first; `status` filters.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShopReservationStatus' } }
      responses:
        '200': { description: CSV export, content: { text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/reservations/{reservationId}:
    patch:
      tags: [operator]
      operationId: operatorUpdateReservation
      security: [ { userAuth: ['kinframe:operate'] } ]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/ShopReservationStatus' }
                internal_note: { type: [string, 'null'], maxLength: 2000, description: Only for the operator; never emailed. }
                tracking_url:
                  type: [string, 'null']
                  maxLength: 2000
                  description: >-
                    The carrier's tracking link (http or https). The shipped email of a paid order links to it; setting or
                    changing it on an order that is already shipped emails the customer the new link.
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservation' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/ownership/search:
    get:
      tags: [operator]
      operationId: operatorSearchOwnership
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: |
        Find frames and families for an ownership transfer (README §5.21 "Ownership by the operator"): by id, name, or a
        member's email or display name (`q`, at least 2 characters). At most 20 of each, with their members.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        '200': { description: Matches, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorOwnershipMatches' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/frames/{frameId}/owner:
    post:
      tags: [operator]
      operationId: operatorTransferFrameOwner
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: |
        Move ownership of a frame to an existing member (`422 validation_failed` otherwise). The previous owner
        becomes admin, or is removed with `remove_previous: true`. Both get `ownership_changed`; the change is logged
        with the reason (`operatorListOwnershipLog`).
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperatorOwnerTransfer' } } }
      responses:
        '204': { description: Transferred }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/feeds/{feedId}/owner:
    post:
      tags: [operator]
      operationId: operatorTransferFeedOwner
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: The same for a family (feed). The new owner must be a member of the family.
      parameters: [ { $ref: '#/components/parameters/FeedId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperatorOwnerTransfer' } } }
      responses:
        '204': { description: Transferred }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/ownership-log:
    get:
      tags: [operator]
      operationId: operatorListOwnershipLog
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Operator ownership transfers and account-deletion handovers (README §5.21), newest first, kept 2 years.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Log, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipLogPage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/blocked-servers:
    get:
      tags: [operator]
      operationId: operatorListBlockedServers
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Servers blocked for the whole instance (README §5.22 "Trust").
      responses:
        '200':
          description: Blocked servers
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockedServer' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [operator]
      operationId: operatorBlockServer
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: |
        Block a server instance-wide: every remote subscription with it ends on both sides (`server_blocked`), its
        federation requests answer `403 forbidden`, and this server stops calling it. Idempotent per host.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BlockedServerCreate' } } }
      responses:
        '201': { description: Blocked, content: { application/json: { schema: { $ref: '#/components/schemas/BlockedServer' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/blocked-servers/{blockedServerId}:
    delete:
      tags: [operator]
      operationId: operatorUnblockServer
      security: [ { userAuth: ['kinframe:operate'] } ]
      parameters: [ { $ref: '#/components/parameters/BlockedServerId' } ]
      responses:
        '204': { description: Unblocked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/remote-servers:
    get:
      tags: [operator]
      operationId: operatorListRemoteServers
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Servers this one federates with (either direction), with counts and their last contact.
      responses:
        '200':
          description: Remote servers
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RemoteServer' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- federation (server to server, README §5.22)
  # Hand-written in server/internal/api (the signature covers the raw request): excluded in gen/cfg.yaml.
  /federation/v1/subscriptions:
    post:
      tags: [federation]
      operationId: federationSubscribe
      security: [ { serverSignature: [] } ]
      description: |
        Called by B on A. Checks a `subscribe` invite (token from the invite URL) that has `allow_remote`, in a family
        with `allow_remote_frames`, and records a remote subscription for B's frame: `active` at once (the invite is
        pre-approved), otherwise `pending`. With `preview: true` nothing is recorded and the answer describes the
        family for B's confirmation sheet. A repeat for the same B frame and family returns the live subscription.
        Errors: `401 unauthorized` (bad or missing signature), `403 forbidden` (federation off, not allowed, server
        blocked, family doesn't allow remote frames, invite without `allow_remote`), `404 invite_invalid`,
        `410 invite_expired`, `409 limit_reached` (`limits.max_subscriptions_per_feed` counts remote ones too).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FederationSubscribeRequest' } } }
      responses:
        '200': { description: Preview, or an existing subscription, content: { application/json: { schema: { $ref: '#/components/schemas/FederationSubscription' } } } }
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/FederationSubscription' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /federation/v1/subscriptions/{subscriptionId}:
    delete:
      tags: [federation]
      operationId: federationUnsubscribe
      security: [ { serverSignature: [] } ]
      description: |
        Either side ends a remote subscription; `subscriptionId` is always A's id. Called by B on A (B's frame
        unsubscribed) or by A on B (A's admins removed it, the family was deleted, or B was blocked). Idempotent.
      parameters:
        - { $ref: '#/components/parameters/SubscriptionId' }
        - { name: reason, in: query, schema: { $ref: '#/components/schemas/RemoteEndReason' } }
      responses:
        '204': { description: Ended }
        default: { $ref: '#/components/responses/Problem' }

  /federation/v1/subscriptions/{subscriptionId}/changes:
    get:
      tags: [federation]
      operationId: federationChanges
      security: [ { serverSignature: [] } ]
      description: |
        Called by B on A, signed by the server the subscription belongs to (`404 not_found` for anyone else). The
        family's changes for this subscription after `cursor`, in order (README §5.22 "Cursor"). Without a cursor:
        the history backfill first, then live changes. While `pending` the page is empty with `status: pending`.
      parameters:
        - { $ref: '#/components/parameters/SubscriptionId' }
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: Changes, content: { application/json: { schema: { $ref: '#/components/schemas/FederationChangePage' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /federation/v1/subscriptions/{subscriptionId}/activity:
    post:
      tags: [federation]
      operationId: federationActivity
      security: [ { serverSignature: [] } ]
      description: |
        Called by B on A: the frame's reactions, quick replies and "seen" on placements of this subscription, in
        batches, and the frame's name and *show comments* when they change (`frame`, also with no events). Events for
        posts that are gone are ignored. Idempotent per event (`id`).
      parameters: [ { $ref: '#/components/parameters/SubscriptionId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FederationActivity' } } }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Problem' }

  /federation/v1/ping:
    post:
      tags: [federation]
      operationId: federationPing
      security: [ { serverSignature: [] } ]
      description: |
        Called by A on B after new changes (debounced 10 s): B pulls those subscriptions soon. Unknown ids are ignored.
        Always `202` for a valid signature; a ping never carries data.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FederationPing' } } }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    userAuth:
      type: oauth2
      description: Logto access token for the API resource. The issuer comes from discovery.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.kinframe.appmire.be/oidc/auth
          tokenUrl: https://auth.kinframe.appmire.be/oidc/token
          scopes:
            kinframe:operate: Operator access
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device access token from /v1/devices/token.
    inboundWebhook:
      type: apiKey
      in: header
      name: X-Kinframe-Signature
      description: |
        Operator integration only (docs/spec/email-inbox.md §6.3): `v1=<hex>`, the HMAC-SHA256 with
        `KINFRAME_EMAIL_WEBHOOK_SECRET` over `"v1" LF X-Kinframe-Timestamp LF X-Kinframe-Envelope-To LF
        X-Kinframe-Envelope-From LF X-Kinframe-Client-Ip LF X-Kinframe-Helo LF hex(sha256(body))` (absent headers as
        empty strings). Timestamps more than 5 minutes off and signatures seen in the last 10 minutes are refused.
    telegramWebhook:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: |
        Telegram only (docs/spec/telegram.md §7): the `secret_token` the server passed to `setWebhook`, derived from
        its secrets key (HKDF-SHA256, info `kinframe telegram webhook v1`). Compared in constant time.

    serverSignature:
      type: apiKey
      in: header
      name: Signature
      description: |
        Federation only (README §5.22 "Signatures"): an HTTP Message Signature (RFC 9421) by the calling server's
        Ed25519 key (`alg="ed25519"`, `keyid` from its `/.well-known/kinframe`), over `"@method" "@path" "@query"
        "content-digest" "date" "kinframe-server"` with `created` within 5 minutes; `Content-Digest` (RFC 9530,
        sha-256, also for empty bodies) and `Kinframe-Server: <caller base URL>` are required headers.

  parameters:
    FrameId: { name: frameId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ItemId: { name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    PlacementId: { name: placementId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    CalendarId: { name: calendarId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EventId: { name: eventId, in: path, required: true, schema: { $ref: '#/components/schemas/CalendarEventId' } }
    EndpointId: { name: endpointId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    FeedId: { name: feedId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    PostId: { name: postId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    BirthdayId: { name: birthdayId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    SourceId: { name: sourceId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ImportId: { name: importId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    AddressId: { name: addressId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    SenderId: { name: senderId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    HeldMessageId: { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TelegramChatId: { name: chatId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InviteToken: { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
    CommentId: { name: commentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    CircleId: { name: circleId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    MessageId: { name: messageId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ReportId: { name: reportId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RequestId: { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RemoteSubscriptionId: { name: remoteSubscriptionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    BlockedServerId: { name: blockedServerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TargetKind: { name: targetKind, in: path, required: true, schema: { $ref: '#/components/schemas/ReactionTargetKind' } }
    TargetId: { name: targetId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    WeekOf: { name: weekOf, in: path, required: true, description: 'A Monday (YYYY-MM-DD); other days answer `422 validation_failed`.', schema: { type: string, format: date } }
    Before:
      name: before
      in: query
      description: 'Chronological lists (timeline, messages): return what comes before this cursor (a `next_before` value, or a message id).'
      schema: { type: string, maxLength: 200 }
    After:
      name: after
      in: query
      description: 'Chronological lists (comments, messages): return what comes after this id.'
      schema: { $ref: '#/components/schemas/Id' }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 64 } }
    IfMatch: { name: If-Match, in: header, required: true, description: 'Quoted version, e.g. "7"', schema: { type: string } }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Id:
      type: string
      format: uuid
      description: UUIDv7

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        detail: { type: string }
        errors:
          type: array
          description: Field-level validation errors (422)
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }

    ProblemCode:
      type: string
      enum:
        - unauthorized
        - token_expired
        - device_revoked
        - forbidden
        - missing_permission
        - not_found
        - code_invalid
        - code_expired
        - invite_invalid
        - invite_expired
        - link_expired
        - already_member
        - validation_failed
        - too_many_items
        - video_too_long
        - upload_too_large
        - upload_not_found
        - unsupported_media
        - corrupt_media
        - version_conflict
        - frame_offline
        - command_timeout
        - owner_cannot_leave
        - rate_limited
        - app_update_required
        - upstream_unavailable
        - feature_disabled
        - already_decided
        - already_subscribed
        - invalid_transition
        - limit_reached
        - duplicate_birthday
        - duplicate_source
        - source_test_failed
        - duplicate_sender
        - telegram_already_linked
        - cannot_message
        - comments_closed
        - audio_too_long
        - server_error

    AppVersionPolicy:
      type: object
      description: Version policy for one family app platform (README §5.15).
      properties:
        minimum_build:
          type: [integer, 'null']
          description: 'Lowest build (Android versionCode, Apple CFBundleVersion) the server still serves; null: no minimum.'
        recommended_build:
          type: [integer, 'null']
          description: 'Apps below this build show an "update available" banner; null: none.'
        store_url:
          type: [string, 'null']
          format: uri
          description: 'Where to update: the App Store, Mac App Store, Google Play, F-Droid or an APK page; null: the app''s own default.'

    Discovery:
      type: object
      required: [name, version, api, auth, limits]
      properties:
        name: { type: string }
        version: { type: string }
        api: { type: string, format: uri }
        web: { type: string, format: uri }
        auth:
          type: object
          required: [issuer, mobile_client_id, web_client_id, api_resource]
          properties:
            issuer: { type: string, format: uri }
            mobile_client_id: { type: string }
            desktop_client_id:
              type: string
              description: |
                Logto Native app of the Windows, macOS and Linux client. It signs in with a loopback redirect
                (`http://127.0.0.1:<port>/callback`, RFC 8252). Absent on servers bootstrapped before it existed.
            web_client_id: { type: string }
            api_resource: { type: string }
        limits: { $ref: '#/components/schemas/Limits' }
        dev_auth:
          type: boolean
          default: false
          description: True only on development servers running dev auth mode (POST /dev/token). Never true in production.
        weather:
          type: boolean
          default: false
          description: True when the server fetches weather for frames and serves `/v1/geocode`.
        calendar:
          type: boolean
          default: false
          description: True when the server syncs calendars for frames (ICS/webcal and CalDAV).
        app_versions:
          type: object
          description: |
            Family app version policy per platform (README §5.15). A platform is left out when the operator set nothing
            for it. Apps compare their own build number: below `minimum_build` they show a blocking "update" screen
            (the server also answers `426 app_update_required` to their requests), below `recommended_build` a banner
            that can be dismissed.
          properties:
            android: { $ref: '#/components/schemas/AppVersionPolicy' }
            ios: { $ref: '#/components/schemas/AppVersionPolicy' }
            macos: { $ref: '#/components/schemas/AppVersionPolicy' }
        feeds:
          type: boolean
          default: false
          description: True when the server supports feeds and subscriptions (docs/spec/feeds.md).
        birthdays:
          type: boolean
          default: false
          description: True when feeds have birthday lists (docs/spec/birthdays.md). Only true together with `feeds`.
        photo_sources:
          type: boolean
          default: false
          description: True when albums and feeds can sync from Immich or iCloud (docs/spec/photo-sources.md).
        photo_source_providers:
          type: array
          description: The providers this server allows (`icloud_link` can be turned off on its own). Empty without `photo_sources`.
          items: { $ref: '#/components/schemas/PhotoSourceProvider' }
        photo_sources_private_networks:
          type: boolean
          default: false
          description: |
            True when sources may reach private network addresses (a home-network Immich such as
            `http://192.168.1.10:2283`). False: the connect sheet asks for a public address (docs/spec/photo-sources.md §12.3).
        google_photos_import:
          type: boolean
          default: false
          description: True when the operator configured a Google OAuth client, so clients offer "Add from Google Photos".
        email_inbox:
          type: boolean
          default: false
          description: |
            True when frames and feeds can have inbox addresses that turn mailed photos into sends and posts
            (docs/spec/email-inbox.md). Clients hide "Email photos to this frame" otherwise.
        email_inbox_domain:
          type: [string, 'null']
          description: The mail domain of inbox addresses (`<slug>-<random>@<domain>`); null without `email_inbox`.
          examples: [in.kinframe.appmire.be]
        telegram:
          type: boolean
          default: false
          description: |
            True when the operator configured a Telegram bot, so frames and feeds can connect Telegram chats and
            accounts can link Telegram (docs/spec/telegram.md). Clients hide every Telegram section otherwise.
        telegram_bot_username:
          type: [string, 'null']
          description: The bot's username without "@", for `https://t.me/<username>` links; null without `telegram`.
          examples: [kinframe_bot]
        telegram_privacy_mode:
          type: boolean
          default: false
          description: |
            True when the bot runs in Telegram's privacy mode: a group must make the bot an admin before it sees photos,
            so the connect sheet says so up front (docs/spec/telegram.md §6).
        telegram_max_file_bytes:
          type: [integer, 'null']
          description: The largest file the bot can download (20 MB on Telegram's cloud Bot API, up to 2000 MB with a local Bot API server); null without `telegram`.
        social:
          type: boolean
          default: false
          description: True when the server has the home timeline, comment threads, people's reactions, mentions, the `member` role and circles (docs/spec/family-social.md, README §5.18). Only with `feeds`.
        chats:
          type: boolean
          default: false
          description: True when the server has conversations (direct, group, family, circle), blocks and reports (README §5.19).
        voice_messages:
          type: boolean
          default: false
          description: True when chats accept voice messages (needs ffmpeg on the server; README §5.19).
        link_previews:
          type: boolean
          default: false
          description: |
            True when the operator turned on link previews (`KINFRAME_LINK_PREVIEWS=1`): the server fetches pages of
            links in messages itself (public addresses only). Off by default; clients then show links without previews.
        engagement:
          type: boolean
          default: false
          description: True when the server has frame freshness, "Ask for new photos", reminders, streaks, prompts, On this day, summaries, recaps and milestones (README §5.20).
        email_digest:
          type: boolean
          default: false
          description: True when the server can send outgoing mail, so people can choose a daily or weekly email digest of comments and messages.
        server_id:
          type: string
          description: |
            Stable random id of this server (generated at first start), so apps signed in to several servers can tell
            them apart and deduplicate accounts (docs/spec/multi-server.md §2.3).
        server_name:
          type: string
          description: The operator-set label of this server (`KINFRAME_SERVER_LABEL`, default the public host name), shown as the server chip in apps with several accounts.
          examples: [Janssens]
        base_url:
          type: string
          format: uri
          description: The server's public base URL (the `server` field of push payloads and the `kinframe-server` header of federation requests).
        api_version: { type: string, description: 'API major version, `v1`.', examples: [v1] }
        federation: { $ref: '#/components/schemas/FederationInfo' }
        leaving:
          type: boolean
          default: false
          description: True when the server has the leaving choices, take-away, keep requests, the account deletion handover and the memories filter (README §5.21).
        remote_families:
          type: boolean
          default: false
          description: True when frames here can follow families on other servers and families here can allow frames on other servers (README §5.22). False when federation is off.
        webpush_public_key:
          type: [string, 'null']
          description: |
            VAPID application server public key (uncompressed P-256 point, base64url) for browser push
            subscriptions (`PushManager.subscribe({applicationServerKey})`). Null when the server has push disabled.
        shop:
          $ref: '#/components/schemas/Shop'

    Shop:
      type: object
      description: |
        Pre-order shop run by the server operator (README §5.11). Present only when the operator configured one
        (KINFRAME_SHOP_FILE). Prices include VAT. Localized texts are maps from a language code (see docs/i18n.md)
        to text; `en` is always present and is the fallback.
      required: [brand, currency, vat_percent, products, shipping, seller]
      properties:
        brand: { type: string, description: 'Consumer-facing brand name, e.g. in "Get a {brand}". Defaults to the server name.', examples: [kinframe] }
        currency: { type: string, description: ISO 4217, examples: [EUR] }
        vat_percent: { type: number, description: VAT included in all prices, examples: [21] }
        products: { type: array, items: { $ref: '#/components/schemas/ShopProduct' } }
        shipping: { $ref: '#/components/schemas/ShopShipping' }
        estimated_delivery: { $ref: '#/components/schemas/LocalizedText' }
        stock:
          type: object
          description: |
            Shops with stock management: the dispatch day of an order placed now, when every item is in stock
            (the next business day) and when one is not. Business days are Belgian working days.
          required: [ships_in_stock, ships_out_of_stock]
          properties:
            ships_in_stock: { type: string, format: date }
            ships_out_of_stock: { type: string, format: date }
        notice:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: |
            A notice shown prominently at the top of the storefront and the shop page, above the products (e.g.
            "we resell converted frames"). Plain text, no HTML; a blank line starts a new paragraph. Absent when
            the operator configured none.
        diy: { $ref: '#/components/schemas/ShopDiy' }
        elsewhere:
          type: array
          items: { $ref: '#/components/schemas/ShopElsewhereLink' }
          description: |
            Retailers selling a frame the convert tool supports. Links for countries outside `shipping.countries`
            are shown to visitors elsewhere ("Outside Belgium?"); links that list a shipping country are shown to
            visitors from that country in the "buy it yourself and convert it" section. The links may be affiliate
            links (shown with a disclosure). Absent when the operator configured none.
        domains:
          type: array
          items: { type: string }
          description: |
            Storefront host names (no scheme or port). On these hosts the web app is the brand's shop: landing page,
            `/shop`, `/shop/cancel`, `/shop/order` and `/shop/terms`, calling the API on its own origin; every other path goes to `web`, where
            sign-in and the family app live. Absent when the operator configured none.
          examples: [[shop.example.org]]
        default_locale:
          type: string
          description: |
            Storefront language for visitors whose browser prefers none of `en`, `nl`, `fr`, `de` (the languages
            the shop emails in). Defaults to `en`.
          examples: [nl]
        checkout:
          type: boolean
          default: false
          description: |
            True when orders are paid online: `createShopReservation` then needs the delivery address and answers
            with a `checkout_url` to send the customer to. False: reservations without payment.
        seller:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            legal: { type: string, description: 'Legal line for the footer, e.g. company, address and VAT number.' }
            privacy_url: { type: string, format: uri }
            terms_url: { type: string, format: uri, description: Terms of sale; absent = the web app's own page `/shop/terms`. }
            address: { type: string, description: Seller's address (terms of sale). }
            vat_number: { type: string }
            phone: { type: string }

    ShopDiy:
      type: object
      description: |
        Title and text of the "buy it yourself and convert it" section, shown to visitors in a shipping country when
        `elsewhere` has links for that country. Plain text; a blank line in `body` starts a new paragraph. Either may
        be absent; the web app then uses its own texts.
      properties:
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }

    ShopElsewhereLink:
      type: object
      description: A retailer selling a frame the convert tool supports, for visitors from some countries.
      required: [countries, retailer, product, url]
      properties:
        countries:
          type: array
          items: { type: string }
          description: ISO 3166-1 alpha-2 codes; `*` means every other country.
          examples: [[NL]]
        retailer: { type: string, examples: [bol.com] }
        product: { type: string, description: The frame model., examples: [Denver PFF-1024] }
        url: { type: string, format: uri }
        affiliate: { type: boolean, default: false, description: True for an affiliate link; the web app then shows a disclosure. }
        secondary:
          type: boolean
          default: false
          description: True for an alternative shown as a small text link ("Also at bol.com") below the main links.

    LocalizedText:
      type: object
      description: Language code → text; `en` is the fallback.
      additionalProperties: { type: string }

    ShopProduct:
      type: object
      required: [id, name, price_cents, max_qty]
      properties:
        id: { type: string, examples: [frame-10] }
        name: { type: string, examples: ['kinframe 10.1"'] }
        size: { type: string, description: Screen size label, examples: ['10.1"'] }
        price_cents: { type: integer, description: 'Unit price incl. VAT, in cents' }
        max_qty: { type: integer, minimum: 1 }
        in_stock:
          type: integer
          minimum: 0
          description: 'Shops with `stock`: frames ready to ship, at most `max_qty` (the real count is not shown).'
        image: { type: string, description: 'Illustration key: frame-10 or frame-15', examples: [frame-10] }
        photos:
          type: array
          items: { type: string }
          description: |
            Product photos, the first one leading: paths on the API origin (`/v1/shop/media/{name}`, public, cached
            for a day). Absent = show the `image` illustration.
        specs:
          type: object
          description: Language code → short spec bullets; `en` is the fallback.
          additionalProperties: { type: array, items: { type: string } }

    ShopShipping:
      type: object
      required: [countries, flat_cents]
      properties:
        countries: { type: array, items: { type: string, description: ISO 3166-1 alpha-2 }, examples: [[BE, NL]] }
        flat_cents: { type: integer, description: Shipping cost per order incl. VAT }
        free_from_cents: { type: [integer, 'null'], description: Item subtotal from which shipping is free; null = never }

    ShopReservationStatus:
      type: string
      enum: [new, contacted, confirmed, shipped, cancelled]

    ShopPaymentStatus:
      type: string
      description: The payment at the provider (shops with `checkout`); `paid` confirms the order.
      enum: [open, pending, authorized, paid, failed, canceled, expired]

    ShopReservationCreate:
      type: object
      required: [name, email, country, items, consent]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        country: { type: string, minLength: 2, maxLength: 2, examples: [BE] }
        postal_code: { type: string, maxLength: 12 }
        street: { type: string, maxLength: 200, description: Street and number (required when the shop has `checkout`). }
        city: { type: string, maxLength: 100, description: Required when the shop has `checkout`. }
        phone: { type: string, maxLength: 30, description: Optional, for the delivery. }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, maxLength: 64 }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: string, maxLength: 1000 }
        locale: { type: string, maxLength: 35, description: Language for the emails (falls back to English), examples: [nl] }
        consent:
          type: boolean
          description: |
            Must be true. Reservations: the customer agrees to be contacted about this reservation. Shops with
            `checkout`: the customer accepts the terms of sale.
        website: { type: string, maxLength: 200, description: Honeypot; leave empty. }

    ShopLine:
      type: object
      required: [product_id, name, quantity, unit_cents, line_cents]
      properties:
        product_id: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_cents: { type: integer }
        line_cents: { type: integer }

    ShopReservationReceipt:
      type: object
      required: [reference, status, email, items, subtotal_cents, shipping_cents, total_cents, currency]
      properties:
        reference: { type: string, examples: [KF-7Q3M] }
        status: { $ref: '#/components/schemas/ShopReservationStatus' }
        email: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ShopLine' } }
        subtotal_cents: { type: integer }
        shipping_cents: { type: integer }
        total_cents: { type: integer }
        currency: { type: string }
        payment_status: { $ref: '#/components/schemas/ShopPaymentStatus' }
        checkout_url:
          type: [string, 'null']
          format: uri
          description: |
            Shops with `checkout`: where the customer pays (the provider's payment page). Null once the payment is
            final.
        ships_on: { type: [string, 'null'], format: date, description: 'Shops with `stock`: the promised dispatch day.' }

    ShopReservation:
      type: object
      required: [id, reference, status, name, email, country, items, subtotal_cents, shipping_cents, total_cents, currency, locale, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ShopReservationStatus' }
        name: { type: string }
        email: { type: string }
        country: { type: string }
        postal_code: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        locale: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ShopLine' } }
        subtotal_cents: { type: integer }
        shipping_cents: { type: integer }
        total_cents: { type: integer }
        currency: { type: string }
        internal_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        street: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        payment_status: { $ref: '#/components/schemas/ShopPaymentStatus' }
        paid_at: { type: [string, 'null'], format: date-time }
        shipped_at: { type: [string, 'null'], format: date-time }
        tracking_url: { type: [string, 'null'] }
        ships_on: { type: [string, 'null'], format: date }

    ShopStockItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        quantity: { type: integer, minimum: 0 }

    Limits:
      type: object
      required: [max_items_per_send, max_video_seconds, max_upload_bytes]
      properties:
        max_items_per_send: { type: integer, default: 200 }
        max_video_seconds: { type: integer, default: 300 }
        max_upload_bytes: { type: integer, default: 2147483648 }
        trash_retention_days: { type: integer, default: 30 }
        max_feeds_per_user: { type: integer, default: 20, description: Feeds one account may own. }
        max_subscriptions_per_feed: { type: integer, default: 100 }
        max_feed_backfill_items: { type: integer, default: 5000, description: 'Cap of `history: all` per subscription (newest first).' }
        max_birthdays_per_feed: { type: integer, default: 200, description: Birthday people per feed (pending and approved). }
        max_photo_sources_per_target: { type: integer, default: 5, description: Photo sources per album or feed. }
        max_photo_sources_per_user: { type: integer, default: 20, description: Photo sources one account owns. }
        max_photo_source_items: { type: integer, default: 10000, description: Live imported items per photo source; newer upstream items beyond it are skipped. }
        max_photo_source_run_bytes: { type: integer, default: 2147483648, description: Bytes one sync run downloads; the rest follows in the next runs. }
        max_google_import_items: { type: integer, default: 500, description: Items per Google Photos import (the picker's own maximum is 2000). }
        max_email_addresses_per_target: { type: integer, default: 5, description: Inbox addresses per frame or feed. }
        max_email_senders_per_address: { type: integer, default: 200, description: Allowed and blocked senders per inbox address. }
        max_email_message_bytes: { type: integer, default: 52428800, description: 'One mail as received (SMTP SIZE, webhook body).' }
        max_email_messages_per_address_day: { type: integer, default: 200, description: Mails processed per inbox address per day; more are dropped. }
        max_email_held_messages: { type: integer, default: 100, description: Held mails per inbox address (10 per pending sender); the oldest go first. }
        max_telegram_chats_per_target: { type: integer, default: 5, description: Connected Telegram chats per frame or feed. }
        max_telegram_chats_per_user: { type: integer, default: 20, description: Connected Telegram chats one account owns. }
        max_telegram_items_per_chat_hour: { type: integer, default: 300, description: Photos and videos accepted per Telegram chat per hour; more are skipped with one reply in the chat. }
        max_comment_chars: { type: integer, default: 2000, description: Characters (Unicode code points) per comment. }
        max_message_chars: { type: integer, default: 4000, description: Characters (Unicode code points) per chat message. }
        max_mentions: { type: integer, default: 20, description: Mentions per comment or message. }
        max_message_items: { type: integer, default: 30, description: Photos and videos per chat message. }
        max_group_members: { type: integer, default: 100, description: People in a group chat, the creator included. }
        max_circles_per_feed: { type: integer, default: 20 }
        max_voice_seconds: { type: integer, default: 300, description: Length of one voice message. }
        message_edit_hours: { type: integer, default: 24, description: How long after sending the author can edit a message. }

    Place:
      type: object
      description: A geocoding result (Open-Meteo geocoding API).
      required: [name, lat, lon]
      properties:
        name: { type: string, examples: [Gent] }
        admin1: { type: [string, 'null'], description: 'Region / state / province', examples: [Flanders] }
        country: { type: [string, 'null'], examples: [Belgium] }
        country_code: { type: [string, 'null'], description: ISO 3166-1 alpha-2, examples: [BE] }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        timezone: { type: [string, 'null'], examples: [Europe/Brussels] }

    User:
      type: object
      required: [id, display_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'], format: uri }
        share_location_names: { type: boolean }
        locale: { type: [string, 'null'] }
        timezone: { type: [string, 'null'], description: IANA time zone reported by the user's apps; null until one did., examples: [Europe/Brussels] }
        is_operator: { type: boolean }
        show_read_receipts:
          type: boolean
          default: true
          description: Show "Seen" to others in direct chats and small groups; off also hides others' read state from this user (README §5.19).
        created_at: { type: string, format: date-time }

    PushEndpointCreate:
      type: object
      required: [kind, endpoint]
      properties:
        kind: { type: string, enum: [unifiedpush, fcm, apns, webpush] }
        endpoint: { type: string, description: 'UnifiedPush/WebPush URL, or FCM/APNs token' }
        webpush_keys:
          type: object
          properties:
            p256dh: { type: string }
            auth: { type: string }
        device_name: { type: string, maxLength: 60 }
        locale: { type: string }

    PushEndpoint:
      allOf:
        - $ref: '#/components/schemas/PushEndpointCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            created_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [owner, admin, member]

    Permissions:
      type: object
      properties:
        send: { type: boolean }
        invite: { type: boolean }
        see_library: { type: boolean }
        manage_library: { type: boolean }
        change_settings: { type: boolean }

    FrameSummary:
      type: object
      required: [id, name, role, permissions, online]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        location: { type: [string, 'null'] }
        owner_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        online: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        screen: { $ref: '#/components/schemas/Screen' }
        app_version: { type: [string, 'null'] }
        needs_update: { type: boolean }
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
        freshness:
          description: How recently the frame got new photos from people (README §5.20). Absent on servers without `engagement`.
          $ref: '#/components/schemas/Freshness'
        photo_request:
          description: 'The frame''s "Ask for new photos": the open one, or one answered in the last 24 hours; null otherwise.'
          oneOf: [ { $ref: '#/components/schemas/PhotoRequest' }, { type: 'null' } ]

    Frame:
      allOf:
        - $ref: '#/components/schemas/FrameSummary'
        - type: object
          properties:
            default_permissions: { $ref: '#/components/schemas/Permissions' }
            approve_joins_on_frame: { type: boolean }
            invite_requires_approval: { type: boolean }
            moderation: { type: boolean }
            member_count: { type: integer }
            placement_count: { type: integer }
            created_at: { type: string, format: date-time }

    Screen:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, examples: [1280] }
        height: { type: integer, examples: [800] }
        density_dpi: { type: integer }
        orientation: { type: string, enum: [landscape, portrait] }

    FrameHealth:
      type: object
      properties:
        online: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_heartbeat: { $ref: '#/components/schemas/Heartbeat' }
        last_unclean_shutdown_at: { type: [string, 'null'], format: date-time }

    Heartbeat:
      type: object
      required: [app_version, uptime_s]
      properties:
        app_version: { type: string }
        app_version_code: { type: integer }
        android_sdk: { type: integer }
        features:
          type: array
          description: |
            Optional capabilities of the frame app. `feed_backfill`: the frame shows `Placement.backfill` placements
            quietly (no "N new" card, no wake). Until a frame's latest heartbeat lists it, the server withholds
            backfilled feed placements from its change feed and emits them once it does. `birthdays`: the frame shows
            the `birthdays` change (informational only: nothing is withheld; apps use it for
            `Subscription.frame.birthdays_supported`). `play`: informational, the frame app is the Google Play build
            (docs/play-frame.md): it updates through Google Play rather than from `GET /device/update`, and has no root.
            `comments`, `photo_requests`, `prompts`: informational (README §5.20); the frame shows the `comments` change,
            has the "Ask for new photos" button, and shows prompt title cards. Apps use them to say "update the frame
            app"; nothing is withheld.
          items: { type: string }
        uptime_s: { type: integer }
        wifi_ssid: { type: [string, 'null'] }
        wifi_rssi_dbm: { type: [integer, 'null'] }
        wifi_link_mbps: { type: [integer, 'null'] }
        storage_free_bytes: { type: integer }
        storage_total_bytes: { type: integer }
        cache_bytes: { type: integer }
        placements_cached: { type: integer }
        placements_missing: { type: integer }
        placements_evicted:
          type: integer
          description: Renditions the frame removed from its cache to free space (least recently shown first); it downloads them again before they show.
        storage_state:
          type: string
          enum: [ok, low, critical]
          description: '`low`: below the frame''s low-water mark, evicting. `critical`: nearly full with nothing left to evict.'
        screen_state: { type: string, enum: ['on', 'off', dimmed, sleeping] }
        last_shutdown_clean: { type: boolean }
        crash_count_24h: { type: integer }
        local_time: { type: string, format: date-time }
        timezone: { type: string, examples: [Europe/Brussels] }
        update_state:
          type: string
          description: |
            Self-update state (README §5.7). `idle`: nothing pending. `downloading`, `installing`: in progress.
            `waiting`: downloaded, waiting for the frame to be idle. `needs_user`: no root, the system installer is
            showing. `updated`: the last update succeeded. `failed`: the last attempt failed (see
            `last_update_error`). `rolled_back`: the new version crash-looped and the previous one was reinstalled.
          enum: [idle, downloading, waiting, installing, needs_user, updated, failed, rolled_back]
        last_update_error: { type: [string, 'null'], description: 'Short machine-readable reason, e.g. `sha256_mismatch`, `signature_mismatch`, `install_failed: ...`, `crash_loop 20199`' }

    FrameCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [sleep, wake, restart, next, previous, show_placement, sync_now, identify] }
        placement_id: { $ref: '#/components/schemas/Id' }

    CommandResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error_code: { type: [string, 'null'] }

    RedeemResult:
      type: object
      required: [status, frame]
      properties:
        status: { type: string, enum: [claimed, joined, pending, already_member] }
        frame: { $ref: '#/components/schemas/FrameSummary' }
        join_request_id: { $ref: '#/components/schemas/Id' }

    Member:
      type: object
      required: [user_id, display_name, role, permissions]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        joined_at: { type: string, format: date-time }
        last_sent_at: { type: [string, 'null'], format: date-time }

    JoinRequest:
      type: object
      required: [id, user, via, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        user:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            display_name: { type: string }
            avatar_url: { type: [string, 'null'] }
        via:
          type: string
          description: |
            How the request came. `frame_code`, `invite`: as before. Outside channels (one enum value each, later channels
            add only a value): `email`, from the join link in a reply to someone who mailed photos
            (docs/spec/email-inbox.md §10.4); `telegram`, from the join link the bot gave a Telegram group member in a
            private chat (docs/spec/telegram.md §10.3). Channel requests always need approval.
          enum: [frame_code, invite, email, telegram]
        invited_by_name: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        via_name:
          type: [string, 'null']
          description: |
            Channel requests only: who the channel invited, as managers should see it (for `email`: the sender's name and
            address, "Jan · jan.peeters@telenet.be"; for `telegram`: the Telegram name and the chat, "Ben · Telegram,
            Peeters family").
        via_matches:
          type: [boolean, 'null']
          description: |
            Channel requests only: whether the requester's verified identity matches the one the link was sent to (for
            `email`: the account's verified email is that address); null when the channel can't tell (always for
            `telegram`).
        created_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, token, url, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        token: { type: string }
        url: { type: string, format: uri }
        created_by_name: { type: string }
        max_uses: { type: [integer, 'null'] }
        uses: { type: integer }
        note: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }

    InvitePreview:
      type: object
      required: [frame_name, invited_by_name, requires_approval]
      properties:
        frame_name: { type: string }
        frame_location: { type: [string, 'null'] }
        owner_name: { type: string }
        invited_by_name: { type: string }
        requires_approval: { type: boolean }
        already_member: { type: boolean }

    FrameCode:
      type: object
      required: [code, expires_at, join_url]
      properties:
        code: { type: string, pattern: '^[0-9]{8}$' }
        expires_at: { type: string, format: date-time }
        join_url: { type: string, format: uri }
        claimed: { type: boolean, description: false while the frame has no owner }

    MediaKind:
      type: string
      description: |
        `live` is a Live Photo (iOS) or Motion Photo (Android): a still plus a short motion clip (`Item.motion`).
        Clients that don't know `live` treat it as `photo`: every photo field (size, thumbnails, the frame's
        `media`) describes the still. As a library filter, `photo` includes live items and `live` only them.
      enum: [photo, video, live]

    Fit:
      type: string
      enum: [fill, fit]

    FocalPoint:
      type: object
      description: Relative to the master rendition, 0..1 from top-left.
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }

    Reaction:
      type: string
      enum: [love, laugh, wow, sad]

    ReplyPreset:
      type: string
      enum: [beautiful, call_me, miss_you, thanks]

    SendCreate:
      type: object
      description: |
        Recipients are `frame_ids` plus `feed_ids`; together they must not be empty (`422 validation_failed` on
        `frame_ids`). Feeds need membership (any role), frames need `send`. A frame that is a direct recipient and
        also subscribes to a feed in `feed_ids` gets the item once (docs/spec/feeds.md §6.2).
      required: [frame_ids, items]
      properties:
        frame_ids:
          type: array
          description: Frames to send to directly. May be empty when `feed_ids` is not.
          items: { $ref: '#/components/schemas/Id' }
        feed_ids:
          type: array
          maxItems: 20
          description: 'Feeds to post to. Each becomes one post; every active subscribed frame gets a placement (`origin: feed`). Needs role `poster` or above (`403 missing_permission` for `member`).'
          items: { $ref: '#/components/schemas/Id' }
        circle_ids:
          type: array
          maxItems: 20
          description: |
            The audience inside a feed: at most one circle per feed, its feed must be in `feed_ids`, and the caller must
            be in the circle (`422 validation_failed`, field `circle_ids`). That feed's post is shared with the circle
            only (README §5.18); other feeds get a whole-family post.
          items: { $ref: '#/components/schemas/Id' }
        prompt_id:
          type: string
          format: uuid
          description: 'Tag the feed posts as answers to this weekly prompt (`FeedPrompt.id`, current or previous week); only the post in that prompt''s feed is tagged.'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [upload_id]
            properties:
              upload_id: { type: string, description: 'tus upload id, or an existing item id when the server reported a duplicate. For a live item, the still.' }
              caption: { type: [string, 'null'], maxLength: 280 }
              focal_point: { $ref: '#/components/schemas/FocalPoint' }
              fit: { $ref: '#/components/schemas/Fit' }
              trim:
                type: object
                description: Videos only. The selected part must be at least 3 seconds long (unless the whole video is shorter).
                properties:
                  start_ms: { type: integer, minimum: 0 }
                  end_ms: { type: integer, minimum: 1 }
              include_audio:
                type: boolean
                default: true
                description: For a live item it applies to the motion clip, which is muted unless this is `true` explicitly.
              captured_at:
                type: [string, 'null']
                format: date-time
                description: |
                  Capture time. Prepared uploads carry no metadata, so clients read it from the original (EXIF,
                  QuickTime) and send it here. Used when the stored file has no capture time.
              width:
                type: integer
                minimum: 1
                description: Prepared uploads only. Pixel width the client produced; a mismatch makes the server take the normal pipeline.
              height:
                type: integer
                minimum: 1
                description: Prepared uploads only. Pixel height the client produced.
              duration_ms:
                type: integer
                minimum: 1
                description: Prepared videos only. Duration the client produced (±500 ms).
              live_video_upload_id:
                type: string
                description: |
                  Makes this a Live Photo: the tus upload of its motion clip (MOV/MP4, at most 10 s; longer clips
                  are cut). `upload_id` must be a photo and `trim` is not allowed. The clip may be a prepared
                  `video-master-v1`.
              live:
                type: boolean
                default: true
                description: |
                  `false` sends a Motion Photo (a JPEG/HEIC with an embedded video, detected by the server) as a
                  still only. Without `live_video_upload_id`, the server splits such files itself.

    Item:
      type: object
      required: [id, kind, status, sender_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        status: { type: string, enum: [processing, ready, failed] }
        failure_code: { type: [string, 'null'] }
        sender_id: { $ref: '#/components/schemas/Id' }
        sender_name: { type: string }
        caption: { type: [string, 'null'] }
        caption_edited: { type: boolean }
        focal_point: { $ref: '#/components/schemas/FocalPoint' }
        fit: { $ref: '#/components/schemas/Fit' }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        has_audio: { type: [boolean, 'null'] }
        captured_at: { type: [string, 'null'], format: date-time }
        place_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        imported_from:
          description: |
            Set on items a frame imported from another app's leftover data (docs/spec/frameo-import.md). The sender is
            then the frame; clients show `imported_sender_name` instead, e.g. "Anna · via Frameo".
          oneOf: [ { $ref: '#/components/schemas/ItemOrigin' }, { type: 'null' } ]
        imported_sender_name:
          type: [string, 'null']
          description: The original sender's display name in that app, when known.
        via:
          description: |
            Set on items a photo source synced or a Google Photos import copied (docs/spec/photo-sources.md §9.5), or
            that were mailed to an inbox address (`service: email`, docs/spec/email-inbox.md §9) or posted in a
            connected Telegram chat (`service: telegram`, docs/spec/telegram.md §8). The sender is the account that set
            it up (for mail and Telegram: the matched or linked account, or the address's or chat's owner); clients and
            frames show "Anna via Immich" ("Anna · Feed via Immich" for feed placements), or "Jan via email" / "Jan via
            Telegram". Optional: clients that don't know it show the sender only.
          oneOf: [ { $ref: '#/components/schemas/ItemVia' }, { type: 'null' } ]
        motion:
          description: |
            Live items only: the motion clip. `GET /v1/items/{id}/media/motion` streams its master once `status` is
            `ready`. If the clip fails, the item stays a plain photo (`kind: photo`, no `motion`).
          oneOf:
            - $ref: '#/components/schemas/ItemMotion'
            - { type: 'null' }
        thumb_url:
          type: [string, 'null']
          format: uri
          description: Short-lived signed URL (about 1 h) usable directly in <img src> without an Authorization header.
        remote_sender:
          oneOf: [ { $ref: '#/components/schemas/ItemRemoteSender' }, { type: 'null' } ]
          description: Copied from a family on another server (README §5.22); show `remote_sender.name` instead of a local person.
        former_sender_name:
          type: [string, 'null']
          description: |
            Handed over when its sender deleted their account with "Leave my photos to the families" (README §5.21):
            `sender_id` is now the new owner; show "<former_sender_name> (former member)" as the credit.

    ItemOrigin:
      type: string
      enum: [frameo]
      description: An app a frame can import leftover photos from.

    PhotoService:
      type: string
      description: 'The outside service a photo came from. `email`: mailed to an inbox address (docs/spec/email-inbox.md). `telegram`: posted in a connected Telegram chat (docs/spec/telegram.md).'
      enum: [immich, icloud, google_photos, email, telegram]

    ItemVia:
      type: object
      required: [service, label]
      properties:
        service: { $ref: '#/components/schemas/PhotoService' }
        label:
          type: string
          description: |
            Photo services: the service name to show, not translated ("Immich", "iCloud", "Google Photos"); frames show
            "<sender> via <label>". `email`, `telegram`: the name of the person who mailed or posted it ("Jan"; for
            Telegram the linked account's display name, else the Telegram display name); frames show "<label> via
            email" / "<label> via Telegram" (localized) **instead of** the sender's name, since the sender may be the
            address's or chat's owner sending on Jan's behalf.
          examples: [Immich, Jan]
        source_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The photo source that synced it, while it exists (null for Google imports and deleted sources).
        address_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: '`email`: the inbox address it was mailed to, while it exists.'
        telegram_chat_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: '`telegram`: the Telegram chat it was posted in (`TelegramChat`), while it exists.'

    ItemMotion:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [processing, ready] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        has_audio: { type: [boolean, 'null'] }

    PlacementStatus:
      type: string
      enum: [pending, ready, delivered, seen, failed, removed]

    Placement:
      type: object
      required: [id, frame_id, item, status, hidden, trashed]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        item: { $ref: '#/components/schemas/Item' }
        status: { $ref: '#/components/schemas/PlacementStatus' }
        hidden: { type: boolean }
        trashed: { type: boolean }
        trashed_at: { type: [string, 'null'], format: date-time }
        pending_moderation: { type: boolean }
        fit_override: { oneOf: [ { $ref: '#/components/schemas/Fit' }, { type: 'null' } ] }
        focal_override: { oneOf: [ { $ref: '#/components/schemas/FocalPoint' }, { type: 'null' } ] }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
        replies:
          type: array
          items:
            type: object
            properties:
              preset: { $ref: '#/components/schemas/ReplyPreset' }
              at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        seen_at: { type: [string, 'null'], format: date-time }
        received_at: { type: string, format: date-time }
        album_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        shared_by_user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The member who shared this placement from another frame (`sharePlacements`); null for sends and forwards.
        shared_by_name:
          type: [string, 'null']
          description: Display name of `shared_by_user_id`. Frames show "Sender · shared by Name".
        origin: { $ref: '#/components/schemas/PlacementOrigin' }
        origin_feed_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: '`origin: feed`: the feed that placed it.'
        origin_feed_name:
          type: [string, 'null']
          description: Current name of `origin_feed_id`. Frames show "Sender · Feed name" (instead of "shared by").
        feed_ids:
          type: array
          description: |
            Feeds whose active subscriptions hold this placement on the frame (possibly also when `origin` is `send`).
            Used for feed mode (`slideshow.feed_id`), like `album_ids` for album mode.
          items: { $ref: '#/components/schemas/Id' }
        backfill:
          type: boolean
          default: false
          description: |
            Placed as history (a feed subscription's history, a history change, a resume, or a photo source's first
            import). Frames don't treat it as new: no "N new" card, no screen wake. `received_at` is then the post time
            (for a photo source's first import: when the photo was added upstream, else its capture time).
        prompt_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: 'Feed placements whose post answers a weekly prompt (`prompts` change): frames show the prompt''s title card before the first of them.'
        taken_away:
          oneOf: [ { $ref: '#/components/schemas/PlacementTakenAway' }, { type: 'null' } ]
          description: 'Set while the sender took it away and it waits in the frame''s trash (`visibility: taken_away`, README §5.21). Never in the device change feed (the frame gets `placement.remove`).'
        origin_remote:
          oneOf: [ { $ref: '#/components/schemas/PlacementRemote' }, { type: 'null' } ]
          description: |
            Set on copies of posts of a family on another server (README §5.22). `origin` is then `feed`,
            `origin_feed_id` null and `origin_feed_name` the remote family's name, so frames show "Lies · Janssens"
            without knowing about servers.

    ShareResult:
      type: object
      required: [placements, skipped]
      properties:
        placements:
          type: array
          description: The placements created on the target frames (empty for a dry run).
          items: { $ref: '#/components/schemas/Placement' }
        skipped:
          type: array
          description: Source placement × target frame pairs that were not shared.
          items:
            type: object
            required: [placement_id, frame_id, reason]
            properties:
              placement_id: { $ref: '#/components/schemas/Id' }
              frame_id: { $ref: '#/components/schemas/Id' }
              reason: { type: string, enum: [already_on_frame] }
              existing_placement_id: { $ref: '#/components/schemas/Id' }

    Send:
      type: object
      required: [id, created_at, items, frames]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
        via:
          description: |
            Set when a photo source or a Google Photos import made this send on the sender's behalf (one send per sync
            run or import), when it came by mail (`service: email`, one send per mail), or from a connected Telegram
            chat (`service: telegram`, one send per batch). Such sends get no `delivered` push, except Telegram sends by
            a linked account (they are that person's own sends).
          oneOf: [ { $ref: '#/components/schemas/ItemVia' }, { type: 'null' } ]
        feeds:
          type: array
          description: The feeds this send was posted to, with receipts (docs/spec/feeds.md §7).
          items: { $ref: '#/components/schemas/SendFeed' }
        frames:
          type: array
          description: Per-frame delivery for this send (direct recipients and shares; feed placements are in `feeds`).
          items:
            type: object
            required: [frame_id, frame_name, placements]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              online: { type: boolean }
              placements:
                type: array
                items:
                  type: object
                  required: [placement_id, item_id, status]
                  properties:
                    placement_id: { $ref: '#/components/schemas/Id' }
                    item_id: { $ref: '#/components/schemas/Id' }
                    status: { $ref: '#/components/schemas/PlacementStatus' }
                    reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
                    replies: { type: array, items: { $ref: '#/components/schemas/ReplyPreset' } }
                    shared_by_name: { type: [string, 'null'], description: Set when another member shared this item to the frame. }
        summary:
          type: object
          properties:
            processing: { type: integer }
            pending: { type: integer }
            delivered: { type: integer }
            seen: { type: integer }
            failed: { type: integer }

    Album:
      type: object
      required: [id, name, version, placement_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        version: { type: integer }
        placement_count: { type: integer }
        cover_placement_id: { $ref: '#/components/schemas/Id' }
        placement_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Ordered. }
        photo_source_count: { type: integer, description: Photo sources syncing into this album (docs/spec/photo-sources.md); details for album managers in `listAlbumPhotoSources`. }
        only_in_album_mode:
          type: boolean
          default: false
          description: >-
            Only play this album's photos when the frame plays this album (album mode or its schedule), not in the
            normal slideshow. A placement is left out of the normal slideshow when it is in at least one album with
            this flag and in no album without it. Frames that don't know the flag show everything as before.
        schedule:
          type: [object, 'null']
          description: Play this album automatically between dates each year (e.g. December).
          properties:
            from_month_day: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }
            to_month_day: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }

    AlbumWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        placement_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        cover_placement_id: { $ref: '#/components/schemas/Id' }
        schedule: { $ref: '#/components/schemas/Album/properties/schedule' }
        only_in_album_mode: { $ref: '#/components/schemas/Album/properties/only_in_album_mode' }

    # ---------------------------------------------------------------- feeds (docs/spec/feeds.md)
    FeedRole:
      type: string
      description: '`member` reads, comments, reacts and chats but does not post photos (docs/spec/family-social.md §3). Joiners get `poster` or `member` by the feed''s `new_members_can_post`.'
      enum: [owner, admin, poster, member]

    FeedSummary:
      type: object
      required: [id, name, role, member_count, subscription_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        cover_url:
          type: [string, 'null']
          format: uri
          description: Short-lived signed thumbnail URL (thumb_512 of `cover_item_id`), usable in <img src>.
        role: { $ref: '#/components/schemas/FeedRole' }
        member_count: { type: integer }
        subscription_count: { type: integer, description: Active and paused subscriptions. }
        last_post_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        freshness:
          description: 'How recently the family got new posts from people (README §5.20). Absent without `engagement`.'
          $ref: '#/components/schemas/Freshness'
        streak:
          description: Null when the family turned streaks off. Absent without `engagement`.
          oneOf: [ { $ref: '#/components/schemas/FeedStreakSummary' }, { type: 'null' } ]
        conversation_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The family chat. Absent without `chats`.

    Feed:
      allOf:
        - $ref: '#/components/schemas/FeedSummary'
        - type: object
          properties:
            owner_name: { type: string }
            cover_item_id:
              oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
              description: An item of a live post of this feed.
            auto_approve_subscriptions: { type: boolean }
            invite_requires_approval: { type: boolean }
            members_see_reactions: { type: boolean, description: 'Every member sees frames'' reactions and quick replies in posts'' reaction rows and threads (default on for new feeds).' }
            members_see_receipts: { type: boolean, description: 'Every member sees per-frame receipts (delivered, seen) of every post (default off).' }
            new_members_can_post: { type: boolean, description: 'Joiners become `poster` (default) or, when off, `member`.' }
            members_can_create_circles: { type: boolean, description: Any member may create circles (default on); otherwise owner and admins only. }
            circle_count: { type: integer, description: Circles the caller can see. }
            mute: { $ref: '#/components/schemas/FeedMute' }
            posters_can_invite: { type: boolean, description: Posters may create `join` invites and revoke their own. }
            posters_can_add_birthdays: { type: boolean, description: Posters add birthday people directly instead of suggesting them. }
            birthday_notifications: { type: boolean, description: 'The caller''s own preference (`updateFeedPreferences`): morning and greeting notifications for this feed''s birthdays.' }
            birthday_count: { type: integer, description: Approved birthday people. }
            pending_birthday_count: { type: integer, description: Suggestions waiting; owner and admins only (0 for posters). }
            post_count: { type: integer }
            pending_subscription_count: { type: integer, description: Owner and admins only (0 for posters). }
            pending_join_request_count: { type: integer, description: Owner and admins only (0 for posters). }
            allow_remote_frames: { type: boolean, description: 'Frames on other servers may follow this family through `subscribe` invites with `allow_remote` (default off; README §5.22).' }

    FeedCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        auto_approve_subscriptions: { type: boolean, default: false }
        invite_requires_approval: { type: boolean, default: true }
        members_see_reactions: { type: boolean, default: true, description: 'Default changed to true with docs/spec/family-social.md: reactions are social now.' }
        members_see_receipts: { type: boolean, default: false }
        new_members_can_post: { type: boolean, default: true }
        members_can_create_circles: { type: boolean, default: true }
        posters_can_invite: { type: boolean, default: false }
        posters_can_add_birthdays: { type: boolean, default: false }
        allow_remote_frames: { type: boolean, default: false }

    FeedUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        cover_item_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: An item of a live post of this feed; null removes the cover.
        auto_approve_subscriptions: { type: boolean, description: Requests by non-admin members become active without approval. }
        invite_requires_approval: { type: boolean, description: Join invites need an admin's approval. }
        members_see_reactions: { type: boolean, description: Every member sees frames' reactions and quick replies on every post. }
        members_see_receipts: { type: boolean, description: Every member sees per-frame receipts of every post. }
        new_members_can_post: { type: boolean, description: 'Joiners become `poster` (true) or `member` (false). Existing members keep their role.' }
        members_can_create_circles: { type: boolean }
        posters_can_invite: { type: boolean, description: 'Posters may create `join` invites (and list and revoke their own).' }
        posters_can_add_birthdays: { type: boolean, description: Posters add birthday people directly (and edit and remove the ones they added) instead of suggesting them. }
        allow_remote_frames: { type: boolean, description: 'Owner and admins. Turning it off ends every remote subscription of the family (`removed_by_feed`).' }

    FeedMember:
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/FeedRole' }
        joined_at: { type: string, format: date-time }
        last_posted_at: { type: [string, 'null'], format: date-time }

    FeedInvitePurpose:
      type: string
      description: '`join`: become a poster. `subscribe`: subscribe frames you manage (pre-approved), without joining.'
      enum: [join, subscribe]

    FeedInviteCreate:
      type: object
      required: [purpose]
      properties:
        purpose: { $ref: '#/components/schemas/FeedInvitePurpose' }
        max_uses: { type: [integer, 'null'], minimum: 1, description: null = unlimited }
        expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
        note: { type: string, maxLength: 80, description: Shown to admins when approving a join request. }
        allow_remote: { type: boolean, default: false, description: '`subscribe` only, and only when the family has `allow_remote_frames`: frames on other servers may use this link (README §5.22).' }

    FeedInvite:
      type: object
      required: [id, purpose, token, code, url, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        purpose: { $ref: '#/components/schemas/FeedInvitePurpose' }
        token: { type: string }
        code: { type: string, description: 'Short code for "Enter a code", shown as `KF7Q-M2XA`.', examples: [KF7QM2XA] }
        url: { type: string, format: uri, description: 'https://<web>/fi/<token>; also shown as QR.' }
        created_by_name: { type: string }
        max_uses: { type: [integer, 'null'] }
        uses: { type: integer }
        note: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        allow_remote: { type: boolean, description: Frames on other servers may use this link. }

    FeedInvitePreview:
      type: object
      required: [token, purpose, feed_name, invited_by_name, requires_approval]
      properties:
        token: { type: string, description: For `acceptFeedInvite` (also after a code lookup). }
        purpose: { $ref: '#/components/schemas/FeedInvitePurpose' }
        feed_name: { type: string }
        cover_url: { type: [string, 'null'], format: uri }
        owner_name: { type: string }
        invited_by_name: { type: string }
        member_count: { type: integer }
        requires_approval: { type: boolean, description: '`join` only: the request waits for an admin.' }
        already_member: { type: boolean }
        frames:
          type: array
          description: |
            `subscribe` only: the frames the caller manages (owner, admin or `change_settings`), and whether each already
            has a live subscription to this feed.
          items:
            type: object
            required: [frame_id, frame_name]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              subscription_status: { oneOf: [ { $ref: '#/components/schemas/SubscriptionStatus' }, { type: 'null' } ] }

    FeedInviteAccept:
      type: object
      properties:
        frame_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: '`subscribe` invites (required there): the frames to subscribe.'
          items: { $ref: '#/components/schemas/Id' }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: integer, minimum: 1, maximum: 1000, description: 'Required with `history: last_n`.' }
        birthdays: { type: boolean, default: true, description: Show the feed's birthday people on the frames. }

    FeedInviteResult:
      type: object
      required: [status, feed]
      properties:
        status: { type: string, enum: [joined, pending, already_member, subscribed] }
        feed: { $ref: '#/components/schemas/FeedSummary' }
        join_request_id: { $ref: '#/components/schemas/Id' }
        subscriptions:
          type: array
          description: '`subscribed`: one per requested frame (existing live subscriptions are returned as they are).'
          items: { $ref: '#/components/schemas/Subscription' }

    SubscriptionStatus:
      type: string
      description: |
        `pending`: waiting for a feed admin. `active`: posts are placed on the frame. `paused`: paused by the frame
        side; the feed's placements are kept but not shown. `rejected`: declined by a feed admin. `removed`: ended
        (see `removed_reason`). Rejected and removed subscriptions are listed for 30 days.
      enum: [pending, active, paused, rejected, removed]

    SubscriptionHistory:
      type: string
      description: |
        What a new subscription places from before it became active: `none` (only new posts), `last_n` (the
        `history_count` most recent items) or `all`. History only, not a rolling limit; changing it later backfills
        or trims.
      enum: [none, last_n, all]
      default: none

    SubscriptionRequest:
      type: object
      required: [frame_id]
      properties:
        frame_id: { $ref: '#/components/schemas/Id' }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: integer, minimum: 1, maximum: 1000, description: 'Required with `history: last_n`.' }
        birthdays: { type: boolean, default: true, description: Show the feed's birthday people on the frame. }

    SubscriptionUpdate:
      type: object
      description: At least one field. Omitting `history` keeps the history option (and starts no backfill or trim).
      properties:
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: integer, minimum: 1, maximum: 1000, description: 'Required with `history: last_n`.' }
        birthdays: { type: boolean, description: Show the feed's birthday people on the frame (a `birthdays` change follows). }

    Subscription:
      type: object
      required: [id, status, history, feed, frame, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: [integer, 'null'] }
        feed:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            cover_url: { type: [string, 'null'], format: uri }
            member_count: { type: integer }
            admin_names: { type: array, items: { type: string }, description: Owner first; so the frame side knows whom it subscribes to. }
        frame:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            location: { type: [string, 'null'] }
            online: { type: boolean }
            last_seen_at: { type: [string, 'null'], format: date-time }
            birthdays_supported: { type: boolean, description: 'The frame app shows birthdays (its latest heartbeat lists `birthdays`); false means "update the frame app".' }
        requested_by_name: { type: [string, 'null'], description: Feed owner/admins and frame managers only. }
        via_invite: { type: boolean, description: Created through a `subscribe` invite. }
        birthdays: { type: boolean, description: 'The feed''s birthday people are shown on the frame while the subscription is `active` (default true; frame side).' }
        birthday_count: { type: integer, description: Approved birthday people of the feed (so frame managers outside the feed see how many). }
        created_at: { type: string, format: date-time }
        activated_at: { type: [string, 'null'], format: date-time, description: First activation; the history boundary. }
        paused_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        removed_reason:
          oneOf:
            - { type: string, enum: [unsubscribed, removed_by_feed, frame_removed, feed_deleted, withdrawn] }
            - { type: 'null' }
        backfill:
          type: object
          description: Progress of the history backfill or trim after activation, a history change or a resume.
          properties:
            state: { type: string, enum: [idle, queued, running] }
            placed: { type: integer }
            total: { type: integer }
        estimate:
          type: object
          description: Size of what the current history option places on this frame, for the subscribe dialog.
          properties:
            items: { type: integer }
            bytes: { type: integer }
        can_manage: { type: boolean, description: 'The caller may pause, resume, change history and unsubscribe (frame side).' }
        can_decide: { type: boolean, description: 'The caller may approve, reject and remove (feed side).' }
        remote:
          oneOf: [ { $ref: '#/components/schemas/SubscriptionRemote' }, { type: 'null' } ]
          description: |
            Set for a frame on another server (README §5.22; only in `listFeedSubscriptions`). `frame.id` is then the
            id that server gave its frame, `frame.online` is absent, and approve, reject and delete work as for local
            ones; pause, resume and history changes are the other server's.

    FeedReceiptSummary:
      type: object
      description: |
        Per post (or per send's post). `frames` counts active subscriptions holding the post; a frame counts as
        delivered/seen when every item of the post is. Paused frames are only in `paused`.
      required: [frames, delivered, seen]
      properties:
        frames: { type: integer }
        delivered: { type: integer }
        seen: { type: integer }
        awaiting_approval: { type: integer }
        paused: { type: integer }
        removed: { type: integer, description: Frames whose moderation rejected the post or that deleted it. }

    FeedReaction:
      type: object
      required: [frame_id, frame_name, item_id, placement_id]
      properties:
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        item_id: { $ref: '#/components/schemas/Id' }
        placement_id: { $ref: '#/components/schemas/Id' }
        reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
        replies: { type: array, items: { $ref: '#/components/schemas/ReplyPreset' } }
        at: { type: string, format: date-time }

    FeedPost:
      type: object
      required: [id, feed_id, poster, created_at, items]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        poster:
          type: object
          required: [user_id, display_name]
          properties:
            user_id: { $ref: '#/components/schemas/Id' }
            display_name: { type: string }
            avatar_url: { type: [string, 'null'], format: uri }
        send_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The poster's send (own posts only).
        created_at: { type: string, format: date-time }
        via:
          description: 'Set when a photo source or a Google Photos import made this post for the poster ("Anna · 14 photos via Immich"), it came by mail ("Jan via email · 14 photos"), or from a Telegram chat ("Ben via Telegram · 12 photos").'
          oneOf: [ { $ref: '#/components/schemas/ItemVia' }, { type: 'null' } ]
        items: { type: array, description: Live items in send order., items: { $ref: '#/components/schemas/Item' } }
        receipts:
          description: Own posts, owner/admins, or everyone with `members_see_receipts`; otherwise null.
          oneOf: [ { $ref: '#/components/schemas/FeedReceiptSummary' }, { type: 'null' } ]
        reactions:
          type: [array, 'null']
          description: 'Frames'' reactions and replies: own posts, owner/admins, or everyone with `members_see_reactions`; otherwise null. Latest first, at most 50 (all in `getFeedPostReceipts`).'
          items: { $ref: '#/components/schemas/FeedReaction' }
        circle_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The circle this post was shared with (only its members see it); null for the whole family.
        circle_name: { type: [string, 'null'] }
        prompt_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The weekly prompt it answers (`tagPostPrompt`).
        thread:
          description: The post's comments and people's reactions. Absent without `social`.
          $ref: '#/components/schemas/ThreadSummary'

    FeedDeliveryStatus:
      type: string
      description: |
        One item on one subscribed frame: the placement status, or `awaiting_approval` (the frame's moderation),
        `suspended` (subscription paused) or `removed` (rejected or deleted on that frame).
      enum: [pending, ready, delivered, seen, failed, awaiting_approval, suspended, removed]

    FeedPostReceipts:
      type: object
      required: [post_id, summary, frames]
      properties:
        post_id: { $ref: '#/components/schemas/Id' }
        summary: { $ref: '#/components/schemas/FeedReceiptSummary' }
        frames:
          type: array
          items:
            type: object
            required: [subscription_id, frame_id, frame_name, subscription_status, items]
            properties:
              subscription_id: { $ref: '#/components/schemas/Id' }
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              frame_location: { type: [string, 'null'] }
              online: { type: boolean }
              last_seen_at: { type: [string, 'null'], format: date-time }
              subscription_status: { type: string, enum: [active, paused] }
              items:
                type: array
                items:
                  type: object
                  required: [item_id, status]
                  properties:
                    item_id: { $ref: '#/components/schemas/Id' }
                    placement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
                    status: { $ref: '#/components/schemas/FeedDeliveryStatus' }
                    delivered_at: { type: [string, 'null'], format: date-time }
                    seen_at: { type: [string, 'null'], format: date-time }
                    reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
                    replies:
                      type: array
                      items:
                        type: object
                        properties:
                          preset: { $ref: '#/components/schemas/ReplyPreset' }
                          at: { type: string, format: date-time }

    SendFeed:
      type: object
      description: One feed a send was posted to.
      required: [feed_id, feed_name, post_id]
      properties:
        feed_id: { $ref: '#/components/schemas/Id' }
        feed_name: { type: string }
        post_id: { $ref: '#/components/schemas/Id' }
        removed: { type: boolean, description: The post was removed from the feed (unsend or admin). }
        summary: { $ref: '#/components/schemas/FeedReceiptSummary' }

    BirthdayStatus:
      type: string
      description: |
        `pending`: a poster's suggestion waiting for the feed's owner or an admin. `approved`: on the list and on
        frames. `rejected`: declined; listed for the suggester and admins for 30 days.
      enum: [pending, approved, rejected]

    BirthdayPerson:
      type: object
      description: |
        A person with a birthday in a feed (docs/spec/birthdays.md). People, not accounts: `user_id` optionally links
        a feed member.
      required: [id, feed_id, status, display_name, day, month, show_age, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/BirthdayStatus' }
        display_name: { type: string, examples: [Oma] }
        day: { type: integer, minimum: 1, maximum: 31, examples: [12] }
        month: { type: integer, minimum: 1, maximum: 12, examples: [3] }
        birth_year:
          type: [integer, 'null']
          description: |
            Null when unknown or when the caller may not see it: shown to owner/admins, whoever added the entry and
            the linked member; to other members only with `show_age`.
          examples: [1946]
        show_age: { type: boolean, description: Frames and notifications show the age (needs `birth_year`). }
        photo_url:
          type: [string, 'null']
          format: uri
          description: 256x256 WebP, public at an unguessable URL like avatars. The uploaded photo, else the linked member's avatar.
        has_own_photo: { type: boolean, description: '`photo_url` is an uploaded photo, not the linked member''s avatar.' }
        user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The linked feed member; cleared when they leave the feed or delete their account.
        linked_member_name: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'], description: Null when that account is gone. }
        created_by_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: Account id of whoever added or suggested it ("added by me"); null when that account is gone.
        suggested: { type: boolean, description: Created as a poster's suggestion (also after approval). }
        decided_by_name: { type: [string, 'null'], description: Suggestions only; owner/admins and the suggester. }
        decided_at: { type: [string, 'null'], format: date-time }
        next_birthday:
          type: string
          format: date
          description: The next occurrence on or after today in the caller's time zone (`User.timezone`); 29 February becomes 28 February in non-leap years.
        turns:
          type: [integer, 'null']
          description: Age on `next_birthday`, when `birth_year` is visible to the caller.
        greetings_today: { type: integer, description: Frames that sent a greeting for today's occurrence (0 on other days). }
        can_edit: { type: boolean, description: 'The caller may change this entry (some fields only, for the linked member).' }
        can_decide: { type: boolean, description: 'The caller may approve or reject it (pending, owner/admin).' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BirthdayPersonCreate:
      type: object
      description: |
        `day`/`month` must form a real date (29 February is allowed, and with `birth_year` only in leap years).
        `birth_year` from 1900 to the current year.
      required: [display_name, day, month]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 40 }
        day: { type: integer, minimum: 1, maximum: 31 }
        month: { type: integer, minimum: 1, maximum: 12 }
        birth_year: { type: [integer, 'null'], minimum: 1900 }
        show_age: { type: boolean, default: false }
        user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: Link to a member of this feed who has no entry yet ("Add my birthday" sends the caller's id).

    BirthdayPersonUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 40 }
        day: { type: integer, minimum: 1, maximum: 31 }
        month: { type: integer, minimum: 1, maximum: 12 }
        birth_year: { type: [integer, 'null'], minimum: 1900, description: null clears the year. }
        show_age: { type: boolean }
        user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: null unlinks.

    FeedPreferencesUpdate:
      type: object
      properties:
        birthday_notifications: { type: boolean, description: Morning notification and greetings for this feed's birthdays. }
        mute: { $ref: '#/components/schemas/FeedMute' }

    FeedMute:
      type: string
      description: |
        The caller's mute for one family: `none`; `posts` (no pushes for comments, replies and reactions on its posts;
        mentions still notify); `chat` (no pushes from the family chat and its circle chats); `all` (both, and
        mentions too). Websocket events still arrive.
      enum: [none, posts, chat, all]

    FeedBirthdayGreeting:
      type: object
      description: |
        A frame said happy birthday to a person of this feed on their day. One per person, frame and date; recorded
        in every feed that lists the person. Also the payload of the `birthday.greeting` websocket event.
      required: [id, feed_id, birthday_id, birthday_name, frame_id, frame_name, date, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        birthday_id: { $ref: '#/components/schemas/Id' }
        birthday_name: { type: string, examples: [Oma] }
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string, description: The frame's name when it sent the greeting., examples: [Opa's frame] }
        frame_location: { type: [string, 'null'] }
        date: { type: string, format: date, description: The occurrence date (the frame's local date). }
        created_at: { type: string, format: date-time }

    FrameBirthday:
      type: object
      description: |
        One person on the frame, merged across the frame's birthday subscriptions on normalized name + day + month
        (docs/spec/birthdays.md §6.5). The frame computes today, countdowns and ages in its own time zone.
      required: [id, name, day, month, feed_ids, birthday_ids]
      properties:
        id: { type: string, format: uuid, description: 'The primary entry (a `BirthdayPerson` id); use it for `deviceGreetBirthday`.' }
        name: { type: string, examples: [Oma] }
        day: { type: integer, minimum: 1, maximum: 31 }
        month: { type: integer, minimum: 1, maximum: 12 }
        birth_year:
          type: integer
          description: |
            Present only when the age may be shown (`show_age` on for every merged entry that has a year, and the
            years agree). Absent otherwise: show no age.
        photo_url:
          type: [string, 'null']
          format: uri
          description: 256x256 WebP (public, unguessable, cacheable by URL).
        feed_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        birthday_ids: { type: array, description: Every merged `BirthdayPerson` id., items: { $ref: '#/components/schemas/Id' } }

    FrameBirthdays:
      type: object
      description: |
        Payload of the `birthdays` change (docs/api/README.md §5.13): the approved people of every feed the frame has
        an `active` subscription with `birthdays: true` to, merged, sorted by month and day. Nothing in it depends on
        today, so it is emitted only when the list changes.
      required: [generated_at, people]
      properties:
        generated_at: { type: string, format: date-time }
        people: { type: array, items: { $ref: '#/components/schemas/FrameBirthday' } }

    PlacementOrigin:
      type: string
      description: |
        How a placement got onto the frame. `send`: a send or forward to the frame. `share`: shared from another
        frame's library (`shared_by_*`). `feed`: a post in a feed the frame subscribes to (`origin_feed_*`).
        `import`: imported on the frame. When several paths lead to the same item, the first one is the origin.
      enum: [send, share, feed, import]

    # ---------------------------------------------------------------- photo sources (docs/spec/photo-sources.md)
    PhotoSourceProvider:
      type: string
      description: |
        `immich_link`: an Immich shared link (`https://<immich>/share/<key>`, optional password); recommended.
        `immich_api`: an Immich server URL with an API key and a chosen album. `icloud_link`: an iCloud shared album's
        public website link (`https://www.icloud.com/sharedalbum/#<token>`), best effort.
      enum: [immich_link, immich_api, icloud_link]

    PhotoSourceStatus:
      type: string
      description: |
        `active`: syncing on schedule (a single failed run being retried stays active, with `last_error_code`).
        `error`: failures expected to pass (unreachable, upstream errors) for 3 runs or 6 hours; retried with backoff.
        `needs_attention`: only a person can fix it (`last_error_code`); syncing stopped except a daily probe for some
        codes. `paused`: paused by a manager; imported photos keep showing.
      enum: [active, paused, error, needs_attention]

    PhotoSourceErrorCode:
      type: string
      description: Why the last run (or a test) failed; user-facing texts are in docs/spec/photo-sources.md §13.
      enum:
        - unreachable
        - tls_error
        - private_address_blocked
        - auth_failed
        - password_required
        - permission_missing
        - link_not_found
        - link_expired
        - album_not_found
        - unsupported_link
        - too_large
        - format_changed
        - rate_limited_upstream
        - upstream_error
        - owner_lost_access
        - credentials_unreadable
        - mass_removal

    PhotoSourceWarning:
      type: string
      description: |
        Conditions that don't stop syncing. `downloads_disabled`: the Immich link doesn't allow downloads, so photos
        come as previews. `metadata_hidden`: the link hides EXIF (no capture dates or descriptions).
        `item_limit_reached`: `limits.max_photo_source_items` is reached; newer upstream items are skipped.
      enum: [downloads_disabled, metadata_hidden, item_limit_reached]

    PhotoSourceHistory:
      type: string
      description: |
        What the first run imports: `none` (only photos added from now on), `last_n` (the `history_count` newest by
        capture date) or `all` (up to `limits.max_photo_source_items`). Imported quietly (`Placement.backfill`).
        Defaults: `all` for albums, `last_n` with 20 for feeds.
      enum: [none, last_n, all]

    PhotoSourceDeletePolicy:
      type: string
      description: |
        What happens when a photo disappears from the outside album. `mirror`: remove it here too (default for albums).
        `keep`: keep it (default for feeds). Errors never remove anything; many removals at once wait for
        confirmation (`mass_removal`).
      enum: [mirror, keep]

    PhotoSourceTarget:
      type: object
      description: Where the photos go. Exactly one of `album_id` (with its frame) or `feed_id` is set.
      required: [kind]
      properties:
        kind: { type: string, enum: [album, feed] }
        frame_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The album's frame (albums belong to one frame).
        frame_name: { type: [string, 'null'] }
        album_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        album_name: { type: [string, 'null'] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'] }

    PhotoSourceConnection:
      type: object
      description: |
        How to reach the outside album. `immich_link` and `icloud_link` need `url` (and `password` for a protected
        Immich link); `immich_api` needs `server_url`, `api_key` and, to create, `immich_album_id`. Secrets are
        write-only: they are sealed at rest and never returned.
      required: [provider]
      properties:
        provider: { $ref: '#/components/schemas/PhotoSourceProvider' }
        url:
          type: string
          minLength: 8
          maxLength: 2048
          writeOnly: true
          description: The shared link (links only). It is the secret; responses carry `url_hint`.
          examples: ['https://photos.example.org/share/0d1e…', 'https://www.icloud.com/sharedalbum/#B0aGWZuqDGxyz']
        server_url:
          type: string
          minLength: 8
          maxLength: 2048
          description: '`immich_api` only: the Immich server, e.g. `https://photos.example.org` (an `/api` suffix is tolerated).'
        api_key: { type: string, minLength: 8, maxLength: 200, writeOnly: true, description: '`immich_api` only. Needs album.read, asset.read, asset.view and asset.download.' }
        password: { type: string, maxLength: 200, writeOnly: true, description: '`immich_link` only: the link password.' }
        immich_album_id: { type: string, maxLength: 64, description: '`immich_api` only: the album, from `listImmichAlbums`.' }

    PhotoSourceCreate:
      allOf:
        - $ref: '#/components/schemas/PhotoSourceConnection'
        - type: object
          description: Exactly one of `album_id` or `feed_id` (`422 validation_failed` otherwise).
          properties:
            album_id: { $ref: '#/components/schemas/Id' }
            feed_id: { $ref: '#/components/schemas/Id' }
            name: { type: string, maxLength: 60, description: Display name; defaults to the outside album's name. }
            history: { $ref: '#/components/schemas/PhotoSourceHistory' }
            history_count: { type: integer, minimum: 1, maximum: 10000, description: 'Required with `history: last_n`.' }
            on_upstream_delete: { $ref: '#/components/schemas/PhotoSourceDeletePolicy' }
            include_videos: { type: boolean, default: true }
            notify_reactions: { type: boolean, default: true, description: The owner gets reaction and reply notifications for this source's photos. }

    PhotoSourceUpdate:
      type: object
      description: At least one field. Connection changes are tested first and then synced at once.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        paused: { type: boolean, description: 'true pauses, false resumes.' }
        url: { type: string, minLength: 8, maxLength: 2048, writeOnly: true, description: A new link to the same (or another) outside album. }
        server_url: { type: string, minLength: 8, maxLength: 2048 }
        api_key: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
        password: { type: [string, 'null'], maxLength: 200, writeOnly: true, description: null removes the link password. }
        immich_album_id: { type: string, maxLength: 64 }
        on_upstream_delete: { $ref: '#/components/schemas/PhotoSourceDeletePolicy' }
        include_videos: { type: boolean, description: Turning it on imports previously skipped videos in the next run. }
        notify_reactions: { type: boolean, description: The owner's own switch; only the owner may change it. }
        take_over: { type: boolean, description: 'The caller becomes the owner (credit for future photos). `immich_api` needs a new `api_key` with it.' }

    PhotoSourceCounts:
      type: object
      required: [imported, pending]
      properties:
        upstream: { type: integer, description: Photos and videos in the outside album at the last listing. }
        imported: { type: integer, description: Live items this source created. }
        duplicates: { type: integer, description: Upstream photos the target already had. }
        pending: { type: integer, description: Waiting to be downloaded (backlog). }
        skipped: { type: integer, description: "Not imported on purpose (videos off, too long, too large, unsupported, over the limit, before the first import's cut)." }
        failed: { type: integer }
        removed_locally: { type: integer, description: Removed on kinframe; never imported again. }
        gone_upstream: { type: integer, description: No longer in the outside album (kept with `keep`). }

    PhotoSourceRun:
      type: object
      required: [started_at]
      properties:
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        added: { type: integer }
        updated: { type: integer, description: 'Captions, dates or files changed upstream.' }
        removed: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        bytes: { type: integer }
        error_code:
          oneOf: [ { $ref: '#/components/schemas/PhotoSourceErrorCode' }, { type: 'null' } ]

    PhotoSource:
      type: object
      required: [id, provider, name, target, status, running, history, on_upstream_delete, include_videos, counts, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        provider: { $ref: '#/components/schemas/PhotoSourceProvider' }
        name: { type: string, description: The outside album's name (or the name given at creation). }
        target: { $ref: '#/components/schemas/PhotoSourceTarget' }
        owner:
          description: Who set it up; imported photos are sent by them. Null when that account is gone.
          oneOf:
            - type: object
              required: [user_id, display_name]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
                display_name: { type: string }
                avatar_url: { type: [string, 'null'], format: uri }
            - { type: 'null' }
        best_effort: { type: boolean, description: 'True for `icloud_link`: no official API; clients show the best-effort note.' }
        url_hint: { type: [string, 'null'], description: 'Redacted link for display (links only).', examples: ['https://photos.example.org/share/…'] }
        server_url: { type: [string, 'null'], description: '`immich_api` only.' }
        immich_album_id: { type: [string, 'null'], description: '`immich_api` only.' }
        has_api_key: { type: boolean }
        has_password: { type: boolean }
        status: { $ref: '#/components/schemas/PhotoSourceStatus' }
        running: { type: boolean, description: A run is in progress. }
        warnings: { type: array, items: { $ref: '#/components/schemas/PhotoSourceWarning' } }
        last_error_code:
          oneOf: [ { $ref: '#/components/schemas/PhotoSourceErrorCode' }, { type: 'null' } ]
        last_error: { type: [string, 'null'], description: Short English detail for support; clients show their own text for `last_error_code`. }
        error_since: { type: [string, 'null'], format: date-time, description: First failure of the current streak. }
        pending_removals: { type: integer, description: 'Removals held back by the mass-removal guard; confirm with `syncPhotoSource {confirm_removals: true}`.' }
        history: { $ref: '#/components/schemas/PhotoSourceHistory' }
        history_count: { type: [integer, 'null'] }
        on_upstream_delete: { $ref: '#/components/schemas/PhotoSourceDeletePolicy' }
        include_videos: { type: boolean }
        notify_reactions: { type: boolean }
        counts: { $ref: '#/components/schemas/PhotoSourceCounts' }
        last_run:
          oneOf: [ { $ref: '#/components/schemas/PhotoSourceRun' }, { type: 'null' } ]
        last_synced_at: { type: [string, 'null'], format: date-time, description: Last successful run. }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        next_sync_at: { type: [string, 'null'], format: date-time, description: Null while paused or waiting for a person. }
        can_manage: { type: boolean, description: 'The caller may pause, change and delete it.' }
        is_owner: { type: boolean }
        created_at: { type: string, format: date-time }

    PhotoSourceTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error_code:
          oneOf: [ { $ref: '#/components/schemas/PhotoSourceErrorCode' }, { type: 'null' } ]
        error: { type: [string, 'null'], description: Short English detail. }
        album_name: { type: [string, 'null'] }
        photos: { type: [integer, 'null'] }
        videos: { type: [integer, 'null'] }
        estimate_bytes: { type: [integer, 'null'], description: 'Size of everything in the album, when the provider tells.' }
        warnings: { type: array, items: { $ref: '#/components/schemas/PhotoSourceWarning' } }
        best_effort: { type: boolean }
        server_version: { type: [string, 'null'], description: 'Immich only, e.g. `v1.132.3`.' }
        albums:
          type: array
          description: '`immich_api` without `immich_album_id`: the albums the key can read.'
          items: { $ref: '#/components/schemas/ImmichAlbum' }

    ImmichConnection:
      type: object
      required: [server_url, api_key]
      properties:
        server_url: { type: string, minLength: 8, maxLength: 2048 }
        api_key: { type: string, minLength: 8, maxLength: 200, writeOnly: true }

    ImmichAlbum:
      type: object
      required: [id, name, asset_count]
      properties:
        id: { type: string }
        name: { type: string }
        asset_count: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
        owner_name: { type: [string, 'null'] }
        shared: { type: boolean, description: Shared with the key's account by someone else. }
        thumbnail_url: { type: [string, 'null'], format: uri, description: 'A short-lived kinframe URL of the album thumbnail (proxied; the key never reaches the client).' }

    ImmichAlbumList:
      type: object
      required: [ok, albums]
      properties:
        ok: { type: boolean }
        error_code:
          oneOf: [ { $ref: '#/components/schemas/PhotoSourceErrorCode' }, { type: 'null' } ]
        error: { type: [string, 'null'] }
        server_version: { type: [string, 'null'] }
        albums: { type: array, items: { $ref: '#/components/schemas/ImmichAlbum' }, description: 'Own albums first, then shared ones, by name.' }

    GoogleImportStatus:
      type: string
      description: |
        `needs_auth`: open `auth_url`. `picking`: open `picker_uri`; the server waits for Google. `importing`: copying
        (`progress`). `done` (possibly with `progress.failed` > 0), `failed` (`error_code`), `expired` (nothing picked
        before Google's session ended) and `cancelled` are final.
      enum: [needs_auth, picking, importing, done, failed, cancelled, expired]

    GoogleImportErrorCode:
      type: string
      enum: [consent_denied, auth_failed, picker_expired, google_unavailable, target_gone, download_failed, server_error]

    GoogleImportCreate:
      type: object
      required: [return_uri]
      description: Exactly one of `album_id` or `feed_id`.
      properties:
        album_id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        return_uri:
          type: string
          maxLength: 512
          description: Where the browser goes after consent, with `?import_id=…&status=…` added.
          examples: ['app.kinframe:/google-import', 'https://kinframe.appmire.be/google-import/return']

    GoogleImport:
      type: object
      required: [id, status, target, progress, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/GoogleImportStatus' }
        target: { $ref: '#/components/schemas/PhotoSourceTarget' }
        auth_url: { type: [string, 'null'], format: uri, description: '`needs_auth` only: Google''s consent page, to open in a browser session (never an embedded web view).' }
        picker_uri:
          type: [string, 'null']
          format: uri
          description: '`picking` only: Google''s picker. Web clients append `/autoclose`; on Android the Google Photos app can handle it.'
        picker_expires_at: { type: [string, 'null'], format: date-time }
        progress:
          type: object
          required: [picked, imported]
          properties:
            picked: { type: integer }
            imported: { type: integer }
            duplicates: { type: integer, description: Already in the album or feed. }
            skipped: { type: integer, description: 'Too long, too large or unsupported.' }
            failed: { type: integer }
            bytes: { type: integer }
        send_ids: { type: array, description: The sends (and thus posts) the import made; unsend them to undo., items: { $ref: '#/components/schemas/Id' } }
        error_code:
          oneOf: [ { $ref: '#/components/schemas/GoogleImportErrorCode' }, { type: 'null' } ]
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------- email inbox (docs/spec/email-inbox.md)
    EmailAddressStatus:
      type: string
      description: '`active`: mail is accepted. `paused`: mail to it is refused (`550 5.2.1 This address is paused`); resume to reopen.'
      enum: [active, paused]

    EmailAddressTarget:
      type: object
      description: What the address fills. Exactly one of `frame_id` (a direct send) or `feed_id` (a post) is set.
      required: [kind]
      properties:
        kind: { type: string, enum: [frame, feed] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_name: { type: [string, 'null'] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'] }

    EmailAddress:
      type: object
      required: [id, address, slug, name, target, status, anyone_may_send, send_confirmations, offer_app_invite, notify_reactions, counts, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        address:
          type: string
          format: email
          description: 'The full address, `<slug>-<random>@<email_inbox_domain>`. A capability: shown to managers only.'
          examples: [oma-k7q2m9@in.kinframe.appmire.be]
        slug: { type: string, description: The friendly part., examples: [oma] }
        name: { type: string, description: 'Label in the apps and in replies to senders ("Oma''s frame").' }
        target: { $ref: '#/components/schemas/EmailAddressTarget' }
        owner:
          description: |
            Who mail from senders without a matching account is sent by (the creator, or the frame's or feed's owner after
            the creator lost their rights). Null only briefly while ownership passes on.
          oneOf:
            - type: object
              required: [user_id, display_name]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
                display_name: { type: string }
                avatar_url: { type: [string, 'null'], format: uri }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/EmailAddressStatus' }
        anyone_may_send: { type: boolean, description: 'Mail from anyone with the address is delivered without approval (default off).' }
        send_confirmations: { type: boolean, description: 'Authenticated senders get a short "delivered" reply (default on).' }
        offer_app_invite: { type: boolean, description: 'Replies to allowed, authenticated senders include a link to join the frame or feed in the app (an invite that always needs approval; default on).' }
        notify_reactions: { type: boolean, description: 'The owner gets reaction and reply notifications for photos they sent on behalf of non-account senders (the owner''s own switch).' }
        replies_available: { type: boolean, description: 'False when the server can''t send mail (no outgoing mail configured): senders get no replies at all.' }
        counts:
          type: object
          required: [allowed_senders, pending_senders, held_messages]
          properties:
            allowed_senders: { type: integer }
            blocked_senders: { type: integer }
            pending_senders: { type: integer }
            held_messages: { type: integer }
            delivered_30d: { type: integer, description: Mails delivered in the last 30 days. }
        last_received_at: { type: [string, 'null'], format: date-time }
        regenerated_at: { type: [string, 'null'], format: date-time }
        can_manage: { type: boolean }
        is_owner: { type: boolean }
        created_at: { type: string, format: date-time }

    EmailAddressCreate:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 24
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: The friendly part; defaults to one made from the target's name (lower case, accents removed, `oma`).
        name: { type: string, minLength: 1, maxLength: 60, description: Label; defaults to the target's name. }
        anyone_may_send: { type: boolean, default: false }
        send_confirmations: { type: boolean, default: true }
        offer_app_invite: { type: boolean, default: true }
        notify_reactions: { type: boolean, default: true }

    EmailAddressUpdate:
      type: object
      description: At least one field.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { type: string, minLength: 1, maxLength: 24, pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$', description: A new friendly part; the old address stops working at once. }
        paused: { type: boolean, description: 'true pauses, false resumes.' }
        anyone_may_send: { type: boolean }
        send_confirmations: { type: boolean }
        offer_app_invite: { type: boolean }
        notify_reactions: { type: boolean, description: The owner's own switch; only the owner may change it. }
        take_over: { type: boolean, description: The caller becomes the owner. }

    EmailSenderState:
      type: string
      description: '`allowed`: mail is delivered (when authenticated). `blocked`: mail is dropped silently. `pending`: mail is held until a manager decides.'
      enum: [allowed, blocked, pending]

    EmailSender:
      type: object
      required: [id, email, state, origin, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        display_name: { type: [string, 'null'], description: 'Name for the credit ("Jan via email") when the mail has none.' }
        state: { $ref: '#/components/schemas/EmailSenderState' }
        origin:
          type: string
          description: '`manual`: added by a manager. `approved`: a pending sender that was approved. `mail`: pending, came by mail.'
          enum: [manual, approved, mail]
        added_by_name: { type: [string, 'null'] }
        last_message_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    EmailSenderCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        display_name: { type: string, maxLength: 40 }
        blocked: { type: boolean, default: false, description: Block instead of allow. }

    EmailSenderUpdate:
      type: object
      properties:
        display_name: { type: [string, 'null'], maxLength: 40 }
        blocked: { type: boolean }

    EmailSenderApprove:
      type: object
      properties:
        deliver: { type: boolean, default: true, description: Deliver their authenticated held mail now. }
        display_name: { type: string, maxLength: 40 }

    EmailSenderReject:
      type: object
      properties:
        block: { type: boolean, default: false, description: Drop their later mail silently. }

    EmailAuthResult:
      type: object
      description: How the mail was checked (docs/spec/email-inbox.md §7). Only `authenticated` mail is matched, allowed or answered.
      required: [authenticated]
      properties:
        authenticated: { type: boolean, description: DMARC-aligned SPF or DKIM passed for the From domain. }
        from_domain: { type: [string, 'null'] }
        spf: { type: string, enum: [pass, fail, softfail, neutral, none, temperror, permerror, not_checked] }
        dkim: { type: string, enum: [pass, fail, none, temperror, permerror] }
        dkim_domain: { type: [string, 'null'], description: The `d=` of the passing signature. }
        dmarc: { type: string, enum: [pass, fail, none, temperror] }
        dmarc_policy: { type: [string, 'null'], description: 'The From domain''s policy: `none`, `quarantine` or `reject`; null without a DMARC record.' }
        aligned: { type: [string, 'null'], description: 'Which check aligned: `spf` or `dkim`; null when neither.' }

    EmailHeldReason:
      type: string
      description: |
        `unknown_sender`: authenticated, but not allowed (approve or reject the sender). `unverified_sender`: the mail
        couldn't be authenticated, so its From can't be trusted (deliver this one by hand, or delete it).
      enum: [unknown_sender, unverified_sender]

    EmailSkipCounts:
      type: object
      description: Files in a mail that were not used.
      properties:
        too_small: { type: integer, description: 'Images under 300 px on the long side (signatures, logos).' }
        duplicate: { type: integer, description: Already in the mail or on the frame / in the feed. }
        unsupported: { type: integer }
        too_large: { type: integer }
        too_long: { type: integer, description: Videos longer than `limits.max_video_seconds`. }
        over_limit: { type: integer }

    EmailHeldMessageSummary:
      type: object
      required: [id, reason, received_at, expires_at, media_count, authenticated]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/EmailHeldReason' }
        subject: { type: [string, 'null'] }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Deleted then (at most 14 days after it arrived). }
        media_count: { type: integer }
        authenticated: { type: boolean }
        thumb_urls:
          type: array
          maxItems: 4
          description: The first thumbnails; short-lived signed URLs (about 1 h).
          items: { type: string, format: uri }

    EmailHeldMessage:
      type: object
      required: [id, address_id, sender_email, reason, received_at, expires_at, auth, media]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        address_id: { $ref: '#/components/schemas/Id' }
        sender_id: { $ref: '#/components/schemas/Id' }
        sender_email: { type: string, description: 'As the From header says; trustworthy only when `auth.authenticated`.' }
        sender_name: { type: [string, 'null'] }
        reason: { $ref: '#/components/schemas/EmailHeldReason' }
        subject: { type: [string, 'null'] }
        caption: { type: [string, 'null'], description: The caption the photos would get. }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auth: { $ref: '#/components/schemas/EmailAuthResult' }
        media:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { $ref: '#/components/schemas/MediaKind' }
              width: { type: [integer, 'null'] }
              height: { type: [integer, 'null'] }
              duration_ms: { type: [integer, 'null'] }
              bytes: { type: [integer, 'null'] }
              filename: { type: [string, 'null'] }
              thumb_url: { type: [string, 'null'], format: uri, description: Short-lived signed URL (about 1 h); null while processing. }
        skipped: { $ref: '#/components/schemas/EmailSkipCounts' }

    EmailPendingSender:
      type: object
      required: [id, email, authenticated, first_held_at, last_held_at, messages]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, description: 'As claimed; trustworthy only when `authenticated`.' }
        display_name: { type: [string, 'null'] }
        authenticated: { type: boolean, description: The latest held mail was authenticated. }
        first_held_at: { type: string, format: date-time }
        last_held_at: { type: string, format: date-time }
        messages: { type: array, description: 'Held mail, newest first.', items: { $ref: '#/components/schemas/EmailHeldMessageSummary' } }

    EmailOutcome:
      type: string
      description: What became of a mail (texts in docs/spec/email-inbox.md §13).
      enum: [delivered, held, no_media, too_large, encrypted, duplicate, blocked, rejected_dmarc, ignored, rate_limited, failed]

    EmailReplyKind:
      type: string
      enum: [delivered, held, no_media, too_large, encrypted]

    EmailMessage:
      type: object
      required: [id, received_at, authenticated, outcome]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        received_at: { type: string, format: date-time }
        sender_email: { type: [string, 'null'] }
        sender_name: { type: [string, 'null'] }
        authenticated: { type: boolean }
        outcome: { $ref: '#/components/schemas/EmailOutcome' }
        items: { type: integer, description: Photos and videos delivered or held. }
        skipped: { $ref: '#/components/schemas/EmailSkipCounts' }
        send_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        reply: { oneOf: [ { $ref: '#/components/schemas/EmailReplyKind' }, { type: 'null' } ], description: 'The reply the sender got, if any.' }

    EmailMessagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmailMessage' } }
        next_cursor: { type: [string, 'null'] }

    EmailInboundResult:
      type: object
      required: [id, recipients]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        recipients:
          type: array
          items:
            type: object
            required: [address, outcome]
            properties:
              address: { type: string }
              outcome: { type: string, enum: [accepted, unknown_recipient, paused, rejected_dmarc, too_large] }

    EmailRecipientCheck:
      type: object
      required: [recipients]
      properties:
        recipients: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 320 } }

    EmailRecipientCheckResult:
      type: object
      required: [recipients]
      properties:
        recipients:
          type: array
          items:
            type: object
            required: [address, outcome]
            properties:
              address: { type: string }
              outcome: { type: string, enum: [accepted, unknown_recipient, paused] }

    TelegramChatKind:
      type: string
      description: '`group`: a basic group or supergroup (forum groups included). `private`: a one-to-one chat with the bot.'
      enum: [group, private]

    TelegramConnectCodeCreate:
      type: object
      required: [chat_kind]
      properties:
        chat_kind: { $ref: '#/components/schemas/TelegramChatKind' }
        link_account:
          type: boolean
          default: false
          description: |
            `chat_kind: private` only ("Send from my Telegram"): also link the Telegram account that redeems the code to
            the caller. Without it the redeemer is an outside contributor sent for by the caller ("Invite someone to
            send by Telegram").

    TelegramCodePurpose:
      type: string
      enum: [connect, link]

    TelegramCodeStatus:
      type: string
      enum: [open, used, expired, revoked]

    TelegramCodeErrorCode:
      type: string
      description: Why the last attempt to redeem the code in Telegram failed (the code may still be open).
      enum: [code_expired, code_used, already_connected, limit_reached, wrong_chat_kind, already_linked, missing_permission]

    TelegramCode:
      type: object
      required: [id, purpose, status, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        purpose: { $ref: '#/components/schemas/TelegramCodePurpose' }
        chat_kind: { oneOf: [ { $ref: '#/components/schemas/TelegramChatKind' }, { type: 'null' } ] }
        link_account: { type: boolean }
        target:
          description: '`connect` codes: the frame or feed.'
          oneOf: [ { $ref: '#/components/schemas/TelegramChatTarget' }, { type: 'null' } ]
        code: { type: [string, 'null'], description: Only in the create response. }
        url:
          type: [string, 'null']
          format: uri
          description: |
            Only in the create response: `https://t.me/<bot>?startgroup=<code>` (groups) or `?start=<code>`. Show it as
            a button (opens Telegram) and as a QR code (for another device).
          examples: ['https://t.me/kinframe_bot?startgroup=cA7f9QxK2mPz4LwN8']
        status: { $ref: '#/components/schemas/TelegramCodeStatus' }
        expires_at: { type: string, format: date-time }
        chat_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: '`connect`, once used: the `TelegramChat` it created.'
        error_code:
          oneOf: [ { $ref: '#/components/schemas/TelegramCodeErrorCode' }, { type: 'null' } ]

    TelegramChatTarget:
      type: object
      description: What the chat fills. Exactly one of `frame_id` (a direct send per batch) or `feed_id` (a post per batch) is set.
      required: [kind]
      properties:
        kind: { type: string, enum: [frame, feed] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_name: { type: [string, 'null'] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'] }

    TelegramChatStatus:
      type: string
      description: |
        `active`: media is accepted. `needs_attention`: a person must fix `error_code`. `paused`: paused in the app,
        media ignored. `disconnected`: ended (`ended_reason`); listed for 30 days, then deleted.
      enum: [active, needs_attention, paused, disconnected]

    TelegramChatErrorCode:
      type: string
      description: '`privacy_mode`: the bot only sees commands in the group (make it an admin, or the operator turns privacy mode off). `bot_changed`: the server now uses another bot; connect again.'
      enum: [privacy_mode, bot_changed]

    TelegramChatWarning:
      type: string
      description: '`cannot_post`: the bot may not post in the group, so it can''t reply. `reactions_off`: the group restricts reactions, so confirmations are silent.'
      enum: [cannot_post, reactions_off]

    TelegramChatEndedReason:
      type: string
      enum: [disconnected, stopped, bot_removed, chat_gone, bot_blocked, target_deleted]

    TelegramContributorsMode:
      type: string
      description: |
        `everyone`: every member of the chat may send (the chat is the trust boundary). `linked_only`: only Telegram
        users linked to a kinframe account that may send to the target.
      enum: [everyone, linked_only]

    TelegramTopic:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, description: Telegram `message_thread_id` (1 = General). }
        name: { type: string }

    TelegramChat:
      type: object
      required: [id, chat_kind, title, target, status, contributors, frame_replies, notify_reactions, offer_app_invite, counts, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        chat_kind: { $ref: '#/components/schemas/TelegramChatKind' }
        title: { type: string, description: 'The group''s title, or for a private chat the Telegram user''s display name.' }
        is_forum: { type: boolean }
        target: { $ref: '#/components/schemas/TelegramChatTarget' }
        owner:
          description: |
            Who connected it: the sender of outside contributions (the frame's or feed's owner after the creator lost
            their rights). Null only briefly while ownership passes on.
          oneOf:
            - type: object
              required: [user_id, display_name]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
                display_name: { type: string }
                avatar_url: { type: [string, 'null'], format: uri }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/TelegramChatStatus' }
        error_code: { oneOf: [ { $ref: '#/components/schemas/TelegramChatErrorCode' }, { type: 'null' } ] }
        warnings: { type: array, items: { $ref: '#/components/schemas/TelegramChatWarning' } }
        ended_reason: { oneOf: [ { $ref: '#/components/schemas/TelegramChatEndedReason' }, { type: 'null' } ] }
        ended_by_name: { type: [string, 'null'], description: 'Who disconnected it (`disconnected`, `stopped`).' }
        ended_at: { type: [string, 'null'], format: date-time }
        bot_is_admin: { type: boolean }
        sees_all_messages: { type: boolean, description: 'False: privacy mode hides photos from the bot (`error_code: privacy_mode`).' }
        contributors: { $ref: '#/components/schemas/TelegramContributorsMode' }
        frame_replies: { type: boolean, description: Post frames' quick replies into the chat as replies (default false). }
        notify_reactions: { type: boolean, description: 'The owner gets reaction and reply notifications for outside contributions (default false: the chat already shows them). The owner''s own switch.' }
        offer_app_invite: { type: boolean, description: 'The bot''s one-time app message includes an "Ask to join" link (an invite that always needs approval; default true).' }
        topic_id: { type: [integer, 'null'], format: int64, description: 'Forum groups: only this topic counts; null = all topics.' }
        topics: { type: array, description: 'Forum groups: topics the bot has seen (Telegram offers no list).', items: { $ref: '#/components/schemas/TelegramTopic' } }
        counts:
          type: object
          required: [sent, contributors]
          properties:
            sent: { type: integer, description: Photos and videos sent. }
            duplicates: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }
            contributors: { type: integer }
        last_delivery_at: { type: [string, 'null'], format: date-time }
        can_manage: { type: boolean }
        is_owner: { type: boolean }
        created_at: { type: string, format: date-time }

    TelegramChatUpdate:
      type: object
      properties:
        paused: { type: boolean }
        contributors: { $ref: '#/components/schemas/TelegramContributorsMode' }
        frame_replies: { type: boolean }
        notify_reactions: { type: boolean }
        offer_app_invite: { type: boolean }
        topic_id: { type: [integer, 'null'], format: int64 }
        take_over: { type: boolean, description: The caller becomes the owner (the sender of outside contributions from now on). }

    TelegramContributor:
      type: object
      required: [id, display_name, linked, blocked, sent_count, last_seen_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string, description: 'The Telegram display name, or the kinframe name when linked.' }
        linked: { type: boolean }
        user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The linked kinframe account, when it is a member of the target.
        blocked: { type: boolean }
        sent_count: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    TelegramContributorUpdate:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }

    TelegramLink:
      type: object
      required: [display_name, can_message, linked_at]
      properties:
        display_name: { type: string }
        username: { type: [string, 'null'], description: Without "@". }
        can_message: { type: boolean, description: False when the user blocked the bot. }
        linked_at: { type: string, format: date-time }

    TvLinkCreate:
      type: object
      properties:
        album_id: { type: [string, 'null'], format: uuid, description: Only this album. }
        placement_ids:
          type: array
          maxItems: 500
          description: Only these placements, in this order (a selection). Empty or absent = the whole visible library.
          items: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        purpose:
          type: string
          enum: [tv, cast, mirror]
          default: tv
          description: |
            `tv` and `cast` show the library at the TV's own pace (cast links are short-lived). `mirror` follows the
            physical frame live (`GET /v1/tv/{token}/mirror`): it needs `see_library` and takes no `album_id`,
            `placement_ids` or `kind`, because it shows whatever the frame shows.
        interval_seconds: { type: integer, minimum: 3, maximum: 600, default: 10 }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 12 }

    TvLink:
      type: object
      required: [id, frame_id, token, url, purpose, interval_seconds, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        token: { type: string }
        url: { type: string, format: uri, description: 'The TV page: <public URL>/tv/<frameId>?t=<token> (mirror links add &mode=mirror)' }
        purpose: { type: string, enum: [tv, cast, mirror] }
        album_id: { type: [string, 'null'], format: uuid }
        placement_count: { type: [integer, 'null'], description: Size of a fixed selection; null for album/library links. }
        kind: { oneOf: [ { $ref: '#/components/schemas/MediaKind' }, { type: 'null' } ] }
        interval_seconds: { type: integer }
        created_by_name: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    TvSlide:
      type: object
      required: [placement_id, kind, url, mime, sender_name, received_at, width, height]
      properties:
        placement_id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url: { type: string, format: uri, description: Absolute signed URL of the master rendition (Range supported). }
        mime: { type: string, description: e.g. image/webp or video/mp4 }
        poster_url: { type: [string, 'null'], format: uri }
        thumb_url: { type: [string, 'null'], format: uri }
        caption: { type: [string, 'null'] }
        sender_name: { type: string }
        captured_at: { type: [string, 'null'], format: date-time }
        received_at: { type: string, format: date-time }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        focal_point:
          oneOf: [ { $ref: '#/components/schemas/FocalPoint' }, { type: 'null' } ]
          description: The placement's focal point (its override, else the item's), for filling the screen and Ken Burns.
        fit: { oneOf: [ { $ref: '#/components/schemas/Fit' }, { type: 'null' } ], description: 'The placement''s fit override, else the item''s; null = the frame setting.' }
        rotation: { type: integer, enum: [0, 90, 180, 270], description: Clockwise rotation set on the frame for this placement. }

    TvSlideshow:
      type: object
      required: [frame_id, frame_name, interval_seconds, expires_at, refresh_after, slides]
      properties:
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        album_name: { type: [string, 'null'] }
        interval_seconds: { type: integer }
        expires_at: { type: string, format: date-time, description: When the link itself stops working. }
        refresh_after: { type: string, format: date-time, description: Refetch before the media URLs expire. }
        slides: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/TvSlide' } }

    NowShowing:
      type: object
      description: |
        Device websocket message `now_showing` (frame → server, README §6.1): what the frame's screen shows right
        now. Sent on every slide change (timer, swipe, `next`/`previous`/`show_placement`, the "N new" card), when a
        video starts, pauses or ends, every 15 s while a video plays, and when the screen sleeps or wakes. Times are
        the frame's clock; the server only uses differences between them.
      required: [type, sent_at, screen]
      properties:
        type: { type: string, enum: [now_showing] }
        placement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: The slide on screen (the first tile of a collage or pair); null while nothing shows. }
        placement_ids: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Id' }, description: 'Every photo on screen (collage or pair), first = `placement_id`.' }
        started_at: { type: string, format: date-time, description: When the transition to this slide started. }
        transition: { type: string, enum: [crossfade, slide, cut] }
        transition_ms: { type: integer, minimum: 0, maximum: 5000 }
        direction: { type: integer, enum: [-1, 1], description: '1: the slide came in as "next", -1: as "previous".' }
        ken_burns: { type: boolean, description: 'The slide moves (Ken Burns): deterministic per placement and focal point.' }
        hold_ms: { type: integer, description: How long the slide is expected to stay. }
        video:
          type: [object, 'null']
          description: The playing video, or a live photo's clip, while it is on screen.
          required: [position_ms, playing]
          properties:
            position_ms: { type: integer, minimum: 0, description: Playback position at `sent_at`. }
            playing: { type: boolean }
            live: { type: boolean, description: The clip of a live photo (played over its still). }
        next_placement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: What the frame expects to show next (for preloading). }
        screen: { type: string, enum: ['on', 'off', dimmed, sleeping] }
        sent_at: { type: string, format: date-time }

    MirrorSettings:
      type: object
      description: The frame settings a mirroring TV needs to look like the frame.
      required: [interval_s, transition, transition_ms, fill, background]
      properties:
        interval_s: { type: integer }
        transition: { type: string, enum: [crossfade, slide, kenburns] }
        transition_ms: { type: integer }
        fill: { type: boolean }
        background: { type: string, enum: [blur, black, palette] }
        caption: { type: boolean }
        caption_date: { type: string, enum: [taken, received, none] }
        clock: { type: boolean }
        date: { type: boolean }
        clock_24h: { type: boolean }
        timezone: { type: string }

    MirrorShowing:
      type: object
      required: [placement_id, slides, started_at, transition, transition_ms]
      properties:
        placement_id: { $ref: '#/components/schemas/Id' }
        slides: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/TvSlide' }, description: 'One per photo on screen; a collage or pair has several.' }
        started_at: { type: string, format: date-time, description: Server clock. Compare with `server_time` of the same message. }
        transition: { type: string, enum: [crossfade, slide, cut] }
        transition_ms: { type: integer }
        direction: { type: integer }
        ken_burns: { type: boolean }
        hold_ms: { type: integer }
        video:
          type: [object, 'null']
          required: [position_ms, playing, at]
          properties:
            position_ms: { type: integer }
            playing: { type: boolean }
            live: { type: boolean }
            at: { type: string, format: date-time, description: Server clock at which `position_ms` was the position. }

    MirrorState:
      type: object
      description: |
        Message `mirror` on the TV mirror websocket (`GET /v1/tv/{token}/mirror`): the frame's state, sent right after
        connecting and on every change. Media URLs are signed like `TvSlide` URLs and are refreshed with each message.
      required: [type, server_time, frame_id, frame_name, online, screen, expires_at]
      properties:
        type: { type: string, enum: [mirror] }
        server_time: { type: string, format: date-time }
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        online: { type: boolean, description: The frame is connected. }
        screen: { type: string, enum: ['on', 'off', dimmed, sleeping, unknown], description: '`off`/`sleeping`: show a calm "the frame is asleep" screen.' }
        settings: { $ref: '#/components/schemas/MirrorSettings' }
        showing:
          oneOf: [ { $ref: '#/components/schemas/MirrorShowing' }, { type: 'null' } ]
          description: Null while the frame shows nothing (empty, offline before it reported anything, or an item the link may not show).
        next: { oneOf: [ { $ref: '#/components/schemas/TvSlide' }, { type: 'null' } ] }
        expires_at: { type: string, format: date-time, description: When the link stops working. }

    SleepSchedule:
      type: object
      required: [id, sleep_at, wake_at, days, enabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sleep_at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['23:00'] }
        wake_at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['07:00'] }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        enabled: { type: boolean }
        mode: { type: string, enum: ['off', dim], default: 'off' }

    CalendarSchedule:
      type: object
      description: Same shape as `SleepSchedule`, with `from`/`to` instead of `sleep_at`/`wake_at`. `to` before `from` runs past midnight.
      required: [id, from, to, days, enabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['07:00'] }
        to: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['09:00'] }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        enabled: { type: boolean }

    FrameSettings:
      type: object
      description: Defaults per docs/spec/product-spec.md §6. Unknown fields must be preserved by clients.
      required: [version]
      properties:
        version: { type: integer }
        slideshow:
          type: object
          properties:
            interval_s: { type: integer, minimum: 2, maximum: 86400, default: 30 }
            transition: { type: string, enum: [crossfade, slide, kenburns], default: crossfade }
            transition_ms: { type: integer, minimum: 200, maximum: 3000, default: 800 }
            order: { type: string, enum: [received, taken, shuffle], default: received }
            reverse: { type: boolean, default: false }
            caption_date: { type: string, enum: [taken, received, none], default: received }
            fill: { type: boolean, default: true }
            background: { type: string, enum: [blur, black, palette], default: blur }
            pair_portraits: { type: boolean, default: true }
            collage: { type: boolean, default: false }
            collage_max: { type: integer, minimum: 2, maximum: 6, default: 3 }
            album_id: { type: [string, 'null'], description: null = all photos. Setting it clears `feed_id`. }
            feed_id:
              type: [string, 'null']
              description: |
                Feed mode: play only placements of this subscribed feed (`Placement.feed_ids`); null = all photos.
                Setting it clears `album_id`. Reset to null when the subscription ends. An empty or unknown feed plays
                everything.
            on_this_day: { type: boolean, default: false }
            live_photos:
              type: string
              enum: ['on', tap, 'off']
              default: 'on'
              description: |
                Live/Motion Photos: `on` plays the motion once when the slide appears (and on tap), `tap` only on
                tap, `off` shows the still only.
        widgets:
          type: object
          properties:
            caption: { type: boolean, default: true }
            avatar: { type: boolean, default: true }
            clock: { type: boolean, default: true }
            date: { type: boolean, default: true }
            weather: { type: boolean, default: false, description: Current weather widget; needs `location`. }
            clock_24h: { type: boolean, default: true }
            calendar_sidebar: { type: boolean, default: false, description: 'Hybrid view: today and upcoming events beside the slideshow (side panel in landscape, bottom panel in portrait).' }
            countdowns: { type: boolean, default: true, description: 'Countdown widgets on the slideshow (the nearest three): marked events and, from 7 days before, feed birthdays (docs/spec/birthdays.md §6.6). The birthday card on the day itself does not depend on it.' }
        video:
          type: object
          properties:
            autoplay: { type: boolean, default: true }
            playback: { type: string, enum: [loop, once_hold, once_advance], default: once_hold }
            volume: { type: integer, minimum: 0, maximum: 100, default: 60 }
            auto_mute_min: { type: [integer, 'null'], default: null }
        display:
          type: object
          properties:
            brightness: { type: integer, minimum: 15, maximum: 255, default: 204 }
            brightness_mode: { type: string, enum: [manual, schedule, sun, sensor], default: manual }
            brightness_schedule:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                  brightness: { type: integer, minimum: 15, maximum: 255 }
            sleep_schedules:
              type: array
              items: { $ref: '#/components/schemas/SleepSchedule' }
            motion_timeout_min: { type: [integer, 'null'], default: 30 }
            text_scale: { type: number, enum: [1.0, 1.15, 1.3], default: 1.0 }
        locale:
          type: object
          properties:
            language: { type: string, default: en }
            timezone: { type: string, default: Europe/Brussels }
            temperature_unit: { type: string, enum: [c, f], default: c }
            first_day_of_week: { type: string, enum: [mon, sun, sat], default: mon }
        calendar:
          type: object
          description: Full-screen calendar options (product spec §4.9). The first day of the week is `locale.first_day_of_week`.
          properties:
            view: { type: string, enum: [four_day, week, month], default: week }
            start_on_today: { type: boolean, default: true, description: Week and 4-day views start on today rather than the first day of the week. }
            fade_past: { type: boolean, default: true }
            week_numbers: { type: boolean, default: false }
            past_days: { type: integer, minimum: 1, maximum: 365, default: 30, description: Sync window before today. }
            future_days: { type: integer, minimum: 7, maximum: 365, default: 30, description: Sync window after today. }
            timed_views:
              type: array
              description: 'Calendar timed view: while a schedule is active the frame shows the full-screen calendar instead of photos. New schedules default to 07:00–09:00 on every day.'
              items: { $ref: '#/components/schemas/CalendarSchedule' }
        location:
          type: [object, 'null']
          description: |
            Used for weather and sun-based brightness. Set by owner/admin, usually from a `/v1/geocode` result.
            Changing it (or turning `widgets.weather` on) makes the server fetch weather right away.
          required: [lat, lon]
          properties:
            name: { type: string, maxLength: 100 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }
        notifications:
          type: object
          properties:
            sound: { type: boolean, default: true }
            volume: { type: integer, minimum: 0, maximum: 100, default: 40 }
        social:
          type: object
          description: Family social on the frame (docs/spec/family-social.md §8, README §5.20). Owner, admins and `change_settings` members.
          properties:
            show_comments:
              type: boolean
              default: false
              description: 'When a photo with comments appears, a card with the newest comment fades in for 8 s (once per photo per day). The server sends the `comments` change only while this is on.'
            ask_for_photos:
              type: boolean
              default: true
              description: Show "Ask for new photos" in the frame's quick menu.
            prompt_cards:
              type: boolean
              default: true
              description: Show a weekly prompt's title card before its answers.
            new_photos_from:
              type: boolean
              default: true
              description: 'Show "New photos from Ben" on the next wake after new photos arrived (computed by the frame from the new placements'' senders).'
        kiosk:
          type: object
          properties:
            allow_remove_members_on_frame: { type: boolean, default: true }
            owner_pin_set: { type: boolean, readOnly: true }
            owner_pin:
              type: [string, 'null']
              writeOnly: true
              pattern: '^[0-9]{4,6}$'
              description: |
                Owner only (`403 forbidden` for anyone else). A 4–6 digit kiosk PIN for the frame, or null to remove it.
                The server never stores or returns the PIN: it keeps only `owner_pin_hash`, which the frame verifies
                locally (opening settings, leaving the kiosk, power off/restart, Wi-Fi changes).
            owner_pin_hash:
              description: |
                Salted hash of the owner PIN, null when no PIN is set. Only the frame sees it (in the change feed and
                in `PATCH /device/settings` responses); user-facing settings omit it. The frame may set or clear it
                with `PATCH /device/settings` when the PIN is changed at the frame; users set it via `owner_pin`.
              oneOf:
                - { $ref: '#/components/schemas/PinHash' }
                - { type: 'null' }
        updates:
          type: object
          properties:
            channel:
              type: string
              enum: [stable, beta]
              default: stable
              description: Frame app release channel (beta program). Beta frames get the newest of beta and stable.
        plugins:
          type: object
          description: |
            Widgets from plugins (docs/plugins.md): the layout and the plugin instances. What a frame can run is in
            its catalog (`GET /frames/{frameId}/plugins`); instances are checked against it.
          properties:
            layout:
              type: object
              properties:
                mode: { type: string, enum: ['off', overlay, band, split], default: 'off', description: 'Off, the photo''s top corners, a band beside or above a 3:2 photo, or split: a photo on half the screen and the other half shared by a dashboard (widgets, clock, the next 48 hours) and a second photo.' }
                side: { type: string, enum: [left, right], default: right, description: 'Where the band goes in landscape; for split, the side of the dashboard''s half (landscape) or of the dashboard itself (portrait).' }
                background: { type: string, enum: [paper, photo], default: paper }
            instances:
              type: array
              maxItems: 8
              description: |
                Replaced whole by a patch (it is an array). Secrets are matched by `instance_id`: an instance sent
                without `secrets` keeps the ones it has.
              items: { $ref: '#/components/schemas/PluginInstance' }

    PluginInstance:
      type: object
      description: |
        One widget: a plugin with the owner's settings (docs/plugins.md §10). Settings follow the plugin's manifest;
        values of `secret` settings never go in `settings` but in `secrets`, which people can only write.
      required: [instance_id, plugin_id]
      properties:
        instance_id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,47}$' }
        plugin_id: { type: string, maxLength: 64, examples: [kinframe.ha-energy] }
        version: { type: string, maxLength: 40, description: The plugin version the settings were made with (informational). }
        slot: { type: string, enum: [top-left, top-right], default: top-right }
        order: { type: integer, minimum: 0, maximum: 99, default: 0 }
        visibility: { type: string, enum: [always, on_change, on_tap], default: always }
        enabled: { type: boolean, default: true, description: An enabled instance needs every required setting and secret. }
        settings:
          type: object
          maxProperties: 40
          additionalProperties: true
          description: The manifest's non-secret settings by key (strings, numbers, booleans, or a list of entity ids).
        secrets:
          type: object
          maxProperties: 8
          additionalProperties: { type: [string, 'null'], maxLength: 2000 }
          description: |
            Write: key → new value, or null to remove it; keys left out keep their value. Stored encrypted. Only the
            frame reads them back (in the change feed and `PATCH /device/settings` responses), in full.
        secrets_set:
          type: array
          readOnly: true
          items: { type: string }
          description: The secret settings that have a value.

    CatalogPlugin:
      type: object
      description: A plugin the frame can run, as the frame reports it (`PUT /device/plugins/catalog`).
      required: [manifest]
      properties:
        manifest:
          type: object
          additionalProperties: true
          description: The plugin's `plugin.json` as-is (docs/plugins.md §3.1).
        locales:
          type: object
          description: |
            Language tag → the manifest's translations (`@name`, `@description`, `@setting.<key>`,
            `@setting.<key>.help`, `@setting.<key>.placeholder`, `@option.<key>.<value>`, `@preset.<id>`). English is
            the manifest itself, with `en` for option labels.
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        builtin: { type: boolean, description: 'Part of the frame app; false for a plugin from the community registry (its newest version).' }

    PluginCatalog:
      type: object
      required: [plugins]
      properties:
        plugins: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CatalogPlugin' } }

    PluginInstanceStatus:
      type: object
      required: [instance_id]
      properties:
        instance_id: { type: string }
        running: { type: boolean, description: The instance started on the frame. }
        error: { type: [string, 'null'], maxLength: 300, description: 'The last error, null when the last update and render worked.' }
        error_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time, description: When the last update succeeded. }
        version: { type: [string, 'null'], description: 'The plugin version the frame runs (a registry plugin may run a newer one than the instance names: same permissions).' }
        update:
          type: [object, 'null']
          description: A newer registry version that asks for different permissions; it runs once the owner sets the instance's `version` to it.
          properties:
            version: { type: string }
            permissions: { type: object, additionalProperties: true, description: The newer version's `permissions`. }
        entities:
          type: array
          maxItems: 3000
          description: |
            Home Assistant entities the frame can see through this instance's `base_url` and `token` (for the entity
            picker, docs/plugins.md §6.2). Absent when the plugin has no entity settings or the connection failed.
          items: { $ref: '#/components/schemas/DiscoveredEntity' }

    DiscoveredEntity:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string }
        name: { type: string }
        unit: { type: string }
        device_class: { type: string }

    DiscoveredService:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 200, examples: ['http://192.168.1.20'] }

    StationLatest:
      type: object
      required: [received_at, reading]
      properties:
        received_at: { type: string, format: date-time }
        reading: { $ref: '#/components/schemas/StationReading' }
        today:
          type: object
          description: Since midnight in the station's frame's time zone (the first registering frame).
          properties:
            temp_min_c: { type: [number, 'null'] }
            temp_max_c: { type: [number, 'null'] }
            gust_max_ms: { type: [number, 'null'] }

    PublicStationList:
      type: object
      required: [stations]
      properties:
        stations:
          type: array
          items: { $ref: '#/components/schemas/PublicStationSummary' }

    PublicStationSummary:
      type: object
      required: [station_id, name, received_at, reading, temp_24h]
      properties:
        station_id: { type: string }
        name: { type: string, description: 'The title the owner chose; empty: none.' }
        received_at: { type: string, format: date-time }
        reading: { $ref: '#/components/schemas/StationReading' }
        temp_24h:
          description: The mean temperature (°C) of each of the last 24 hours, oldest first, the current hour last; null where nothing arrived.
          type: array
          items: { type: [number, 'null'] }

    StationPublic:
      type: object
      required: [station_id, name, timezone, received_at, reading, today, series]
      properties:
        station_id: { type: string, description: The station ID as its owner wrote it. }
        name: { type: string, description: 'The title the owner chose; empty: none.' }
        timezone: { type: string, description: 'IANA zone of the owner''s frame: what "today" means.' }
        received_at: { type: string, format: date-time }
        reading: { $ref: '#/components/schemas/StationReading' }
        today:
          type: object
          description: Since midnight in `timezone`.
          properties:
            temp_min_c: { type: [number, 'null'] }
            temp_min_at: { type: [string, 'null'], format: date-time }
            temp_max_c: { type: [number, 'null'] }
            temp_max_at: { type: [string, 'null'], format: date-time }
            gust_max_ms: { type: [number, 'null'] }
            gust_max_at: { type: [string, 'null'], format: date-time }
            rain_mm: { type: [number, 'null'] }
            uv_max: { type: [number, 'null'] }
        series: { $ref: '#/components/schemas/StationSeries' }

    StationSeries:
      type: object
      description: |
        The last 48 hours in fixed steps (`step_s` seconds from `start`), one value per step and null where nothing
        arrived: means, except gusts, rain rate and UV (the step's maximum), today's rain (its last value) and wind
        direction (the speed-weighted mean direction).
      required: [start, step_s, temp_c, dew_point_c, feels_like_c, humidity_pct, pressure_hpa, wind_ms, gust_ms, wind_dir_deg, rain_rate_mm_h, rain_today_mm, solar_wm2, uv_index]
      properties:
        start: { type: string, format: date-time }
        step_s: { type: integer }
        temp_c: { $ref: '#/components/schemas/StationValues' }
        dew_point_c: { $ref: '#/components/schemas/StationValues' }
        feels_like_c: { $ref: '#/components/schemas/StationValues' }
        humidity_pct: { $ref: '#/components/schemas/StationValues' }
        pressure_hpa: { $ref: '#/components/schemas/StationValues' }
        wind_ms: { $ref: '#/components/schemas/StationValues' }
        gust_ms: { $ref: '#/components/schemas/StationValues' }
        wind_dir_deg: { $ref: '#/components/schemas/StationValues' }
        rain_rate_mm_h: { $ref: '#/components/schemas/StationValues' }
        rain_today_mm: { $ref: '#/components/schemas/StationValues' }
        solar_wm2: { $ref: '#/components/schemas/StationValues' }
        uv_index: { $ref: '#/components/schemas/StationValues' }

    StationValues:
      type: array
      items: { type: [number, 'null'] }

    StationReading:
      type: object
      description: One upload in metric units; a value the station didn't send is absent.
      properties:
        station_time: { type: string, format: date-time }
        temp_c: { type: number }
        humidity_pct: { type: number }
        dew_point_c: { type: number }
        feels_like_c: { type: number }
        pressure_hpa: { type: number }
        wind_ms: { type: number }
        wind_dir_deg: { type: number }
        gust_ms: { type: number }
        rain_rate_mm_h: { type: number }
        rain_today_mm: { type: number }
        solar_wm2: { type: number }
        uv_index: { type: number }
        indoor_temp_c: { type: number }
        indoor_humidity_pct: { type: number }

    PluginRegistry:
      type: object
      required: [index, signature, sequence]
      properties:
        index: { type: string, description: 'base64 of index.json, byte for byte as signed' }
        signature: { type: string, description: 'base64 DER ECDSA P-256 SHA-256 signature over those bytes' }
        sequence: { type: integer }

    PluginStatusReport:
      type: object
      description: What the frame knows about its plugins right now (`PUT /device/plugins/status`).
      properties:
        instances: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/PluginInstanceStatus' } }
        services:
          type: object
          description: 'mDNS service type (a `discover` value in a manifest) → what the frame found on its network.'
          additionalProperties: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DiscoveredService' } }

    FramePlugins:
      type: object
      description: The frame's plugin catalog and their status, for the apps' Plugins section.
      required: [catalog]
      properties:
        catalog: { type: array, items: { $ref: '#/components/schemas/CatalogPlugin' } }
        catalog_at: { type: [string, 'null'], format: date-time, description: When the frame last reported its catalog; null for an app that doesn't. }
        instances: { type: array, items: { $ref: '#/components/schemas/PluginInstanceStatus' } }
        services:
          type: object
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/DiscoveredService' } }
        status_at: { type: [string, 'null'], format: date-time }

    PinHash:
      type: object
      description: |
        PBKDF2-HMAC-SHA256 of the UTF-8 PIN digits (RFC 8018), 32-byte output. `salt` and `hash` are standard base64.
      required: [alg, iterations, salt, hash]
      properties:
        alg: { type: string, enum: [pbkdf2-sha256] }
        iterations: { type: integer, minimum: 1000, maximum: 1000000, examples: [20000] }
        salt: { type: string, minLength: 16, maxLength: 64, description: 'base64, at least 12 random bytes' }
        hash: { type: string, minLength: 44, maxLength: 44, description: base64 of 32 bytes }

    FrameUpdate:
      type: object
      description: A frame app release mirrored by the server.
      required: [version_name, version_code, min_sdk, url, sha256, size, published_at]
      properties:
        version_name: { type: string, examples: ['0.2.0'] }
        version_code: { type: integer, examples: [20099] }
        min_sdk: { type: integer, examples: [23] }
        url: { type: string, format: uri, description: 'Where to download the APK on this server: `/v1/device/update/apk/{version_code}` (frames) or `/v1/frame-app/apk/{version_code}` (public).' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, description: bytes }
        release_notes: { type: [string, 'null'] }
        published_at: { type: string, format: date-time }
        prerelease: { type: boolean, description: True for beta releases. }

    FrameSettingsPatch:
      description: RFC 7396 merge patch of FrameSettings (any subset; arrays are replaced whole).
      type: object

    DeviceEnroll:
      type: object
      required: [hardware, screen, app]
      properties:
        hardware:
          type: object
          required: [model]
          properties:
            brand: { type: string, examples: [denver] }
            model: { type: string, examples: [PFF_1024] }
            board: { type: string, examples: [rk312x] }
            android_sdk: { type: integer, examples: [23] }
            abis: { type: array, items: { type: string } }
            ram_mb: { type: integer }
            storage_total_bytes: { type: integer }
            max_video_decode: { $ref: '#/components/schemas/Screen' }
            capabilities:
              type: object
              properties:
                light_sensor: { type: boolean }
                motion_sensor: { type: boolean }
                accelerometer: { type: boolean }
                battery: { type: boolean }
                speaker: { type: boolean }
                sd_card: { type: boolean }
                usb_host: { type: boolean }
                root: { type: boolean }
        screen: { $ref: '#/components/schemas/Screen' }
        app:
          type: object
          required: [version, version_code]
          properties:
            version: { type: string }
            version_code: { type: integer }
            channel: { type: string, enum: [stable, beta], default: stable }
        locale: { type: string }
        timezone: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }

    DeviceKind:
      type: string
      enum: [android, browser]
      default: android
      description: |
        What runs the frame. `android`: the frame app. `browser`: a web browser enrolled as a virtual frame from the TV
        page (`/tv/frame`). Browser frames speak the same device protocol; they never get app updates, are exempt from
        `426 app_update_required`, and send a smaller heartbeat (no Wi-Fi or storage fields).

    DeviceState:
      type: object
      required: [device_id, claimed, latest_seq]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        claimed: { type: boolean }
        frame_id: { type: [string, 'null'] }
        frame_name: { type: [string, 'null'] }
        owner_name: { type: [string, 'null'] }
        latest_seq: { type: integer }
        server_time: { type: string, format: date-time }

    Change:
      type: object
      required: [seq, type]
      discriminator: { propertyName: type }
      properties:
        seq: { type: integer }
        type:
          type: string
          enum: [placement.upsert, placement.remove, settings, album.upsert, album.remove, member.upsert, member.remove, frame, weather, calendar, birthdays, comments, photo_request, prompts, reset]
        placement:
          allOf:
            - $ref: '#/components/schemas/Placement'
            - type: object
              properties:
                media:
                  type: object
                  description: Frame rendition to download (present on placement.upsert when status is ready).
                  properties:
                    url: { type: string, format: uri }
                    sha256: { type: string }
                    bytes: { type: integer }
                    mime: { type: string, examples: [image/webp, video/mp4] }
                    width: { type: integer }
                    height: { type: integer }
                    poster_url: { type: [string, 'null'], format: uri }
                motion:
                  type: object
                  description: |
                    Live items only (`item.kind: live`), once the clip's frame rendition is ready: the short H.264
                    clip to play over the still (`media`), which is also its poster. Frames that don't know `live`
                    ignore it and show `media` as a photo.
                  properties:
                    url: { type: string, format: uri }
                    sha256: { type: string }
                    bytes: { type: integer }
                    mime: { type: string, examples: [video/mp4] }
                    width: { type: integer }
                    height: { type: integer }
                    duration_ms: { type: integer }
                    has_audio: { type: boolean }
        id: { $ref: '#/components/schemas/Id' }
        settings: { $ref: '#/components/schemas/FrameSettings' }
        album: { $ref: '#/components/schemas/Album' }
        member:
          type: object
          properties:
            user_id: { $ref: '#/components/schemas/Id' }
            display_name: { type: string }
            avatar_url: { type: [string, 'null'] }
            role: { $ref: '#/components/schemas/Role' }
        frame:
          type: object
          properties:
            name: { type: string }
            location: { type: [string, 'null'] }
            owner_name: { type: string }
        weather:
          $ref: '#/components/schemas/Weather'
        calendar:
          oneOf:
            - $ref: '#/components/schemas/Calendar'
            - { type: 'null' }
        birthdays:
          description: The frame's birthday people (`birthdays` change), or null = drop them. Old frame apps ignore it.
          oneOf:
            - $ref: '#/components/schemas/FrameBirthdays'
            - { type: 'null' }
        comments:
          description: '`comments` change (entity `id` = the placement): its newest comments, or null = drop them (show comments turned off, comments removed). Only for frames with `settings.social.show_comments`. Old frame apps ignore it.'
          oneOf:
            - $ref: '#/components/schemas/PlacementComments'
            - { type: 'null' }
        photo_request:
          description: '`photo_request` change (entity `id` = the frame): the frame''s latest "Ask for new photos", or null when there is none in the last 7 days.'
          oneOf:
            - $ref: '#/components/schemas/FramePhotoRequest'
            - { type: 'null' }
        prompts:
          description: '`prompts` change (entity `id` = the frame): the current weekly prompts of its families, or null = none.'
          oneOf:
            - $ref: '#/components/schemas/FramePrompts'
            - { type: 'null' }

    Weather:
      type: [object, 'null']
      description: |
        Payload of the `weather` change (docs/api/README.md §5.4). `null` means "no weather": the location was
        removed, the weather widget was turned off, or the server has weather disabled; the frame drops what it has.
        Values are always metric (°C, km/h, mm); clients convert for `locale.temperature_unit`. Local times carry the
        location's UTC offset. Data by Open-Meteo.com (CC BY 4.0); clients showing it must credit "Weather data by
        Open-Meteo.com".
      required: [fetched_at, current, daily]
      properties:
        fetched_at: { type: string, format: date-time, description: When the server fetched this from Open-Meteo }
        location:
          type: object
          properties:
            name: { type: [string, 'null'] }
            lat: { type: number }
            lon: { type: number }
        timezone: { type: string, examples: [Europe/Brussels] }
        utc_offset_seconds: { type: integer }
        units:
          type: object
          properties:
            temperature: { type: string, enum: [c], default: c }
            wind_speed: { type: string, enum: [km/h], default: km/h }
            precipitation: { type: string, enum: [mm], default: mm }
        current:
          type: object
          required: [temp_c, code, is_day]
          properties:
            time: { type: string, format: date-time }
            temp_c: { type: number }
            apparent_c: { type: [number, 'null'], description: Feels-like temperature }
            code: { type: integer, description: WMO weather code (0–99) }
            is_day: { type: boolean }
            wind_kmh: { type: [number, 'null'] }
            wind_dir_deg: { type: [integer, 'null'], description: 'Direction the wind comes from, 0 = north' }
            humidity_pct: { type: [integer, 'null'] }
            precip_mm: { type: [number, 'null'] }
        hourly:
          type: array
          description: The next 24 hours, starting with the current hour.
          items:
            type: object
            required: [time, temp_c, code]
            properties:
              time: { type: string, format: date-time }
              temp_c: { type: number }
              code: { type: integer }
              is_day: { type: boolean }
              precip_prob: { type: [integer, 'null'], description: Percent }
        daily:
          type: array
          description: Up to 7 days, starting today (in the location's time zone).
          items:
            type: object
            required: [date, min_c, max_c, code]
            properties:
              date: { type: string, format: date }
              min_c: { type: number }
              max_c: { type: number }
              code: { type: integer }
              precip_mm: { type: [number, 'null'] }
              precip_prob: { type: [integer, 'null'], description: Maximum hourly probability, percent }
              sunrise: { type: [string, 'null'], format: date-time }
              sunset: { type: [string, 'null'], format: date-time }

    CalendarColor:
      type: string
      description: |
        Palette key. Clients map it to the light/dark colours listed in docs/api/README.md §5.8 (the same 12 colours
        everywhere).
      enum: [coral, tangerine, amber, olive, mint, sage, teal, sky, ocean, lavender, plum, rose]

    CalendarSourceKind:
      type: string
      description: '`ics`: an ICS/iCal/webcal link. `caldav`: a CalDAV calendar. `local`: the frame''s received-events calendar.'
      enum: [ics, caldav, local]

    CalendarSyncStatus:
      type: string
      description: '`syncing` before the first sync and while one runs; `disabled` when the source is turned off.'
      enum: [ok, syncing, failed, auth_failed, disabled]

    CalendarSource:
      type: object
      required: [id, kind, name, color, enabled, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CalendarSourceKind' }
        name: { type: string, description: 'Display name. Empty for the local calendar until renamed: clients show "Received events".' }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean }
        url_hint: { type: [string, 'null'], description: 'Redacted URL for display. Null for `local`.', examples: ['https://calendar.google.com/…/basic.ics'] }
        username: { type: [string, 'null'], description: CalDAV only. }
        has_password: { type: boolean }
        status: { $ref: '#/components/schemas/CalendarSyncStatus' }
        last_error: { type: [string, 'null'], description: Short reason of the last failed sync (English). }
        last_synced_at: { type: [string, 'null'], format: date-time, description: Last successful sync. }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        next_sync_at: { type: [string, 'null'], format: date-time }
        event_count: { type: integer, description: Events of this source in the frame's window. }
        created_at: { type: string, format: date-time }

    CalendarSourceCreate:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [ics, caldav] }
        url:
          type: string
          minLength: 8
          maxLength: 2048
          description: '`https://`, `http://` or `webcal://` (treated as https). For CalDAV: the server, account or calendar URL.'
        name: { type: string, maxLength: 60, description: 'Defaults to the calendar''s own name, else the host.' }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean, default: true }
        username: { type: string, maxLength: 200, description: CalDAV only. }
        password: { type: string, maxLength: 500, writeOnly: true, description: 'CalDAV only; use an app-specific password.' }
        calendar_url: { type: string, maxLength: 2048, description: 'CalDAV only: the calendar collection to use, from `CalendarTestResult.calendars`.' }

    CalendarSourceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean }
        url: { type: string, minLength: 8, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }
        calendar_url: { type: string, maxLength: 2048 }

    CalendarTestResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [ok, failed, auth_failed] }
        error: { type: [string, 'null'] }
        calendar_name: { type: [string, 'null'], description: 'The calendar''s own name, if it has one.' }
        event_count: { type: [integer, 'null'], description: Events in the next 30 days. }
        calendars:
          type: array
          description: CalDAV only. Calendars on the account that hold events.
          items:
            type: object
            required: [url, name]
            properties:
              url: { type: string }
              name: { type: string }
              color: { type: [string, 'null'], description: 'The server''s colour (hex), as a hint.' }

    CalendarEventId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: Stable id of one event occurrence (a hash of source, UID and occurrence start).

    CalendarEvent:
      type: object
      description: |
        One occurrence. Timed events have `start_at`/`end_at` (UTC; clients show them in the frame's time zone);
        all-day events have `start_date`/`end_date` (inclusive) and no times. Multi-day events span several days.
      required: [id, source_id, title, all_day]
      properties:
        id: { $ref: '#/components/schemas/CalendarEventId' }
        source_id: { $ref: '#/components/schemas/Id' }
        title: { type: string, maxLength: 200 }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        location: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 500 }
        recurring: { type: boolean }
        countdown: { type: boolean }
        sender_name: { type: [string, 'null'], description: Received events only. }
        invitation_id:
          description: 'Received events only; the photo is at `/v1/device/invitations/{id}/photo`.'
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
        has_photo: { type: boolean }
        photo_placement: { oneOf: [ { $ref: '#/components/schemas/EventPhotoPlacement' }, { type: 'null' } ] }

    CalendarSourceInfo:
      type: object
      required: [id, kind, name, color, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CalendarSourceKind' }
        name: { type: string }
        color: { $ref: '#/components/schemas/CalendarColor' }
        status: { $ref: '#/components/schemas/CalendarSyncStatus' }
        last_synced_at: { type: [string, 'null'], format: date-time }

    Countdown:
      type: object
      description: A marked event, even when it lies outside the window.
      required: [event_id, title, all_day, color]
      properties:
        event_id: { $ref: '#/components/schemas/CalendarEventId' }
        source_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        title: { type: string }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        color: { $ref: '#/components/schemas/CalendarColor' }

    Calendar:
      type: object
      description: |
        Payload of the `calendar` change (docs/api/README.md §5.8): every enabled source of the frame merged into one
        list, deduplicated across sources by UID and start, sorted by start.
      required: [generated_at, timezone, window, sources, events, countdowns]
      properties:
        generated_at: { type: string, format: date-time }
        timezone: { type: string, description: 'The frame''s time zone (`locale.timezone`), used for the window and all-day events.', examples: [Europe/Brussels] }
        window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date, description: Inclusive. }
        sources: { type: array, items: { $ref: '#/components/schemas/CalendarSourceInfo' } }
        events: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        countdowns:
          type: array
          description: Marked events that have not passed yet, nearest first.
          items: { $ref: '#/components/schemas/Countdown' }

    CalendarView:
      allOf:
        - $ref: '#/components/schemas/Calendar'
        - type: object
          properties:
            weather:
              $ref: '#/components/schemas/Weather'

    EventPhotoPlacement:
      type: string
      description: '`top`: the photo above the event details. `background`: the photo fills the card behind them.'
      enum: [top, background]

    EventInvitationCreate:
      type: object
      description: Timed events need `start_at` and `end_at`; all-day events need `start_date` (`end_date` is inclusive and defaults to `start_date`).
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        all_day: { type: boolean, default: false }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        location: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        photo_upload_id: { type: string, description: A finished tus upload holding an image. }
        photo_placement: { $ref: '#/components/schemas/EventPhotoPlacement' }

    EventInvitation:
      type: object
      required: [id, frame_id, sender_id, sender_name, status, title, all_day, has_photo, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        sender_id: { $ref: '#/components/schemas/Id' }
        sender_name: { type: string }
        status: { type: string, enum: [pending, accepted, declined, withdrawn] }
        title: { type: string }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        location: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        has_photo: { type: boolean }
        photo_placement: { $ref: '#/components/schemas/EventPhotoPlacement' }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------- family social (docs/spec/family-social.md, README §5.18)
    PersonRef:
      type: object
      description: |
        A person as shown next to a comment, message or reaction. `former_member: true` for deleted accounts: show
        the localized "Former member" instead of `display_name` (which is then empty) and no avatar.
      required: [user_id, display_name]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        former_member: { type: boolean, default: false }

    PersonReaction:
      type: string
      description: |
        A person's reaction. The first four are the frame's reactions (`Reaction`), so counts merge with frames':
        `love` ❤️, `laugh` 😂, `wow` 😮, `sad` 😢; people also have `thumbs_up` 👍 and `pray` 🙏.
      enum: [love, laugh, wow, sad, thumbs_up, pray]

    ReactionTargetKind:
      type: string
      description: '`post_item` is one item of a post (the `post_id` query parameter names the post).'
      enum: [post, post_item, comment, message]

    ReactionSummary:
      type: object
      description: |
        The reaction row of a post, post item, comment or message: people and frames together ("❤ Oma's frame, Anna
        and 3 others"). `counts` merges people and frames (frames' `Reaction` values map to the same names).
        `frames` is only filled for posts and post items, and for feed posts only when the caller may see frame
        reactions (`members_see_reactions`, or own post, or feed owner/admin; README §5.18). People the caller blocked
        are left out of `people` but counted.
      required: [total, counts, people, frames]
      properties:
        total: { type: integer }
        counts:
          type: array
          description: Per emoji, most frequent first.
          items:
            type: object
            required: [emoji, count]
            properties:
              emoji: { $ref: '#/components/schemas/PersonReaction' }
              count: { type: integer }
        people:
          type: array
          description: Up to 3 people, the caller's contacts first, newest first.
          items:
            type: object
            required: [person, emoji]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              emoji: { $ref: '#/components/schemas/PersonReaction' }
        frames:
          type: array
          description: Up to 3 frames, newest first.
          items: { $ref: '#/components/schemas/FrameReactionRef' }
        mine: { oneOf: [ { $ref: '#/components/schemas/PersonReaction' }, { type: 'null' } ] }

    FrameReactionRef:
      type: object
      required: [frame_id, frame_name, reaction]
      properties:
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        reaction: { $ref: '#/components/schemas/Reaction' }
        item_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: The item the frame reacted to (posts with several items). }
        at: { type: string, format: date-time }
        server_name: { type: [string, 'null'], description: A frame on another server (README §5.22); `frame_id` is then the remote subscription's id. }

    ReactionList:
      type: object
      required: [people, frames]
      properties:
        people:
          type: array
          items:
            type: object
            required: [person, emoji, at]
            properties:
              person: { $ref: '#/components/schemas/PersonRef' }
              emoji: { $ref: '#/components/schemas/PersonReaction' }
              at: { type: string, format: date-time }
        frames: { type: array, items: { $ref: '#/components/schemas/FrameReactionRef' } }

    Mention:
      type: object
      description: |
        A mention inside a comment or message `body`: `start` and `length` are in UTF-16 code units (what JavaScript,
        Kotlin and Swift's `utf16` view count), covering the "@Name" text. Spans must lie inside the body and must not
        overlap; at most `limits.max_mentions` per text.
      required: [user_id, start, length]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        start: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 1 }

    ThreadState:
      type: string
      enum: [open, closed]

    CommentKind:
      type: string
      description: '`person`: a comment or reply. `frame`: a read-only frame entry ("Oma''s frame loved this", "Oma''s frame: Call me!").'
      enum: [person, frame]

    Comment:
      type: object
      required: [id, post_id, kind, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        post_id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CommentKind' }
        parent_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: 'Replies only: the top-level comment (one level of replies).'
        author:
          oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ]
          description: '`person` comments; null for frame entries.'
        quoted:
          oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ]
          description: A reply to a reply quotes that person ("@Ben"), while hanging under the same top comment.
        frame:
          type: [object, 'null']
          description: Frame entries only.
          required: [frame_id, frame_name]
          properties:
            frame_id: { $ref: '#/components/schemas/Id' }
            frame_name: { type: string }
            item_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
            reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
            reply: { oneOf: [ { $ref: '#/components/schemas/ReplyPreset' }, { type: 'null' } ] }
            server_name: { type: [string, 'null'], description: 'A frame on another server (README §5.22): show "Oma''s frame (kinframe.appmire.be)". `frame_id` is then the remote subscription''s id.' }
        body: { type: [string, 'null'], description: Null for frame entries and tombstones. }
        mentions: { type: array, items: { $ref: '#/components/schemas/Mention' } }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        reply_count: { type: integer, description: Top-level comments only. }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted:
          type: boolean
          default: false
          description: Deleted by its author but kept as a tombstone because it has replies ("Comment deleted").
        removed_by_admin:
          type: boolean
          default: false
          description: Only ever true for the author, who still sees it ("Removed by a family admin"); everyone else no longer gets it.
        can_edit: { type: boolean }
        can_delete: { type: boolean }

    CommentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000, description: 'Trimmed; at most `limits.max_comment_chars` characters (Unicode code points).' }
        parent_id: { $ref: '#/components/schemas/Id' }
        quoted_user_id: { $ref: '#/components/schemas/Id' }
        mentions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Mention' } }

    CommentUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        mentions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Mention' } }

    CommentPage:
      type: object
      required: [comments, has_more]
      properties:
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        has_more: { type: boolean, description: More comments after the last one; pass its id as `after`. }

    ThreadSummary:
      type: object
      description: The thread of a post as shown on the timeline.
      required: [post_id, state, comment_count, latest_comments, reactions]
      properties:
        post_id: { $ref: '#/components/schemas/Id' }
        state: { $ref: '#/components/schemas/ThreadState' }
        comment_count: { type: integer, description: Person comments and replies, without tombstones and removed ones. }
        latest_comments:
          type: array
          maxItems: 2
          description: The two newest person comments (replies included), oldest of the two first.
          items: { $ref: '#/components/schemas/Comment' }
        unread_count: { type: integer, description: Person comments after the caller's `read_up_to` (all of them if never read), not counting their own. }
        unread_mentions: { type: integer, description: Unread comments that mention the caller or reply to them. }
        read_up_to: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        muted: { type: boolean }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        can_comment: { type: boolean, description: False when closed or the caller may only read. }
        can_moderate: { type: boolean, description: May close the thread and remove others' comments. }

    PostKind:
      type: string
      description: '`feed`: a post in a family (feed). `frame`: a direct send to one frame (one per send and frame).'
      enum: [feed, frame]

    PostSeen:
      type: object
      description: |
        The line under a post: "Seen on 4 frames · ❤ from Oma's frame". `frames`/`seen` follow the post's receipts
        (`FeedReceiptSummary`); visible to the poster, the feed's owner/admins, and every member when the feed has
        `members_see_receipts` (frame posts: everyone who sees the post). Otherwise null on `TimelinePost.seen`.
      required: [frames, seen]
      properties:
        frames: { type: integer }
        seen: { type: integer }

    TimelinePost:
      type: object
      required: [id, kind, poster, created_at, items, thread]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/PostKind' }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'], description: The family, shown as a label. }
        circle_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: 'Feed posts shared with one circle only.' }
        circle_name: { type: [string, 'null'] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: '`frame` posts: the frame ("To Oma''s frame").' }
        frame_name: { type: [string, 'null'] }
        poster: { $ref: '#/components/schemas/PersonRef' }
        send_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The poster's send (own posts only).
        created_at: { type: string, format: date-time }
        via: { oneOf: [ { $ref: '#/components/schemas/ItemVia' }, { type: 'null' } ] }
        items: { type: array, description: Live items in send order (for frame posts, those still on the frame)., items: { $ref: '#/components/schemas/Item' } }
        prompt:
          type: [object, 'null']
          description: The weekly prompt this post answers; clients group consecutive answers ("6 answers to …").
          required: [id, title]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            title: { type: string }
        seen: { oneOf: [ { $ref: '#/components/schemas/PostSeen' }, { type: 'null' } ] }
        thread: { $ref: '#/components/schemas/ThreadSummary' }
        can_remove: { type: boolean, description: 'The poster, or a feed owner/admin (`removeFeedPost`); frame posts: the sender (`unsend` per frame is not offered; it removes the whole send).' }

    TimelinePage:
      type: object
      required: [posts, next_before]
      properties:
        posts: { type: array, items: { $ref: '#/components/schemas/TimelinePost' } }
        next_before: { type: [string, 'null'], description: 'Pass as `before` for the next (older) page; null at the end.' }

    # ---------------------------------------------------------------- circles
    CircleRole:
      type: string
      enum: [admin, member]

    CircleMember:
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/CircleRole' }
        added_at: { type: string, format: date-time }

    Circle:
      type: object
      description: |
        A smaller group inside a family ("Anna's household", "The cousins"): its own chat (`conversation_id`) and an
        audience for posts. Circle posts reach the family's subscribed frames that have a manager (owner, admin or
        `change_settings`) in the circle, plus the frames in `frame_ids` (README §5.18).
      required: [id, feed_id, name, members, member_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        my_role:
          oneOf: [ { $ref: '#/components/schemas/CircleRole' }, { type: 'null' } ]
          description: Null when the caller is a feed owner/admin who is not in the circle.
        members: { type: array, items: { $ref: '#/components/schemas/CircleMember' } }
        member_count: { type: integer }
        frame_ids: { type: array, description: Extra frames (subscribed to the family) the circle's posts reach., items: { $ref: '#/components/schemas/Id' } }
        frames_reached:
          type: array
          description: Every subscribed frame its posts reach now (managers in the circle, plus `frame_ids`).
          items:
            type: object
            required: [frame_id, frame_name]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
        conversation_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: The circle's chat (members only). }
        created_at: { type: string, format: date-time }

    CircleCreate:
      type: object
      required: [name, member_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        member_ids: { type: array, maxItems: 200, description: Feed members besides the caller., items: { $ref: '#/components/schemas/Id' } }
        frame_ids: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Id' } }

    CircleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        frame_ids: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Id' } }

    # ---------------------------------------------------------------- chats (README §5.19)
    ConversationKind:
      type: string
      description: '`direct`: two people, one per pair. `group`: 3–100 people with a name. `family`: one per feed, its members always the feed''s members. `circle`: one per circle, its members the circle''s.'
      enum: [direct, group, family, circle]

    ConversationRole:
      type: string
      description: Groups only; family, circle and direct members are always `member` (family moderation follows feed roles).
      enum: [admin, member]

    ConversationMember:
      type: object
      required: [person, role]
      properties:
        person: { $ref: '#/components/schemas/PersonRef' }
        role: { $ref: '#/components/schemas/ConversationRole' }
        joined_at: { type: string, format: date-time }
        last_read_message_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: Only when read receipts are shown in this conversation (`Conversation.read_receipts`) and this member shows them too; null otherwise.

    MuteFor:
      type: string
      enum: ['off', 1h, 8h, 1w, always]

    Conversation:
      type: object
      required: [id, kind, name, member_count, unread_count, last_activity_at, muted, archived]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ConversationKind' }
        name: { type: string, description: 'Group name; the family''s or circle''s name; for `direct`, the other person''s display name.' }
        photo_url: { type: [string, 'null'], format: uri, description: 'Group photo; the family''s cover; for `direct`, the other person''s avatar.' }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: '`family` and `circle`.' }
        circle_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        other: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: '`direct` only.' }
        members:
          type: array
          description: Every member (conversations are at most 100 people; family chats can be larger and list everyone).
          items: { $ref: '#/components/schemas/ConversationMember' }
        member_count: { type: integer }
        my_role: { $ref: '#/components/schemas/ConversationRole' }
        unread_count: { type: integer, description: Messages after the caller's read position, not their own, not from people they blocked. }
        unread_mentions: { type: integer }
        read_up_to: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: The caller's own read position. }
        last_message: { oneOf: [ { $ref: '#/components/schemas/Message' }, { type: 'null' } ] }
        last_activity_at: { type: string, format: date-time, description: Last message, or creation. The list's sort key. }
        muted: { type: boolean }
        muted_until: { type: [string, 'null'], format: date-time, description: 'Null with `muted: true` means always.' }
        archived: { type: boolean, description: 'The caller archived it (a new message un-archives it), or its family or circle was deleted (read-only).' }
        read_only: { type: boolean, description: 'No sending: the family or circle was deleted, or (direct) the other account is gone, blocked the caller, or the two no longer share a family or frame (README §5.21).' }
        read_only_reason:
          oneOf:
            - { type: string, enum: [archived, account_gone, blocked, no_longer_contacts] }
            - { type: 'null' }
          description: 'Why `read_only`: `no_longer_contacts` shows "You can no longer message Lies".'
        read_receipts: { type: boolean, description: '"Seen" is shown here: direct chats and groups of up to 10 people, when the caller has `show_read_receipts` on.' }
        created_at: { type: string, format: date-time }

    ConversationCreate:
      type: object
      required: [kind, member_ids]
      properties:
        kind: { type: string, enum: [direct, group] }
        member_ids: { type: array, minItems: 1, maxItems: 99, description: Other people (not the caller)., items: { $ref: '#/components/schemas/Id' } }
        name: { type: string, minLength: 1, maxLength: 60, description: Required for groups. }

    ConversationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    ConversationPreferencesUpdate:
      type: object
      properties:
        mute: { $ref: '#/components/schemas/MuteFor' }
        archived: { type: boolean }

    MessageKind:
      type: string
      description: '`system`: posted by kinframe (put on a frame, streak milestone, monthly recap, weekly prompt, member changes); no author, can be reacted to, can''t be edited.'
      enum: [person, system]

    MessageItemCreate:
      type: object
      description: One photo or video, as in `SendCreate.items`.
      required: [upload_id]
      properties:
        upload_id: { type: string, description: 'tus upload id (or an existing item id of the caller''s when the server reported a duplicate).' }
        caption: { type: [string, 'null'], maxLength: 280 }
        captured_at: { type: [string, 'null'], format: date-time }
        trim:
          type: object
          properties:
            start_ms: { type: integer, minimum: 0 }
            end_ms: { type: integer, minimum: 1 }
        include_audio: { type: boolean, default: true }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        duration_ms: { type: integer, minimum: 1 }
        live_video_upload_id: { type: string }
        live: { type: boolean, default: true }

    MessageCreate:
      type: object
      properties:
        client_id: { type: string, maxLength: 64, description: 'Client-generated id (e.g. a UUID) for the optimistic bubble; echoed back, and a retry with the same one returns the first message.' }
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Mention' } }
        items: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/MessageItemCreate' } }
        voice:
          type: object
          description: A voice message (README §5.19); not together with `items`.
          required: [upload_id]
          properties:
            upload_id: { type: string, description: 'The tus upload of the recording: AAC in MP4 (`audio/mp4`, `.m4a`) or Opus in WebM or Ogg.' }
            duration_ms: { type: integer, minimum: 1, maximum: 300000, description: What the client recorded; the server measures it itself. }
        reply_to_id: { $ref: '#/components/schemas/Id' }
        shared_post_id: { $ref: '#/components/schemas/Id' }
        link_preview: { type: boolean, default: true, description: 'false: don''t attach a preview of the body''s first link.' }

    MessageUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        mentions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Mention' } }

    MessageQuote:
      type: object
      description: The message replied to, as quoted above the reply.
      required: [id, deleted]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        author: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        excerpt: { type: [string, 'null'], description: The first 200 characters of the body. }
        media_kind: { oneOf: [ { $ref: '#/components/schemas/MediaKind' }, { type: 'null' } ], description: The first item's kind, for "📷 Photo". }
        voice: { type: boolean, description: The quoted message is a voice message ("🎤 Voice message"). }
        thumb_url: { type: [string, 'null'], format: uri }
        deleted: { type: boolean, description: The quoted message was deleted or isn't visible to the caller. }

    PostCard:
      type: object
      description: A post shared in a chat ("Share in chat").
      required: [post_id, available]
      properties:
        post_id: { $ref: '#/components/schemas/Id' }
        available: { type: boolean, description: 'False when the caller may not see the post (another family, a circle they are not in) or it was removed: show "This post isn''t available".' }
        kind: { oneOf: [ { $ref: '#/components/schemas/PostKind' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'] }
        frame_name: { type: [string, 'null'] }
        poster: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        created_at: { type: [string, 'null'], format: date-time }
        item_count: { type: integer }
        thumb_urls: { type: array, maxItems: 4, items: { type: string, format: uri } }
        caption: { type: [string, 'null'] }

    LinkPreview:
      type: object
      required: [url, status]
      properties:
        url: { type: string, format: uri, description: The link as written. }
        status: { type: string, enum: [pending, ok, failed] }
        title: { type: [string, 'null'], maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 500 }
        site_name: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri, description: 'Fetched and re-encoded by the server (WebP, at most 512 px), served from the server: clients never load remote images.' }
        image_width: { type: [integer, 'null'] }
        image_height: { type: [integer, 'null'] }

    SystemMessageType:
      type: string
      enum: [put_on_frame, streak_milestone, monthly_recap, prompt, member_joined, member_left]

    SystemMessage:
      type: object
      description: The content of a `system` message; clients render it in the viewer's language from these fields.
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/SystemMessageType' }
        person: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: 'Who did it: put on a frame, joined or left.' }
        send_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: '`put_on_frame`.' }
        source_message_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: '`put_on_frame`: the message whose items were sent.' }
        item_count: { type: [integer, 'null'] }
        frame_names: { type: array, items: { type: string } }
        feed_names: { type: array, items: { type: string } }
        weeks: { type: [integer, 'null'], description: '`streak_milestone`: 4, 12, 26, 52, then every 52.' }
        month: { type: [string, 'null'], description: '`monthly_recap`: YYYY-MM (`getFeedRecap`).' }
        recap: { oneOf: [ { $ref: '#/components/schemas/MonthlyRecap' }, { type: 'null' } ] }
        prompt_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        prompt_title: { type: [string, 'null'] }

    Message:
      type: object
      required: [id, conversation_id, kind, created_at, items, reactions, deleted]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        conversation_id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MessageKind' }
        author: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: Null for system messages. }
        client_id: { type: [string, 'null'], description: The author's `client_id` (author only). }
        body: { type: [string, 'null'] }
        mentions: { type: array, items: { $ref: '#/components/schemas/Mention' } }
        items:
          type: array
          description: Photos and videos. Ordinary items; `GET /v1/items/{id}/media/{variant}` serves them to conversation members.
          items: { $ref: '#/components/schemas/Item' }
        voice: { oneOf: [ { $ref: '#/components/schemas/VoiceClip' }, { type: 'null' } ] }
        reply_to: { oneOf: [ { $ref: '#/components/schemas/MessageQuote' }, { type: 'null' } ] }
        shared_post: { oneOf: [ { $ref: '#/components/schemas/PostCard' }, { type: 'null' } ] }
        link_preview: { oneOf: [ { $ref: '#/components/schemas/LinkPreview' }, { type: 'null' } ] }
        system: { oneOf: [ { $ref: '#/components/schemas/SystemMessage' }, { type: 'null' } ] }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        frame_activity:
          type: array
          description: Frame reactions and quick replies on placements made from this message by "Put on a frame".
          items:
            type: object
            required: [frame_id, frame_name, item_id]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              item_id: { $ref: '#/components/schemas/Id' }
              reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
              replies: { type: array, items: { $ref: '#/components/schemas/ReplyPreset' } }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted: { type: boolean, description: 'Tombstone: "This message was deleted" (body, items, voice, preview and reactions are gone).' }
        removed_by_admin: { type: boolean, default: false, description: 'With `deleted`: removed by a moderator ("This message was removed").' }

    VoiceClip:
      type: object
      description: |
        A voice message's recording (README §5.19). Stored as an item of its own (never placed on a frame or in a
        library); `GET /v1/items/{item_id}/media/master` serves the AAC master (`audio/mp4`, Range supported).
      required: [item_id, status]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [processing, ready, failed] }
        duration_ms: { type: [integer, 'null'] }
        waveform:
          type: array
          description: 64 loudness values 0–100 over the recording (empty while processing).
          items: { type: integer, minimum: 0, maximum: 100 }

    MessagePage:
      type: object
      required: [messages, has_more_before, has_more_after]
      properties:
        messages: { type: array, description: Oldest first., items: { $ref: '#/components/schemas/Message' } }
        has_more_before: { type: boolean }
        has_more_after: { type: boolean }

    PutOnFrameRequest:
      type: object
      description: '`frame_ids` and `feed_ids` together must not be empty.'
      required: [frame_ids]
      properties:
        frame_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        feed_ids: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Id' } }
        circle_ids: { type: array, maxItems: 20, description: As in `SendCreate.circle_ids`., items: { $ref: '#/components/schemas/Id' } }
        item_ids: { type: array, maxItems: 30, description: 'A subset of the message''s photos and videos; default all of them.', items: { $ref: '#/components/schemas/Id' } }

    Person:
      type: object
      description: A contact (someone the caller shares a family or a frame with).
      required: [person, feeds, frames, blocked]
      properties:
        person: { $ref: '#/components/schemas/PersonRef' }
        feeds:
          type: array
          description: The families both are in.
          items:
            type: object
            required: [feed_id, feed_name]
            properties:
              feed_id: { $ref: '#/components/schemas/Id' }
              feed_name: { type: string }
        frames:
          type: array
          description: The frames both are members of.
          items:
            type: object
            required: [frame_id, frame_name]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
        blocked: { type: boolean, description: The caller blocked this person. }
        direct_conversation_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        milestones:
          type: array
          description: The milestones this person chose to show (all of them for the caller's own profile).
          items: { $ref: '#/components/schemas/MilestoneKey' }

    Badge:
      type: object
      description: 'The app badge: conversations with unread messages (not muted) plus threads with unread mentions of or replies to the caller (not muted).'
      required: [total, conversations, threads]
      properties:
        total: { type: integer }
        conversations: { type: integer }
        threads: { type: integer }

    Block:
      type: object
      required: [person, created_at]
      properties:
        person: { $ref: '#/components/schemas/PersonRef' }
        created_at: { type: string, format: date-time }

    ReportTargetKind:
      type: string
      enum: [comment, message, post]

    ReportReason:
      type: string
      enum: [unkind, spam, inappropriate, other]

    ReportCreate:
      type: object
      required: [target_kind, target_id, reason]
      properties:
        target_kind: { $ref: '#/components/schemas/ReportTargetKind' }
        target_id: { $ref: '#/components/schemas/Id' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: string, maxLength: 500 }

    Report:
      type: object
      description: The reporter sees their own report (`mine`) without `excerpt`, `author` or `note` of others; handlers see everything except who reported.
      required: [id, target_kind, target_id, reason, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        target_kind: { $ref: '#/components/schemas/ReportTargetKind' }
        target_id: { $ref: '#/components/schemas/Id' }
        post_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        conversation_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: Null when the operator handles it. }
        reason: { $ref: '#/components/schemas/ReportReason' }
        note: { type: [string, 'null'] }
        author: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: Who wrote the reported content (handlers). }
        excerpt: { type: [string, 'null'], description: 'The reported text as it was when reported (kept even if it was edited or deleted since), or a description of the media; handlers only.' }
        status: { type: string, enum: [open, removed, dismissed] }
        mine: { type: boolean }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------- encouragement to share (README §5.20)
    Freshness:
      type: object
      description: |
        How recently a frame (or family) got new photos from people (README §5.20). The ring: `level` from 1 (shared
        today) down to 0 (14 days or more). Words, not numbers: `fresh` "Fresh", `recent` "4 days", `quiet`
        "2 weeks quiet", `never` "No photos yet".
      required: [state, level]
      properties:
        state: { type: string, enum: [fresh, recent, quiet, never] }
        level: { type: number, minimum: 0, maximum: 1 }
        days_quiet: { type: [integer, 'null'], description: Whole days since the last personal photo (null = never). }
        last_shared_at: { type: [string, 'null'], format: date-time }
        last_shared_by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }

    PhotoRequestState:
      type: string
      description: '`open`: waiting (7 days at most). `answered`: someone sent a photo that reached the frame. `expired`: nobody did within 7 days.'
      enum: [open, answered, expired]

    PhotoRequest:
      type: object
      description: A frame's "Ask for new photos".
      required: [id, frame_id, frame_name, state, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        state: { $ref: '#/components/schemas/PhotoRequestState' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        answered_by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        freshness: { $ref: '#/components/schemas/Freshness' }
        feed_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
          description: |
            The families with an active subscription to the frame. A family member who is not on the frame answers
            the request by posting to one of these (the apps preselect it when sending).

    FramePhotoRequest:
      type: object
      description: The frame's view of its latest request (`deviceRequestPhotos`, and the `photo_request` change).
      required: [id, state, created_at, next_allowed_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        state: { $ref: '#/components/schemas/PhotoRequestState' }
        created_at: { type: string, format: date-time }
        next_allowed_at: { type: string, format: date-time, description: 'Until then the button shows "Asked today 💛".' }
        answered_at: { type: [string, 'null'], format: date-time }
        answered_by_name: { type: [string, 'null'], description: First name of whoever answered ("New photos from Ben"). }

    FeedStreakSummary:
      type: object
      required: [current_weeks, week_photos, goal, met]
      properties:
        current_weeks: { type: integer }
        week_photos: { type: integer }
        goal: { type: integer }
        met: { type: boolean, description: This week's goal is reached. }

    FeedEngagement:
      type: object
      required: [feed_id, streak_enabled, streak_goal, prompts_enabled, quiet_after_days, monthly_recap, timezone]
      properties:
        feed_id: { $ref: '#/components/schemas/Id' }
        streak_enabled: { type: boolean, default: true }
        streak_goal: { type: integer, minimum: 1, maximum: 20, default: 3, description: Photos the family together posts per week. }
        prompts_enabled: { type: boolean, default: false }
        quiet_after_days: { type: integer, minimum: 3, maximum: 30, default: 7, description: 'A subscribed frame without new personal photos for this long gets the "getting quiet" reminder.' }
        monthly_recap: { type: boolean, default: true }
        timezone: { type: string, description: 'IANA zone for weeks (Monday–Sunday), prompts and recaps; default: the most common `locale.timezone` of its subscribed frames, else the owner''s, else Europe/Brussels.', examples: [Europe/Brussels] }

    FeedEngagementUpdate:
      type: object
      properties:
        streak_enabled: { type: boolean }
        streak_goal: { type: integer, minimum: 1, maximum: 20 }
        prompts_enabled: { type: boolean }
        quiet_after_days: { type: integer, minimum: 3, maximum: 30 }
        monthly_recap: { type: boolean }
        timezone: { type: string, maxLength: 64 }

    FeedStreak:
      type: object
      required: [enabled, goal, current_weeks, best_weeks, freezes_left, week]
      properties:
        enabled: { type: boolean }
        goal: { type: integer }
        current_weeks: { type: integer, description: Weeks in a row the goal was met (frozen weeks keep it, they don't add). }
        best_weeks: { type: integer }
        freezes_left: { type: integer, minimum: 0, maximum: 2 }
        week:
          type: object
          required: [week_of, photos, met, helpers]
          properties:
            week_of: { type: string, format: date, description: The Monday. }
            photos: { type: integer }
            met: { type: boolean }
            helpers: { type: array, description: Who posted this week (no counts per person)., items: { $ref: '#/components/schemas/PersonRef' } }
        history:
          type: array
          description: The last 12 closed weeks, newest first.
          items:
            type: object
            required: [week_of, outcome]
            properties:
              week_of: { type: string, format: date }
              outcome: { type: string, enum: [met, frozen, missed] }

    FeedPrompt:
      type: object
      required: [id, feed_id, week_of, status, source, title]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        week_of: { type: string, format: date, description: The Monday the prompt runs from. }
        status: { type: string, enum: [current, planned, past, skipped] }
        source: { type: string, enum: [server, custom] }
        library_key: { type: [string, 'null'] }
        title: { type: string, description: 'In the caller''s language for server prompts; empty when skipped.' }
        answer_count: { type: integer }
        set_by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: The admin who chose or wrote it; null for the server's choice. }

    FeedPromptSet:
      type: object
      properties:
        library_key: { type: string, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 80 }
        skip: { type: boolean, enum: [true] }

    PromptLibraryEntry:
      type: object
      required: [key, title]
      properties:
        key: { type: string, examples: [cooked] }
        title: { type: string, examples: [Something you cooked] }

    OnThisDay:
      type: object
      required: [date, groups]
      properties:
        date: { type: string, format: date }
        groups:
          type: array
          maxItems: 3
          items:
            type: object
            required: [feed_id, feed_name, years_ago, items, post_ids]
            properties:
              feed_id: { $ref: '#/components/schemas/Id' }
              feed_name: { type: string }
              years_ago: { type: integer, minimum: 1 }
              post_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
              items: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/Item' } }

    WeeklySummary:
      type: object
      description: '"Your photos were seen 58 times on 3 frames this week; Oma loved 4".'
      required: [week_of, seen_count, frame_count, love_count, reaction_count, comment_count, frames]
      properties:
        week_of: { type: string, format: date }
        seen_count: { type: integer, description: Placements of the caller's items first seen this week. }
        frame_count: { type: integer }
        love_count: { type: integer, description: Frame ❤ on the caller's items this week. }
        reaction_count: { type: integer, description: People's reactions on the caller's posts and items this week. }
        comment_count: { type: integer, description: Comments by others on the caller's posts this week. }
        frames:
          type: array
          items:
            type: object
            required: [frame_id, frame_name, seen_count, love_count]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              seen_count: { type: integer }
              love_count: { type: integer }
        top_item: { oneOf: [ { $ref: '#/components/schemas/Item' }, { type: 'null' } ], description: The item with the most reactions. }

    MonthlyRecap:
      type: object
      description: About the family, never ranking individuals.
      required: [feed_id, month, photos_shared, videos_shared, sharer_count]
      properties:
        feed_id: { $ref: '#/components/schemas/Id' }
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        photos_shared: { type: integer }
        videos_shared: { type: integer }
        sharer_count: { type: integer }
        most_loved:
          type: [object, 'null']
          required: [post_id, item]
          properties:
            post_id: { $ref: '#/components/schemas/Id' }
            item: { $ref: '#/components/schemas/Item' }
            reaction_count: { type: integer, description: People and frames. }
        freshest_frames:
          type: array
          maxItems: 3
          items:
            type: object
            required: [frame_id, frame_name, days_with_new_photos]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              days_with_new_photos: { type: integer }
        new_members: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }
        streak_weeks: { type: [integer, 'null'] }

    MilestoneKey:
      type: string
      enum: [first_photo, photos_10, photos_100, photos_1000, first_video, year_of_sharing, loves_100]

    Milestone:
      type: object
      required: [key, achieved_at, shown, seen]
      properties:
        key: { $ref: '#/components/schemas/MilestoneKey' }
        achieved_at: { type: string, format: date-time }
        shown: { type: boolean, description: Shown on the caller's profile to their contacts (default false). }
        seen: { type: boolean, description: The caller dismissed its card. }

    ReminderLevel:
      type: string
      description: '`fewer`: half the weekly budget and no streak reminders. `off`: no reminders (frame requests follow `frame_requests`).'
      enum: [normal, fewer, 'off']

    EmailDigest:
      type: string
      enum: ['off', daily, weekly]

    QuietHours:
      type: object
      description: Local times (`User.timezone`) without reminders; they wait until the end. Default 21:00–09:00.
      required: [start, end]
      properties:
        start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }

    ReminderPreferences:
      type: object
      required: [level, frame_requests, weekly_summary, birthday_reminders, quiet_hours, email_digest]
      properties:
        level: { $ref: '#/components/schemas/ReminderLevel' }
        auto_reduced:
          type: boolean
          description: The server lowered `level` to `fewer` after 4 unanswered reminders in a row; show it once, then send `auto_reduced_seen`.
        frame_requests: { type: boolean, default: true, description: Pushes when a frame asks for new photos. }
        weekly_summary: { type: boolean, default: true }
        birthday_reminders: { type: boolean, default: true }
        snoozed_until: { type: [string, 'null'], format: date-time }
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        email_digest: { $ref: '#/components/schemas/EmailDigest' }
        email_digest_available: { type: boolean, description: The server can send mail (discovery `email_digest`). }

    ReminderPreferencesUpdate:
      type: object
      properties:
        level: { $ref: '#/components/schemas/ReminderLevel' }
        frame_requests: { type: boolean }
        weekly_summary: { type: boolean }
        birthday_reminders: { type: boolean }
        snooze_days: { type: integer, minimum: 0, maximum: 90 }
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        email_digest: { $ref: '#/components/schemas/EmailDigest' }
        auto_reduced_seen: { type: boolean, enum: [true] }

    PlacementComments:
      type: object
      description: |
        Payload of the `comments` change (entity: the placement): the three newest person comments of the placement's
        feed post, for frames with `settings.social.show_comments` on (README §5.20). Plain text, first names only.
      required: [placement_id, comments]
      properties:
        placement_id: { $ref: '#/components/schemas/Id' }
        comments:
          type: array
          maxItems: 3
          description: Newest first.
          items:
            type: object
            required: [id, author_name, body, created_at]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              author_name: { type: string, examples: [Anna] }
              body: { type: string, maxLength: 280, description: 'Cut at 280 characters with "…"; mentions as plain text.' }
              created_at: { type: string, format: date-time }

    FramePrompts:
      type: object
      description: 'Payload of the `prompts` change (entity: the frame): current prompts of its families, for the title card before their answers.'
      required: [generated_at, prompts]
      properties:
        generated_at: { type: string, format: date-time }
        prompts:
          type: array
          items:
            type: object
            required: [prompt_id, feed_id, feed_name, title, week_of]
            properties:
              prompt_id: { $ref: '#/components/schemas/Id' }
              feed_id: { $ref: '#/components/schemas/Id' }
              feed_name: { type: string }
              title: { type: string, description: In the frame's `locale.language`. }
              week_of: { type: string, format: date }

    # ---------------------------------------------------------------- family social: websocket events and push (README §6.2, §6.3)
    # Payloads of user websocket messages (`GET /v1/ws`). Not used by any operation; listed so generated clients
    # get typed models. Every message also has `type`.
    PostEvent:
      type: object
      description: '`post.updated`: a post''s thread state, comment count or reaction row changed (everyone who sees the post).'
      required: [type, post_id, thread]
      properties:
        type: { type: string, enum: [post.updated] }
        post_id: { $ref: '#/components/schemas/Id' }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        thread: { $ref: '#/components/schemas/ThreadSummary' }

    PostRemovedEvent:
      type: object
      description: '`post.removed`: removed, or no longer visible to the receiver.'
      required: [type, post_id]
      properties:
        type: { type: string, enum: [post.removed] }
        post_id: { $ref: '#/components/schemas/Id' }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }

    CommentEvent:
      type: object
      description: '`comment.created` (new comment, reply or frame entry) and `comment.updated` (edited, or deleted into a tombstone).'
      required: [type, post_id, comment]
      properties:
        type: { type: string, enum: [comment.created, comment.updated] }
        post_id: { $ref: '#/components/schemas/Id' }
        comment: { $ref: '#/components/schemas/Comment' }

    CommentDeletedEvent:
      type: object
      description: '`comment.deleted`: gone from the thread for the receiver.'
      required: [type, post_id, comment_id]
      properties:
        type: { type: string, enum: [comment.deleted] }
        post_id: { $ref: '#/components/schemas/Id' }
        comment_id: { $ref: '#/components/schemas/Id' }

    ThreadReadEvent:
      type: object
      description: '`thread.read`: the receiver read a thread on another device.'
      required: [type, post_id, read_up_to]
      properties:
        type: { type: string, enum: [thread.read] }
        post_id: { $ref: '#/components/schemas/Id' }
        read_up_to: { $ref: '#/components/schemas/Id' }

    ReactionUpdatedEvent:
      type: object
      description: '`reaction.updated`: people''s reactions on a target changed; `summary` is computed for the receiver.'
      required: [type, target_kind, target_id, summary]
      properties:
        type: { type: string, enum: [reaction.updated] }
        target_kind: { $ref: '#/components/schemas/ReactionTargetKind' }
        target_id: { $ref: '#/components/schemas/Id' }
        post_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        conversation_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        summary: { $ref: '#/components/schemas/ReactionSummary' }

    CircleEvent:
      type: object
      required: [type, feed_id, circle]
      properties:
        type: { type: string, enum: [circle.updated] }
        feed_id: { $ref: '#/components/schemas/Id' }
        circle: { $ref: '#/components/schemas/Circle' }

    CircleRemovedEvent:
      type: object
      required: [type, feed_id, circle_id]
      properties:
        type: { type: string, enum: [circle.removed] }
        feed_id: { $ref: '#/components/schemas/Id' }
        circle_id: { $ref: '#/components/schemas/Id' }

    ConversationEvent:
      type: object
      required: [type, conversation]
      properties:
        type: { type: string, enum: [conversation.updated] }
        conversation: { $ref: '#/components/schemas/Conversation' }

    ConversationRemovedEvent:
      type: object
      required: [type, conversation_id]
      properties:
        type: { type: string, enum: [conversation.removed] }
        conversation_id: { $ref: '#/components/schemas/Id' }

    MessageEvent:
      type: object
      description: '`message.created`, and `message.updated` (edited, items ready, preview fetched, frame activity, deleted into a tombstone).'
      required: [type, conversation_id, message]
      properties:
        type: { type: string, enum: [message.created, message.updated] }
        conversation_id: { $ref: '#/components/schemas/Id' }
        message: { $ref: '#/components/schemas/Message' }

    ReadUpdatedEvent:
      type: object
      required: [type, conversation_id, user_id, last_read_message_id]
      properties:
        type: { type: string, enum: [read.updated] }
        conversation_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
        last_read_message_id: { $ref: '#/components/schemas/Id' }

    TypingEvent:
      type: object
      required: [type, conversation_id, user_id, display_name, activity, expires_at]
      properties:
        type: { type: string, enum: [typing] }
        conversation_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        activity: { type: string, enum: [typing, recording] }
        expires_at: { type: string, format: date-time }

    BadgeEvent:
      type: object
      required: [type, badge]
      properties:
        type: { type: string, enum: [badge.updated] }
        badge: { $ref: '#/components/schemas/Badge' }

    ReportEvent:
      type: object
      required: [type, report]
      properties:
        type: { type: string, enum: [report.created] }
        report: { $ref: '#/components/schemas/Report' }

    PhotoRequestEvent:
      type: object
      required: [type, request]
      properties:
        type: { type: string, enum: [photo_request.created, photo_request.updated] }
        request: { $ref: '#/components/schemas/PhotoRequest' }

    StreakEvent:
      type: object
      required: [type, feed_id, streak]
      properties:
        type: { type: string, enum: [streak.updated] }
        feed_id: { $ref: '#/components/schemas/Id' }
        streak: { $ref: '#/components/schemas/FeedStreakSummary' }

    PromptEvent:
      type: object
      required: [type, feed_id, prompt]
      properties:
        type: { type: string, enum: [prompt.updated] }
        feed_id: { $ref: '#/components/schemas/Id' }
        prompt: { $ref: '#/components/schemas/FeedPrompt' }

    MilestoneEvent:
      type: object
      required: [type, milestone]
      properties:
        type: { type: string, enum: [milestone.achieved] }
        milestone: { $ref: '#/components/schemas/Milestone' }

    FamilySocialPushKey:
      type: string
      description: |
        Push `key`s added by family social (README §6.3; the older keys are listed there). Clients ignore keys they
        don't know.
      enum: [comment, comment_reply, mention, reaction_person, reaction_digest, message, conversation_added, report,
             frame_request, reminder_quiet, reminder_streak, reminder_birthday, weekly_summary]

    PushAction:
      type: string
      description: 'Notification buttons in `PushPayload.actions`: `snooze_month` calls `updateReminderPreferences {snooze_days: 30}`, `fewer_reminders` `{level: fewer}`.'
      enum: [snooze_month, fewer_reminders]

    PushPayload:
      type: object
      description: |
        The decrypted WebPush payload and the content of UnifiedPush messages (README §6.3); FCM data and APNs
        custom keys carry the same fields. `ids` holds only ids (strings), never content.
      required: [type, key, title, body, ids]
      properties:
        type: { type: string, description: The websocket event type this push stands for. }
        key: { type: string, description: 'The push key (`FamilySocialPushKey`, `LeavingPushKey` and the older ones in README §6.3).' }
        title: { type: string }
        body: { type: string }
        ids: { type: object, additionalProperties: { type: string } }
        tag: { type: string, description: A newer push with the same tag replaces the older one. }
        actions: { type: array, items: { $ref: '#/components/schemas/PushAction' } }
        server: { type: string, format: uri, description: 'The sending server''s base URL (discovery `base_url`), so apps with several accounts open the right one (README §6.3). Absent from older servers: use the account the push endpoint belongs to.' }

    # ---------------------------------------------------------------- leaving (docs/spec/leaving.md, README §5.21)
    PhotosChoice:
      type: string
      description: '`keep`: your photos stay with the family or frame, still credited to you (the default). `take`: they are taken away with the 30-day notice (README §5.21).'
      enum: [keep, take]

    CommentsChoice:
      type: string
      description: '`keep` (default) or `delete`: your comments in the family become tombstones ("Comment deleted").'
      enum: [keep, delete]

    LeaveFeedRequest:
      type: object
      properties:
        photos: { $ref: '#/components/schemas/PhotosChoice' }
        comments: { $ref: '#/components/schemas/CommentsChoice' }
        leave_frame_ids:
          type: array
          maxItems: 50
          description: |
            Frames to leave in the same request (frames the caller is a member of, not owner, that subscribe to this
            family; others answer `422 validation_failed`). The same `photos` choice applies to the caller's direct
            placements on them.
          items: { $ref: '#/components/schemas/Id' }
        remove_my_posts:
          type: boolean
          deprecated: true
          description: 'Older clients. `true` without `photos` means `photos: take`; without either the server keeps the photos.'

    LeaveFrameRequest:
      type: object
      properties:
        photos: { $ref: '#/components/schemas/PhotosChoice' }
        remove_my_items:
          type: boolean
          deprecated: true
          description: 'Older clients. `true` without `photos` means `photos: take`; without either the server keeps the photos.'

    TakeAwayRequest:
      type: object
      properties:
        comments: { $ref: '#/components/schemas/CommentsChoice' }

    TakeAwayResult:
      type: object
      description: |
        The answer of leaving with `photos` and of the take-away endpoints. `taking_id` is null when nothing was taken
        away (`photos: keep`, or nothing live).
      required: [photos_taken_away, comments_deleted, frames]
      properties:
        taking_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        photos_taken_away: { type: integer, description: Items taken away (each counted once, whatever the number of frames). }
        comments_deleted: { type: integer }
        until: { type: [string, 'null'], format: date-time, description: When the frames' trash deletes what nobody asked to keep. }
        frames:
          type: array
          description: Frames that lost photos (local ones; frames on other servers are counted in `remote_frames`).
          items:
            type: object
            required: [frame_id, frame_name, photos]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              photos: { type: integer }
        remote_frames: { type: integer, description: Frames on other servers following the family that were told to remove the photos. }
        left_frame_ids:
          type: array
          description: '`leaveFeed` with `leave_frame_ids`: the frames actually left.'
          items: { $ref: '#/components/schemas/Id' }

    LeavePreview:
      type: object
      required: [scope, name, photos, member]
      properties:
        scope: { type: string, enum: [feed, frame] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        name: { type: string, description: The family's or frame's name. }
        member: { type: boolean, description: The caller is still a member (false for the take-away sheet of people who left or were removed). }
        owner: { type: boolean, description: The caller owns it (must transfer ownership before leaving). }
        photos: { type: integer, description: The caller's own live items in this scope (family posts; or direct placements on the frame). }
        comments: { type: integer, description: 'Families: the caller''s live comments in the family.' }
        already_taken_away: { type: integer, description: The caller's items in this scope still in a frame's trash from an earlier taking. }
        frames:
          type: array
          description: 'Families: frames the caller is a member of that subscribe to the family (the "Leave this frame too" checkboxes).'
          items:
            type: object
            required: [frame_id, frame_name, role, suggested]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              can_leave: { type: boolean, description: False for frames the caller owns (transfer first). }
              suggested: { type: boolean, description: Checked by default (the frame gets this family's photos and the caller is not its owner). }
              direct_photos: { type: integer, description: The caller's own direct placements on that frame. }

    FormerPlaces:
      type: object
      required: [feeds, frames]
      properties:
        feeds:
          type: array
          items:
            type: object
            required: [feed_id, name, photos]
            properties:
              feed_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              photos: { type: integer }
              left_at: { type: [string, 'null'], format: date-time }
        frames:
          type: array
          items:
            type: object
            required: [frame_id, name, photos]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              photos: { type: integer }
              left_at: { type: [string, 'null'], format: date-time }

    PlacementTakenAway:
      type: object
      description: A placement taken away by its sender (README §5.21). It is off the frame and listed in the trash under "Taken away by …".
      required: [taking_id, by_name, at, until]
      properties:
        taking_id: { $ref: '#/components/schemas/Id' }
        by_user_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: Null for deleted accounts. }
        by_name: { type: string }
        at: { type: string, format: date-time }
        until: { type: string, format: date-time }
        keep_request_status: { oneOf: [ { $ref: '#/components/schemas/KeepRequestStatus' }, { type: 'null' } ] }

    TakenAwayGroup:
      type: object
      description: One taking as a frame's or family's managers see it.
      required: [taking_id, by_name, taken_at, until, count, can_ask]
      properties:
        taking_id: { $ref: '#/components/schemas/Id' }
        by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        by_name: { type: string }
        taken_at: { type: string, format: date-time }
        until: { type: string, format: date-time }
        count: { type: integer, description: Items still taken away in this scope. }
        preview_thumb_urls:
          type: array
          maxItems: 6
          description: Short-lived signed thumbnails of the first few.
          items: { type: string, format: uri }
        keep_request: { oneOf: [ { $ref: '#/components/schemas/KeepRequest' }, { type: 'null' } ] }
        can_ask: { type: boolean, description: The caller may ask to keep now. }
        cannot_ask_reason:
          oneOf:
            - { type: string, enum: [blocked, already_asked, expired, account_deleted, not_allowed] }
            - { type: 'null' }
          description: '`blocked`: show "Tom doesn''t accept requests".'

    TakenAwayGroupList:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: '#/components/schemas/TakenAwayGroup' } }

    KeepRequestStatus:
      type: string
      description: '`open` until answered or the 30 days end; `allowed` (all), `partly_allowed` (some), `declined`, `expired`.'
      enum: [open, allowed, partly_allowed, declined, expired]

    KeepRequestCreate:
      type: object
      required: [taking_id]
      properties:
        taking_id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        feed_id: { $ref: '#/components/schemas/Id' }
        item_ids:
          type: array
          minItems: 1
          maxItems: 2000
          description: The photos to ask for; absent means every item of the taking in this scope.
          items: { $ref: '#/components/schemas/Id' }
        note: { type: string, maxLength: 300, description: Optional words for the person ("The ones with the children, for Oma"). }

    KeepRequestAnswer:
      type: object
      required: [allow]
      properties:
        allow: { type: string, enum: [all, some, none] }
        item_ids:
          type: array
          minItems: 1
          maxItems: 2000
          description: '`some` only: the allowed items (a subset of the request''s).'
          items: { $ref: '#/components/schemas/Id' }

    KeepRequest:
      type: object
      required: [id, status, scope, taking_id, asked_by_name, asked_at, expires_at, item_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/KeepRequestStatus' }
        scope: { type: string, enum: [frame, feed] }
        frame_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        frame_name: { type: [string, 'null'] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        feed_name: { type: [string, 'null'] }
        taking_id: { $ref: '#/components/schemas/Id' }
        person: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ], description: The person asked (who took the photos away). }
        asked_by: { oneOf: [ { $ref: '#/components/schemas/PersonRef' }, { type: 'null' } ] }
        asked_by_name: { type: string }
        note: { type: [string, 'null'] }
        asked_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        item_count: { type: integer, description: Items asked for. }
        allowed_count: { type: integer }
        items:
          type: array
          description: '`getKeepRequest` only: the items asked for, with `allowed` once answered.'
          items:
            type: object
            required: [item]
            properties:
              item: { $ref: '#/components/schemas/Item' }
              allowed: { type: [boolean, 'null'] }

    KeepRequestList:
      type: object
      required: [requests]
      properties:
        requests: { type: array, items: { $ref: '#/components/schemas/KeepRequest' } }

    AccountDeletion:
      type: object
      properties:
        photos:
          type: string
          enum: [take, leave]
          default: take
          description: |
            `take` (default): every photo leaves every frame and family with the 30-day notice. `leave`: each photo
            still in a family or on a frame is handed over to that family's or frame's owner and stays credited
            "<name> (former member)" (README §5.21 "Account deletion").

    MemoryPreferences:
      type: object
      required: [hidden_people, hidden_memories]
      properties:
        hidden_people:
          type: array
          description: People left out of the caller's memories.
          items: { $ref: '#/components/schemas/PersonRef' }
        hidden_memories:
          type: array
          description: Posts (feed or frame posts) never shown again as a memory.
          items: { $ref: '#/components/schemas/Id' }

    MemoryPreferencesUpdate:
      type: object
      properties:
        hidden_people: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Id' } }
        hidden_memories: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/Id' } }

    OperatorOwnerTransfer:
      type: object
      required: [user_id, reason]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        reason: { type: string, minLength: 1, maxLength: 500, description: Kept in the ownership log; not shown to the people. }
        remove_previous: { type: boolean, default: false, description: Remove the previous owner instead of making them admin. }

    OperatorScopeMember:
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        role: { type: string, description: 'Frame role (`Role`) or family role (`FeedRole`).' }

    OperatorScope:
      type: object
      required: [kind, id, name, members]
      properties:
        kind: { type: string, enum: [frame, feed] }
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        created_at: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/OperatorScopeMember' } }

    OperatorOwnershipMatches:
      type: object
      required: [frames, feeds]
      properties:
        frames: { type: array, items: { $ref: '#/components/schemas/OperatorScope' } }
        feeds: { type: array, items: { $ref: '#/components/schemas/OperatorScope' } }

    OwnershipLogEntry:
      type: object
      required: [id, kind, at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [operator_transfer, account_handover] }
        at: { type: string, format: date-time }
        scope_kind: { oneOf: [ { type: string, enum: [frame, feed] }, { type: 'null' } ] }
        scope_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        scope_name: { type: [string, 'null'] }
        from_name: { type: [string, 'null'], description: 'Previous owner; for handovers the deleted account''s name.' }
        to_name: { type: [string, 'null'] }
        operator_name: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        removed_previous: { type: [boolean, 'null'] }
        item_count: { type: [integer, 'null'], description: Handovers only. }

    OwnershipLogPage:
      type: object
      required: [entries, next_cursor]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/OwnershipLogEntry' } }
        next_cursor: { type: [string, 'null'] }

    KeepRequestEvent:
      type: object
      description: '`keep_request.updated`: a keep request was made, answered or expired (the person asked and the scope''s managers).'
      required: [type, request]
      properties:
        type: { type: string, enum: [keep_request.updated] }
        request: { $ref: '#/components/schemas/KeepRequest' }

    PlacementUpdatedEvent:
      type: object
      description: '`placement.updated`: placements were taken away or came back (the frame''s library viewers and the sender).'
      required: [type, frame_id, placement_ids, reason]
      properties:
        type: { type: string, enum: [placement.updated] }
        frame_id: { $ref: '#/components/schemas/Id' }
        placement_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        reason: { type: string, enum: [taken_away, restored, purged] }
        taking_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }

    RemoteSubscriptionEvent:
      type: object
      description: '`remote_subscription.updated`: a frame''s follow of a family on another server changed status, synced or failed (the frame''s managers; README §5.22).'
      required: [type, frame_id, remote_subscription]
      properties:
        type: { type: string, enum: [remote_subscription.updated] }
        frame_id: { $ref: '#/components/schemas/Id' }
        remote_subscription: { $ref: '#/components/schemas/RemoteSubscription' }

    LeavingPushKey:
      type: string
      description: |
        Push `key`s added by leaving (README §6.3). `photos_taken_away`: frame owner/admins and family owner/admins
        (`ids`: `taking_id`, `frame_id` or `feed_id`). `keep_request`: the person asked (`request_id`).
        `keep_answered`: the asker (`request_id`). `ownership_changed`: the old and the new owner (`frame_id` or
        `feed_id`).
      enum: [photos_taken_away, keep_request, keep_answered, ownership_changed]

    # ---------------------------------------------------------------- multi-server (docs/spec/multi-server.md, README §5.22)
    FederationInfo:
      type: object
      description: The server's federation identity in `/.well-known/kinframe` (README §5.22).
      required: [enabled]
      properties:
        enabled: { type: boolean, description: 'False when the operator turned federation off (`KINFRAME_FEDERATION=off`); the rest is then absent.' }
        key_id: { type: string, description: The `keyid` of the current signing key, used in `Signature-Input`. }
        public_key: { type: string, description: The current Ed25519 public key, 32 bytes, base64url without padding. }
        keys:
          type: array
          description: Every key a signature may use, the current one first; a rotated key stays here for 7 days.
          items:
            type: object
            required: [key_id, public_key]
            properties:
              key_id: { type: string }
              public_key: { type: string }
              expires_at: { type: [string, 'null'], format: date-time }
        endpoints:
          type: object
          properties:
            subscriptions: { type: string, format: uri, examples: ['https://kinframe.janssens.be/federation/v1/subscriptions'] }
            ping: { type: string, format: uri }

    RemoteServer:
      type: object
      description: Another kinframe server as this one knows it.
      required: [server_url, server_name]
      properties:
        server_id: { type: [string, 'null'], description: Its stable `server_id` (from its well-known document). }
        server_name: { type: string, examples: [Janssens] }
        server_url: { type: string, format: uri, description: Its base URL. }
        host: { type: string, examples: [kinframe.janssens.be] }
        last_contact_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        subscribers: { type: integer, description: 'Operator listing: frames there following families here.' }
        follows: { type: integer, description: 'Operator listing: frames here following families there.' }
        blocked: { type: boolean }

    RemoteInviteRef:
      type: object
      required: [invite_url]
      properties:
        invite_url: { type: string, format: uri, maxLength: 2000, examples: ['https://kinframe.janssens.be/fi/9cQ2xV0kFq7Lm3Zt8bW1rA'] }

    RemoteInvitePreview:
      type: object
      required: [server, feed_name, this_server_name]
      properties:
        server: { $ref: '#/components/schemas/RemoteServer' }
        feed_name: { type: string }
        cover_url: { type: [string, 'null'], format: uri, description: 'A signed thumbnail on A, valid for an hour.' }
        frame_count: { type: integer, description: Frames that follow the family (local and remote). }
        requires_approval: { type: boolean, description: The family's admins must approve first. }
        this_server_name: { type: string, description: This server's name, for "Photos from this family will be copied to this server (…)". }
        this_server_host: { type: string }

    RemoteOnEnd:
      type: string
      description: 'When the subscription ends: `remove` the copied photos from the frame (default) or `keep` the ones already there.'
      enum: [remove, keep]
      default: remove

    RemoteEndReason:
      type: string
      enum: [unsubscribed, removed_by_feed, feed_deleted, server_blocked, withdrawn, rejected]

    RemoteSubscriptionCreate:
      type: object
      required: [invite_url]
      properties:
        invite_url: { type: string, format: uri, maxLength: 2000 }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: integer, minimum: 1, maximum: 1000, description: 'Required with `history: last_n`.' }
        birthdays: { type: boolean, default: true }
        on_end: { $ref: '#/components/schemas/RemoteOnEnd' }

    RemoteSubscriptionUpdate:
      type: object
      properties:
        on_end: { $ref: '#/components/schemas/RemoteOnEnd' }
        birthdays: { type: boolean }

    RemoteSubscription:
      type: object
      description: A frame on this server following a family on another server (B's side).
      required: [id, frame_id, status, feed_name, server, history, on_end, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        status:
          type: string
          description: '`pending` (A''s admins decide), `active`, `rejected`, `removed` (see `removed_reason`), or `error` (A unreachable or refusing for 3 days; retried).'
          enum: [pending, active, rejected, removed, error]
        feed_name: { type: string }
        cover_url: { type: [string, 'null'], format: uri }
        server: { $ref: '#/components/schemas/RemoteServer' }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: [integer, 'null'] }
        birthdays: { type: boolean }
        on_end: { $ref: '#/components/schemas/RemoteOnEnd' }
        item_count: { type: integer, description: Photos copied to this server and on the frame. }
        requested_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        removed_reason: { oneOf: [ { $ref: '#/components/schemas/RemoteEndReason' }, { type: 'null' } ] }
        last_sync_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        backfill:
          type: object
          properties:
            state: { type: string, enum: [idle, running] }
            placed: { type: integer }
            total: { type: integer }

    SubscriptionRemote:
      type: object
      description: '`Subscription.remote`: the subscriber is a frame on another server (A''s side).'
      required: [server_name, server_url]
      properties:
        server_id: { type: [string, 'null'] }
        server_name: { type: string }
        server_url: { type: string, format: uri }
        host: { type: string }
        requested_by_name: { type: [string, 'null'], description: 'The frame manager on that server, as it reported.' }
        show_comments: { type: boolean, description: The remote frame shows comment cards (it then receives comment summaries). }

    PlacementRemote:
      type: object
      description: '`Placement.origin_remote`: the placement is a copy of a post of a family on another server (B''s side).'
      required: [remote_subscription_id, server_name, server_url, feed_name]
      properties:
        remote_subscription_id: { $ref: '#/components/schemas/Id' }
        server_name: { type: string }
        server_url: { type: string, format: uri }
        feed_name: { type: string }
        sender_name: { type: string, description: 'The poster''s display name on A ("Lies").' }

    ItemRemoteSender:
      type: object
      description: '`Item.remote_sender`: copied from another server; `sender_id` is then the remote sender record''s id.'
      required: [name, server_name, server_url]
      properties:
        name: { type: string }
        server_name: { type: string }
        server_url: { type: string, format: uri }

    BlockedServerCreate:
      type: object
      description: '`host` (e.g. `kinframe.example.org`) or a base URL in `server_url`.'
      properties:
        host: { type: string, maxLength: 253 }
        server_url: { type: string, format: uri, maxLength: 2000 }
        reason: { type: string, maxLength: 300 }

    BlockedServer:
      type: object
      required: [id, host, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        host: { type: string }
        server_name: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        feed_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: Null for instance-wide blocks. }
        created_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    FederationSubscribeRequest:
      type: object
      required: [invite_token, frame]
      properties:
        invite_token: { type: string, minLength: 22, maxLength: 64, description: The token of the `/fi/<token>` invite URL. }
        preview: { type: boolean, default: false, description: Check and describe only; record nothing. }
        frame:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string, maxLength: 80 }
            show_comments: { type: boolean, default: false }
        follow_id: { $ref: '#/components/schemas/Id' }
        history: { $ref: '#/components/schemas/SubscriptionHistory' }
        history_count: { type: integer, minimum: 1, maximum: 1000 }
        birthdays: { type: boolean, default: true }
        requested_by_name: { type: string, maxLength: 80, description: The frame manager on B, shown to A's admins. }

    FederationSubscription:
      type: object
      required: [status, feed]
      properties:
        subscription_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: A's id; null for a preview. }
        status: { type: string, enum: [preview, pending, active, rejected, removed] }
        feed:
          type: object
          required: [name]
          properties:
            name: { type: string }
            cover_url: { type: [string, 'null'], format: uri }
            frame_count: { type: integer }
        requires_approval: { type: boolean }
        server_name: { type: string }

    FederationItem:
      type: object
      required: [id, kind, master_url, master_url_expires_at, bytes, mime]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        caption: { type: [string, 'null'] }
        captured_at: { type: [string, 'null'], format: date-time }
        focal_point: { $ref: '#/components/schemas/FocalPoint' }
        fit: { $ref: '#/components/schemas/Fit' }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        has_audio: { type: [boolean, 'null'] }
        bytes: { type: integer }
        sha256: { type: string, description: Of the master, hex. }
        mime: { type: string, examples: [image/webp, video/mp4] }
        master_url: { type: string, format: uri, description: Signed, valid for 1 hour; no signature needed to fetch it. }
        master_url_expires_at: { type: string, format: date-time }
        motion_url: { type: [string, 'null'], format: uri, description: 'Live items: the motion clip''s master, signed like `master_url`.' }

    FederationPost:
      type: object
      required: [id, poster_key, poster_name, created_at, items]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        poster_key: { type: string, description: Stable opaque key of the poster within this subscription (not the user id). }
        poster_name: { type: string }
        created_at: { type: string, format: date-time }
        backfill: { type: boolean, description: History (activation or a history change); B places it quietly. }
        items: { type: array, items: { $ref: '#/components/schemas/FederationItem' } }

    FederationComment:
      type: object
      required: [first_name, at]
      properties:
        first_name: { type: string }
        text: { type: string, maxLength: 200 }
        at: { type: string, format: date-time }

    FederationBirthday:
      type: object
      required: [id, name, month, day]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: [integer, 'null'], description: Only with the person's *show age*. }

    FederationChange:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            `post.upsert`: a post (new, backfilled, or back after a keep request); B places its items. `post.remove`:
            the post is gone (unsend, admin removal, taking away, circle change). `items.remove`: some items of a post
            are gone. `birthdays`: the family's birthday people now (replace). `comments`: the newest comments of a
            post (only with *show comments*; replace). `subscription`: the subscription's status changed.
          enum: [post.upsert, post.remove, items.remove, birthdays, comments, subscription]
        post: { $ref: '#/components/schemas/FederationPost' }
        post_id: { $ref: '#/components/schemas/Id' }
        item_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        birthdays: { type: array, items: { $ref: '#/components/schemas/FederationBirthday' } }
        comments: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/FederationComment' } }
        status: { type: string, enum: [pending, active, rejected, removed] }
        reason: { $ref: '#/components/schemas/RemoteEndReason' }

    FederationChangePage:
      type: object
      required: [changes, cursor, more, status]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/FederationChange' } }
        cursor: { type: string, description: Pass it as `cursor` on the next call; store it only after the page was applied. }
        more: { type: boolean, description: More changes are waiting; pull again at once. }
        reset: { type: boolean, default: false, description: 'The given cursor was too old: this page restarts from a full snapshot (B drops what isn''t in it).' }
        status: { type: string, enum: [pending, active, rejected, removed] }
        feed_name: { type: string, description: The family's current name (credit "Lies · Janssens"). }

    FederationActivity:
      type: object
      properties:
        frame:
          type: object
          properties:
            name: { type: string, maxLength: 80 }
            show_comments: { type: boolean }
        events:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, kind, post_id, item_id, at]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              kind: { type: string, enum: [reaction, reply, seen] }
              post_id: { $ref: '#/components/schemas/Id' }
              item_id: { $ref: '#/components/schemas/Id' }
              reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ], description: '`reaction`: null clears it.' }
              reply: { $ref: '#/components/schemas/ReplyPreset' }
              at: { type: string, format: date-time }

    FederationPing:
      type: object
      required: [subscription_ids]
      properties:
        subscription_ids: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/Id' } }
