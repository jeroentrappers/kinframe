openapi: 3.1.0
info:
  title: kinframe API
  version: 1.0.0-draft
  summary: Family photo frames, self-hosted.
  description: |
    Machine-readable contract for the kinframe server. Concepts, flows, websockets,
    tus uploads and the change feed are described in docs/api/README.md.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://kinframe.appmire.be
    description: Default hosted server
  - url: http://localhost:8110
    description: Local development

security:
  - userAuth: []

tags:
  - name: discovery
  - name: me
  - name: frames
  - name: members
  - name: invites
  - name: sends
  - name: library
  - name: albums
  - name: settings
  - name: tv
    description: Show a frame's library on a TV (Google Cast, Presentation API or a full-screen TV page).
  - name: weather
    description: Place search and weather. Data by Open-Meteo.com (CC BY 4.0), fetched and cached by the server.
  - name: calendar
    description: Calendars synced by the server (ICS/webcal, CalDAV), events sent to frames, and countdowns.
  - name: devices
    description: Frame enrollment and token exchange (unauthenticated or secret-based).
  - name: device
    description: Endpoints called by the frame itself (device token).
  - name: frame-app
    description: Public frame app releases, for installing kinframe on a frame (the website's convert tool).
  - name: shop
    description: Pre-order reservations for frames sold by the server operator (only when configured).
  - name: operator
  - name: dev
    description: Development-only helpers; absent in production.

paths:
  /.well-known/kinframe:
    get:
      tags: [discovery]
      operationId: getDiscovery
      security: []
      responses:
        '200':
          description: Server discovery document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }

  /dev/token:
    post:
      tags: [dev]
      operationId: devToken
      security: []
      description: |
        Development servers only (discovery `dev_auth: true`); 404 otherwise. Issues a user access token signed by the
        server itself so web and app development works without Logto. The server refuses to start with dev auth
        enabled when KINFRAME_ENV=production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- me
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 40 }
                share_location_names: { type: boolean }
                locale: { type: string, examples: [nl-BE] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [me]
      operationId: deleteMe
      description: Deletes the kinframe user. The Logto account is deleted separately via Logto's account API.
      parameters:
        - name: remove_items
          in: query
          required: true
          description: Also remove everything this user sent from all frames.
          schema: { type: boolean }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/avatar:
    put:
      tags: [me]
      operationId: putAvatar
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
          image/png: { schema: { type: string, contentMediaType: image/png } }
          image/webp: { schema: { type: string, contentMediaType: image/webp } }
      responses:
        '200': { description: Stored (server crops to 256x256), content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [me]
      operationId: deleteAvatar
      responses:
        '204': { description: Removed }

  /v1/me/push-endpoints:
    get:
      tags: [me]
      operationId: listPushEndpoints
      responses:
        '200':
          description: Registered endpoints
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PushEndpoint' } }
    post:
      tags: [me]
      operationId: registerPushEndpoint
      description: Idempotent on (kind, endpoint).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PushEndpointCreate' } } }
      responses:
        '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/PushEndpoint' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/me/push-endpoints/{endpointId}:
    delete:
      tags: [me]
      operationId: deletePushEndpoint
      parameters: [ { $ref: '#/components/parameters/EndpointId' } ]
      responses:
        '204': { description: Removed }

  # ---------------------------------------------------------------- frames
  /v1/frames:
    get:
      tags: [frames]
      operationId: listMyFrames
      description: Frames the caller is a member of (any role).
      responses:
        '200':
          description: Frames
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FrameSummary' } }

  /v1/frames/redeem:
    post:
      tags: [frames]
      operationId: redeemFrameCode
      description: Claim an unowned frame or join an owned one with the code shown on the frame. See README §5.1.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200':
          description: Result
          content: { application/json: { schema: { $ref: '#/components/schemas/RedeemResult' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [frames]
      operationId: getFrame
      responses:
        '200': { description: Frame, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [frames]
      operationId: updateFrame
      description: Owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                location: { type: string, maxLength: 40 }
                default_permissions: { $ref: '#/components/schemas/Permissions' }
                approve_joins_on_frame: { type: boolean }
                invite_requires_approval: { type: boolean }
                moderation: { type: boolean, description: New placements need approval by owner/admin before showing. }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [frames]
      operationId: removeFrame
      description: Owner only. Revokes the device credential and deletes all placements on this frame.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/leave:
    post:
      tags: [frames]
      operationId: leaveFrame
      description: Remove your own membership. The owner must transfer ownership first.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remove_my_items: { type: boolean, default: false }
      responses:
        '204': { description: Left }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/transfer:
    post:
      tags: [frames]
      operationId: transferOwnership
      description: Owner only. The previous owner becomes admin.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Transferred }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/replace-device:
    post:
      tags: [frames]
      operationId: replaceDevice
      description: |
        Owner only. "Move to new frame": attach a freshly enrolled, unclaimed device (identified by the code it shows)
        to this frame. The old device credential is revoked; the new device syncs everything.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        '200': { description: Replaced, content: { application/json: { schema: { $ref: '#/components/schemas/Frame' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/health:
    get:
      tags: [frames]
      operationId: getFrameHealth
      description: Owner, admin, or members with change_settings.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Latest heartbeat and connectivity, content: { application/json: { schema: { $ref: '#/components/schemas/FrameHealth' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/commands:
    post:
      tags: [frames]
      operationId: sendFrameCommand
      description: Delivered over the device websocket only; never queued.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FrameCommand' } } }
      responses:
        '200': { description: Executed by the frame, content: { application/json: { schema: { $ref: '#/components/schemas/CommandResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '504': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- members
  /v1/frames/{frameId}/members:
    get:
      tags: [members]
      operationId: listMembers
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200':
          description: Members
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } }

  /v1/frames/{frameId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [members]
      operationId: updateMember
      description: Owner or admin. Admins cannot change the owner or other admins' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, member] }
                permissions: { $ref: '#/components/schemas/Permissions' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [members]
      operationId: removeMember
      parameters:
        - name: remove_items
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/join-requests:
    get:
      tags: [members]
      operationId: listJoinRequests
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200':
          description: Pending requests
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } }

  /v1/frames/{frameId}/join-requests/{requestId}/{decision}:
    post:
      tags: [members]
      operationId: decideJoinRequest
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, deny] } }
      responses:
        '204': { description: Decided }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- invites
  /v1/frames/{frameId}/invites:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [invites]
      operationId: listInvites
      responses:
        '200':
          description: Active invites created by the caller (owner/admin see all)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } }
    post:
      tags: [invites]
      operationId: createInvite
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_uses: { type: [integer, 'null'], minimum: 1, description: null = unlimited }
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                note: { type: string, maxLength: 80, description: Shown to the owner when approving. }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/invites/{inviteId}:
    delete:
      tags: [invites]
      operationId: revokeInvite
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: inviteId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Revoked }

  /v1/invites/{token}:
    get:
      tags: [invites]
      operationId: previewInvite
      description: Requires sign-in so invite tokens can't be enumerated anonymously.
      parameters: [ { $ref: '#/components/parameters/InviteToken' } ]
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/InvitePreview' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /v1/invites/{token}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      parameters: [ { $ref: '#/components/parameters/InviteToken' } ]
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/RedeemResult' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- sends
  /v1/uploads:
    post:
      tags: [sends]
      operationId: tusCreateUpload
      description: |
        tus 1.0 creation endpoint (also HEAD/PATCH/DELETE on /v1/uploads/{uploadId}). See README §5.3.
        Upload-Metadata keys: filename, filetype, sha256 (optional), prepared (optional: `photo-master-v1` or
        `video-master-v1` when the client already produced a master; the server verifies it, see README §5.3
        "Prepared uploads").
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, const: 1.0.0 } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer } }
        - { name: Upload-Metadata, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created; Location header holds the upload URL. If sha256 matches an existing item of the caller, `Kinframe-Existing-Item` header carries its id and the client may skip uploading.
        '413': { $ref: '#/components/responses/Problem' }

  /v1/sends:
    get:
      tags: [sends]
      operationId: listMySends
      description: The caller's sent history across all devices, newest first.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: state
          in: query
          schema: { type: string, enum: [ongoing, delivered, all], default: all }
      responses:
        '200':
          description: Page of sends
          content:
            application/json:
              schema:
                type: object
                required: [sends, next_cursor]
                properties:
                  sends: { type: array, items: { $ref: '#/components/schemas/Send' } }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [sends]
      operationId: createSend
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendCreate' } } }
      responses:
        '202': { description: Accepted; processing, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/sends/{sendId}:
    parameters: [ { name: sendId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [sends]
      operationId: getSend
      responses:
        '200': { description: Send with per-frame placement status, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [sends]
      operationId: unsend
      description: Removes all placements of this send from all frames (sender only). Never needs a frame to be online.
      responses:
        '204': { description: Unsent }

  /v1/sends/{sendId}/forward:
    post:
      tags: [sends]
      operationId: forwardSend
      description: |
        Place the same items on additional frames. Uses the same path as `sharePlacements`: no new upload or master,
        renditions only for screen sizes that have none yet, and frames that already hold an item are skipped.
      parameters: [ { name: sendId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame_ids]
              properties:
                frame_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Id' } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Send' } } } }

  /v1/items/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    patch:
      tags: [sends]
      operationId: updateItem
      description: Sender, or a manager of every frame the item is on. Changes propagate to all placements and show "edited".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: [string, 'null'], maxLength: 280 }
                focal_point: { $ref: '#/components/schemas/FocalPoint' }
                fit: { $ref: '#/components/schemas/Fit' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/items/{itemId}/media/{variant}:
    get:
      tags: [sends]
      operationId: getItemMedia
      description: Thumbnails and the master rendition for app/web. Responds 302 to a short-lived signed URL (`/v1/media/signed/{token}`, HMAC + expiry, ~1 h) that needs no Authorization header and supports Range and ETag, so it works in <img>/<video> tags.
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - name: variant
          in: path
          required: true
          description: '`motion` is the master of a Live/Motion Photo clip (`item.kind: live`).'
          schema: { type: string, enum: [thumb_256, thumb_512, master, poster, motion] }
      responses:
        '302': { description: Redirect to signed media URL }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- library
  /v1/frames/{frameId}/placements:
    get:
      tags: [library]
      operationId: listPlacements
      description: Everything on the frame (needs see_library), or only the caller's own placements otherwise.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: visibility, in: query, schema: { type: string, enum: [visible, hidden, trashed, pending_moderation, all], default: visible } }
        - { name: sender_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - { name: album_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - name: on_this_day
          in: query
          description: |
            "On this day" memories: only placements whose capture date (`item.captured_at`, else the client hint) falls
            on this month and day (`MM-DD`, the client's local date) in an earlier year than the server's current year.
          schema: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }
        - { name: sort, in: query, schema: { type: string, enum: [received_desc, received_asc, taken_desc, taken_asc], default: received_desc } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [placements, next_cursor, counts]
                properties:
                  placements: { type: array, items: { $ref: '#/components/schemas/Placement' } }
                  next_cursor: { type: [string, 'null'] }
                  counts:
                    type: object
                    properties:
                      photos: { type: integer }
                      videos: { type: integer }
                      hidden: { type: integer }
                      trashed: { type: integer }

  /v1/frames/{frameId}/placements/{placementId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/PlacementId' }
    patch:
      tags: [library]
      operationId: updatePlacement
      description: Sender of the item, or manage_library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                trashed: { type: boolean, description: true moves to trash (30 days), false restores. }
                approved: { type: boolean, description: Moderation decision (owner/admin). }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [library]
      operationId: purgePlacement
      description: Permanent removal (skips trash).
      responses:
        '204': { description: Purged }

  /v1/frames/{frameId}/placements:bulk:
    post:
      tags: [library]
      operationId: bulkUpdatePlacements
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement_ids, action]
              properties:
                placement_ids: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Id' } }
                action: { type: string, enum: [hide, unhide, trash, restore, purge, add_to_album, remove_from_album] }
                album_id: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Per-id outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: array, items: { $ref: '#/components/schemas/Id' } }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        code: { $ref: '#/components/schemas/ProblemCode' }

  /v1/frames/{frameId}/placements:share:
    post:
      tags: [library]
      operationId: sharePlacements
      description: |
        Share photos and videos from this frame's library to other frames without uploading them again (README §5.3,
        "Sharing between frames"). Each new placement references the **same item**: no new upload, master or blob copy;
        a frame rendition is only made when the target's screen size has none yet.

        - Source: every placement must be live on `{frameId}` (not trashed or awaiting moderation), and the caller needs
          `see_library` there or be the item's sender (or the member who shared it there).
        - Targets: the caller needs `send` on every frame in `frame_ids`. The target's moderation applies
          (`pending_moderation` unless the caller manages that frame), and at most `limits.max_items_per_send`
          placements may be shared per request.
        - A target that already holds the item is skipped and reported in `skipped`.
        - New placements keep the item's original sender (who hears about reactions, and sees them in their history)
          and record `shared_by_user_id` / `shared_by_name` (the sharer, who gets the "delivered" push).
        - The original sender's unsend removes shared placements too. Owners and admins of a target manage them like any
          other placement; the sharer may hide, trash or purge the placements they created (that is how clients undo).
        - `dry_run: true` validates and reports `skipped` without creating anything, so pickers can show which frames
          already have the selection.
        - All-or-nothing validation; repeat-safe with `Idempotency-Key`.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement_ids, frame_ids]
              properties:
                placement_ids: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Id' } }
                frame_ids: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Created placements and skipped targets, content: { application/json: { schema: { $ref: '#/components/schemas/ShareResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- albums
  /v1/frames/{frameId}/albums:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [albums]
      operationId: listAlbums
      responses:
        '200':
          description: Albums
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Album' } } } }
    post:
      tags: [albums]
      operationId: createAlbum
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlbumWrite' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Album' } } } }

  /v1/frames/{frameId}/albums/{albumId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { name: albumId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [albums]
      operationId: updateAlbum
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlbumWrite' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Album' } } } }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [albums]
      operationId: deleteAlbum
      description: Placements stay on the frame.
      responses:
        '204': { description: Deleted }

  # ---------------------------------------------------------------- settings
  # ---------------------------------------------------------------- tv
  /v1/frames/{frameId}/tv-links:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [tv]
      operationId: listTvLinks
      description: Active (unexpired, unrevoked) TV links. Owner/admin see all; others see the links they created.
      responses:
        '200':
          description: Active TV links
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TvLink' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tv]
      operationId: createTvLink
      description: |
        Creates a short-lived, revocable share token for a slideshow of this frame's library, used by the TV page
        (`/tv/{frameId}?t=<token>`) and by Cast senders. Needs `see_library`, unless every `placement_ids` entry is
        one of the caller's own placements (e.g. "Show on TV" from History).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TvLinkCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TvLink' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/tv-links/{linkId}:
    delete:
      tags: [tv]
      operationId: revokeTvLink
      description: Revoke a TV link (its creator, or owner/admin). TV pages using it stop at their next refresh.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { name: linkId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/tv/{token}:
    get:
      tags: [tv]
      operationId: getTvSlideshow
      security: []
      description: |
        No sign-in: the token is the credential. Returns the slides with absolute, signed media URLs (master
        rendition: WebP photos, H.264/AAC MP4 videos) that a TV or Chromecast can fetch without headers. The URLs
        expire after 1-2 h; refetch after `refresh_after`. `404 not_found` for unknown or revoked tokens,
        `410 link_expired` once the link has expired.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
      responses:
        '200': { description: Slideshow, content: { application/json: { schema: { $ref: '#/components/schemas/TvSlideshow' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/tv/{token}/mirror:
    get:
      tags: [tv]
      operationId: tvMirror
      security: []
      description: |
        WebSocket (README §6.4) for a `mirror` TV link: the TV follows the physical frame live. The server sends a
        `MirrorState` right away and on every change, and `{type: "ended", reason}` before closing when the link is
        revoked, expires or its creator loses `see_library`. At most 8 viewers per frame (`429 rate_limited`).
        `404 not_found` for unknown, revoked or non-mirror tokens, `410 link_expired` for expired ones.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
      responses:
        '101': { description: Switching to the websocket protocol }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/settings:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [settings]
      operationId: getFrameSettings
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
    patch:
      tags: [settings]
      operationId: updateFrameSettings
      description: JSON merge patch (RFC 7396) of FrameSettings. Requires If-Match.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/FrameSettingsPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
        '412': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/plugins:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [settings]
      operationId: getFramePlugins
      description: |
        The plugins the frame can run and how its instances are doing (needs change_settings): the form for each
        plugin comes from its manifest, the entity picker and "find on network" from what the frame discovered.
        The instances themselves are in the settings (`plugins.instances`).
      responses:
        '200': { description: Catalog and status, content: { application/json: { schema: { $ref: '#/components/schemas/FramePlugins' } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- weather
  /v1/geocode:
    get:
      tags: [weather]
      operationId: geocode
      description: |
        Place search for a frame's `settings.location`, proxied to the Open-Meteo geocoding API and cached by the
        server (clients never call third parties). Rate-limited per user (`429 rate_limited`). An empty list means
        no match. `502 upstream_unavailable` when the geocoding service cannot be reached, `503` when the server
        has weather disabled.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: lang, in: query, description: 'Language of place names (ISO 639-1), e.g. `nl`', schema: { type: string, pattern: '^[a-zA-Z]{2}$', default: en } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200':
          description: Matching places, best first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Place' } }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- calendar
  /v1/frames/{frameId}/calendars:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [calendar]
      operationId: listCalendars
      description: The frame's calendar sources with their sync status (needs change_settings). There is no limit on the number.
      responses:
        '200':
          description: Sources in display order; the local received-events calendar (if any) comes first.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [calendar]
      operationId: createCalendar
      description: |
        Add an ICS/webcal link or a CalDAV calendar (needs change_settings). The server syncs it right away; the
        result has `status: syncing`. The URL and credentials are encrypted at rest and never returned (only
        `url_hint`). `503 feature_disabled` when the server has calendars turned off. For a CalDAV account with
        several calendars, `calendar_url` picks one (from `testCalendar`); create one source per calendar.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars:test:
    post:
      tags: [calendar]
      operationId: testCalendar
      description: |
        Try a link or CalDAV account without saving it (needs change_settings; rate-limited). For CalDAV,
        `calendars` lists the calendars found on the account so the client can let the user pick one or more.
        `ok: false` with `status` and `error` when the calendar cannot be read.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceCreate' } } }
      responses:
        '200': { description: Outcome, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarTestResult' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars/{calendarId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/CalendarId' }
    patch:
      tags: [calendar]
      operationId: updateCalendar
      description: |
        Rename, recolour, enable/disable, or change the link or credentials (needs change_settings). Omitted fields
        are kept. Changing the URL or credentials syncs right away.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSourceUpdate' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [calendar]
      operationId: deleteCalendar
      description: |
        Remove a source and its events from the frame (needs change_settings). Removing the local received-events
        calendar deletes every accepted event; the calendar comes back with the next accepted invitation.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendars/{calendarId}/sync:
    post:
      tags: [calendar]
      operationId: syncCalendar
      description: 'Sync now (needs change_settings). Returns at once with `status: syncing`.'
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/CalendarId' }
      responses:
        '202': { description: Sync started, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarSource' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/calendar:
    get:
      tags: [calendar]
      operationId: getFrameCalendar
      description: |
        Read-only merged view of what the frame shows (needs change_settings): the payload of the frame's
        `calendar` change, plus the frame's weather (`null` when it has none) so clients can show the forecast per
        day.
      parameters: [ { $ref: '#/components/parameters/FrameId' } ]
      responses:
        '200': { description: Merged calendar, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarView' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/countdowns/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/FrameId' }
      - { $ref: '#/components/parameters/EventId' }
    put:
      tags: [calendar]
      operationId: setCountdown
      description: |
        Show a countdown to this event (an `id` from the merged calendar) on the frame (needs change_settings).
        Idempotent. Any number can be marked; the frame shows the nearest three. `404` when the event is not in the
        frame's calendar.
      responses:
        '204': { description: Marked }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [calendar]
      operationId: clearCountdown
      responses:
        '204': { description: Unmarked }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events:
    parameters: [ { $ref: '#/components/parameters/FrameId' } ]
    get:
      tags: [calendar]
      operationId: listEventInvitations
      description: Events sent to this frame, newest first. Senders see their own; owner and admin see all.
      responses:
        '200':
          description: Invitations
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventInvitation' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [calendar]
      operationId: sendEventToFrame
      description: |
        Send an event to the frame (needs `send`). It arrives as an invitation that the frame accepts or declines;
        accepted events go to the frame's local received-events calendar. The sender gets an
        `event_invitation.decided` websocket event (or a push). Accepted events cannot be changed remotely: send a
        new one instead. The optional photo is a finished tus upload (`photo_upload_id`, JPEG/PNG/WebP/HEIC).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventInvitationCreate' } } }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/EventInvitation' } } } }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events/{invitationId}:
    delete:
      tags: [calendar]
      operationId: withdrawEventInvitation
      description: The sender (or owner/admin) withdraws an invitation that is still pending; `409 already_decided` otherwise.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/InvitationId' }
      responses:
        '204': { description: Withdrawn }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/frames/{frameId}/events/{invitationId}/photo:
    get:
      tags: [calendar]
      operationId: getEventInvitationPhoto
      description: The invitation's photo (WebP), for its sender and owner/admin. `404` when it has none.
      parameters:
        - { $ref: '#/components/parameters/FrameId' }
        - { $ref: '#/components/parameters/InvitationId' }
      responses:
        '200': { description: Photo, content: { image/webp: { schema: { type: string, contentMediaType: image/webp } } } }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- devices (enrollment)
  /v1/devices/enroll:
    post:
      tags: [devices]
      operationId: enrollDevice
      security: []
      description: Called once by a fresh frame. Rate-limited per IP.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceEnroll' } } }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [device_id, device_secret]
                properties:
                  device_id: { $ref: '#/components/schemas/Id' }
                  device_secret: { type: string, description: 256-bit random, base64url. Shown only once. }
        '429': { $ref: '#/components/responses/Problem' }

  /v1/devices/token:
    post:
      tags: [devices]
      operationId: deviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, device_secret]
              properties:
                device_id: { $ref: '#/components/schemas/Id' }
                device_secret: { type: string }
      responses:
        '200':
          description: Short-lived device access token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, description: seconds }
        '401': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- device (frame-side)
  /v1/device/state:
    get:
      tags: [device]
      operationId: deviceGetState
      security: [ { deviceAuth: [] } ]
      description: Whether the frame is claimed, its identity and the latest change seq. Used after boot and on the setup screen.
      responses:
        '200': { description: State, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceState' } } } }

  /v1/device/code:
    post:
      tags: [device]
      operationId: deviceGetCode
      security: [ { deviceAuth: [] } ]
      description: Get (or re-get) the active frame code. Same code until it expires.
      responses:
        '200': { description: Code, content: { application/json: { schema: { $ref: '#/components/schemas/FrameCode' } } } }

  /v1/device/changes:
    get:
      tags: [device]
      operationId: deviceGetChanges
      security: [ { deviceAuth: [] } ]
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Ordered changes after `since`
          content:
            application/json:
              schema:
                type: object
                required: [changes, next_seq, has_more]
                properties:
                  changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
                  next_seq: { type: integer }
                  has_more: { type: boolean }

  /v1/device/media/{placementId}:
    get:
      tags: [device]
      operationId: deviceGetMedia
      security: [ { deviceAuth: [] } ]
      description: |
        The frame-sized rendition (or poster with ?variant=poster). For a Live/Motion Photo (`item.kind: live`),
        `display` is the still and `?variant=motion` the short frame-sized clip. Supports Range, ETag, If-None-Match.
      parameters:
        - { $ref: '#/components/parameters/PlacementId' }
        - { name: variant, in: query, schema: { type: string, enum: [display, poster, avatar, motion], default: display } }
      responses:
        '200': { description: Bytes }
        '206': { description: Partial bytes }
        '304': { description: Not modified }

  /v1/device/acks:
    post:
      tags: [device]
      operationId: deviceAck
      security: [ { deviceAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivered: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Id' } }
                seen:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [placement_id, at]
                    properties:
                      placement_id: { $ref: '#/components/schemas/Id' }
                      at: { type: string, format: date-time }
      responses:
        '204': { description: Recorded }

  /v1/device/heartbeat:
    post:
      tags: [device]
      operationId: deviceHeartbeat
      security: [ { deviceAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } }
      responses:
        '204': { description: Recorded }

  /v1/device/settings:
    patch:
      tags: [device]
      operationId: devicePatchSettings
      security: [ { deviceAuth: [] } ]
      description: Settings changed locally on the frame. Same semantics as updateFrameSettings.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/FrameSettingsPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FrameSettings' } } } }
        '412': { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/catalog:
    put:
      tags: [device]
      operationId: devicePutPluginCatalog
      security: [ { deviceAuth: [] } ]
      description: The plugins this frame can run, sent when the app starts and its catalog changed. Replaces the previous one.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginCatalog' } } }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/plugins/status:
    put:
      tags: [device]
      operationId: devicePutPluginStatus
      security: [ { deviceAuth: [] } ]
      description: Errors, discovered entities and services (at most every 10 s). Replaces the previous report.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginStatusReport' } } }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/placements/{placementId}:
    patch:
      tags: [device]
      operationId: devicePatchPlacement
      security: [ { deviceAuth: [] } ]
      description: Actions taken at the frame (hide/unhide, trash/restore, local fit/focal override).
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
                trashed: { type: boolean }
                fit: { $ref: '#/components/schemas/Fit' }
                focal_point: { $ref: '#/components/schemas/FocalPoint' }
                rotation: { type: integer, enum: [0, 90, 180, 270] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }

  /v1/device/placements/{placementId}/reaction:
    put:
      tags: [device]
      operationId: deviceSetReaction
      security: [ { deviceAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
      responses:
        '204': { description: Stored }

  /v1/device/placements/{placementId}/replies:
    post:
      tags: [device]
      operationId: deviceSendReply
      security: [ { deviceAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PlacementId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { $ref: '#/components/schemas/ReplyPreset' }
      responses:
        '204': { description: Sent }

  /v1/device/join-requests:
    get:
      tags: [device]
      operationId: deviceListJoinRequests
      security: [ { deviceAuth: [] } ]
      description: |
        Pending join requests that wait for a decision on the frame ("ask on the frame before someone new joins").
        The frame shows them until they are decided here or by an owner/admin in the app; it re-reads this list on
        connect and after syncing, so requests announced while it was offline are not lost.
      responses:
        '200':
          description: Oldest first
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } } } }

  /v1/device/join-requests/{requestId}:
    post:
      tags: [device]
      operationId: deviceDecideJoin
      security: [ { deviceAuth: [] } ]
      parameters: [ { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
      responses:
        '204': { description: Decided }

  /v1/device/members/{userId}:
    delete:
      tags: [device]
      operationId: deviceRemoveMember
      security: [ { deviceAuth: [] } ]
      description: Remove a member from the frame itself (allowed unless the owner disabled it in settings). Cannot remove the owner.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: remove_items, in: query, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/device/imports:
    post:
      tags: [device]
      operationId: deviceImport
      security: [ { deviceAuth: [] } ]
      description: |
        Upload a photo/video imported from SD/USB on the frame so it joins the library (sender = the frame).
        Body is the file; tus is not required for imports (frames upload one file at a time, ≤ 512 MiB). The file
        takes the same processing as any upload (renditions, location metadata stripped).
        The server hashes the body: if this frame already has a live placement of the same file (source, master or
        rendition sha256), nothing is created and the existing placement is returned with `200`.

        **Imports from another app's leftover data** (`source`, docs/spec/frameo-import.md): `source_key` makes the
        import idempotent per frame. If this frame imported that key before, the placement of that item is returned
        with `200`, even when it was removed since (`status: removed`), so a re-run never brings back what the family
        deleted. The item keeps `sender_name`, `received_at`, fit, focal point and hidden state from the old app, and
        the frame's owner owns the media.
      parameters:
        - { name: X-Filename, in: header, required: true, schema: { type: string } }
        - { name: X-Captured-At, in: header, schema: { type: string, format: date-time } }
        - name: caption
          in: query
          description: Caption to restore (e.g. from a kinframe export manifest).
          schema: { type: string, maxLength: 280 }
        - name: source
          in: query
          description: The app the file comes from. `source_key`, `sender_name` and `received_at` are ignored without it.
          schema: { $ref: '#/components/schemas/ItemOrigin' }
        - name: source_key
          in: query
          description: Stable id of the file in that app (for Frameo, its file name). Unique per frame and source.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: sender_name
          in: query
          description: The original sender's display name in that app.
          schema: { type: string, maxLength: 100 }
        - name: received_at
          in: query
          description: When the old app received the file; becomes the placement's `received_at` (not in the future).
          schema: { type: string, format: date-time }
        - name: fit
          in: query
          schema: { $ref: '#/components/schemas/Fit' }
        - name: focal_x
          in: query
          description: Focal point, as a fraction of the width (with `focal_y`).
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: focal_y
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: hidden
          in: query
          description: Import the placement hidden (it was hidden from the slideshow in the old app).
          schema: { type: boolean, default: false }
        - name: rotation
          in: query
          description: Extra clockwise rotation chosen on the frame in the old app.
          schema: { type: integer, enum: [0, 90, 180, 270], default: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, contentMediaType: application/octet-stream } }
      responses:
        '200': { description: Duplicate; the frame already has this file, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        '202': { description: Accepted; a placement.upsert change follows, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/imports/check:
    post:
      tags: [device]
      operationId: deviceImportCheck
      security: [ { deviceAuth: [] } ]
      description: |
        Which of these file hashes this frame already has (a live placement whose source, master or frame
        rendition sha256 matches), so an import from SD/USB can skip duplicates before uploading. With `source` and
        `source_keys`, also which of those keys this frame has imported before (removed items included, see
        `deviceImport`), so a resumed import only uploads what is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sha256:
                  type: array
                  maxItems: 500
                  items: { type: string, pattern: '^[0-9a-f]{64}$' }
                source: { $ref: '#/components/schemas/ItemOrigin' }
                source_keys:
                  type: array
                  maxItems: 500
                  items: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The known subset
          content:
            application/json:
              schema:
                type: object
                required: [known]
                properties:
                  known: { type: array, items: { type: string } }
                  known_source_keys: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/device/calendar/sync:
    post:
      tags: [device]
      operationId: deviceSyncCalendars
      security: [ { deviceAuth: [] } ]
      description: '"Sync now" on the frame: the server re-syncs all of the frame''s calendar sources. A `calendar` change follows when something changed.'
      responses:
        '202': { description: Sync started }

  /v1/device/countdowns/{eventId}:
    parameters: [ { $ref: '#/components/parameters/EventId' } ]
    put:
      tags: [device]
      operationId: deviceSetCountdown
      security: [ { deviceAuth: [] } ]
      description: The countdown toggle in the frame's event details. A `calendar` change follows.
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [device]
      operationId: deviceClearCountdown
      security: [ { deviceAuth: [] } ]
      responses:
        '204': { description: Unmarked }

  /v1/device/invitations:
    get:
      tags: [device]
      operationId: deviceListInvitations
      security: [ { deviceAuth: [] } ]
      description: |
        Event invitations waiting for a decision on the frame, oldest first. The frame re-reads this list on connect,
        after syncing and after an `event_invitation` websocket message, like join requests.
      responses:
        '200':
          description: Pending invitations
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EventInvitation' } } } }

  /v1/device/invitations/{invitationId}:
    post:
      tags: [device]
      operationId: deviceDecideInvitation
      security: [ { deviceAuth: [] } ]
      description: Accept or decline. Final; `409 already_decided` when it was decided or withdrawn before.
      parameters: [ { $ref: '#/components/parameters/InvitationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        '204': { description: Decided }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/device/invitations/{invitationId}/photo:
    get:
      tags: [device]
      operationId: deviceGetInvitationPhoto
      security: [ { deviceAuth: [] } ]
      description: The invitation's photo (WebP, long edge at most 1280 px). Supports ETag and If-None-Match.
      parameters: [ { $ref: '#/components/parameters/InvitationId' } ]
      responses:
        '200': { description: Photo, content: { image/webp: { schema: { type: string, contentMediaType: image/webp } } } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/device/update:
    get:
      tags: [device]
      operationId: deviceCheckUpdate
      security: [ { deviceAuth: [] } ]
      description: |
        Self-update check (README §5.7). Answers with the newest frame app release on the channel that is newer
        than the caller's version code (from `X-Kinframe-App`, else the code last reported by the device) and
        whose `min_sdk` the device meets; `204` when there is none. Allowed even when the app is below the
        server's minimum version (`426` is never returned here).
      parameters:
        - name: channel
          in: query
          description: Defaults to the frame's `updates.channel` setting (unclaimed frames use the channel from enrollment).
          schema: { type: string, enum: [stable, beta] }
        - name: skip
          in: query
          description: Version codes the frame refuses (rolled back earlier). The newest release not listed is returned.
          style: form
          explode: false
          schema: { type: array, maxItems: 50, items: { type: integer } }
        - name: X-Kinframe-App
          in: header
          description: '`kinframe-frame/<version name> (<version code>)`'
          schema: { type: string, examples: ['kinframe-frame/0.2.0 (20099)'] }
      responses:
        '200': { description: An update is available, content: { application/json: { schema: { $ref: '#/components/schemas/FrameUpdate' } } } }
        '204': { description: Up to date (or no release suits this device) }

  /v1/device/update/apk/{versionCode}:
    get:
      tags: [device]
      operationId: deviceGetUpdateApk
      security: [ { deviceAuth: [] } ]
      description: The mirrored APK. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
      parameters:
        - { name: versionCode, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: APK bytes, content: { application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } } } }
        '206': { description: Partial bytes }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/frame-app/latest:
    get:
      tags: [frame-app]
      operationId: getFrameAppLatest
      security: []
      description: |
        No sign-in. The newest stable frame app release this server mirrors (README §5.7), for the convert tool on
        the website (`/convert`), which installs kinframe on a frame over USB. `url` points at
        `/v1/frame-app/apk/{version_code}` on this server, so the browser needs no cross-origin download. `204` when
        the server mirrors no release (self-update disabled) or none suits `sdk`. Clients must still check the
        APK's signing certificate: this endpoint is a convenience, not a trust anchor.
      parameters:
        - name: sdk
          in: query
          description: The frame's Android API level; releases whose `min_sdk` is higher are skipped.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: The newest stable release, content: { application/json: { schema: { $ref: '#/components/schemas/FrameUpdate' } } } }
        '204': { description: No release available }

  /v1/frame-app/apk/{versionCode}:
    get:
      tags: [frame-app]
      operationId: getFrameAppApk
      security: []
      description: No sign-in. The mirrored APK, as `/v1/device/update/apk/{versionCode}`. Supports Range, If-Range, ETag (`"<sha256>"`) and If-None-Match.
      parameters:
        - { name: versionCode, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: APK bytes, content: { application/vnd.android.package-archive: { schema: { type: string, contentMediaType: application/vnd.android.package-archive } } } }
        '206': { description: Partial bytes }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- shop (README §5.11)
  /v1/shop/reservations:
    post:
      tags: [shop]
      operationId: createShopReservation
      security: []
      description: |
        Pre-order reservation for a frame sold by the server operator. No sign-in and no payment: the customer is
        emailed when stock is in. Only on servers with a shop (discovery `shop`); `404 not_found` otherwise.
        Prices and totals are recomputed by the server from its own configuration; the client never sends prices.
        Rate limited per IP (`429 rate_limited`). `website` is a honeypot that people never fill in: when it is
        not empty the server answers as usual but stores and sends nothing. Field errors (`422`) use these fields
        and codes: `email`/`format`, `country`/`enum`, `items`/`minItems`, `items.<i>.product_id`/`enum`,
        `items.<i>.quantity`/`maximum`, `consent`/`required`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservationCreate' } } }
      responses:
        '201': { description: Reserved, content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservationReceipt' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/shop/reservations/cancel:
    post:
      tags: [shop]
      operationId: cancelShopReservation
      security: []
      description: |
        Cancels a reservation with the signed token from the link in the confirmation email (the web page
        `/shop/cancel?token=…` asks for a confirmation and then calls this). Idempotent. `404 not_found` for an
        invalid token or a deleted reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 10, maxLength: 200 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string, examples: [KF-7Q3M] }
                  status: { $ref: '#/components/schemas/ShopReservationStatus' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- operator
  /v1/operator/stats:
    get:
      tags: [operator]
      operationId: operatorStats
      security: [ { userAuth: ['kinframe:operate'] } ]
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  frames: { type: integer }
                  frames_online: { type: integer }
                  items: { type: integer }
                  storage_bytes: { type: integer }
                  processing_queue: { type: integer }
                  media_pipeline:
                    type: object
                    description: |
                      How masters were made (README §5.3 "Prepared uploads"): `transcoded` by the full pipeline,
                      `prepared` (a client master verified and kept without re-encoding), `fallback` (a prepared
                      upload that did not conform and was transcoded). `reused_renditions` counts frame video
                      renditions served from the master's bytes instead of a transcode.
                    properties:
                      transcoded: { type: integer }
                      prepared: { type: integer }
                      fallback: { type: integer }
                      reused_renditions: { type: integer }

  /v1/operator/limits:
    get:
      tags: [operator]
      operationId: operatorGetLimits
      security: [ { userAuth: ['kinframe:operate'] } ]
      responses:
        '200': { description: Limits, content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } } }
    put:
      tags: [operator]
      operationId: operatorSetLimits
      security: [ { userAuth: ['kinframe:operate'] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Limits' } } } }

  /v1/operator/reservations:
    get:
      tags: [operator]
      operationId: operatorListReservations
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: Shop reservations, newest first. `404 not_found` when the server has no shop.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShopReservationStatus' } }
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations: { type: array, items: { $ref: '#/components/schemas/ShopReservation' } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/reservations.csv:
    get:
      tags: [operator]
      operationId: operatorExportReservations
      security: [ { userAuth: ['kinframe:operate'] } ]
      description: All reservations as CSV (UTF-8 with BOM, comma-separated), newest first; `status` filters.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShopReservationStatus' } }
      responses:
        '200': { description: CSV export, content: { text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/operator/reservations/{reservationId}:
    patch:
      tags: [operator]
      operationId: operatorUpdateReservation
      security: [ { userAuth: ['kinframe:operate'] } ]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/ShopReservationStatus' }
                internal_note: { type: [string, 'null'], maxLength: 2000, description: Only for the operator; never emailed. }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ShopReservation' } } } }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    userAuth:
      type: oauth2
      description: Logto access token for the API resource. The issuer comes from discovery.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.kinframe.appmire.be/oidc/auth
          tokenUrl: https://auth.kinframe.appmire.be/oidc/token
          scopes:
            kinframe:operate: Operator access
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device access token from /v1/devices/token.

  parameters:
    FrameId: { name: frameId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ItemId: { name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    PlacementId: { name: placementId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    CalendarId: { name: calendarId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EventId: { name: eventId, in: path, required: true, schema: { $ref: '#/components/schemas/CalendarEventId' } }
    EndpointId: { name: endpointId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InviteToken: { name: token, in: path, required: true, schema: { type: string, minLength: 22, maxLength: 64 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 64 } }
    IfMatch: { name: If-Match, in: header, required: true, description: 'Quoted version, e.g. "7"', schema: { type: string } }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Id:
      type: string
      format: uuid
      description: UUIDv7

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ProblemCode' }
        detail: { type: string }
        errors:
          type: array
          description: Field-level validation errors (422)
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }

    ProblemCode:
      type: string
      enum:
        - unauthorized
        - token_expired
        - device_revoked
        - forbidden
        - missing_permission
        - not_found
        - code_invalid
        - code_expired
        - invite_invalid
        - invite_expired
        - link_expired
        - already_member
        - validation_failed
        - too_many_items
        - video_too_long
        - upload_too_large
        - upload_not_found
        - unsupported_media
        - corrupt_media
        - version_conflict
        - frame_offline
        - command_timeout
        - owner_cannot_leave
        - rate_limited
        - app_update_required
        - upstream_unavailable
        - feature_disabled
        - already_decided
        - server_error

    Discovery:
      type: object
      required: [name, version, api, auth, limits]
      properties:
        name: { type: string }
        version: { type: string }
        api: { type: string, format: uri }
        web: { type: string, format: uri }
        auth:
          type: object
          required: [issuer, mobile_client_id, web_client_id, api_resource]
          properties:
            issuer: { type: string, format: uri }
            mobile_client_id: { type: string }
            desktop_client_id:
              type: string
              description: |
                Logto Native app of the Windows, macOS and Linux client. It signs in with a loopback redirect
                (`http://127.0.0.1:<port>/callback`, RFC 8252). Absent on servers bootstrapped before it existed.
            web_client_id: { type: string }
            api_resource: { type: string }
        limits: { $ref: '#/components/schemas/Limits' }
        dev_auth:
          type: boolean
          default: false
          description: True only on development servers running dev auth mode (POST /dev/token). Never true in production.
        weather:
          type: boolean
          default: false
          description: True when the server fetches weather for frames and serves `/v1/geocode`.
        calendar:
          type: boolean
          default: false
          description: True when the server syncs calendars for frames (ICS/webcal and CalDAV).
        webpush_public_key:
          type: [string, 'null']
          description: |
            VAPID application server public key (uncompressed P-256 point, base64url) for browser push
            subscriptions (`PushManager.subscribe({applicationServerKey})`). Null when the server has push disabled.
        shop:
          $ref: '#/components/schemas/Shop'

    Shop:
      type: object
      description: |
        Pre-order shop run by the server operator (README §5.11). Present only when the operator configured one
        (KINFRAME_SHOP_FILE). Prices include VAT. Localized texts are maps from a language code (see docs/i18n.md)
        to text; `en` is always present and is the fallback.
      required: [brand, currency, vat_percent, products, shipping, seller]
      properties:
        brand: { type: string, description: 'Consumer-facing brand name, e.g. in "Get a {brand}". Defaults to the server name.', examples: [kinframe] }
        currency: { type: string, description: ISO 4217, examples: [EUR] }
        vat_percent: { type: number, description: VAT included in all prices, examples: [21] }
        products: { type: array, items: { $ref: '#/components/schemas/ShopProduct' } }
        shipping: { $ref: '#/components/schemas/ShopShipping' }
        estimated_delivery: { $ref: '#/components/schemas/LocalizedText' }
        domains:
          type: array
          items: { type: string }
          description: |
            Storefront host names (no scheme or port). On these hosts the web app is the brand's shop: landing page,
            `/shop` and `/shop/cancel`, calling the API on its own origin; every other path goes to `web`, where
            sign-in and the family app live. Absent when the operator configured none.
          examples: [[shop.example.org]]
        default_locale:
          type: string
          description: |
            Storefront language for visitors whose browser prefers none of `en`, `nl`, `fr`, `de` (the languages
            the shop emails in). Defaults to `en`.
          examples: [nl]
        seller:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            legal: { type: string, description: 'Legal line for the footer, e.g. company, address and VAT number.' }
            privacy_url: { type: string, format: uri }

    LocalizedText:
      type: object
      description: Language code → text; `en` is the fallback.
      additionalProperties: { type: string }

    ShopProduct:
      type: object
      required: [id, name, price_cents, max_qty]
      properties:
        id: { type: string, examples: [frame-10] }
        name: { type: string, examples: ['kinframe 10.1"'] }
        size: { type: string, description: Screen size label, examples: ['10.1"'] }
        price_cents: { type: integer, description: Unit price incl. VAT, in cents }
        max_qty: { type: integer, minimum: 1 }
        image: { type: string, description: 'Illustration key: frame-10 or frame-15', examples: [frame-10] }
        specs:
          type: object
          description: Language code → short spec bullets; `en` is the fallback.
          additionalProperties: { type: array, items: { type: string } }

    ShopShipping:
      type: object
      required: [countries, flat_cents]
      properties:
        countries: { type: array, items: { type: string, description: ISO 3166-1 alpha-2 }, examples: [[BE, NL]] }
        flat_cents: { type: integer, description: Shipping cost per order incl. VAT }
        free_from_cents: { type: [integer, 'null'], description: Item subtotal from which shipping is free; null = never }

    ShopReservationStatus:
      type: string
      enum: [new, contacted, confirmed, cancelled]

    ShopReservationCreate:
      type: object
      required: [name, email, country, items, consent]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        country: { type: string, minLength: 2, maxLength: 2, examples: [BE] }
        postal_code: { type: string, maxLength: 12 }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: string, maxLength: 64 }
              quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: string, maxLength: 1000 }
        locale: { type: string, maxLength: 35, description: Language for the emails (falls back to English), examples: [nl] }
        consent: { type: boolean, description: Must be true. The customer agrees to be contacted about this reservation. }
        website: { type: string, maxLength: 200, description: Honeypot; leave empty. }

    ShopLine:
      type: object
      required: [product_id, name, quantity, unit_cents, line_cents]
      properties:
        product_id: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_cents: { type: integer }
        line_cents: { type: integer }

    ShopReservationReceipt:
      type: object
      required: [reference, status, email, items, subtotal_cents, shipping_cents, total_cents, currency]
      properties:
        reference: { type: string, examples: [KF-7Q3M] }
        status: { $ref: '#/components/schemas/ShopReservationStatus' }
        email: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ShopLine' } }
        subtotal_cents: { type: integer }
        shipping_cents: { type: integer }
        total_cents: { type: integer }
        currency: { type: string }

    ShopReservation:
      type: object
      required: [id, reference, status, name, email, country, items, subtotal_cents, shipping_cents, total_cents, currency, locale, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ShopReservationStatus' }
        name: { type: string }
        email: { type: string }
        country: { type: string }
        postal_code: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        locale: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ShopLine' } }
        subtotal_cents: { type: integer }
        shipping_cents: { type: integer }
        total_cents: { type: integer }
        currency: { type: string }
        internal_note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }

    Limits:
      type: object
      required: [max_items_per_send, max_video_seconds, max_upload_bytes]
      properties:
        max_items_per_send: { type: integer, default: 200 }
        max_video_seconds: { type: integer, default: 300 }
        max_upload_bytes: { type: integer, default: 2147483648 }
        trash_retention_days: { type: integer, default: 30 }

    Place:
      type: object
      description: A geocoding result (Open-Meteo geocoding API).
      required: [name, lat, lon]
      properties:
        name: { type: string, examples: [Gent] }
        admin1: { type: [string, 'null'], description: 'Region / state / province', examples: [Flanders] }
        country: { type: [string, 'null'], examples: [Belgium] }
        country_code: { type: [string, 'null'], description: ISO 3166-1 alpha-2, examples: [BE] }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        timezone: { type: [string, 'null'], examples: [Europe/Brussels] }

    User:
      type: object
      required: [id, display_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'], format: uri }
        share_location_names: { type: boolean }
        locale: { type: [string, 'null'] }
        is_operator: { type: boolean }
        created_at: { type: string, format: date-time }

    PushEndpointCreate:
      type: object
      required: [kind, endpoint]
      properties:
        kind: { type: string, enum: [unifiedpush, fcm, apns, webpush] }
        endpoint: { type: string, description: UnifiedPush/WebPush URL, or FCM/APNs token }
        webpush_keys:
          type: object
          properties:
            p256dh: { type: string }
            auth: { type: string }
        device_name: { type: string, maxLength: 60 }
        locale: { type: string }

    PushEndpoint:
      allOf:
        - $ref: '#/components/schemas/PushEndpointCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            created_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [owner, admin, member]

    Permissions:
      type: object
      properties:
        send: { type: boolean }
        invite: { type: boolean }
        see_library: { type: boolean }
        manage_library: { type: boolean }
        change_settings: { type: boolean }

    FrameSummary:
      type: object
      required: [id, name, role, permissions, online]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        location: { type: [string, 'null'] }
        owner_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        online: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        screen: { $ref: '#/components/schemas/Screen' }
        app_version: { type: [string, 'null'] }
        needs_update: { type: boolean }
        device_kind:
          $ref: '#/components/schemas/DeviceKind'

    Frame:
      allOf:
        - $ref: '#/components/schemas/FrameSummary'
        - type: object
          properties:
            default_permissions: { $ref: '#/components/schemas/Permissions' }
            approve_joins_on_frame: { type: boolean }
            invite_requires_approval: { type: boolean }
            moderation: { type: boolean }
            member_count: { type: integer }
            placement_count: { type: integer }
            created_at: { type: string, format: date-time }

    Screen:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, examples: [1280] }
        height: { type: integer, examples: [800] }
        density_dpi: { type: integer }
        orientation: { type: string, enum: [landscape, portrait] }

    FrameHealth:
      type: object
      properties:
        online: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_heartbeat: { $ref: '#/components/schemas/Heartbeat' }
        last_unclean_shutdown_at: { type: [string, 'null'], format: date-time }

    Heartbeat:
      type: object
      required: [app_version, uptime_s]
      properties:
        app_version: { type: string }
        app_version_code: { type: integer }
        android_sdk: { type: integer }
        uptime_s: { type: integer }
        wifi_ssid: { type: [string, 'null'] }
        wifi_rssi_dbm: { type: [integer, 'null'] }
        wifi_link_mbps: { type: [integer, 'null'] }
        storage_free_bytes: { type: integer }
        storage_total_bytes: { type: integer }
        cache_bytes: { type: integer }
        placements_cached: { type: integer }
        placements_missing: { type: integer }
        placements_evicted:
          type: integer
          description: Renditions the frame removed from its cache to free space (least recently shown first); it downloads them again before they show.
        storage_state:
          type: string
          enum: [ok, low, critical]
          description: '`low`: below the frame''s low-water mark, evicting. `critical`: nearly full with nothing left to evict.'
        screen_state: { type: string, enum: ['on', 'off', dimmed, sleeping] }
        last_shutdown_clean: { type: boolean }
        crash_count_24h: { type: integer }
        local_time: { type: string, format: date-time }
        timezone: { type: string, examples: [Europe/Brussels] }
        update_state:
          type: string
          description: |
            Self-update state (README §5.7). `idle`: nothing pending. `downloading`, `installing`: in progress.
            `waiting`: downloaded, waiting for the frame to be idle. `needs_user`: no root, the system installer is
            showing. `updated`: the last update succeeded. `failed`: the last attempt failed (see
            `last_update_error`). `rolled_back`: the new version crash-looped and the previous one was reinstalled.
          enum: [idle, downloading, waiting, installing, needs_user, updated, failed, rolled_back]
        last_update_error: { type: [string, 'null'], description: 'Short machine-readable reason, e.g. `sha256_mismatch`, `signature_mismatch`, `install_failed: ...`, `crash_loop 20199`' }

    FrameCommand:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [sleep, wake, restart, next, previous, show_placement, sync_now, identify] }
        placement_id: { $ref: '#/components/schemas/Id' }

    CommandResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error_code: { type: [string, 'null'] }

    RedeemResult:
      type: object
      required: [status, frame]
      properties:
        status: { type: string, enum: [claimed, joined, pending, already_member] }
        frame: { $ref: '#/components/schemas/FrameSummary' }
        join_request_id: { $ref: '#/components/schemas/Id' }

    Member:
      type: object
      required: [user_id, display_name, role, permissions]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/Role' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        joined_at: { type: string, format: date-time }
        last_sent_at: { type: [string, 'null'], format: date-time }

    JoinRequest:
      type: object
      required: [id, user, via, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        user:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            display_name: { type: string }
            avatar_url: { type: [string, 'null'] }
        via: { type: string, enum: [frame_code, invite] }
        invited_by_name: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [id, token, url, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        token: { type: string }
        url: { type: string, format: uri }
        created_by_name: { type: string }
        max_uses: { type: [integer, 'null'] }
        uses: { type: integer }
        note: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }

    InvitePreview:
      type: object
      required: [frame_name, invited_by_name, requires_approval]
      properties:
        frame_name: { type: string }
        frame_location: { type: [string, 'null'] }
        owner_name: { type: string }
        invited_by_name: { type: string }
        requires_approval: { type: boolean }
        already_member: { type: boolean }

    FrameCode:
      type: object
      required: [code, expires_at, join_url]
      properties:
        code: { type: string, pattern: '^[0-9]{8}$' }
        expires_at: { type: string, format: date-time }
        join_url: { type: string, format: uri }
        claimed: { type: boolean, description: false while the frame has no owner }

    MediaKind:
      type: string
      description: |
        `live` is a Live Photo (iOS) or Motion Photo (Android): a still plus a short motion clip (`Item.motion`).
        Clients that don't know `live` treat it as `photo`: every photo field (size, thumbnails, the frame's
        `media`) describes the still. As a library filter, `photo` includes live items and `live` only them.
      enum: [photo, video, live]

    Fit:
      type: string
      enum: [fill, fit]

    FocalPoint:
      type: object
      description: Relative to the master rendition, 0..1 from top-left.
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }

    Reaction:
      type: string
      enum: [love, laugh, wow, sad]

    ReplyPreset:
      type: string
      enum: [beautiful, call_me, miss_you, thanks]

    SendCreate:
      type: object
      required: [frame_ids, items]
      properties:
        frame_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Id' } }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [upload_id]
            properties:
              upload_id: { type: string, description: tus upload id, or an existing item id when the server reported a duplicate. For a live item, the still. }
              caption: { type: [string, 'null'], maxLength: 280 }
              focal_point: { $ref: '#/components/schemas/FocalPoint' }
              fit: { $ref: '#/components/schemas/Fit' }
              trim:
                type: object
                description: Videos only. The selected part must be at least 3 seconds long (unless the whole video is shorter).
                properties:
                  start_ms: { type: integer, minimum: 0 }
                  end_ms: { type: integer, minimum: 1 }
              include_audio:
                type: boolean
                default: true
                description: For a live item it applies to the motion clip, which is muted unless this is `true` explicitly.
              captured_at:
                type: [string, 'null']
                format: date-time
                description: |
                  Capture time. Prepared uploads carry no metadata, so clients read it from the original (EXIF,
                  QuickTime) and send it here. Used when the stored file has no capture time.
              width:
                type: integer
                minimum: 1
                description: Prepared uploads only. Pixel width the client produced; a mismatch makes the server take the normal pipeline.
              height:
                type: integer
                minimum: 1
                description: Prepared uploads only. Pixel height the client produced.
              duration_ms:
                type: integer
                minimum: 1
                description: Prepared videos only. Duration the client produced (±500 ms).
              live_video_upload_id:
                type: string
                description: |
                  Makes this a Live Photo: the tus upload of its motion clip (MOV/MP4, at most 10 s; longer clips
                  are cut). `upload_id` must be a photo and `trim` is not allowed. The clip may be a prepared
                  `video-master-v1`.
              live:
                type: boolean
                default: true
                description: |
                  `false` sends a Motion Photo (a JPEG/HEIC with an embedded video, detected by the server) as a
                  still only. Without `live_video_upload_id`, the server splits such files itself.

    Item:
      type: object
      required: [id, kind, status, sender_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        status: { type: string, enum: [processing, ready, failed] }
        failure_code: { type: [string, 'null'] }
        sender_id: { $ref: '#/components/schemas/Id' }
        sender_name: { type: string }
        caption: { type: [string, 'null'] }
        caption_edited: { type: boolean }
        focal_point: { $ref: '#/components/schemas/FocalPoint' }
        fit: { $ref: '#/components/schemas/Fit' }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        has_audio: { type: [boolean, 'null'] }
        captured_at: { type: [string, 'null'], format: date-time }
        place_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        imported_from:
          description: |
            Set on items a frame imported from another app's leftover data (docs/spec/frameo-import.md). The sender is
            then the frame; clients show `imported_sender_name` instead, e.g. "Anna · via Frameo".
          oneOf: [ { $ref: '#/components/schemas/ItemOrigin' }, { type: 'null' } ]
        imported_sender_name:
          type: [string, 'null']
          description: The original sender's display name in that app, when known.
        motion:
          description: |
            Live items only: the motion clip. `GET /v1/items/{id}/media/motion` streams its master once `status` is
            `ready`. If the clip fails, the item stays a plain photo (`kind: photo`, no `motion`).
          oneOf:
            - $ref: '#/components/schemas/ItemMotion'
            - { type: 'null' }
        thumb_url:
          type: [string, 'null']
          format: uri
          description: Short-lived signed URL (about 1 h) usable directly in <img src> without an Authorization header.

    ItemOrigin:
      type: string
      enum: [frameo]
      description: An app a frame can import leftover photos from.

    ItemMotion:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [processing, ready] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        has_audio: { type: [boolean, 'null'] }

    PlacementStatus:
      type: string
      enum: [pending, ready, delivered, seen, failed, removed]

    Placement:
      type: object
      required: [id, frame_id, item, status, hidden, trashed]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        item: { $ref: '#/components/schemas/Item' }
        status: { $ref: '#/components/schemas/PlacementStatus' }
        hidden: { type: boolean }
        trashed: { type: boolean }
        trashed_at: { type: [string, 'null'], format: date-time }
        pending_moderation: { type: boolean }
        fit_override: { oneOf: [ { $ref: '#/components/schemas/Fit' }, { type: 'null' } ] }
        focal_override: { oneOf: [ { $ref: '#/components/schemas/FocalPoint' }, { type: 'null' } ] }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
        replies:
          type: array
          items:
            type: object
            properties:
              preset: { $ref: '#/components/schemas/ReplyPreset' }
              at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        seen_at: { type: [string, 'null'], format: date-time }
        received_at: { type: string, format: date-time }
        album_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        shared_by_user_id:
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
          description: The member who shared this placement from another frame (`sharePlacements`); null for sends and forwards.
        shared_by_name:
          type: [string, 'null']
          description: Display name of `shared_by_user_id`. Frames show "Sender · shared by Name".

    ShareResult:
      type: object
      required: [placements, skipped]
      properties:
        placements:
          type: array
          description: The placements created on the target frames (empty for a dry run).
          items: { $ref: '#/components/schemas/Placement' }
        skipped:
          type: array
          description: Source placement × target frame pairs that were not shared.
          items:
            type: object
            required: [placement_id, frame_id, reason]
            properties:
              placement_id: { $ref: '#/components/schemas/Id' }
              frame_id: { $ref: '#/components/schemas/Id' }
              reason: { type: string, enum: [already_on_frame] }
              existing_placement_id: { $ref: '#/components/schemas/Id' }

    Send:
      type: object
      required: [id, created_at, items, frames]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
        frames:
          type: array
          description: Per-frame delivery for this send.
          items:
            type: object
            required: [frame_id, frame_name, placements]
            properties:
              frame_id: { $ref: '#/components/schemas/Id' }
              frame_name: { type: string }
              online: { type: boolean }
              placements:
                type: array
                items:
                  type: object
                  required: [placement_id, item_id, status]
                  properties:
                    placement_id: { $ref: '#/components/schemas/Id' }
                    item_id: { $ref: '#/components/schemas/Id' }
                    status: { $ref: '#/components/schemas/PlacementStatus' }
                    reaction: { oneOf: [ { $ref: '#/components/schemas/Reaction' }, { type: 'null' } ] }
                    replies: { type: array, items: { $ref: '#/components/schemas/ReplyPreset' } }
                    shared_by_name: { type: [string, 'null'], description: Set when another member shared this item to the frame. }
        summary:
          type: object
          properties:
            processing: { type: integer }
            pending: { type: integer }
            delivered: { type: integer }
            seen: { type: integer }
            failed: { type: integer }

    Album:
      type: object
      required: [id, name, version, placement_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        version: { type: integer }
        placement_count: { type: integer }
        cover_placement_id: { $ref: '#/components/schemas/Id' }
        placement_ids: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Ordered. }
        schedule:
          type: [object, 'null']
          description: Play this album automatically between dates each year (e.g. December).
          properties:
            from_month_day: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }
            to_month_day: { type: string, pattern: '^[0-9]{2}-[0-9]{2}$' }

    AlbumWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        placement_ids: { type: array, items: { $ref: '#/components/schemas/Id' } }
        cover_placement_id: { $ref: '#/components/schemas/Id' }
        schedule: { $ref: '#/components/schemas/Album/properties/schedule' }

    TvLinkCreate:
      type: object
      properties:
        album_id: { type: [string, 'null'], format: uuid, description: Only this album. }
        placement_ids:
          type: array
          maxItems: 500
          description: Only these placements, in this order (a selection). Empty or absent = the whole visible library.
          items: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        purpose:
          type: string
          enum: [tv, cast, mirror]
          default: tv
          description: |
            `tv` and `cast` show the library at the TV's own pace (cast links are short-lived). `mirror` follows the
            physical frame live (`GET /v1/tv/{token}/mirror`): it needs `see_library` and takes no `album_id`,
            `placement_ids` or `kind`, because it shows whatever the frame shows.
        interval_seconds: { type: integer, minimum: 3, maximum: 600, default: 10 }
        expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 12 }

    TvLink:
      type: object
      required: [id, frame_id, token, url, purpose, interval_seconds, expires_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        token: { type: string }
        url: { type: string, format: uri, description: 'The TV page: <public URL>/tv/<frameId>?t=<token> (mirror links add &mode=mirror)' }
        purpose: { type: string, enum: [tv, cast, mirror] }
        album_id: { type: [string, 'null'], format: uuid }
        placement_count: { type: [integer, 'null'], description: Size of a fixed selection; null for album/library links. }
        kind: { oneOf: [ { $ref: '#/components/schemas/MediaKind' }, { type: 'null' } ] }
        interval_seconds: { type: integer }
        created_by_name: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    TvSlide:
      type: object
      required: [placement_id, kind, url, mime, sender_name, received_at, width, height]
      properties:
        placement_id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url: { type: string, format: uri, description: Absolute signed URL of the master rendition (Range supported). }
        mime: { type: string, description: e.g. image/webp or video/mp4 }
        poster_url: { type: [string, 'null'], format: uri }
        thumb_url: { type: [string, 'null'], format: uri }
        caption: { type: [string, 'null'] }
        sender_name: { type: string }
        captured_at: { type: [string, 'null'], format: date-time }
        received_at: { type: string, format: date-time }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        focal_point:
          oneOf: [ { $ref: '#/components/schemas/FocalPoint' }, { type: 'null' } ]
          description: The placement's focal point (its override, else the item's), for filling the screen and Ken Burns.
        fit: { oneOf: [ { $ref: '#/components/schemas/Fit' }, { type: 'null' } ], description: 'The placement''s fit override, else the item''s; null = the frame setting.' }
        rotation: { type: integer, enum: [0, 90, 180, 270], description: Clockwise rotation set on the frame for this placement. }

    TvSlideshow:
      type: object
      required: [frame_id, frame_name, interval_seconds, expires_at, refresh_after, slides]
      properties:
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        album_name: { type: [string, 'null'] }
        interval_seconds: { type: integer }
        expires_at: { type: string, format: date-time, description: When the link itself stops working. }
        refresh_after: { type: string, format: date-time, description: Refetch before the media URLs expire. }
        slides: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/TvSlide' } }

    NowShowing:
      type: object
      description: |
        Device websocket message `now_showing` (frame → server, README §6.1): what the frame's screen shows right
        now. Sent on every slide change (timer, swipe, `next`/`previous`/`show_placement`, the "N new" card), when a
        video starts, pauses or ends, every 15 s while a video plays, and when the screen sleeps or wakes. Times are
        the frame's clock; the server only uses differences between them.
      required: [type, sent_at, screen]
      properties:
        type: { type: string, enum: [now_showing] }
        placement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: The slide on screen (the first tile of a collage or pair); null while nothing shows. }
        placement_ids: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Id' }, description: 'Every photo on screen (collage or pair), first = `placement_id`.' }
        started_at: { type: string, format: date-time, description: When the transition to this slide started. }
        transition: { type: string, enum: [crossfade, slide, cut] }
        transition_ms: { type: integer, minimum: 0, maximum: 5000 }
        direction: { type: integer, enum: [-1, 1], description: '1: the slide came in as "next", -1: as "previous".' }
        ken_burns: { type: boolean, description: 'The slide moves (Ken Burns): deterministic per placement and focal point.' }
        hold_ms: { type: integer, description: How long the slide is expected to stay. }
        video:
          type: [object, 'null']
          description: The playing video, or a live photo's clip, while it is on screen.
          required: [position_ms, playing]
          properties:
            position_ms: { type: integer, minimum: 0, description: Playback position at `sent_at`. }
            playing: { type: boolean }
            live: { type: boolean, description: The clip of a live photo (played over its still). }
        next_placement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: What the frame expects to show next (for preloading). }
        screen: { type: string, enum: ['on', 'off', dimmed, sleeping] }
        sent_at: { type: string, format: date-time }

    MirrorSettings:
      type: object
      description: The frame settings a mirroring TV needs to look like the frame.
      required: [interval_s, transition, transition_ms, fill, background]
      properties:
        interval_s: { type: integer }
        transition: { type: string, enum: [crossfade, slide, kenburns] }
        transition_ms: { type: integer }
        fill: { type: boolean }
        background: { type: string, enum: [blur, black, palette] }
        caption: { type: boolean }
        caption_date: { type: string, enum: [taken, received, none] }
        clock: { type: boolean }
        date: { type: boolean }
        clock_24h: { type: boolean }
        timezone: { type: string }

    MirrorShowing:
      type: object
      required: [placement_id, slides, started_at, transition, transition_ms]
      properties:
        placement_id: { $ref: '#/components/schemas/Id' }
        slides: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/TvSlide' }, description: 'One per photo on screen; a collage or pair has several.' }
        started_at: { type: string, format: date-time, description: Server clock. Compare with `server_time` of the same message. }
        transition: { type: string, enum: [crossfade, slide, cut] }
        transition_ms: { type: integer }
        direction: { type: integer }
        ken_burns: { type: boolean }
        hold_ms: { type: integer }
        video:
          type: [object, 'null']
          required: [position_ms, playing, at]
          properties:
            position_ms: { type: integer }
            playing: { type: boolean }
            live: { type: boolean }
            at: { type: string, format: date-time, description: Server clock at which `position_ms` was the position. }

    MirrorState:
      type: object
      description: |
        Message `mirror` on the TV mirror websocket (`GET /v1/tv/{token}/mirror`): the frame's state, sent right after
        connecting and on every change. Media URLs are signed like `TvSlide` URLs and are refreshed with each message.
      required: [type, server_time, frame_id, frame_name, online, screen, expires_at]
      properties:
        type: { type: string, enum: [mirror] }
        server_time: { type: string, format: date-time }
        frame_id: { $ref: '#/components/schemas/Id' }
        frame_name: { type: string }
        online: { type: boolean, description: The frame is connected. }
        screen: { type: string, enum: ['on', 'off', dimmed, sleeping, unknown], description: '`off`/`sleeping`: show a calm "the frame is asleep" screen.' }
        settings: { $ref: '#/components/schemas/MirrorSettings' }
        showing:
          oneOf: [ { $ref: '#/components/schemas/MirrorShowing' }, { type: 'null' } ]
          description: Null while the frame shows nothing (empty, offline before it reported anything, or an item the link may not show).
        next: { oneOf: [ { $ref: '#/components/schemas/TvSlide' }, { type: 'null' } ] }
        expires_at: { type: string, format: date-time, description: When the link stops working. }

    SleepSchedule:
      type: object
      required: [id, sleep_at, wake_at, days, enabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sleep_at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['23:00'] }
        wake_at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['07:00'] }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        enabled: { type: boolean }
        mode: { type: string, enum: ['off', dim], default: 'off' }

    CalendarSchedule:
      type: object
      description: Same shape as `SleepSchedule`, with `from`/`to` instead of `sleep_at`/`wake_at`. `to` before `from` runs past midnight.
      required: [id, from, to, days, enabled]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['07:00'] }
        to: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', examples: ['09:00'] }
        days:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        enabled: { type: boolean }

    FrameSettings:
      type: object
      description: Defaults per docs/spec/product-spec.md §6. Unknown fields must be preserved by clients.
      required: [version]
      properties:
        version: { type: integer }
        slideshow:
          type: object
          properties:
            interval_s: { type: integer, minimum: 2, maximum: 86400, default: 30 }
            transition: { type: string, enum: [crossfade, slide, kenburns], default: crossfade }
            transition_ms: { type: integer, minimum: 200, maximum: 3000, default: 800 }
            order: { type: string, enum: [received, taken, shuffle], default: received }
            reverse: { type: boolean, default: false }
            caption_date: { type: string, enum: [taken, received, none], default: received }
            fill: { type: boolean, default: true }
            background: { type: string, enum: [blur, black, palette], default: blur }
            pair_portraits: { type: boolean, default: true }
            collage: { type: boolean, default: false }
            collage_max: { type: integer, minimum: 2, maximum: 6, default: 3 }
            album_id: { type: [string, 'null'], description: null = all photos }
            on_this_day: { type: boolean, default: false }
            live_photos:
              type: string
              enum: ['on', tap, 'off']
              default: 'on'
              description: |
                Live/Motion Photos: `on` plays the motion once when the slide appears (and on tap), `tap` only on
                tap, `off` shows the still only.
        widgets:
          type: object
          properties:
            caption: { type: boolean, default: true }
            avatar: { type: boolean, default: true }
            clock: { type: boolean, default: true }
            date: { type: boolean, default: true }
            weather: { type: boolean, default: false, description: Current weather widget; needs `location`. }
            clock_24h: { type: boolean, default: true }
            calendar_sidebar: { type: boolean, default: false, description: 'Hybrid view: today and upcoming events beside the slideshow (side panel in landscape, bottom panel in portrait).' }
            countdowns: { type: boolean, default: true, description: Countdown widgets on the slideshow (the nearest three). }
        video:
          type: object
          properties:
            autoplay: { type: boolean, default: true }
            playback: { type: string, enum: [loop, once_hold, once_advance], default: once_hold }
            volume: { type: integer, minimum: 0, maximum: 100, default: 60 }
            auto_mute_min: { type: [integer, 'null'], default: null }
        display:
          type: object
          properties:
            brightness: { type: integer, minimum: 15, maximum: 255, default: 204 }
            brightness_mode: { type: string, enum: [manual, schedule, sun, sensor], default: manual }
            brightness_schedule:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                  brightness: { type: integer, minimum: 15, maximum: 255 }
            sleep_schedules:
              type: array
              items: { $ref: '#/components/schemas/SleepSchedule' }
            motion_timeout_min: { type: [integer, 'null'], default: 30 }
            text_scale: { type: number, enum: [1.0, 1.15, 1.3], default: 1.0 }
        locale:
          type: object
          properties:
            language: { type: string, default: en }
            timezone: { type: string, default: Europe/Brussels }
            temperature_unit: { type: string, enum: [c, f], default: c }
            first_day_of_week: { type: string, enum: [mon, sun, sat], default: mon }
        calendar:
          type: object
          description: Full-screen calendar options (product spec §4.9). The first day of the week is `locale.first_day_of_week`.
          properties:
            view: { type: string, enum: [four_day, week, month], default: week }
            start_on_today: { type: boolean, default: true, description: Week and 4-day views start on today rather than the first day of the week. }
            fade_past: { type: boolean, default: true }
            week_numbers: { type: boolean, default: false }
            past_days: { type: integer, minimum: 1, maximum: 365, default: 30, description: Sync window before today. }
            future_days: { type: integer, minimum: 7, maximum: 365, default: 30, description: Sync window after today. }
            timed_views:
              type: array
              description: 'Calendar timed view: while a schedule is active the frame shows the full-screen calendar instead of photos. New schedules default to 07:00–09:00 on every day.'
              items: { $ref: '#/components/schemas/CalendarSchedule' }
        location:
          type: [object, 'null']
          description: |
            Used for weather and sun-based brightness. Set by owner/admin, usually from a `/v1/geocode` result.
            Changing it (or turning `widgets.weather` on) makes the server fetch weather right away.
          required: [lat, lon]
          properties:
            name: { type: string, maxLength: 100 }
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }
        notifications:
          type: object
          properties:
            sound: { type: boolean, default: true }
            volume: { type: integer, minimum: 0, maximum: 100, default: 40 }
        kiosk:
          type: object
          properties:
            allow_remove_members_on_frame: { type: boolean, default: true }
            owner_pin_set: { type: boolean, readOnly: true }
            owner_pin:
              type: [string, 'null']
              writeOnly: true
              pattern: '^[0-9]{4,6}$'
              description: |
                Owner only (`403 forbidden` for anyone else). A 4–6 digit kiosk PIN for the frame, or null to remove it.
                The server never stores or returns the PIN: it keeps only `owner_pin_hash`, which the frame verifies
                locally (opening settings, leaving the kiosk, power off/restart, Wi-Fi changes).
            owner_pin_hash:
              description: |
                Salted hash of the owner PIN, null when no PIN is set. Only the frame sees it (in the change feed and
                in `PATCH /device/settings` responses); user-facing settings omit it. The frame may set or clear it
                with `PATCH /device/settings` when the PIN is changed at the frame; users set it via `owner_pin`.
              oneOf:
                - { $ref: '#/components/schemas/PinHash' }
                - { type: 'null' }
        updates:
          type: object
          properties:
            channel:
              type: string
              enum: [stable, beta]
              default: stable
              description: Frame app release channel (beta program). Beta frames get the newest of beta and stable.
        plugins:
          type: object
          description: |
            Widgets from plugins (docs/plugins.md): the layout and the plugin instances. What a frame can run is in
            its catalog (`GET /frames/{frameId}/plugins`); instances are checked against it.
          properties:
            layout:
              type: object
              properties:
                mode: { type: string, enum: ['off', overlay, band], default: 'off', description: 'Off, the photo''s top corners, or a band beside or above a 3:2 photo.' }
                side: { type: string, enum: [left, right], default: right, description: Where the band goes in landscape. }
                background: { type: string, enum: [paper, photo], default: paper }
            instances:
              type: array
              maxItems: 8
              description: |
                Replaced whole by a patch (it is an array). Secrets are matched by `instance_id`: an instance sent
                without `secrets` keeps the ones it has.
              items: { $ref: '#/components/schemas/PluginInstance' }

    PluginInstance:
      type: object
      description: |
        One widget: a plugin with the owner's settings (docs/plugins.md §10). Settings follow the plugin's manifest;
        values of `secret` settings never go in `settings` but in `secrets`, which people can only write.
      required: [instance_id, plugin_id]
      properties:
        instance_id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,47}$' }
        plugin_id: { type: string, maxLength: 64, examples: [kinframe.ha-energy] }
        version: { type: string, maxLength: 40, description: The plugin version the settings were made with (informational). }
        slot: { type: string, enum: [top-left, top-right], default: top-right }
        order: { type: integer, minimum: 0, maximum: 99, default: 0 }
        visibility: { type: string, enum: [always, on_change, on_tap], default: always }
        enabled: { type: boolean, default: true, description: An enabled instance needs every required setting and secret. }
        settings:
          type: object
          maxProperties: 40
          description: The manifest's non-secret settings by key (strings, numbers, booleans, or a list of entity ids).
        secrets:
          type: object
          maxProperties: 8
          additionalProperties: { type: [string, 'null'], maxLength: 2000 }
          description: |
            Write: key → new value, or null to remove it; keys left out keep their value. Stored encrypted. Only the
            frame reads them back (in the change feed and `PATCH /device/settings` responses), in full.
        secrets_set:
          type: array
          readOnly: true
          items: { type: string }
          description: The secret settings that have a value.

    CatalogPlugin:
      type: object
      description: A plugin the frame can run, as the frame reports it (`PUT /device/plugins/catalog`).
      required: [manifest]
      properties:
        manifest:
          type: object
          description: The plugin's `plugin.json` as-is (docs/plugins.md §3.1).
        locales:
          type: object
          description: |
            Language tag → the manifest's translations (`@name`, `@description`, `@setting.<key>`,
            `@setting.<key>.help`, `@option.<key>.<value>`, `@preset.<id>`). English is the manifest itself.
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        builtin: { type: boolean, description: Part of the frame app (not a downloaded bundle). }

    PluginCatalog:
      type: object
      required: [plugins]
      properties:
        plugins: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CatalogPlugin' } }

    PluginInstanceStatus:
      type: object
      required: [instance_id]
      properties:
        instance_id: { type: string }
        running: { type: boolean, description: The instance started on the frame. }
        error: { type: [string, 'null'], maxLength: 300, description: The last error, null when the last update and render worked. }
        error_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time, description: When the last update succeeded. }
        entities:
          type: array
          maxItems: 3000
          description: |
            Home Assistant entities the frame can see through this instance's `base_url` and `token` (for the entity
            picker, docs/plugins.md §6.1). Absent when the plugin has no entity settings or the connection failed.
          items: { $ref: '#/components/schemas/DiscoveredEntity' }

    DiscoveredEntity:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string }
        name: { type: string }
        unit: { type: string }
        device_class: { type: string }

    DiscoveredService:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 200, examples: ['http://192.168.1.20'] }

    PluginStatusReport:
      type: object
      description: What the frame knows about its plugins right now (`PUT /device/plugins/status`).
      properties:
        instances: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/PluginInstanceStatus' } }
        services:
          type: object
          description: 'mDNS service type (a `discover` value in a manifest) → what the frame found on its network.'
          additionalProperties: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DiscoveredService' } }

    FramePlugins:
      type: object
      description: The frame's plugin catalog and their status, for the apps' Plugins section.
      required: [catalog]
      properties:
        catalog: { type: array, items: { $ref: '#/components/schemas/CatalogPlugin' } }
        catalog_at: { type: [string, 'null'], format: date-time, description: When the frame last reported its catalog; null for an app that doesn't. }
        instances: { type: array, items: { $ref: '#/components/schemas/PluginInstanceStatus' } }
        services:
          type: object
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/DiscoveredService' } }
        status_at: { type: [string, 'null'], format: date-time }

    PinHash:
      type: object
      description: |
        PBKDF2-HMAC-SHA256 of the UTF-8 PIN digits (RFC 8018), 32-byte output. `salt` and `hash` are standard base64.
      required: [alg, iterations, salt, hash]
      properties:
        alg: { type: string, enum: [pbkdf2-sha256] }
        iterations: { type: integer, minimum: 1000, maximum: 1000000, examples: [20000] }
        salt: { type: string, minLength: 16, maxLength: 64, description: base64, at least 12 random bytes }
        hash: { type: string, minLength: 44, maxLength: 44, description: base64 of 32 bytes }

    FrameUpdate:
      type: object
      description: A frame app release mirrored by the server.
      required: [version_name, version_code, min_sdk, url, sha256, size, published_at]
      properties:
        version_name: { type: string, examples: ['0.2.0'] }
        version_code: { type: integer, examples: [20099] }
        min_sdk: { type: integer, examples: [23] }
        url: { type: string, format: uri, description: 'Where to download the APK on this server: `/v1/device/update/apk/{version_code}` (frames) or `/v1/frame-app/apk/{version_code}` (public).' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, description: bytes }
        release_notes: { type: [string, 'null'] }
        published_at: { type: string, format: date-time }
        prerelease: { type: boolean, description: True for beta releases. }

    FrameSettingsPatch:
      description: RFC 7396 merge patch of FrameSettings (any subset; arrays are replaced whole).
      type: object

    DeviceEnroll:
      type: object
      required: [hardware, screen, app]
      properties:
        hardware:
          type: object
          required: [model]
          properties:
            brand: { type: string, examples: [denver] }
            model: { type: string, examples: [PFF_1024] }
            board: { type: string, examples: [rk312x] }
            android_sdk: { type: integer, examples: [23] }
            abis: { type: array, items: { type: string } }
            ram_mb: { type: integer }
            storage_total_bytes: { type: integer }
            max_video_decode: { $ref: '#/components/schemas/Screen' }
            capabilities:
              type: object
              properties:
                light_sensor: { type: boolean }
                motion_sensor: { type: boolean }
                accelerometer: { type: boolean }
                battery: { type: boolean }
                speaker: { type: boolean }
                sd_card: { type: boolean }
                usb_host: { type: boolean }
                root: { type: boolean }
        screen: { $ref: '#/components/schemas/Screen' }
        app:
          type: object
          required: [version, version_code]
          properties:
            version: { type: string }
            version_code: { type: integer }
            channel: { type: string, enum: [stable, beta], default: stable }
        locale: { type: string }
        timezone: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }

    DeviceKind:
      type: string
      enum: [android, browser]
      default: android
      description: |
        What runs the frame. `android`: the frame app. `browser`: a web browser enrolled as a virtual frame from the TV
        page (`/tv/frame`). Browser frames speak the same device protocol; they never get app updates, are exempt from
        `426 app_update_required`, and send a smaller heartbeat (no Wi-Fi or storage fields).

    DeviceState:
      type: object
      required: [device_id, claimed, latest_seq]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        claimed: { type: boolean }
        frame_id: { type: [string, 'null'] }
        frame_name: { type: [string, 'null'] }
        owner_name: { type: [string, 'null'] }
        latest_seq: { type: integer }
        server_time: { type: string, format: date-time }

    Change:
      type: object
      required: [seq, type]
      discriminator: { propertyName: type }
      properties:
        seq: { type: integer }
        type:
          type: string
          enum: [placement.upsert, placement.remove, settings, album.upsert, album.remove, member.upsert, member.remove, frame, weather, calendar, reset]
        placement:
          allOf:
            - $ref: '#/components/schemas/Placement'
            - type: object
              properties:
                media:
                  type: object
                  description: Frame rendition to download (present on placement.upsert when status is ready).
                  properties:
                    url: { type: string, format: uri }
                    sha256: { type: string }
                    bytes: { type: integer }
                    mime: { type: string, examples: [image/webp, video/mp4] }
                    width: { type: integer }
                    height: { type: integer }
                    poster_url: { type: [string, 'null'], format: uri }
                motion:
                  type: object
                  description: |
                    Live items only (`item.kind: live`), once the clip's frame rendition is ready: the short H.264
                    clip to play over the still (`media`), which is also its poster. Frames that don't know `live`
                    ignore it and show `media` as a photo.
                  properties:
                    url: { type: string, format: uri }
                    sha256: { type: string }
                    bytes: { type: integer }
                    mime: { type: string, examples: [video/mp4] }
                    width: { type: integer }
                    height: { type: integer }
                    duration_ms: { type: integer }
                    has_audio: { type: boolean }
        id: { $ref: '#/components/schemas/Id' }
        settings: { $ref: '#/components/schemas/FrameSettings' }
        album: { $ref: '#/components/schemas/Album' }
        member:
          type: object
          properties:
            user_id: { $ref: '#/components/schemas/Id' }
            display_name: { type: string }
            avatar_url: { type: [string, 'null'] }
            role: { $ref: '#/components/schemas/Role' }
        frame:
          type: object
          properties:
            name: { type: string }
            location: { type: [string, 'null'] }
            owner_name: { type: string }
        weather:
          $ref: '#/components/schemas/Weather'
        calendar:
          oneOf:
            - $ref: '#/components/schemas/Calendar'
            - { type: 'null' }

    Weather:
      type: [object, 'null']
      description: |
        Payload of the `weather` change (docs/api/README.md §5.4). `null` means "no weather": the location was
        removed, the weather widget was turned off, or the server has weather disabled; the frame drops what it has.
        Values are always metric (°C, km/h, mm); clients convert for `locale.temperature_unit`. Local times carry the
        location's UTC offset. Data by Open-Meteo.com (CC BY 4.0); clients showing it must credit "Weather data by
        Open-Meteo.com".
      required: [fetched_at, current, daily]
      properties:
        fetched_at: { type: string, format: date-time, description: When the server fetched this from Open-Meteo }
        location:
          type: object
          properties:
            name: { type: [string, 'null'] }
            lat: { type: number }
            lon: { type: number }
        timezone: { type: string, examples: [Europe/Brussels] }
        utc_offset_seconds: { type: integer }
        units:
          type: object
          properties:
            temperature: { type: string, enum: [c], default: c }
            wind_speed: { type: string, enum: [km/h], default: km/h }
            precipitation: { type: string, enum: [mm], default: mm }
        current:
          type: object
          required: [temp_c, code, is_day]
          properties:
            time: { type: string, format: date-time }
            temp_c: { type: number }
            apparent_c: { type: [number, 'null'], description: Feels-like temperature }
            code: { type: integer, description: WMO weather code (0–99) }
            is_day: { type: boolean }
            wind_kmh: { type: [number, 'null'] }
            wind_dir_deg: { type: [integer, 'null'], description: Direction the wind comes from, 0 = north }
            humidity_pct: { type: [integer, 'null'] }
            precip_mm: { type: [number, 'null'] }
        hourly:
          type: array
          description: The next 24 hours, starting with the current hour.
          items:
            type: object
            required: [time, temp_c, code]
            properties:
              time: { type: string, format: date-time }
              temp_c: { type: number }
              code: { type: integer }
              is_day: { type: boolean }
              precip_prob: { type: [integer, 'null'], description: Percent }
        daily:
          type: array
          description: Up to 7 days, starting today (in the location's time zone).
          items:
            type: object
            required: [date, min_c, max_c, code]
            properties:
              date: { type: string, format: date }
              min_c: { type: number }
              max_c: { type: number }
              code: { type: integer }
              precip_mm: { type: [number, 'null'] }
              precip_prob: { type: [integer, 'null'], description: Maximum hourly probability, percent }
              sunrise: { type: [string, 'null'], format: date-time }
              sunset: { type: [string, 'null'], format: date-time }

    CalendarColor:
      type: string
      description: |
        Palette key. Clients map it to the light/dark colours listed in docs/api/README.md §5.8 (the same 12 colours
        everywhere).
      enum: [coral, tangerine, amber, olive, mint, sage, teal, sky, ocean, lavender, plum, rose]

    CalendarSourceKind:
      type: string
      description: '`ics`: an ICS/iCal/webcal link. `caldav`: a CalDAV calendar. `local`: the frame''s received-events calendar.'
      enum: [ics, caldav, local]

    CalendarSyncStatus:
      type: string
      description: '`syncing` before the first sync and while one runs; `disabled` when the source is turned off.'
      enum: [ok, syncing, failed, auth_failed, disabled]

    CalendarSource:
      type: object
      required: [id, kind, name, color, enabled, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CalendarSourceKind' }
        name: { type: string, description: 'Display name. Empty for the local calendar until renamed: clients show "Received events".' }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean }
        url_hint: { type: [string, 'null'], description: 'Redacted URL for display. Null for `local`.', examples: ['https://calendar.google.com/…/basic.ics'] }
        username: { type: [string, 'null'], description: CalDAV only. }
        has_password: { type: boolean }
        status: { $ref: '#/components/schemas/CalendarSyncStatus' }
        last_error: { type: [string, 'null'], description: Short reason of the last failed sync (English). }
        last_synced_at: { type: [string, 'null'], format: date-time, description: Last successful sync. }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        next_sync_at: { type: [string, 'null'], format: date-time }
        event_count: { type: integer, description: Events of this source in the frame's window. }
        created_at: { type: string, format: date-time }

    CalendarSourceCreate:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [ics, caldav] }
        url:
          type: string
          minLength: 8
          maxLength: 2048
          description: '`https://`, `http://` or `webcal://` (treated as https). For CalDAV: the server, account or calendar URL.'
        name: { type: string, maxLength: 60, description: Defaults to the calendar's own name, else the host. }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean, default: true }
        username: { type: string, maxLength: 200, description: CalDAV only. }
        password: { type: string, maxLength: 500, writeOnly: true, description: 'CalDAV only; use an app-specific password.' }
        calendar_url: { type: string, maxLength: 2048, description: 'CalDAV only: the calendar collection to use, from `CalendarTestResult.calendars`.' }

    CalendarSourceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        color: { $ref: '#/components/schemas/CalendarColor' }
        enabled: { type: boolean }
        url: { type: string, minLength: 8, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500, writeOnly: true }
        calendar_url: { type: string, maxLength: 2048 }

    CalendarTestResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [ok, failed, auth_failed] }
        error: { type: [string, 'null'] }
        calendar_name: { type: [string, 'null'], description: The calendar's own name, if it has one. }
        event_count: { type: [integer, 'null'], description: Events in the next 30 days. }
        calendars:
          type: array
          description: CalDAV only. Calendars on the account that hold events.
          items:
            type: object
            required: [url, name]
            properties:
              url: { type: string }
              name: { type: string }
              color: { type: [string, 'null'], description: The server's colour (hex), as a hint. }

    CalendarEventId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: Stable id of one event occurrence (a hash of source, UID and occurrence start).

    CalendarEvent:
      type: object
      description: |
        One occurrence. Timed events have `start_at`/`end_at` (UTC; clients show them in the frame's time zone);
        all-day events have `start_date`/`end_date` (inclusive) and no times. Multi-day events span several days.
      required: [id, source_id, title, all_day]
      properties:
        id: { $ref: '#/components/schemas/CalendarEventId' }
        source_id: { $ref: '#/components/schemas/Id' }
        title: { type: string, maxLength: 200 }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        location: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 500 }
        recurring: { type: boolean }
        countdown: { type: boolean }
        sender_name: { type: [string, 'null'], description: Received events only. }
        invitation_id:
          description: 'Received events only; the photo is at `/v1/device/invitations/{id}/photo`.'
          oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ]
        has_photo: { type: boolean }
        photo_placement: { oneOf: [ { $ref: '#/components/schemas/EventPhotoPlacement' }, { type: 'null' } ] }

    CalendarSourceInfo:
      type: object
      required: [id, kind, name, color, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CalendarSourceKind' }
        name: { type: string }
        color: { $ref: '#/components/schemas/CalendarColor' }
        status: { $ref: '#/components/schemas/CalendarSyncStatus' }
        last_synced_at: { type: [string, 'null'], format: date-time }

    Countdown:
      type: object
      description: A marked event, even when it lies outside the window.
      required: [event_id, title, all_day, color]
      properties:
        event_id: { $ref: '#/components/schemas/CalendarEventId' }
        source_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        title: { type: string }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        color: { $ref: '#/components/schemas/CalendarColor' }

    Calendar:
      type: object
      description: |
        Payload of the `calendar` change (docs/api/README.md §5.8): every enabled source of the frame merged into one
        list, deduplicated across sources by UID and start, sorted by start.
      required: [generated_at, timezone, window, sources, events, countdowns]
      properties:
        generated_at: { type: string, format: date-time }
        timezone: { type: string, description: 'The frame''s time zone (`locale.timezone`), used for the window and all-day events.', examples: [Europe/Brussels] }
        window:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date, description: Inclusive. }
        sources: { type: array, items: { $ref: '#/components/schemas/CalendarSourceInfo' } }
        events: { type: array, items: { $ref: '#/components/schemas/CalendarEvent' } }
        countdowns:
          type: array
          description: Marked events that have not passed yet, nearest first.
          items: { $ref: '#/components/schemas/Countdown' }

    CalendarView:
      allOf:
        - $ref: '#/components/schemas/Calendar'
        - type: object
          properties:
            weather:
              $ref: '#/components/schemas/Weather'

    EventPhotoPlacement:
      type: string
      description: '`top`: the photo above the event details. `background`: the photo fills the card behind them.'
      enum: [top, background]

    EventInvitationCreate:
      type: object
      description: Timed events need `start_at` and `end_at`; all-day events need `start_date` (`end_date` is inclusive and defaults to `start_date`).
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        all_day: { type: boolean, default: false }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        location: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 2000 }
        photo_upload_id: { type: string, description: A finished tus upload holding an image. }
        photo_placement: { $ref: '#/components/schemas/EventPhotoPlacement' }

    EventInvitation:
      type: object
      required: [id, frame_id, sender_id, sender_name, status, title, all_day, has_photo, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        frame_id: { $ref: '#/components/schemas/Id' }
        sender_id: { $ref: '#/components/schemas/Id' }
        sender_name: { type: string }
        status: { type: string, enum: [pending, accepted, declined, withdrawn] }
        title: { type: string }
        all_day: { type: boolean }
        start_at: { type: [string, 'null'], format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        location: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        has_photo: { type: boolean }
        photo_placement: { $ref: '#/components/schemas/EventPhotoPlacement' }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
